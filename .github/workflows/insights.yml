name: market brief

# Writes the market page's "Today's Brief" insights once each morning,
# before the US open. The job talks to Supabase only -- it never commits to
# this repository.
#
# ~10:00 UTC is 06:00 in New York on eastern daylight time and 05:00 on
# eastern standard time. GitHub's cron is UTC year-round while the market
# keeps wall-clock hours, so the gap to the 09:30 open shifts by an hour
# across the DST boundary; either way the brief is up hours before anyone
# reads it.
#
# Every day, not just weekdays: on a weekend there is no session to report,
# but there is a weekend's news and a Friday close to carry it, and that is
# the reading someone opening the page on a Sunday wants. insights.py dates
# every price fact to the session it came from, so nothing calls Friday's
# close "today".
#
# :07 rather than :30. GitHub queues scheduled runs and drops or delays them
# under load, and the hour and the half-hour are the most congested minutes
# on it -- two runs on ":30" landed more than ten hours late, which put the
# brief on the page after the close it was meant to precede. The second cron
# is a catch-up for a morning that was delayed or rejected; it writes only
# when the day still has no brief, so a good one is never overwritten.

on:
  schedule:
    - cron: "7 10 * * *"
    - cron: "23 13 * * *"
  workflow_dispatch:

# Two runs writing the same day would race on the same rows. The second
# waits rather than doubling up.
concurrency:
  group: market-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The job writes to Supabase, not to git.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Anthropic SDK
        run: pip install --quiet anthropic

      - name: Write today's brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            exit 1
          fi
          # A scheduled run never overwrites a brief the day already has:
          # the second cron is a safety net, not a rewrite, and a first cron
          # arriving late must not replace what the catch-up already wrote.
          # A hand-started run is someone asking for a fresh one, so it
          # always writes.
          python insights.py ${{ github.event_name == 'schedule' && '--only-if-missing' || '' }}
