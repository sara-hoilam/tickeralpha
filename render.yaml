# Render blueprint — the ingest worker.
#
# Dashboard → Blueprints → New Blueprint Instance → pick this repo.
# Then set the three secret values in the service's Environment tab.
#
# IMPORTANT: numInstances stays at 1. The SEC rate limit is per IP and the
# limiter lives inside this process, so a second instance would double the
# request rate against them. Scaling belongs on the read path (Supabase),
# which this worker never touches.

services:
  - type: worker
    name: ledger-ingest
    runtime: python
    plan: starter          # free instances sleep, and a sleeping ingester
                           # misses filings
    numInstances: 1
    region: oregon         # match the Supabase project's region
    buildCommand: "true"   # standard library only — nothing to install
    startCommand: python worker.py run
    autoDeploy: true
    envVars:
      # A real address. The SEC asks clients to identify themselves and
      # throttles traffic that does not.
      - key: SEC_CONTACT
        sync: false
      - key: SUPABASE_URL
        value: https://etembhwwbqswzcepfhxp.supabase.co
      # Secret. Paste in the dashboard; never commit it.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Paid secret, same rule. Everything the worker knows about prices,
      # quotes, movers, earnings and 13F holders comes through this key --
      # without it market.configured() is false and those refreshes are all
      # skipped, while the SEC filings carry on regardless. It was reachable
      # through the environment but never declared here, so a blueprint deploy
      # came up with the filings and none of the market data.
      - key: FMP_API_KEY
        sync: false
      - key: SEC_MAX_RPS
        value: "8"
      - key: BACKFILL_POLL_SECONDS
        value: "20"
      - key: COMPANY_RECHECK_HOURS
        value: "6"
      - key: PYTHON_VERSION
        value: "3.12"
