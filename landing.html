<style>
/* ---------------------------------------------------------------------------
   Markets Today — the same design system as the company page, so moving
   between them does not feel like changing product. Identical tokens,
   typography and card treatment; only the content differs.
--------------------------------------------------------------------------- */
:root {
  color-scheme: light;
  --ground:#eef0f3; --card:#ffffff; --sunk:#f6f7f9;
  --ink:#111820; --ink-2:#4a5866; --ink-3:#78889a;
  --rule:#dde2e8; --rule-2:#eaeef2;
  --accent:#1e4fbf; --accent-soft:#e6ecfb;
  --up:#0b7a4b; --down:#c0392e;
  --up-soft:#e3f4ec; --down-soft:#fbe9e7;
  --revenue:#2a78d6;
  /* The same validated categorical palette the company page uses. */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  /* Eleven saturated hues for the sector lines. Twelve overlapping series
     need more separation than the eight-slot palette gives, and identity here
     never rests on colour alone: there is a legend and a hover readout. */
  --k1:#6c63f0; --k2:#f28a70; --k3:#3fbf5f; --k4:#f2c14a;
  --k5:#cf922f; --k6:#5aa9f0; --k7:#7fc47f; --k8:#4b3fe0;
  --k9:#b13fd6; --k10:#d45a7a; --k11:#ef4136;
  --shadow:0 1px 2px rgba(17,24,32,.06), 0 6px 20px -12px rgba(17,24,32,.22);
  --r:10px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:#0d1219; --card:#151c25; --sunk:#111821;
  --ink:#e7edf4; --ink-2:#a3b1c0; --ink-3:#77879a;
  --rule:#232d3a; --rule-2:#1c2531;
  --accent:#6e9bff; --accent-soft:#1a2740;
  --up:#38b37d; --down:#f0736a;
  --up-soft:#12291f; --down-soft:#2b1614;
  --revenue:#3987e5;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --k1:#8b83ff; --k2:#ff9c81; --k3:#4ed46f; --k4:#ffd05c;
  --k5:#e0a63c; --k6:#6fb9ff; --k7:#93d693; --k8:#6a5cff;
  --k9:#c655e8; --k10:#e86b8c; --k11:#ff5347;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.8);
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  background:var(--ground); color:var(--ink);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
main{max-width:var(--page,1680px);margin:0 auto;padding:26px 28px 72px}

/* ---- market summary ------------------------------------------------------ */
.sumhead{
  display:flex; justify-content:space-between; align-items:baseline;
  gap:12px 24px; margin-bottom:12px; flex-wrap:nowrap;
}
.sumhead h2{font-size:15px;font-weight:600;letter-spacing:-.005em;margin:0;flex:0 0 auto}
.sumhead .sub{color:var(--ink-3);font-size:12.5px;text-align:right;margin-left:auto;
  line-height:1.35;white-space:nowrap;flex:0 1 auto;min-width:0}
.sumhead .sub b{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--ink-2)}
h2{font-size:15px;font-weight:600;letter-spacing:-.005em;margin-bottom:12px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.split{display:grid;grid-template-columns:minmax(320px,420px) 1fr;min-height:520px}
.up{color:var(--up)} .down{color:var(--down)}
.tsym,.ppl{display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  text-decoration:none;text-align:left}
.tsym-t{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--accent);
  font-size:12.5px;line-height:1.25}
.tsym-n,.ppl-n{font-family:"IBM Plex Sans",sans-serif;font-size:10.5px;color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px;line-height:1.3}
.ppl-t{font-family:"IBM Plex Sans",sans-serif;font-weight:600;font-size:12.5px;
  color:var(--ink);line-height:1.25}
.ghost{
  background:transparent;border:1px solid var(--rule);border-radius:7px;
  padding:8px 13px;cursor:pointer;color:var(--ink-2);font:inherit;font-size:12.5px;
}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.ghost:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card{
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  padding:15px 16px;box-shadow:var(--shadow);min-height:104px;
  display:flex;flex-direction:column;
}
.card .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.card .v{font-family:"IBM Plex Serif",Georgia,serif;font-size:23px;font-weight:600;
  letter-spacing:-.015em;margin-top:8px;line-height:1.15;overflow-wrap:break-word;
  hyphens:none}
.card .d{font-size:12px;margin-top:auto;padding-top:6px;color:var(--ink-3)}
.card .d b{font-family:"IBM Plex Mono",monospace;font-weight:600}

.listhead{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:14px 18px 10px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;flex-shrink:0}
.seg button{background:transparent;border:0;padding:6px 11px;font:inherit;font-size:12px;
  cursor:pointer;color:var(--ink-2);border-right:1px solid var(--rule);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:500}
.seg button[disabled]{opacity:.34;cursor:not-allowed}

/* Risk & Return controls: the period buttons and the interval dropdown. */
.riskctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.drop{position:relative}
.dropbtn{display:inline-flex;align-items:center;gap:6px;background:transparent;
  border:1px solid var(--rule);border-radius:7px;padding:6px 11px;font:inherit;
  font-size:12px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.dropbtn:hover{border-color:var(--accent);color:var(--ink)}
.dropbtn[aria-expanded=true]{border-color:var(--accent);color:var(--accent)}
.dropbtn .caret{font-size:9px;line-height:1}
.dropmenu{position:absolute;top:calc(100% + 6px);right:0;z-index:60;min-width:172px;
  background:var(--card);border:1px solid var(--rule);border-radius:10px;
  box-shadow:var(--shadow);overflow:hidden;padding:5px}
.dropcap{padding:7px 11px 5px;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3)}
.dropmenu button{display:block;width:100%;text-align:left;background:transparent;
  border:0;border-radius:7px;padding:8px 11px;font:inherit;font-size:13px;
  color:var(--ink-2);cursor:pointer}
.dropmenu button:hover{background:var(--sunk);color:var(--ink)}
.dropmenu button[aria-selected=true]{color:var(--accent);font-weight:600}
.dropmenu button[aria-selected=true]::before{content:"✓ "}
.dropmenu button[disabled]{opacity:.34;cursor:not-allowed}
.dropmenu button[disabled]:hover{background:transparent;color:var(--ink-2)}

/* Eight rows, then scroll -- enough to see the shape of the list without the
   panel growing taller than the chart beside it. */
.rows{border-right:1px solid var(--rule);overflow-y:auto;max-height:520px}
/* Tiles are placed in whole pixels, so the rightmost can land a hair past the
   canvas. Clipping that is right; a scrollbar for two pixels is not. */
#heatmap{overflow:hidden}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
thead{position:relative;z-index:2}
thead th{
  position:sticky;top:0;background:var(--card);z-index:2;
  background-clip:padding-box;box-shadow:0 1px 0 var(--rule);
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;text-align:right;padding:8px 18px 8px 0;
}
thead th:first-child{text-align:left;padding-left:18px}
tbody td{padding:9px 0 9px 0;border-bottom:1px solid var(--rule-2);text-align:right;
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
tbody td:first-child{text-align:left;padding-left:18px;font-family:"IBM Plex Sans",sans-serif}
tbody td:last-child{padding-right:18px}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}
tbody tr[aria-selected=true] td{background:var(--accent-soft)}
.sym{display:flex;align-items:center;gap:9px}
.dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:600;color:#fff;letter-spacing:-.02em}
.tick{font-weight:500}
.pill{display:inline-block;min-width:64px;text-align:right;padding:2px 7px;border-radius:5px;
  font-size:12.5px;font-weight:500}
.pill.up{background:var(--up-soft)} .pill.down{background:var(--down-soft)}

/* ---- chart --------------------------------------------------------------- */
.chartwrap{padding:14px 18px 18px;display:flex;flex-direction:column;min-width:0}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.chead .price{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chead .price b{font-family:"IBM Plex Serif",Georgia,serif;font-size:27px;font-weight:600;letter-spacing:-.015em}
.chead .price #c-price{font-family:"IBM Plex Mono",monospace;font-size:22px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chead .c-sym-line{display:inline-flex;align-items:center;gap:8px}
.chead .meta{font-size:12px;color:var(--ink-3);margin-top:3px}
.search{position:relative}
.search input{
  background:var(--sunk);border:1px solid var(--rule);border-radius:8px;
  padding:9px 13px;font:inherit;font-size:13px;color:var(--ink);width:230px;
  font-family:"IBM Plex Mono",monospace;
}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;background:var(--card)}
.ac{position:absolute;top:calc(100% + 5px);right:0;z-index:60;width:320px;background:var(--card);
  border:1px solid var(--rule);border-radius:9px;box-shadow:var(--shadow);overflow:hidden;display:none}
.ac.open{display:block}
.ac div{padding:8px 11px;cursor:pointer;display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--rule-2)}
.ac div:last-child{border-bottom:0}
.ac div:hover,.ac div[aria-selected=true]{background:var(--accent-soft)}
.ac b{font-family:"IBM Plex Mono",monospace;font-size:12.5px;min-width:56px;color:var(--accent)}
.ac span{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chart{flex:1;min-height:360px}
svg{display:block;max-width:100%}
.tnum{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

/* ---- the sections below Market Summary ---------------------------------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
/* The rotation chart carries twelve series and a date axis; the bar
   chart beside it is eleven short rows and needs much less. */
.grid2.wide{grid-template-columns:1.7fr 1fr}
.hmhead{display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:15px 18px 4px;flex-wrap:wrap}
.hmhead h3{font-size:14.5px;font-weight:600;letter-spacing:-.005em;margin:0}
.htitle{display:inline-flex;align-items:center;gap:7px;min-width:0}
.info-i{
  position:relative; flex-shrink:0;
  width:18px; height:18px; border-radius:50%;
  border:1px solid var(--rule); background:var(--sunk);
  color:var(--ink-3); cursor:help; padding:0;
  display:inline-grid; place-items:center;
  font:inherit; font-size:11px; font-weight:700; line-height:1;
}
.info-i:hover, .info-i:focus-visible{
  color:var(--accent); border-color:var(--accent); outline:none;
}
/* Fixed so .panel overflow:hidden cannot crop the bubble.
   Opaque fill is required — without it the tip text sits on the table. */
.info-i .info-bubble, .info-bubble{
  position:fixed; z-index:200; left:0; top:0;
  width:min(300px, 72vw); height:auto; padding:9px 11px;
  background-color:var(--card); background:var(--card);
  color:var(--ink-2); border:1px solid var(--rule);
  border-radius:8px; box-shadow:var(--shadow);
  font-size:12px; font-weight:400; line-height:1.45; text-align:left;
  opacity:0; visibility:hidden; pointer-events:none;
  transform:translateY(-3px); transition:opacity .12s ease, transform .12s ease;
}
.info-i:hover .info-bubble, .info-i:focus-visible .info-bubble, .info-bubble.on{
  opacity:1; visibility:visible; transform:none;
}
.grid2 > .panel{overflow:visible}
.scroll{overflow-x:auto;padding:10px 18px 18px}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;
  font-size:13.5px;color:var(--ink-3);padding:0 18px 14px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px;
  vertical-align:-1px}

/* Treemap tiles are anchors so a heatmap click behaves like any other link. */
.tile{position:absolute;border-radius:3px;overflow:hidden;text-decoration:none;
  display:block;border:1px solid var(--ground)}
.tile:hover{outline:2px solid var(--ink);outline-offset:-2px;z-index:3}
.tile b{position:absolute;left:4px;top:3px;font-family:"IBM Plex Sans",sans-serif;
  font-weight:600;color:#fff;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.tile span{position:absolute;left:4px;font-family:"IBM Plex Mono",monospace;
  color:rgba(255,255,255,.88);line-height:1;white-space:nowrap}
.sectorbox{position:absolute}
.sectorbox>h4{font-size:14.5px;font-weight:600;color:var(--ink-2);margin:0 0 3px 1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Compact tables for the trade panels. */
.mini{width:100%;border-collapse:collapse;font-size:12.5px}
.mini thead th{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;text-align:right;padding:0 0 7px 8px;border-bottom:1px solid var(--rule)}
.mini thead th:first-child{text-align:left;padding-left:0}
.mini thead th.idcol{text-align:left}
.mini tbody td{padding:7px 0 7px 8px;border-bottom:1px solid var(--rule-2);text-align:right;
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap;
  vertical-align:middle}
.mini tbody td:first-child{text-align:left;color:var(--ink-3);padding-left:0}
.mini tbody td.idcol{text-align:left;font-family:"IBM Plex Sans",sans-serif}
.mini tbody tr:last-child td{border-bottom:0}
.mini a{color:var(--accent);text-decoration:none;font-weight:500}
.mini a:hover .tsym-t{text-decoration:underline}
.side{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;font-weight:600;
  font-family:"IBM Plex Sans",sans-serif}
.side.buy{background:var(--up-soft);color:var(--up)}
.side.sell{background:var(--down-soft);color:var(--down)}
.who{font-family:"IBM Plex Sans",sans-serif;color:var(--ink-2);max-width:150px;
  overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}

#tip{
  position:fixed;z-index:200;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--card);border:1px solid var(--rule);border-radius:8px;
  box-shadow:var(--shadow);padding:9px 11px;font-size:12.5px;max-width:280px;
}
#tip.on{opacity:1}
#tip b{display:block;font-size:12.5px;margin-bottom:4px;
  font-family:"IBM Plex Mono",monospace;font-weight:600}
#tip .r{display:flex;justify-content:space-between;gap:16px;align-items:center;color:var(--ink-2)}
#tip .r span:last-child{font-family:"IBM Plex Mono",monospace;color:var(--ink);
  font-variant-numeric:tabular-nums;font-weight:600}
#tip .sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:7px;
  vertical-align:-1px}

.note{padding:30px 18px;color:var(--ink-3);font-size:13px;text-align:center}
.foot{margin-top:26px;padding-top:18px;border-top:1px solid var(--rule);
  font-size:12px;color:var(--ink-3);line-height:1.7}
.foot a{color:var(--accent);text-decoration:none}
.foot a:hover{text-decoration:underline}
.load{display:inline-block;width:13px;height:13px;border:2px solid var(--rule);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- market pulse + news strip (above Market Summary) -------------------- */
/* ---- Today's Brief -------------------------------------------------------
   Insights left, the day's calendar right, in the same proportions the list
   and chart below use. Both halves are fixed-height and scroll internally, so
   a heavy news day cannot push the market-cap table off the fold. */
.brief{
  display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.9fr);
  gap:18px;margin:0 0 18px;align-items:start;
}
@media (max-width:980px){ .brief{grid-template-columns:minmax(0,1fr)} }
.brief .panel{display:flex;flex-direction:column;min-width:0}
.bstamp{font-size:11.5px;color:var(--ink-3);white-space:nowrap;flex-shrink:0}
/* ~3 cards and ~4 calendar rows before either side scrolls; the two columns
   are deliberately the same height so the section reads as one block. */
#brief-list,.cal-scroll{height:268px;overflow-y:auto;scrollbar-gutter:stable}
.bcard{
  display:block;padding:11px 14px;border-bottom:1px solid var(--rule-2);
  text-decoration:none;color:inherit;
}
.bcard:last-child{border-bottom:0}
.bcard h4{
  margin:0 0 4px;font-size:13.5px;font-weight:650;letter-spacing:-.01em;
  color:var(--ink);line-height:1.3;
}
.bcard p{margin:0;font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.bfoot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px}
.bwhen{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  color:var(--ink-3);letter-spacing:.02em;
}
.bkind{
  font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
  color:var(--ink-3);border:1px solid var(--rule);border-radius:99px;
  padding:1px 7px;
}
.bsym{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;
  color:var(--accent);text-decoration:none;border:1px solid var(--rule);
  border-radius:99px;padding:1px 7px;
}
.bsym:hover{border-color:var(--accent);background:var(--accent-soft)}
.bsrc{font-size:11px;color:var(--ink-3);text-decoration:none;margin-left:auto}
.bsrc:hover{color:var(--accent);text-decoration:underline}
/* Calendar rows, matching the portfolio page's so the two read as one product. */
.brow{
  display:flex;align-items:center;gap:10px;padding:0 12px;height:56px;
  border-bottom:1px solid var(--rule-2);box-sizing:border-box;
}
.brow:last-child{border-bottom:0}
.brow .av{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;display:grid;
  place-items:center;font-family:"IBM Plex Mono",monospace;font-size:10px;
  font-weight:700;color:#fff;overflow:hidden;
}
.brow .av img{width:100%;height:100%;object-fit:cover}
.brow .body{min-width:0;flex:1}
.brow .row1{display:flex;align-items:baseline;gap:8px;min-width:0}
.brow .nm{
  font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
a.nm:hover{color:var(--accent)}
.brow .when{
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);
  flex-shrink:0;margin-left:auto;
}
.brow .meta{
  font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* Impact dot: the releases that move the whole market read first. */
.idot{
  width:7px;height:7px;border-radius:50%;flex-shrink:0;
  background:var(--ink-3);display:inline-block;
}
.idot.high{background:var(--down)} .idot.medium{background:#eda100}
.bmore{
  display:block;padding:10px 12px;font-size:12px;color:var(--ink-3);
  text-decoration:none;text-align:center;
}
.bmore:hover{color:var(--accent)}
.bempty{
  height:100%;display:grid;place-items:center;padding:0 20px;text-align:center;
  color:var(--ink-3);font-size:12.5px;line-height:1.5;
}

.pulse{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  box-shadow:var(--shadow);margin:0 0 18px;overflow:hidden;
}
.pulse .cell{padding:14px 16px;border-right:1px solid var(--rule);min-width:0}
.pulse .cell:last-child{border-right:0}
.pulse a.cell{display:block;text-decoration:none;color:inherit}
.pulse a.cell:hover{background:var(--hover, rgba(127,127,127,.06))}
.pulse .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;margin-bottom:6px}
.pulse .v{font-family:"IBM Plex Sans",sans-serif;font-size:22px;font-weight:700;
  letter-spacing:-.02em;line-height:1.15;color:var(--ink)}
.pulse .v.up{color:var(--up)} .pulse .v.down{color:var(--down)}
.pulse .v .dim{color:var(--ink-3);font-weight:500;font-size:16px}
.pulse .chg{margin-top:6px;font-size:12.5px;font-weight:600;
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.pulse .chg.up{color:var(--up)} .pulse .chg.down{color:var(--down)}
.pulse .spark{display:block;width:100%;height:36px;margin-top:10px}
.pulse .scale{margin-top:10px;height:6px;border-radius:99px;position:relative;
  background:linear-gradient(90deg,#c0392e 0%,#eda100 45%,#2a78d6 100%)}
/* Fear runs red to green; breadth runs red to blue. Same shape, different
   quantity, so the ramps differ deliberately. */
.pulse .scale.fg{background:linear-gradient(90deg,#c0392e 0%,#e67e22 25%,#eda100 50%,#27ae60 75%,#0b7a4b 100%)}
.pulse .chg.mut{color:var(--ink-3);font-weight:500;text-transform:capitalize}
.pulse .scale i{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;
  background:var(--card);border:2px solid var(--ink);transform:translate(-50%,-50%);
  box-shadow:0 0 0 2px var(--card)}
.pulse .gauge-wrap .score{
  position:absolute;left:0;right:0;bottom:1px;text-align:center;
  font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1;
  pointer-events:none;
}
.pulse .gauge .rating{font-size:11.5px;color:var(--ink-3);text-transform:capitalize;
  align-self:center;margin-bottom:2px}

/* Chart range filter (same control as Portfolio). */
.range{display:flex;gap:4px;flex-shrink:0}
.range button{
  border:1px solid var(--rule);background:transparent;border-radius:7px;
  padding:4px 9px;font:inherit;font-size:11.5px;cursor:pointer;color:var(--ink-2)
}
.range button[aria-pressed=true]{border-color:var(--ink);color:var(--ink);font-weight:600}

/* Star on the chart header — yellow when followed, grey when not. */
.cstar{background:none;border:0;cursor:pointer;font-size:21px;line-height:1;
  color:var(--ink-3);padding:0 2px;align-self:center}
.cstar:hover{color:#e0a92e}
.cstar.on{color:#e0a92e}
.cstar[disabled]{opacity:.5}


/* Star on each summary row — yellow once followed. */
.tickline{display:flex;align-items:center;gap:5px}
.rstar{background:none;border:0;padding:0;cursor:pointer;line-height:1;
  font-size:12.5px;color:var(--rule);flex-shrink:0}
.rstar:hover{color:#e0a92e}
.rstar.on{color:#e0a92e}

/* Symbol over company name in the summary rows. */
.symtext{display:flex;flex-direction:column;gap:1px;min-width:0}
.coname{font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Sans",sans-serif;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:118px}

/* The watchlist search sits above the rows, not inside them. */
.wl-bar{padding:10px 12px;border-bottom:1px solid var(--rule)}
.wl-bar .wl-search{max-width:none;margin:0}

/* ---- watchlist ----------------------------------------------------------- */
.wl-empty{padding:26px 20px 30px;text-align:center}
.wl-star{width:56px;height:56px;border-radius:50%;margin:0 auto 14px;
  background:#fdf0d5;color:#e0a92e;display:grid;place-items:center;font-size:26px}
.wl-empty h3{font-size:17px;font-weight:700;letter-spacing:-.015em;margin-bottom:5px}
.wl-empty>p{font-size:12.5px;color:var(--ink-3);margin-bottom:18px}
.wl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;text-align:left;margin-bottom:18px}
.wl-card{background:var(--card);border:1px solid var(--rule);border-radius:11px;
  padding:11px 12px;cursor:pointer}
.wl-card:hover{border-color:var(--accent)}
.wl-top{display:flex;align-items:center;gap:7px}
.wl-top b{font-size:13.5px;flex:1}
.wl-plus{width:22px;height:22px;border-radius:50%;border:0;background:var(--sunk);
  color:var(--ink-2);font-size:15px;line-height:1;cursor:pointer;flex-shrink:0}
.wl-card:hover .wl-plus{background:var(--accent);color:#fff}
.wl-px{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;margin-top:7px;
  display:flex;gap:7px;align-items:baseline}
.wl-px span{font-size:11.5px}
.wl-name{font-size:11px;color:var(--ink-3);margin-top:3px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

.wl-search{position:relative;max-width:340px;margin:0 auto 18px}
.wl-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;color:var(--ink-3);pointer-events:none}
.wl-search input{width:100%;background:var(--card);border:1px solid var(--rule);
  border-radius:9px;padding:10px 12px 10px 33px;font:inherit;font-size:13px;color:var(--ink)}
.wl-ac{display:none;position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:40;
  background:var(--card);border:1px solid var(--rule);border-radius:10px;
  box-shadow:var(--shadow);overflow:hidden;text-align:left}
.wl-ac.open{display:block}
.wl-ac div{padding:9px 12px;cursor:pointer;display:flex;gap:10px;align-items:baseline;
  border-bottom:1px solid var(--rule-2)}
.wl-ac div:last-child{border-bottom:0}
.wl-ac div:hover{background:var(--accent-soft)}
.wl-ac b{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--accent);min-width:56px}
.wl-ac span{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}

.wl-prompt{position:fixed;right:18px;bottom:18px;z-index:300;max-width:320px}
.wl-prompt-in{background:var(--card);border:1px solid var(--rule);border-radius:12px;
  box-shadow:var(--shadow);padding:15px 16px}
.wl-prompt-in b{font-size:14px}
.wl-prompt-in p{font-size:12.5px;color:var(--ink-3);margin:5px 0 12px;line-height:1.45}
.wl-prompt-btns{display:flex;gap:8px;justify-content:flex-end}
.wl-cta{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:8px 14px;
  font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.wl-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:300;
  background:var(--ink);color:var(--ground);border-radius:9px;padding:10px 16px;
  font-size:12.5px;box-shadow:var(--shadow)}

@media (max-width:640px){ .wl-prompt{left:14px;right:14px;max-width:none} }

@media (max-width:1180px){ .split{grid-template-columns:minmax(0,1fr)} .rows{border-right:0;border-bottom:1px solid var(--rule)} }
@media (max-width:900px){
  /* minmax(0,1fr), not 1fr. `1fr` means minmax(auto,1fr), whose minimum is the
     content's min-content width -- so the trades table pushed its column to
     522px inside a 390px container while its sibling panels stayed at 390.
     That is the inconsistent-width bug: same page, two card widths. */
  .grid2, .grid2.wide{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){ .top h1{font-size:26px} main{padding:18px 14px 60px} .search input{width:160px} }

/* Mobile: charts use the full card width instead of a letterboxed fixed SVG.

   Cards keep a gutter rather than running edge to edge. Full-bleed looked
   tidier but left no neutral strip to start a scroll from -- a chart occupying
   the whole width captures the drag -- and it made every card the same shape as
   the background, so nothing read as a card. */
@media (max-width:720px){
  main{padding:12px 12px 60px}
  h2{padding:0 2px}
  .panel .phead{padding-left:14px;padding-right:14px}
  .scroll{padding-left:8px;padding-right:8px}
  .scroll svg,.panel svg.fullchart{
    width:100%!important;height:auto!important;max-width:none;display:block;
  }
  .foot{margin:18px 14px 0;padding-top:14px}

  .sumhead{margin:0 10px 8px;gap:6px 10px;flex-wrap:nowrap;overflow-x:auto}
  .sumhead .sub{font-size:10.5px;text-align:right;margin-left:auto;white-space:nowrap}

  /* Pulse: one compact row of five (3 indexes + breadth + fear). */
  .pulse{
    margin:0 10px 8px;border-radius:10px;border:1px solid var(--rule);
    grid-template-columns:repeat(5,minmax(0,1fr));
  }
  .pulse .cell{
    padding:10px 6px 9px;border-right:1px solid var(--rule);border-bottom:0;
  }
  .pulse .cell:last-child{border-right:0}
  .pulse .k{font-size:8px;letter-spacing:.04em;margin-bottom:4px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .pulse .v{font-size:12.5px;letter-spacing:-.02em}
  .pulse .v .dim{font-size:9.5px}
  .pulse .chg{font-size:9.5px;margin-top:3px}
  .pulse .spark{height:22px;margin-top:6px}
  .pulse .scale{margin-top:7px;height:4px}
  .pulse .scale i{width:8px;height:8px;border-width:1.5px}
  .pulse .gauge{justify-content:center;gap:0;margin-top:0}
  .pulse .gauge-wrap svg{width:46px;height:26px}
  .pulse .gauge-wrap .score{font-size:13px;bottom:0}
  .pulse .gauge .rating{display:none}

  h2{margin-top:4px}

  /* Market Summary: keep the list; drop the chart panel (ticker header,
     search, and intraday plot) — on a phone the list is enough. */
  .split{min-height:0}
  .chartwrap{display:none!important}
  .rows{max-height:min(52vh,420px);border-bottom:0}

  /* Heatmap: edge-to-edge, compact chrome, taller plot. */
  #heatmap{padding:0;overflow:hidden}
  .hmhead{padding:14px 14px 6px;gap:8px}
  .info-i .info-bubble, .info-bubble{width:min(260px, 78vw); font-size:11.5px}
  #hm-legend.legend{
    padding:0;gap:5px 9px;font-size:11px;width:100%;
  }
  #hm-legend.legend i{width:9px;height:9px;margin-right:4px}
  .sectorbox>h4{font-size:12px;margin-bottom:2px}
  .tile{border-radius:2px}
  .grid2,.grid2.wide{gap:12px}

  /* Type scale. These were desktop sizes inherited down, which is why a single
     heading could take a third of the screen. */
  h2{font-size:17px}
  h3{font-size:13px}
  .panel .phead h2,.panel .phead h3{font-size:13.5px}
  .hmhead h3{font-size:13.5px}
  .note{font-size:12.5px}

  /* No block gets more than about 40% of the viewport, so two are always in
     view and the page can be skimmed rather than only scrolled. */
  .scroll > svg,.lwrap > svg,.fullchart{max-height:38vh}
  /* The panel is the header plus this plus a legend, so the box has to be well
     under half the screen for the whole card to be. */
  #heatmap{max-height:36vh}
  .rows{max-height:38vh}
}

/* ---- Discover news carousel (under sector movements) --------------------- */
.discover{margin-top:28px}
.disc-head{display:flex;align-items:baseline;justify-content:space-between;
  gap:12px;margin-bottom:14px}
.disc-head h2{margin:0}
.disc-head a{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
.disc-head a:hover{text-decoration:underline}
.disc-rail{position:relative;padding:0 48px}
.disc-viewport{overflow:hidden;border-radius:calc(var(--r) + 2px)}
.disc-track{display:flex;gap:12px;transition:transform .45s cubic-bezier(.22,.61,.36,1);
  will-change:transform}
.disc-card{
  flex:0 0 calc((100% - 48px) / 5);min-width:0;
  display:flex;flex-direction:column;background:var(--card);
  border:1px solid var(--rule);border-radius:9px;overflow:hidden;
  text-decoration:none;color:inherit;box-shadow:var(--shadow);
  transition:transform .25s ease, border-color .2s ease, box-shadow .25s ease;
}
.disc-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb, var(--accent) 45%, var(--rule));
  box-shadow:0 4px 18px -10px rgba(17,24,32,.35)}
.disc-card .ph{aspect-ratio:16/9;background:var(--sunk);overflow:hidden}
.disc-card .ph img{width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .5s ease}
.disc-card:hover .ph img{transform:scale(1.03)}
.disc-card .ph.blank{display:grid;place-items:center;color:var(--ink-3);
  font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.disc-card .body{padding:10px 11px 11px;display:flex;flex-direction:column;gap:8px;flex:1}
.disc-card h3{font-family:"IBM Plex Serif",Georgia,serif;font-size:13.5px;font-weight:600;
  letter-spacing:-.015em;line-height:1.3;margin:0;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  min-height:3.9em}
.disc-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;
  margin-top:auto;padding-top:1px}
.disc-src{display:flex;align-items:center;gap:6px;min-width:0;font-size:10.5px;color:var(--ink-3)}
.disc-src .av{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  font-size:8px;font-weight:700;color:#fff;background:var(--accent)}
.disc-src .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.disc-src .tag{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
  color:var(--accent);flex-shrink:0}
.disc-nav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:2;
  width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);
  background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-items:center;
  box-shadow:var(--shadow);padding:0;
}
.disc-nav:hover{border-color:var(--accent);color:var(--accent)}
.disc-nav:disabled{opacity:.35;cursor:default;border-color:var(--rule);color:var(--ink-3)}
.disc-nav.prev{left:0}
.disc-nav.next{right:0}
.disc-nav svg{width:18px;height:18px;display:block}
.disc-dots{display:flex;justify-content:center;gap:7px;margin-top:16px;min-height:10px}
.disc-dots button{width:7px;height:7px;border-radius:50%;border:0;padding:0;
  background:var(--rule);cursor:pointer}
.disc-dots button[aria-current=true]{background:var(--ink);transform:scale(1.15)}
.disc-empty{padding:28px;text-align:center;color:var(--ink-3);font-size:13px}
@media (max-width:1280px){
  .disc-card{flex-basis:calc((100% - 36px) / 4)}
}
@media (max-width:980px){
  .disc-card{flex-basis:calc((100% - 24px) / 3)}
}
@media (max-width:720px){
  .discover{margin-top:18px;padding:0 10px}
  .disc-head{padding:0 4px}
  .disc-rail{padding:0}
  .disc-nav{display:none}
  .disc-viewport{overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
    scrollbar-width:none}
  .disc-viewport::-webkit-scrollbar{display:none}
  .disc-track{transition:none;transform:none!important;gap:10px}
  .disc-card{flex-basis:min(42vw,168px);scroll-snap-align:start}
  .disc-card h3{font-size:12.5px;min-height:0}
  .disc-card .body{padding:8px 9px 9px;gap:6px}
  .disc-dots{margin-top:12px}
}

/* ---- Alpha of the Day ----------------------------------------------------
   Lifted from the standalone page; every selector is scoped to .alphaday so
   the market page's own .grid2/.chip/.big rules are untouched. */
.alphaday{margin-top:26px}
/* The market page styles its links per component; this block came from a
   page that reset them globally, so keep that reset inside the section. */
.alphaday a{color:inherit;text-decoration:none}
.alphaday .ahead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.alphaday .ahead .sub{color:var(--ink-3);font-size:12.5px;margin-left:auto}
/* Alpha score: hovering (or focusing) the number explains the weighting. */
.alphaday .scorewrap{position:relative;display:inline-block;cursor:help}
.alphaday .scorewrap:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.alphaday .wgt{position:absolute;left:0;top:calc(100% + 8px);z-index:40;width:236px;
  background:var(--card);border:1px solid var(--rule);border-radius:9px;
  box-shadow:var(--shadow);padding:11px 13px;opacity:0;visibility:hidden;
  transform:translateY(-3px);transition:opacity .14s ease,transform .14s ease,visibility .14s}
.alphaday .scorewrap:hover .wgt,.alphaday .scorewrap:focus-visible .wgt{
  opacity:1;visibility:visible;transform:translateY(0)}
.alphaday .wgt h5{font-size:10.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
.alphaday .wgt .wr{display:flex;justify-content:space-between;gap:10px;
  font-size:12px;color:var(--ink-2);padding:2.5px 0}
.alphaday .wgt .wr b{font-family:"IBM Plex Mono",monospace;color:var(--ink);font-weight:600}
.alphaday .wgt p{margin-top:8px;padding-top:8px;border-top:1px solid var(--rule-2);
  font-size:11px;color:var(--ink-3);line-height:1.45}

/* ---- hero carousel ------------------------------------------------------ */
.alphaday .hero{position:relative}
/* The clip is sized to the slide on screen, not to the tallest of the nine —
   the pick carries three gate rows the candidates do not, and letting it set
   the height left every other slide with dead space under its chips. */
.alphaday .slides-clip{overflow:hidden;transition:height .28s ease}
.alphaday .slides{display:flex;align-items:flex-start;transition:transform .32s ease}
@media (prefers-reduced-motion:reduce){
  .alphaday .slides{transition:none}.alphaday .slides-clip{transition:none}
}
.alphaday .slide{flex:0 0 100%;min-width:0}
.alphaday .pick{display:grid;grid-template-columns:minmax(0,1fr) 270px}
.alphaday .pick-main{padding:16px 24px 18px;border-right:1px solid var(--rule-2);min-width:0;
  display:flex;flex-direction:column}
/* Whatever slack the score rail leaves goes to the charts, so the evidence
   grows into the space instead of stranding it under the chips. */
.alphaday .pick-main .charts{flex:1 0 auto}
.alphaday .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  margin-bottom:10px}
.alphaday .eyebrow.today{color:var(--accent)}
.alphaday .eyebrow.rank{color:var(--ink-3)}
.alphaday .idrow{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.alphaday .idrow .dot{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;
  color:#fff;font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;
  flex-shrink:0;overflow:hidden;position:relative}
.alphaday .idrow .nm b{font-size:19px;letter-spacing:-.01em;display:block;line-height:1.2}
.alphaday .idrow .nm b a:hover{color:var(--accent)}
.alphaday .side-in{font-size:14px;font-weight:700}
.alphaday .idrow .nm > span{color:var(--ink-3);font-size:12.5px}
.alphaday .side-in.up{color:var(--up)}.alphaday .side-in.down{color:var(--down)}
.alphaday .px{margin-left:auto;text-align:right}
.alphaday .px .p{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600}
.alphaday .px .c{font-size:11.5px;color:var(--ink-3)}
.alphaday .px .c b{font-family:"IBM Plex Mono",monospace;font-weight:600}
.alphaday .case{font-family:"IBM Plex Serif",Georgia,serif;font-size:17.5px;line-height:1.42;
  letter-spacing:-.008em;margin:11px 0 14px;max-width:74ch}
.alphaday .case b{font-weight:600}
.alphaday .charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.alphaday .ch{background:var(--sunk);border:1px solid var(--rule-2);border-radius:9px;
  padding:12px 14px 8px;min-width:0}
.alphaday .ch h4{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:4px;gap:8px}
.alphaday .ch h4 a{color:var(--accent);text-transform:none;letter-spacing:0;font-weight:600;
  font-size:11.5px;white-space:nowrap}
.alphaday .ch svg{width:100%;height:auto;display:block}
.alphaday .ch .empty{color:var(--ink-3);font-size:12px;padding:26px 0;text-align:center}
.alphaday .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.alphaday .chip{display:inline-flex;align-items:center;gap:7px;background:var(--sunk);
  border:1px solid var(--rule-2);border-radius:8px;padding:6px 11px;font-size:12px;
  color:var(--ink-2)}
.alphaday .chip b{font-family:"IBM Plex Mono",monospace;color:var(--ink);font-weight:600}
.alphaday .chip .d{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.alphaday .chip .d.up{background:var(--up)} .alphaday .chip .d.down{background:var(--down)}
.alphaday .chip .d.mut{background:var(--ink-3)}

<script>
"use strict";

const CFG = window.ALPHATICKER_CONFIG || window.LEDGER_CONFIG || {};
const HOSTED = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
// analytics.js loads first, in the head. The fallback is only so a missing one
// breaks analytics rather than the page.
const GA = window.TAnalytics || { track(){}, pageView(){} };

async function rpc(fn, args){
  if (!HOSTED) throw new Error("config.js is missing, so there is no data source");
  // A stale token must never take the page down with it. If Supabase rejects
  // one, renew it and retry; if it cannot be renewed the session is dropped
  // and the same call goes out anonymously, so public data always arrives.
  const send = tok => fetch(`${CFG.supabaseUrl}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: {
      apikey: CFG.supabaseAnonKey,
      "Content-Type": "application/json",
      ...(tok ? { Authorization: `Bearer ${tok}` } : {}),
    },
    body: JSON.stringify(args || {}),
  });

  let tok = window.TA && window.TA.token();
  let r = await send(tok);
  if (r.status === 401 && tok && window.TA && window.TA.recover) {
    r = await send(await window.TA.recover());
  }
  if (!r.ok) throw new Error(`${fn} failed (${r.status})`);
  return r.json();
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = v => v === null || v === undefined ? "—" : `${v >= 0 ? "+" : ""}${v.toFixed(2)}%`;
const dir = v => v >= 0 ? "up" : "down";
const price = v => v === null || v === undefined ? "—"
  : v >= 1000 ? v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})
  : v.toFixed(2);
const cap = v => {
  if (!v) return "—";
  if (v >= 1e12) return `$${(v/1e12).toFixed(2)}T`;
  if (v >= 1e9)  return `$${(v/1e9).toFixed(1)}B`;
  return `$${(v/1e6).toFixed(0)}M`;
};
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const longDate = iso => { if(!iso) return ""; const [y,m,d]=iso.split("-").map(Number);
  return `${MONTHS[m-1]} ${d}, ${y}`; };
const ago = iso => {
  if (!iso) return "";
  const ms = Date.now() - new Date(iso).getTime();
  if (!Number.isFinite(ms) || ms < 0) return "";
  const m = Math.round(ms / 60000);
  if (m < 60) return `${Math.max(1, m)}m ago`;
  const h = Math.round(m / 60);
  if (h < 48) return `${h}h ago`;
  const d = Math.round(h / 24);
  return `${d}d ago`;
};

// A stable colour per symbol, so a ticker keeps its identity between views.
const AVATAR = ["--accent","#eb6834","#1baf7a","#eda100","#e87ba4","#4a3aa7","#2a78d6","#e34948"];
const avatarColour = s => {
  let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const c = AVATAR[h % AVATAR.length];
  return c.startsWith("--") ? `var(${c})` : c;
};

const S = { view: "market_cap", rows: [], symbol: null, overview: null, movement: null,
            pricePoll: null, intraPoll: null, sel: 0, gotIntraday: false,
            // A year is the range that shows a trend rather than noise, and
            // it is what a first-time visitor should meet.
            chartRange: "1Y", chartBars: [] };

const INDEX_LABELS = {
  SPX: "S&P 500",
  IXIC: "NASDAQ",
  DJI: "Dow Jones",
};

function rangeStartISO(range){
  const d = new Date();
  if (range === "1W") d.setDate(d.getDate() - 7);
  else if (range === "1M") d.setMonth(d.getMonth() - 1);
  else if (range === "1Y") d.setFullYear(d.getFullYear() - 1);
  else d.setMonth(0, 1); // YTD
  return d.toISOString().slice(0, 10);
}

/* ---- shared tooltip ------------------------------------------------------ */
const tipEl = document.getElementById("tip");
function showTip(ev, title, rows){
  tipEl.innerHTML = `<b>${esc(title)}</b>` + rows.map(([k, v, colour]) =>
    `<div class="r"><span>${colour ? `<i class="sw" style="background:${colour}"></i>` : ""}${esc(k)}</span>` +
    `<span>${esc(v)}</span></div>`).join("");
  tipEl.classList.add("on");
  const pad = 14, w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + w > innerWidth - 8) x = ev.clientX - w - pad;
  if (y + h > innerHeight - 8) y = ev.clientY - h - pad;
  tipEl.style.left = Math.max(8, x) + "px";
  tipEl.style.top = Math.max(8, y) + "px";
}
const hideTip = () => tipEl.classList.remove("on");

/* ---- market pulse + news strip ------------------------------------------ */

async function assemblePulseFallback(){
  // Used until migration 0048 is applied and get_market_pulse returns indexes.
  const [overview, tape] = await Promise.all([
    rpc("get_market_overview").catch(() => null),
    rpc("get_ticker_tape").catch(() => null),
  ]);
  const indexes = [];
  for (const sym of ["SPX", "IXIC", "DJI"]) {
    const q = Array.isArray(tape) ? tape.find(t => t.symbol === sym) : null;
    if (q) {
      indexes.push({
        symbol: sym,
        name: INDEX_LABELS[sym] || q.name || sym,
        price: q.price,
        change: q.change,
        changePct: q.changePct ?? q.change_pct,
      });
    } else {
      indexes.push({ symbol: sym, name: INDEX_LABELS[sym] || sym,
                     price: null, change: null, changePct: null });
    }
  }
  const b = overview && overview.breadth;
  const breadth = b && b.total ? {
    up: b.up, total: b.total, avgChange: b.avgChange,
    score: Math.round(100 * b.up / b.total),
  } : null;
  const fearGreed = breadth ? {
    score: breadth.score,
    rating: breadth.score >= 55 ? "greed" : breadth.score <= 45 ? "fear" : "neutral",
    source: "breadth",
  } : null;
  return { indexes, breadth, fearGreed, asOf: overview && overview.asOf };
}

function sparkPath(vals, w, h){
  if (!vals || vals.length < 2) return "";
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.08 || 1;
  const y = v => h - ((v - (lo - pad)) / ((hi + pad) - (lo - pad))) * h;
  const x = i => (w * i) / (vals.length - 1);
  return vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
}

async function paintIndexSparks(indexes){
  await Promise.all((indexes || []).map(async ix => {
    const host = document.querySelector(`[data-spark="${ix.symbol}"]`);
    if (!host) return;
    let bars = [];
    try {
      const d = await rpc("get_prices", { p_symbol: ix.symbol });
      bars = (d && d.bars) || [];
      if (!bars.length) rpc("request_prices", { p_symbol: ix.symbol }).catch(() => {});
    } catch {}
    const vals = bars.slice(-30).map(b => b.c).filter(v => v != null);
    if (vals.length < 2) { host.innerHTML = ""; return; }
    const up = vals[vals.length - 1] >= vals[0];
    const stroke = up ? "var(--up)" : "var(--down)";
    const d = sparkPath(vals, 120, 36);
    host.innerHTML = `<svg class="spark" viewBox="0 0 120 36" preserveAspectRatio="none"
      aria-hidden="true"><path d="${d}" fill="none" stroke="${stroke}"
      stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
  }));
}

function renderPulse(p){
  const host = document.getElementById("pulse");
  if (!p) {
    host.innerHTML = `<div class="note" style="grid-column:1/-1">Pulse unavailable.</div>`;
    return;
  }
  // Prefer indexes from 0048; fall back to legacy marketCap/spy if present.
  let indexes = Array.isArray(p.indexes) ? p.indexes.slice() : [];
  if (!indexes.length && (p.marketCap || p.spy)) {
    indexes = [
      { symbol: "SPX", name: "S&P 500", price: null, changePct: null },
      { symbol: "IXIC", name: "NASDAQ", price: null, changePct: null },
      { symbol: "DJI", name: "Dow Jones", price: null, changePct: null },
    ];
  }
  const bySym = Object.fromEntries(indexes.map(x => [x.symbol, x]));
  const ordered = ["SPX", "IXIC", "DJI"].map(sym => bySym[sym] || {
    symbol: sym, name: INDEX_LABELS[sym], price: null, change: null, changePct: null,
  });
  const br = p.breadth;
  const fg = p.fearGreed;
  const pctFmt = v => `${v > 0 ? "+" : ""}${v.toFixed(2)}%`;
  const absChg = (change, pctVal) => {
    const parts = [];
    if (change != null && Number.isFinite(+change)) {
      const n = +change;
      parts.push(`${n > 0 ? "+" : ""}${n.toLocaleString(undefined, {
        maximumFractionDigits: 2, minimumFractionDigits: 2 })}`);
    }
    if (pctVal != null && Number.isFinite(+pctVal)) parts.push(pctFmt(+pctVal));
    return parts.join(" ");
  };

  const indexCells = ordered.map(ix => {
    const cp = ix.changePct ?? ix.change_pct;
    const label = INDEX_LABELS[ix.symbol] || ix.name || ix.symbol;
    return `<a class="cell" href="company.html?t=${encodeURIComponent(ix.symbol)}&src=market_pulse">
      <div class="k">${esc(label)}</div>
      <div class="v ${cp == null ? "" : dir(cp)}">${ix.price != null ? esc(price(ix.price)) : "—"}</div>
      <div class="chg ${cp == null ? "" : dir(cp)}">${esc(absChg(ix.change, cp))}</div>
      <div data-spark="${esc(ix.symbol)}"></div>
    </a>`;
  });

  const cells = [
    ...indexCells,
    `<div class="cell">
      <div class="k">Breadth Index</div>
      <div class="v">${br ? `${esc(String(br.score))}<span class="dim"> /100</span>` : "—"}</div>
      ${br ? `<div class="scale" title="${br.up}/${br.total} advancing">
        <i style="left:${br.score}%"></i></div>` : ""}
    </div>`,
    `<div class="cell">
      <div class="k">Fear &amp; Greed</div>
      <div class="v">${fg ? `${esc(String(Math.round(fg.score)))}<span class="dim"> /100</span>`
                          : "—"}</div>
      ${fg ? `<div class="scale fg" title="${esc(fg.rating || "")}${
                fg.source && fg.source !== "cnn" ? " · own composite" : " · CNN"}">
        <i style="left:${Math.max(0, Math.min(100, fg.score))}%"></i></div>
      <div class="chg mut">${esc(fg.rating || "")}${
        fg.source && fg.source !== "cnn" ? " · composite" : ""}</div>` : ""}
    </div>`,
  ];
  host.innerHTML = cells.join("");
  paintIndexSparks(ordered);
}

// Same ledger.news corpus as the News page, narrowed to mega-cap tickers and
// government / policy subjects so the market page stays on the macro story.
const DISC = { items: [], page: 0, per: 3 };
const POLICY_RE = /\b(fed|fomc|tariff|interest rates?|inflation|wars?|sanctions?|white house|treasury|recession|jobs report|ukraine|gaza|central bank|congress|regulation|geopolit|s&p\s*500|nasdaq\s*(composite|100)|dow jones)\b/i;

/** An image worth printing, or null — same trust rules as the News page.
    The article page's own photograph (imageSrc "article", scraped by the
    worker) is always trusted; a feed image is a thumbnail pasted on by the
    aggregator, trusted only when no wire service sent the story. */
const WIRE_RE = /newswire|business ?wire|accesswire|newsfile|prweb|press release/i;
function newsImage(a){
  if (!a || !a.image) return null;
  if (a.imageSrc === "article") return a.image;
  if (WIRE_RE.test(a.publisher || "")) return null;
  return a.image;
}

function discoverPerPage(){
  if (matchMedia("(max-width:720px)").matches) return 2;
  if (matchMedia("(max-width:980px)").matches) return 3;
  if (matchMedia("(max-width:1280px)").matches) return 4;
  return 5;
}

function discoverMatch(a, mega){
  const text = `${a.title || ""} ${a.summary || ""}`;
  if (a.symbol && mega.has(a.symbol)) return true;
  if (POLICY_RE.test(text)) return true;
  for (const s of mega) {
    // Skip one-letter tickers (V) — they match ordinary English.
    if (!s || s.length < 2) continue;
    if (new RegExp(`(^|[^A-Za-z])${s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}([^A-Za-z]|$)`).test(text))
      return true;
  }
  return false;
}

async function loadDiscover(){
  let rows = [];
  try {
    rows = await rpc("get_discover_news", { p_limit: 12 }) || [];
  } catch {
    // Migration not applied yet — filter the same corpus the News page uses.
    try {
      const [top, news, feed] = await Promise.all([
        rpc("get_market_summary", { p_view: "market_cap", p_limit: 20 }),
        rpc("get_news", { p_limit: 60, p_offset: 0 }).catch(() => null),
        rpc("get_news_feed", { p_hours: 168, p_limit: 60 }).catch(() => []),
      ]);
      const mega = new Set((top || []).map(r => r.symbol));
      const byUrl = new Map();
      for (const a of [...((news && news.articles) || []), ...(feed || [])]) {
        if (a && a.url && !byUrl.has(a.url) && discoverMatch(a, mega)) byUrl.set(a.url, a);
      }
      rows = [...byUrl.values()].sort((a, b) => {
        const ai = newsImage(a) ? 0 : 1, bi = newsImage(b) ? 0 : 1;
        if (ai !== bi) return ai - bi;
        return (b.published || "").localeCompare(a.published || "");
      }).slice(0, 12);
    } catch { rows = []; }
  }
  renderDiscover(rows);
}

function renderDiscover(articles){
  const track = document.getElementById("discover");
  const dots = document.getElementById("discover-dots");
  DISC.items = Array.isArray(articles) ? articles : [];
  DISC.page = 0;
  DISC.per = discoverPerPage();

  if (!DISC.items.length) {
    track.innerHTML = `<div class="disc-empty">No mega-cap or policy stories in the last few days.
      <a href="news.html" style="color:var(--accent)">Browse all news →</a></div>`;
    dots.innerHTML = "";
    syncDiscoverNav();
    return;
  }

  track.innerHTML = DISC.items.map(a => {
    const pub = a.publisher || "Source";
    const initial = (pub.replace(/^the\s+/i, "").trim()[0] || "?").toUpperCase();
    const pic = newsImage(a);
    const img = pic
      ? `<span class="ph"><img src="${esc(pic)}" alt="" loading="lazy"
           onerror="this.parentNode.classList.add('blank');this.remove()"
           onload="if(this.naturalWidth&&this.naturalWidth<240){this.parentNode.classList.add('blank');this.remove()}"></span>`
      : `<span class="ph blank">Market</span>`;
    return `<a class="disc-card" href="${esc(a.url)}" target="_blank" rel="noopener"
        data-ta-news="home_feed"${a.symbol ? ` data-ta-ticker="${esc(a.symbol)}"` : ""}>
      ${img}
      <div class="body">
        <h3>${esc(a.title)}</h3>
        <div class="disc-meta">
          <span class="disc-src">
            <span class="av" style="background:${avatarColour(pub)}">${esc(initial)}</span>
            <span class="who">${esc(pub)}${a.published ? ` · ${esc(ago(a.published))}` : ""}</span>
          </span>
          ${a.symbol ? `<span class="tag">${esc(a.symbol)}</span>` : ""}
        </div>
      </div>
    </a>`;
  }).join("");

  paintDiscoverDots();
  goDiscover(0);
  requestAnimationFrame(() => goDiscover(DISC.page));
}

/** How far the rail can slide: one step per card past the first visible set. */
function discoverMax(){
  return Math.max(0, DISC.items.length - Math.max(1, DISC.per));
}

function paintDiscoverDots(){
  const dots = document.getElementById("discover-dots");
  const n = discoverMax() + 1;
  if (n <= 1) { dots.innerHTML = ""; return; }
  dots.innerHTML = Array.from({ length: n }, (_, i) =>
    `<button type="button" aria-label="Story ${i + 1}"
       aria-current="${i === DISC.page}"></button>`).join("");
  dots.querySelectorAll("button").forEach((b, i) => b.onclick = () => goDiscover(i));
}

function goDiscover(page){
  const track = document.getElementById("discover");
  DISC.per = discoverPerPage();
  DISC.page = Math.max(0, Math.min(page, discoverMax()));
  // On phones the track scrolls natively; leave transform alone.
  if (!matchMedia("(max-width:720px)").matches) {
    const card = track.querySelector(".disc-card");
    const gap = 12;
    const step = card ? card.getBoundingClientRect().width + gap : 0;
    track.style.transform = `translateX(${-DISC.page * step}px)`;
  }
  document.querySelectorAll("#discover-dots button").forEach((b, i) =>
    b.setAttribute("aria-current", String(i === DISC.page)));
  syncDiscoverNav();
}

function syncDiscoverNav(){
  const max = discoverMax();
  const prev = document.getElementById("disc-prev");
  const next = document.getElementById("disc-next");
  if (!prev || !next) return;
  prev.disabled = DISC.page <= 0 || max <= 0;
  next.disabled = DISC.page >= max || max <= 0;
}

function wireDiscover(){
  document.getElementById("disc-prev").onclick = () => goDiscover(DISC.page - 1);
  document.getElementById("disc-next").onclick = () => goDiscover(DISC.page + 1);
  addEventListener("resize", () => {
    if (!DISC.items.length) return;
    const per = discoverPerPage();
    if (per !== DISC.per) {
      DISC.per = per;
      paintDiscoverDots();
    }
    goDiscover(DISC.page);
  });
}

/* ===========================================================================
   Watchlist

   A visitor can build one before signing in -- asking for an account first is
   how a feature never gets tried. It lives in the browser until they sign in,
   and merges into the account then, so nothing they did is lost.
=========================================================================== */
const WATCH_KEY = "alphaticker-watchlist";

const localWatch = {
  read(){ try { return JSON.parse(localStorage.getItem(WATCH_KEY) || "[]"); } catch { return []; } },
  write(list){ try { localStorage.setItem(WATCH_KEY, JSON.stringify([...new Set(list)])); } catch {} },
  has(sym){ return this.read().includes(sym); },
  toggle(sym){
    const l = this.read();
    const i = l.indexOf(sym);
    if (i >= 0) l.splice(i, 1); else l.push(sym);
    this.write(l);
    return i < 0;                        // true when it was added
  },
  clear(){ try { localStorage.removeItem(WATCH_KEY); } catch {} },
};

const signedIn = () => !!(window.TA && window.TA.signedIn());

/** Ask the worker for a quote and a chart the moment a name is followed, so
    the price column does not wait on the next market-wide refresh. */
function askWatchPrices(sym){
  rpc("request_intraday", { p_symbol: sym }).catch(() => {});
  rpc("request_prices", { p_symbol: sym }).catch(() => {});
}

/** Add or remove, wherever this visitor's list lives. `source` says which
    part of the page the star was on; see analytics.js for the vocabulary. */
async function toggleWatch(symbol, source){
  const sym = String(symbol || "").toUpperCase();
  if (!sym) return false;
  const report = watching => {
    GA.track(watching ? "add_to_watchlist" : "remove_from_watchlist", { ticker: sym, source });
    if (window.posthog) window.posthog.capture(
      watching ? "watchlist_ticker_added" : "watchlist_ticker_removed",
      { ticker: sym, source });
  };
  // The watchlist is the gate. This used to save to localStorage and *then*
  // ask for an account, which meant the visitor already had what they came
  // for and the modal was pure interruption -- the reason it converted at
  // nothing. Now the ask comes first and the star does not move until it is
  // answered.
  if (!signedIn()) {
    GA.track("gate_view", { gate: "watchlist", ticker: sym, source });
    if (window.TA?.showSignupModal) window.TA.showSignupModal({ reason: "watchlist" });
    return false;
  }
  try {
    const d = await rpc("toggle_watchlist", { p_symbol: sym });
    const w = !!(d && d.watching);
    if (w) askWatchPrices(sym);
    report(w);
    dispatchEvent(new CustomEvent("watchchange", { detail: { symbol: sym, watching: w } }));
    return w;
  } catch { return false; }
}

/** The symbols on this visitor's list, from wherever it lives. */
async function watchSymbols(){
  if (!signedIn()) return localWatch.read();
  try {
    const d = await rpc("get_watchlist");
    return ((d && d.items) || []).map(i => i.symbol);
  } catch { return []; }
}

/** On sign-in, hand the browser's list to the account and forget the copy. */
async function mergeLocalWatchlist(){
  const local = localWatch.read();
  if (!local.length || !signedIn()) return 0;
  try {
    const d = await rpc("merge_watchlist", { p_symbols: local });
    if (d && !d.error) { localWatch.clear(); return d.added || 0; }
  } catch {}
  return 0;
}

async function setView(v){
  S.view = v;
  document.querySelectorAll("#views button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.v === v));
  document.getElementById("rows").innerHTML = `<div class="note"><span class="load"></span></div>`;

  await refreshWatched();
  if (v === "watchlist") return renderWatchlist();

  S.rows = await rpc("get_market_summary", { p_view: v, p_limit: 20 }) || [];
  // Draw the table first, always. selectSymbol only moves the highlight now,
  // so relying on it to render left the list showing its loading spinner
  // whenever the previous selection was absent from the new view -- which is
  // every first load.
  renderRows();
  if (!S.rows.some(r => r.symbol === S.symbol) && S.rows.length) selectSymbol(S.rows[0].symbol);
}

/** The star beside the ticker on the chart. Present on every tab, so a
    company can be followed from wherever it was noticed rather than only from
    its own page. Yellow when watched, grey when not. */
async function paintChartStar(sym){
  const el = document.getElementById("c-star");
  if (!el) return;
  el.hidden = false;

  let watching;
  if (signedIn()) {
    try {
      const d = await rpc("is_watched", { p_symbol: sym });
      watching = !!(d && d.watching);
    } catch { watching = false; }
  } else {
    watching = localWatch.has(sym);
  }

  const paint = w => {
    el.textContent = w ? "★" : "☆";
    el.classList.toggle("on", w);
    el.setAttribute("aria-pressed", String(w));
    el.title = w ? `Remove ${sym} from your watchlist` : `Add ${sym} to your watchlist`;
  };
  paint(watching);

  el.onclick = async e => {
    e.stopPropagation();
    el.disabled = true;
    paint(await toggleWatch(sym, S.view === "watchlist" ? "watchlist" : "market_page"));
    el.disabled = false;
    // Watching the list you are looking at: reflect the change immediately.
    if (S.view === "watchlist") renderWatchlist();
  };
}

/** A brief line at the foot of the screen; used only for things the reader
    did not ask to be told twice. */
function toast(msg){
  const el = document.createElement("div");
  el.className = "wl-toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

/* ---- the watchlist view -------------------------------------------------- */
/** Resolve prices for an arbitrary set of tickers — not only the top market
    caps. Prefers get_symbol_quotes; falls back to per-symbol intraday/daily
    when that RPC is not applied yet. */
async function enrichWatchPrices(syms){
  const out = {};
  if (!syms.length) return out;
  try {
    const rows = await rpc("get_symbol_quotes", { p_symbols: syms }) || [];
    if (Array.isArray(rows) && rows.length) {
      rows.forEach(r => { if (r && r.symbol) out[r.symbol] = r; });
      return out;
    }
  } catch {}
  await Promise.all(syms.map(async sym => {
    try {
      const d = await rpc("get_intraday", { p_symbol: sym });
      if (d && d.quote && d.quote.price != null) {
        out[sym] = { symbol: sym, name: d.quote.name, price: d.quote.price,
                     changePct: d.quote.changePct, marketCap: null };
        return;
      }
      const last = d && d.points && d.points.length ? d.points[d.points.length - 1].c : null;
      if (last != null) { out[sym] = { symbol: sym, price: last, changePct: null }; return; }
      const p = await rpc("get_prices", { p_symbol: sym });
      const q = p && p.quote;
      const bars = (p && p.bars) || [];
      const px = (q && q.price != null) ? q.price
        : (bars.length ? bars[bars.length - 1].c : null);
      if (px != null) {
        out[sym] = { symbol: sym, name: q && q.name, price: px,
                     changePct: q && (q.change_pct ?? q.changePct), marketCap: q && q.market_cap };
      }
    } catch {}
  }));
  return out;
}

async function renderWatchlist(){
  const host = document.getElementById("rows");
  // Prefer the watchlist RPC's own quote join — not the top-50 market-cap
  // summary, which left followed names like HOOD as "—" even when a quote
  // was already in ledger.
  let items = [];
  if (signedIn()) {
    try {
      const d = await rpc("get_watchlist");
      items = ((d && d.items) || []).map(i => ({
        symbol: i.symbol, name: i.name, price: i.price,
        changePct: i.changePct, marketCap: i.marketCap,
      }));
    } catch {}
  }
  if (!items.length) {
    const syms = await watchSymbols();
    items = syms.map(symbol => ({ symbol, price: null, changePct: null }));
  }

  S.watched = new Set(items.map(i => i.symbol));
  if (!items.length) return renderWatchEmpty(host);

  const missing = items.filter(i => i.price == null).map(i => i.symbol);
  if (missing.length) {
    const by = await enrichWatchPrices(missing);
    items = items.map(i => {
      if (i.price != null || !by[i.symbol]) return i;
      const e = by[i.symbol];
      return {
        symbol: i.symbol,
        name: i.name || e.name,
        price: e.price,
        changePct: i.changePct ?? e.changePct,
        marketCap: i.marketCap ?? e.marketCap,
      };
    });
    // Still blank: ask the worker so the next pass fills ledger.quote.
    const still = items.filter(i => i.price == null).map(i => i.symbol);
    still.forEach(askWatchPrices);
    if (still.length) {
      clearTimeout(S.wlPricePoll);
      S.wlPricePoll = setTimeout(() => {
        if (S.view === "watchlist") renderWatchlist();
      }, 8000);
    }
  }

  S.rows = items;

  // The search stays above the list rather than only appearing when the list
  // is empty: adding the second company should be no harder than the first.
  host.innerHTML = `<div class="wl-bar">${watchSearchMarkup("Add a company…")}</div>
                    <div id="wl-rows"></div>`;
  renderRows(document.getElementById("wl-rows"));
  wireWatchSearch();

  // Show the top of the list straight away, the way the other tabs do; an
  // empty chart beside a full list looks like something failed.
  if (!S.rows.some(r => r.symbol === S.symbol)) selectSymbol(S.rows[0].symbol);

  if (!signedIn()) promptSaveWatchlist(items.length);
}

/** One search field, used above the list and inside the empty state. */
function watchSearchMarkup(placeholder){
  return `
    <form class="wl-search" id="wl-search">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none"
        stroke="currentColor" stroke-width="2"/><path d="M13.5 13.5 18 18" stroke="currentColor"
        stroke-width="2" stroke-linecap="round"/></svg>
      <input type="text" id="wl-q" placeholder="${esc(placeholder)}" autocomplete="off">
      <div class="wl-ac" id="wl-ac"></div>
    </form>`;
}

/** Nothing on the list yet: offer the obvious names and a search, rather than
    an empty table that gives no way forward. */
async function renderWatchEmpty(host){
  // Array.isArray, not `|| []`: a rejected token can come back 200 with an
  // error object rather than a row set, and `{}.map` took the whole empty
  // state down with it. That state is now the only thing a signed-out visitor
  // sees on this tab, so it is the last thing that should be able to break.
  let popular = [];
  try {
    const rows = await rpc("get_market_summary", { p_view: "market_cap", p_limit: 6 });
    if (Array.isArray(rows)) popular = rows;
  } catch {}

  host.innerHTML = `
    <div class="wl-empty">
      <div class="wl-star">★</div>
      <h3>Add companies to your watchlist</h3>

      ${watchSearchMarkup("Search for a ticker to add…")}

      <div class="wl-grid">${popular.map(q => `
        <div class="wl-card" data-add="${esc(q.symbol)}">
          <div class="wl-top">
            <span class="dot" data-logo="${esc(q.symbol)}" style="background:${avatarColour(q.symbol)}">${esc(q.symbol.slice(0,2))}</span>
            <b>${esc(q.symbol)}</b>
            <button type="button" class="wl-plus" aria-label="Add ${esc(q.symbol)}">+</button>
          </div>
          <div class="wl-px">${esc(price(q.price))}
            <span class="${dir(q.changePct)}">${esc(pct(q.changePct))}</span></div>
          <div class="wl-name">${esc(q.name || "")}</div>
        </div>`).join("")}</div>

    </div>`;

  if (window.TickerLogos) {
    window.TickerLogos.hydrate(popular.map(q => q.symbol), host);
  }

  host.querySelectorAll("[data-add]").forEach(card => {
    card.onclick = async () => {
      await toggleWatch(card.dataset.add, "watchlist");
      renderWatchlist();
    };
  });
  wireWatchSearch();
}

function wireWatchSearch(){
  const q = document.getElementById("wl-q"), ac = document.getElementById("wl-ac");
  if (!q) return;
  let timer = null;
  const close = () => { ac.innerHTML = ""; ac.classList.remove("open"); };
  q.addEventListener("input", () => {
    clearTimeout(timer);
    const term = q.value.trim();
    if (!term) return close();
    timer = setTimeout(async () => {
      let items = [];
      try {
        items = (window.TA && window.TA.searchCompanies
          ? await window.TA.searchCompanies(term)
          : await rpc("search_companies", { q: term })) || [];
      } catch {}
      if (!items.length) return close();
      ac.innerHTML = items.slice(0, 6).map(x => {
        const kind = x.kind && x.kind !== "stock" ? ` · ${x.kind}` : "";
        return `<div data-s="${esc(x.ticker)}"><b>${esc(x.ticker)}</b>` +
          `<span>${esc(x.name)}${esc(kind)}</span></div>`;
      }).join("");
      ac.classList.add("open");
      ac.querySelectorAll("[data-s]").forEach(d => d.onmousedown = async e => {
        e.preventDefault();
        const sym = d.dataset.s;
        GA.track("search", { search_term: term });
        // Add it if it is new, then show it on the chart either way -- picking
        // a company should put it in front of you, not just on a list.
        if (!(await watchSymbols()).includes(sym)) await toggleWatch(sym, "watchlist");
        await renderWatchlist();
        selectSymbol(sym);
      });
    }, 140);
  });
  q.addEventListener("blur", () => setTimeout(close, 150));
  document.getElementById("wl-search").onsubmit = async e => {
    e.preventDefault();
    const sym = q.value.trim().toUpperCase();
    if (!sym) return;
    GA.track("search", { search_term: sym });
    if (!(await watchSymbols()).includes(sym)) await toggleWatch(sym, "watchlist");
    await renderWatchlist();
    selectSymbol(sym);
  };
}

/** A list built without an account lives in one browser. Prefer the shared
    Google signup modal; keep the old sheet only if nav.js is unavailable. */
function promptSaveWatchlist(n){
  if (sessionStorage.getItem("wl-prompted")) return;
  sessionStorage.setItem("wl-prompted", "1");
  if (window.TA?.showSignupModal) {
    window.TA.showSignupModal({ reason: "watchlist" });
    return;
  }
  const el = document.createElement("div");
  el.className = "wl-prompt";
  el.innerHTML = `
    <div class="wl-prompt-in">
      <b>Keep your watchlist</b>
      <p>${n} ${n === 1 ? "company is" : "companies are"} saved in this browser only.
         Sign in and they follow you to any device.</p>
      <div class="wl-prompt-btns">
        <button type="button" class="ghost" data-later>Not now</button>
        <button type="button" class="wl-cta" data-signin>Sign in</button>
