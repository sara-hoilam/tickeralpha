/* ---- Alpha of the Day ---------------------------------------------------
   Ported from the standalone page. Everything lives in this closure so
   its esc/rpc/niceScale/AVATAR do not collide with the market page's. */
(function(){
"use strict";
const CFG = window.ALPHATICKER_CONFIG || window.LEDGER_CONFIG || {};
const HOSTED = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
const GA = window.TAnalytics || { track(){}, pageView(){} };
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function rpc(fn, args){
  if (!HOSTED) throw new Error("config.js is missing, so there is no data source");
  const r = await fetch(`${CFG.supabaseUrl}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { apikey: CFG.supabaseAnonKey, "Content-Type": "application/json" },
    body: JSON.stringify(args || {}),
  });
  if (!r.ok) throw new Error(`${fn} ${r.status}`);
  return r.json();
}

const AVATAR = ["#1e4fbf","#eb2024","#1baf7a","#eda100","#e87ba4","#4a3aa7","#2a78d6","#e34948"];
const avatarColour = s => AVATAR[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0) % AVATAR.length];

function niceScale(lo, hi, want){
  const span = (hi - lo) || Math.abs(hi) || 1;
  const raw = span / Math.max(1, want);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map(m => m * mag).find(v => v >= raw) || mag * 10;
  const decimals = Math.max(0, Math.ceil(-Math.log10(step) - 1e-9));
  const out = [];
  for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + step * 1e-6; v += step)
    out.push(+v.toFixed(10));
  return { values: out, decimals };
}

const FAMILY_LABEL = {
  hist: "Price vs own history", val: "Valuation vs peers", smart: "Smart money",
  fund: "Fundamentals", street: "The Street", mom: "Momentum & season",
};
const money = v => v >= 1e9 ? `$${(v/1e9).toFixed(1)}B`
  : v >= 1e6 ? `$${(v/1e6).toFixed(1)}M` : `$${Math.round(v/1e3)}K`;
const fmtDay = iso => {
  const d = new Date(iso + "T12:00:00Z");
  return d.toLocaleDateString("en-US", { weekday:"short", day:"numeric",
    month:"short", year:"numeric", timeZone:"UTC" });
};
const dow = iso => new Date(iso + "T12:00:00Z")
  .toLocaleDateString("en-US", { weekday:"short", timeZone:"UTC" });

/* ---- charts ------------------------------------------------------------- */

/** Three years of weekly closes with congress purchase flags. */
function priceChart(series, marks, tone){
  const W = 470, H = 168, ml = 8, mr = 46, mt = 14, mb = 20;
  const pts = (series || []).filter(p => p && p.c != null);
  if (pts.length < 10) return null;
  const cs = pts.map(p => p.c);
  const lo = Math.min(...cs), hi = Math.max(...cs);
  const pad = (hi - lo) * 0.06 || hi * 0.05;
  const y0 = lo - pad, y1 = hi + pad;
  const X = i => ml + (W - ml - mr) * i / (pts.length - 1);
  const Y = v => mt + (H - mt - mb) * (1 - (v - y0) / (y1 - y0));
  const col = tone === "down" ? "var(--down)" : "var(--accent)";
  let s = "";
  const yt = niceScale(lo, hi, 3);
  for (const v of yt.values){
    if (v < y0 || v > y1) continue;
    s += `<line x1="${ml}" x2="${W-mr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--rule-2)" stroke-width="1"></line>`
       + `<text x="${W-mr+5}" y="${(Y(v)+3.2).toFixed(1)}" font-size="9.5" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">$${v.toFixed(yt.decimals)}</text>`;
  }
  // year ticks
  let lastYear = "";
  pts.forEach((p, i) => {
    const y = p.d.slice(0, 4);
    if (y !== lastYear && i > 0){
      lastYear = y;
      s += `<text x="${X(i).toFixed(1)}" y="${H-6}" font-size="9.5" fill="var(--ink-3)" text-anchor="middle" font-family="IBM Plex Mono,monospace">${y}</text>`;
    } else if (i === 0) lastYear = y;
  });
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(p.c).toFixed(1)}`).join(" ");
  s += `<path d="${line} L${X(pts.length-1).toFixed(1)} ${(H-mb).toFixed(1)} L${ml} ${(H-mb).toFixed(1)} Z" fill="${col}" opacity=".07"></path>`;
  s += `<path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"></path>`;
  // trade flags — congress and insiders alike, green for buys and red for
  // sells, stacked so labels never collide
  (marks || []).slice(0, 3).forEach((m, j) => {
    let idx = pts.findIndex(p => p.d >= m.d);
    if (idx < 0) idx = pts.length - 1;
    const mcol = m.s === "sell" ? "var(--down)" : "var(--up)";
    const x = X(idx), ly = mt + 2 + j * 15;
    const anchor = x > W * 0.6 ? "end" : "start";
    const tx = x > W * 0.6 ? x - 6 : x + 6;
    s += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${(ly+3).toFixed(1)}" y2="${Y(pts[idx].c).toFixed(1)}" stroke="${mcol}" stroke-width="1" opacity=".55"></line>`
       + `<circle cx="${x.toFixed(1)}" cy="${Y(pts[idx].c).toFixed(1)}" r="3" fill="${mcol}"></circle>`
       + `<text x="${tx.toFixed(1)}" y="${ly+7}" font-size="9.5" font-weight="600" fill="${mcol}" text-anchor="${anchor}" stroke="var(--sunk)" stroke-width="3" paint-order="stroke">${esc(m.l || "")}</text>`;
  });
  const last = pts[pts.length - 1];
  s += `<circle cx="${X(pts.length-1).toFixed(1)}" cy="${Y(last.c).toFixed(1)}" r="3" fill="${col}"></circle>`;
  const tip = pts.map((p, i) => ({ x: +X(i).toFixed(1), y: +Y(p.c).toFixed(1),
    t: fmtDay(p.d), r: [["Close", `$${p.c.toFixed(2)}`]] }));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Three years of price"${tipData("Price", tip, { hair: 1 })}>${s}</svg>`;
}

/** Two columns on a real axis: the company's P/E against its index peers'
    median. The fallback when too little P/E history is stored to draw a line —
    a bar without a baseline is just a floating rectangle, so this one gets
    gridlines, a zero rule and labelled ticks like every other chart here. */
function peBars(own, peer, tone){
  if (!own || !peer) return null;
  const W = 470, H = 168, ml = 8, mr = 46, mt = 18, mb = 30;
  const plotH = H - mt - mb;
  const top = Math.max(own, peer) * 1.15;
  const Y = v => mt + plotH * (1 - v / top);
  const zero = Y(0);
  let s = "";
  /* Ticks are chosen against the axis top, not the taller bar: asking for
     them across the data range alone returned a single gridline here. */
  const yt = niceScale(0, top, 4);
  for (const v of yt.values){
    if (v > top || v <= 0) continue;
    s += `<line x1="${ml}" x2="${W-mr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--rule-2)" stroke-width="1"></line>`
       + `<text x="${W-mr+5}" y="${(Y(v)+3.2).toFixed(1)}" font-size="9.5" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">${v.toFixed(yt.decimals)}</text>`;
  }
  /* Rounded at the data end, square on the baseline. */
  const col = (cx, v, fill, op) => {
    const w = 24, r = 4, x = cx - w / 2, y = Y(v), h = Math.max(zero - y, r);
    return `<path d="M${x} ${zero} L${x} ${(y+r).toFixed(1)} Q${x} ${y.toFixed(1)} ${x+r} ${y.toFixed(1)} L${(x+w-r).toFixed(1)} ${y.toFixed(1)} Q${(x+w).toFixed(1)} ${y.toFixed(1)} ${(x+w).toFixed(1)} ${(y+r).toFixed(1)} L${(x+w).toFixed(1)} ${zero} Z" fill="${fill}"${op ? ` opacity="${op}"` : ""}></path>`;
  };
  const plotW = W - ml - mr;
  const c1 = ml + plotW * 0.38, c2 = ml + plotW * 0.62;
  const accent = tone === "down" ? "var(--down)" : "var(--accent)";
  s += col(c1, own, accent) + col(c2, peer, "var(--ink-3)", ".5");
  /* Value on the cap, category under the baseline — both in text tokens. */
  const cap = (cx, v) =>
    `<text x="${cx.toFixed(1)}" y="${(Y(v)-6).toFixed(1)}" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle" font-family="IBM Plex Mono,monospace">${v.toFixed(1)}</text>`;
  const foot = (cx, t) =>
    `<text x="${cx.toFixed(1)}" y="${(zero+15).toFixed(1)}" font-size="10.5" fill="var(--ink-3)" text-anchor="middle">${t}</text>`;
  s += cap(c1, own) + cap(c2, peer) + foot(c1, "own P/E") + foot(c2, "index peers");
  s += `<line x1="${ml}" x2="${W-mr}" y1="${zero}" y2="${zero}" stroke="var(--rule)" stroke-width="1"></line>`;
  const tip = [
    { x: +c1.toFixed(1), y: +Y(own).toFixed(1), t: "Own P/E",
      r: [["P/E", own.toFixed(1)], ["vs peers", `${((own / peer - 1) * 100).toFixed(0)}%`]] },
    { x: +c2.toFixed(1), y: +Y(peer).toFixed(1), t: "Index peers",
      r: [["Median P/E", peer.toFixed(1)]] }];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="P/E ${own.toFixed(1)} against index peers ${peer.toFixed(1)}"${tipData("Valuation", tip)}>${s}</svg>`;
}


/* ---- per-family evidence charts ------------------------------------------
   The second chart follows the idea's strongest family: the drawdown record
   when price-vs-history leads, the month-by-month seasonal averages when
   momentum leads, the houses' price targets when the Street leads, the
   revenue quarters when fundamentals lead, and the P/E comparison otherwise.
   Each returns null when its data is missing so the caller can fall back. */

const shortDate = iso => {
  if (!iso) return "";
  const d = new Date(String(iso).slice(0, 10) + "T12:00:00Z");
  return isNaN(d) ? "" : d.toLocaleDateString("en-US",
    { day: "numeric", month: "short", timeZone: "UTC" });
};
const fmtRev = v => v >= 1e9 ? `$${(v / 1e9).toFixed(v >= 2e10 ? 0 : 1)}B`
  : `$${Math.round(v / 1e6)}M`;

/** Drawdown from the 10-year running high, weekly over 3 years. */
function drawdownChart(series, tone){
  const pts = (series || []).filter(p => p && p.v != null);
  if (pts.length < 10) return null;
  const W = 470, H = 168, ml = 8, mr = 46, mt = 14, mb = 20;
  const col = tone === "down" ? "var(--down)" : "var(--accent)";
  const lo = Math.min(...pts.map(p => p.v));
  const y0 = Math.min(lo * 1.08, -1), y1 = 0;
  const X = i => ml + (W - ml - mr) * i / (pts.length - 1);
  const Y = v => mt + (H - mt - mb) * (y1 - v) / (y1 - y0);
  let s = "";
  const endY = Y(pts[pts.length - 1].v);
  const yt = niceScale(0, -y0, 3);
  for (const t of yt.values){
    if (t <= 0 || -t < y0) continue;
    s += `<line x1="${ml}" x2="${W-mr}" y1="${Y(-t).toFixed(1)}" y2="${Y(-t).toFixed(1)}" stroke="var(--rule-2)" stroke-width="1"></line>`;
    if (Math.abs(Y(-t) - endY) > 12)
      s += `<text x="${W-mr+5}" y="${(Y(-t)+3.2).toFixed(1)}" font-size="9.5" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">−${t.toFixed(yt.decimals)}%</text>`;
  }
  // the zero line is the running high itself
  s += `<line x1="${ml}" x2="${W-mr}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="var(--rule)" stroke-width="1.2"></line>`
     + `<text x="${W-mr+5}" y="${(Y(0)+3.2).toFixed(1)}" font-size="9.5" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">high</text>`;
  let lastYear = "";
  pts.forEach((p, i) => {
    const y = p.d.slice(0, 4);
    if (y !== lastYear && i > 0){
      lastYear = y;
      s += `<text x="${X(i).toFixed(1)}" y="${H-6}" font-size="9.5" fill="var(--ink-3)" text-anchor="middle" font-family="IBM Plex Mono,monospace">${y}</text>`;
    } else if (i === 0) lastYear = y;
  });
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(" ");
  s += `<path d="${line} L${X(pts.length-1).toFixed(1)} ${Y(0).toFixed(1)} L${ml} ${Y(0).toFixed(1)} Z" fill="${col}" opacity=".07"></path>`
     + `<path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"></path>`
     + `<circle cx="${X(pts.length-1).toFixed(1)}" cy="${endY.toFixed(1)}" r="3" fill="${col}"></circle>`
     + `<text x="${W-mr+5}" y="${(endY+3.2).toFixed(1)}" font-size="9.5" font-weight="600" fill="${col}" font-family="IBM Plex Mono,monospace">${pts[pts.length-1].v.toFixed(0)}%</text>`;
  const tip = pts.map((p, i) => ({ x: +X(i).toFixed(1), y: +Y(p.v).toFixed(1),
    t: fmtDay(p.d), r: [["Below its high", `${p.v.toFixed(1)}%`]] }));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Drawdown from the ten-year high"${tipData("Drawdown", tip, { hair: 1 })}>${s}</svg>`;
}

/** Price against its 50- and 200-day averages — the chart for a name whose
    story is a test of long-term support rather than a deep drawdown. */
function maChart(series, tone){
  const pts = (series || []).filter(p => p && p.c != null);
  if (pts.length < 20) return null;
  const W = 470, H = 168, ml = 8, mr = 46, mt = 22, mb = 20;
  const vals = pts.flatMap(p => [p.c, p.m50, p.m200].filter(v => v != null));
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.06 || hi * 0.05;
  const y0 = lo - pad, y1 = hi + pad;
  const X = i => ml + (W - ml - mr) * i / (pts.length - 1);
  const Y = v => mt + (H - mt - mb) * (1 - (v - y0) / (y1 - y0));
  const col = tone === "down" ? "var(--down)" : "var(--accent)";
  let s = "";
  const yt = niceScale(lo, hi, 3);
  const last = pts[pts.length - 1];
  const endY = Y(last.c), ma200Y = last.m200 != null ? Y(last.m200) : null;
  for (const v of yt.values){
    if (v < y0 || v > y1) continue;
    s += `<line x1="${ml}" x2="${W-mr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--rule-2)" stroke-width="1"></line>`;
    if (Math.abs(Y(v) - endY) > 12 && (ma200Y == null || Math.abs(Y(v) - ma200Y) > 12))
      s += `<text x="${W-mr+5}" y="${(Y(v)+3.2).toFixed(1)}" font-size="9.5" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">$${v.toFixed(yt.decimals)}</text>`;
  }
  let lastYear = "";
  pts.forEach((p, i) => {
    const y = p.d.slice(0, 4);
    if (y !== lastYear && i > 0){
      lastYear = y;
      s += `<text x="${X(i).toFixed(1)}" y="${H-6}" font-size="9.5" fill="var(--ink-3)" text-anchor="middle" font-family="IBM Plex Mono,monospace">${y}</text>`;
    } else if (i === 0) lastYear = y;
  });
  // the averages sit under the price line
  const path = key => {
    let d = "", open = false;
    pts.forEach((p, i) => {
      const v = p[key];
      if (v == null){ open = false; return; }
      d += `${open ? "L" : "M"}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`;
      open = true;
    });
    return d;
  };
  const d200 = path("m200"), d50 = path("m50");
  if (d200) s += `<path d="${d200}" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-linejoin="round" opacity=".85"></path>`;
  if (d50) s += `<path d="${d50}" fill="none" stroke="var(--up)" stroke-width="2" stroke-linejoin="round" opacity=".6"></path>`;
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(p.c).toFixed(1)}`).join(" ");
  s += `<path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"></path>`;
  if (ma200Y != null)
    s += `<text x="${W-mr+5}" y="${(ma200Y+3.2).toFixed(1)}" font-size="9.5" font-weight="600" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">200d</text>`;
  s += `<circle cx="${X(pts.length-1).toFixed(1)}" cy="${endY.toFixed(1)}" r="3.5" fill="${col}" stroke="var(--sunk)" stroke-width="2"></circle>`
     + `<text x="${W-mr+5}" y="${(endY+3.2).toFixed(1)}" font-size="9.5" font-weight="600" fill="${col}" font-family="IBM Plex Mono,monospace">$${last.c.toFixed(0)}</text>`;
  // three lines on one chart need naming
  s += `<g font-size="9.5" fill="var(--ink-3)">
    <line x1="${ml}" x2="${ml+13}" y1="9" y2="9" stroke="${col}" stroke-width="2"></line>
    <text x="${ml+17}" y="12.2">Price</text>
    <line x1="${ml+58}" x2="${ml+71}" y1="9" y2="9" stroke="var(--up)" stroke-width="2" opacity=".6"></line>
    <text x="${ml+75}" y="12.2">50-day</text>
    <line x1="${ml+126}" x2="${ml+139}" y1="9" y2="9" stroke="var(--ink-3)" stroke-width="2" opacity=".85"></line>
    <text x="${ml+143}" y="12.2">200-day</text></g>`;
  const tip = pts.map((p, i) => {
    const rows = [["Close", `$${p.c.toFixed(2)}`]];
    if (p.m50 != null) rows.push(["50-day", `$${p.m50.toFixed(2)}`]);
    if (p.m200 != null) rows.push(["200-day", `$${p.m200.toFixed(2)}`,]);
    if (p.m200) rows.push(["vs 200-day", `${((p.c / p.m200 - 1) * 100).toFixed(1)}%`]);
    return { x: +X(i).toFixed(1), y: +Y(p.c).toFixed(1), t: fmtDay(p.d), r: rows };
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Price against its 50- and 200-day averages"${tipData("Price vs averages", tip, { hair: 1 })}>${s}</svg>`;
}

/** Average return by calendar month across the stored decade. */
function seasonalityChart(season, month){
  const rows = (season || []).filter(x => x && x.r != null);
  if (rows.length < 8) return null;
  const W = 470, H = 168, ml = 8, mr = 46, mt = 14, mb = 24;
  const vals = rows.map(x => x.r);
  const top = Math.max(...vals, 0.4) * 1.2, bot = Math.min(...vals, -0.4) * 1.2;
  const Y = v => mt + (H - mt - mb) * (top - v) / (top - bot);
  const zero = Y(0);
  let s = "";
  /* Small symmetric ranges (±2%) starve a 3-tick ask down to zero labels. */
  const yt = niceScale(bot, top, 5);
  for (const v of yt.values){
    if (v < bot || v > top || v === 0) continue;
    s += `<line x1="${ml}" x2="${W-mr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--rule-2)" stroke-width="1"></line>`
       + `<text x="${W-mr+5}" y="${(Y(v)+3.2).toFixed(1)}" font-size="9.5" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">${v > 0 ? "+" : ""}${v.toFixed(yt.decimals)}%</text>`;
  }
  const plotW = W - ml - mr, slot = plotW / 12, bw = Math.min(20, slot * 0.62), r = 3;
  const LETTER = ["J","F","M","A","M","J","J","A","S","O","N","D"];
  (season || []).forEach(row => {
    const cx = ml + slot * (row.m - 0.5), x = cx - bw / 2;
    const cur = row.m === month;
    s += `<text x="${cx.toFixed(1)}" y="${H-7}" font-size="9.5" font-weight="${cur ? 700 : 400}" fill="${cur ? "var(--ink)" : "var(--ink-3)"}" text-anchor="middle" font-family="IBM Plex Mono,monospace">${LETTER[row.m-1]}</text>`;
    if (row.r == null) return;
    const v = row.r, col = v >= 0 ? "var(--up)" : "var(--down)";
    const yv = Y(v), h = Math.max(Math.abs(zero - yv), r);
    const bar = v >= 0
      ? `M${x} ${zero} L${x} ${(zero-h+r).toFixed(1)} Q${x} ${(zero-h).toFixed(1)} ${x+r} ${(zero-h).toFixed(1)} L${(x+bw-r).toFixed(1)} ${(zero-h).toFixed(1)} Q${(x+bw).toFixed(1)} ${(zero-h).toFixed(1)} ${(x+bw).toFixed(1)} ${(zero-h+r).toFixed(1)} L${(x+bw).toFixed(1)} ${zero} Z`
      : `M${x} ${zero} L${x} ${(zero+h-r).toFixed(1)} Q${x} ${(zero+h).toFixed(1)} ${x+r} ${(zero+h).toFixed(1)} L${(x+bw-r).toFixed(1)} ${(zero+h).toFixed(1)} Q${(x+bw).toFixed(1)} ${(zero+h).toFixed(1)} ${(x+bw).toFixed(1)} ${(zero+h-r).toFixed(1)} L${(x+bw).toFixed(1)} ${zero} Z`;
    s += `<path d="${bar}" fill="${col}"${cur ? "" : ` opacity=".35"`}></path>`;
    if (cur)
      s += `<text x="${cx.toFixed(1)}" y="${(v >= 0 ? yv - 5 : yv + 11).toFixed(1)}" font-size="10" font-weight="600" fill="var(--ink)" text-anchor="middle" stroke="var(--sunk)" stroke-width="3" paint-order="stroke" font-family="IBM Plex Mono,monospace">${v > 0 ? "+" : ""}${v.toFixed(1)}%</text>`;
  });
  s += `<line x1="${ml}" x2="${W-mr}" y1="${zero.toFixed(1)}" y2="${zero.toFixed(1)}" stroke="var(--rule)" stroke-width="1.2"></line>`;
  const MONTH_NAME = ["January","February","March","April","May","June","July",
                     "August","September","October","November","December"];
  const tip = (season || []).filter(r => r && r.r != null).map(row => ({
    x: +(ml + slot * (row.m - 0.5)).toFixed(1), y: +Y(row.r).toFixed(1),
    t: MONTH_NAME[row.m - 1],
    r: [["Average return", `${row.r > 0 ? "+" : ""}${row.r.toFixed(2)}%`],
        ...(row.m === month ? [["", "the month being scored"]] : [])] }));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Average return by calendar month"${tipData("Seasonality", tip)}>${s}</svg>`;
}

/** Quarterly revenue from SEC filings, last eight quarters. */
function revenueChart(rev, tone){
  const rows = (rev || []).filter(x => x && x.r > 0).slice(-8);
  if (rows.length < 4) return null;
  const W = 470, H = 168, ml = 8, mr = 52, mt = 16, mb = 24;
  const col = tone === "down" ? "var(--down)" : "var(--accent)";
  const top = Math.max(...rows.map(x => x.r)) * 1.15;
  const Y = v => mt + (H - mt - mb) * (1 - v / top);
  const zero = Y(0);
  let s = "";
  const yt = niceScale(0, top, 4);
  for (const v of yt.values){
    if (v <= 0 || v > top) continue;
    s += `<line x1="${ml}" x2="${W-mr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--rule-2)" stroke-width="1"></line>`
       + `<text x="${W-mr+5}" y="${(Y(v)+3.2).toFixed(1)}" font-size="9.5" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">${fmtRev(v)}</text>`;
  }
  const plotW = W - ml - mr, slot = plotW / rows.length, bw = Math.min(24, slot * 0.55), r = 4;
  rows.forEach((row, i) => {
    const cx = ml + slot * (i + 0.5), x = cx - bw / 2;
    const yv = Y(row.r), h = Math.max(zero - yv, r);
    s += `<path d="M${x.toFixed(1)} ${zero} L${x.toFixed(1)} ${(yv+r).toFixed(1)} Q${x.toFixed(1)} ${yv.toFixed(1)} ${(x+r).toFixed(1)} ${yv.toFixed(1)} L${(x+bw-r).toFixed(1)} ${yv.toFixed(1)} Q${(x+bw).toFixed(1)} ${yv.toFixed(1)} ${(x+bw).toFixed(1)} ${(yv+r).toFixed(1)} L${(x+bw).toFixed(1)} ${zero} Z" fill="${col}"${i === rows.length - 1 ? "" : ` opacity=".55"`}></path>`;
    const q = row.e ? `Q${Math.floor((+row.e.slice(5,7) - 1) / 3) + 1}’${row.e.slice(2,4)}` : "";
    if (i === 0 || i === rows.length - 1 || i === Math.floor(rows.length / 2))
      s += `<text x="${cx.toFixed(1)}" y="${H-7}" font-size="9" fill="var(--ink-3)" text-anchor="middle" font-family="IBM Plex Mono,monospace">${q}</text>`;
    if (i === rows.length - 1)
      s += `<text x="${cx.toFixed(1)}" y="${(yv-5).toFixed(1)}" font-size="10" font-weight="600" fill="var(--ink)" text-anchor="middle" stroke="var(--sunk)" stroke-width="3" paint-order="stroke" font-family="IBM Plex Mono,monospace">${fmtRev(row.r)}</text>`;
  });
  s += `<line x1="${ml}" x2="${W-mr}" y1="${zero}" y2="${zero}" stroke="var(--rule)" stroke-width="1"></line>`;
  const tip = rows.map((row, i) => {
    const prev = i >= 4 ? rows[i - 4] : null;
    const yoy = prev && prev.r ? ((row.r / prev.r - 1) * 100) : null;
    return { x: +(ml + slot * (i + 0.5)).toFixed(1), y: +Y(row.r).toFixed(1),
      t: row.e ? `Quarter to ${fmtDay(row.e)}` : "Quarter",
      r: [["Revenue", fmtRev(row.r)],
          ...(yoy != null ? [["vs a year ago", `${yoy > 0 ? "+" : ""}${yoy.toFixed(1)}%`]] : [])] };
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue by quarter"${tipData("Revenue", tip)}>${s}</svg>`;
}

/** Who on the Street says what: one row per house, dot at its target,
    the scan price as a reference line through the lanes. */
function targetChart(rowsIn, range, price){
  let rows = (rowsIn || []).filter(t => t && t.target > 0).slice(0, 5);
  if (!rows.length && range)
    rows = [{ house: "Low", target: range.low },
            { house: "Median", target: range.median || range.consensus },
            { house: "High", target: range.high }]
      .filter(t => t.target > 0);
  if (!rows.length || !price) return null;
  const W = 470, H = 168, mt = 22, mb = 8, houseW = 128, valueW = 86, ml = 8;
  const laneX0 = ml + houseW, laneX1 = W - valueW;
  const lo = Math.min(price, ...rows.map(t => t.target)) * 0.96;
  const hi = Math.max(price, ...rows.map(t => t.target)) * 1.04;
  const X = v => laneX0 + (laneX1 - laneX0) * (v - lo) / (hi - lo || 1);
  const rowH = Math.min(28, (H - mt - mb) / rows.length);
  let s = "";
  // the reference: where the stock was when the scan ran
  const px = X(price);
  s += `<line x1="${px.toFixed(1)}" x2="${px.toFixed(1)}" y1="${mt - 4}" y2="${(mt + rowH * rows.length).toFixed(1)}" stroke="var(--ink-3)" stroke-width="1.2" opacity=".55"></line>`
     + `<text x="${px.toFixed(1)}" y="${mt - 9}" font-size="9.5" fill="var(--ink-3)" text-anchor="middle" font-family="IBM Plex Mono,monospace">at scan $${price.toFixed(0)}</text>`;
  rows.forEach((t, i) => {
    const cy = mt + rowH * (i + 0.5);
    const col = t.target >= price ? "var(--up)" : "var(--down)";
    const tx = X(t.target);
    const house = String(t.house || t.analyst || "—").slice(0, 20);
    s += `<line x1="${laneX0}" x2="${laneX1}" y1="${cy.toFixed(1)}" y2="${cy.toFixed(1)}" stroke="var(--rule-2)" stroke-width="1"></line>`
       + `<text x="${ml}" y="${(cy+3.5).toFixed(1)}" font-size="10.5" fill="var(--ink-2)">${esc(house)}</text>`
       + `<line x1="${px.toFixed(1)}" x2="${tx.toFixed(1)}" y1="${cy.toFixed(1)}" y2="${cy.toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".45"></line>`
       + `<circle cx="${tx.toFixed(1)}" cy="${cy.toFixed(1)}" r="4" fill="${col}" stroke="var(--sunk)" stroke-width="2"></circle>`
       + `<text x="${W - ml}" y="${(cy+3.5).toFixed(1)}" font-size="10" text-anchor="end" font-family="IBM Plex Mono,monospace"><tspan font-weight="600" fill="var(--ink)">$${t.target.toFixed(0)}</tspan>${t.d ? `<tspan fill="var(--ink-3)"> · ${esc(shortDate(t.d))}</tspan>` : ""}</text>`;
  });
  const tip = rows.map((t, i) => {
    const cy = mt + rowH * (i + 0.5);
    const up = (t.target / price - 1) * 100;
    return { x: +X(t.target).toFixed(1), y: +cy.toFixed(1),
      t: String(t.house || t.analyst || "Target"),
      r: [["Target", `$${t.target.toFixed(2)}`],
          ["vs price at scan", `${up > 0 ? "+" : ""}${up.toFixed(0)}%`],
          ...(t.d ? [["Published", shortDate(t.d)]] : [])] };
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wall Street price targets"${tipData("Price targets", tip, { axis: "y" })}>${s}</svg>`;
}

/** The company's own P/E record against its index peers' median. */
function peChart(hist, peer, own, tone){
  const pts = (hist || []).filter(p => p && p.pe > 0);
  const W = 470, H = 168, ml = 8, mr = 52, mt = 16, mb = 12;
  if (pts.length < 8) return peBars(own, peer, tone);
  const vals = pts.map(p => p.pe).concat(peer ? [peer] : []);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.08 || 2;
  const y0 = Math.max(0, lo - pad), y1 = hi + pad;
  const X = i => ml + (W - ml - mr) * i / (pts.length - 1);
  const Y = v => mt + (H - mt - mb) * (1 - (v - y0) / (y1 - y0));
  const col = tone === "down" ? "var(--down)" : "var(--accent)";
  let s = "";
  const last = pts[pts.length - 1];
  const lyv = Y(last.pe);
  const peerY = peer ? Y(peer) : null;
  // The endpoint label dodges the peer label when they meet; its final
  // baseline is decided here so tick labels can stay out of both.
  const endLabelY = lyv + (peerY != null && Math.abs(lyv - peerY) < 12
    ? (lyv < peerY ? -6 : 12) : 3.2);
  const yt = niceScale(lo, hi, 3);
  const taken = [peerY, endLabelY].filter(v => v != null);
  for (const v of yt.values){
    if (v < y0 || v > y1) continue;
    s += `<line x1="${ml}" x2="${W-mr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--rule-2)" stroke-width="1"></line>`;
    if (taken.every(t => Math.abs(t - Y(v)) > 13))
      s += `<text x="${W-mr+5}" y="${(Y(v)+3.2).toFixed(1)}" font-size="9.5" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">${v.toFixed(yt.decimals)}</text>`;
  }
  if (peer){
    s += `<line x1="${ml}" x2="${W-mr}" y1="${Y(peer).toFixed(1)}" y2="${Y(peer).toFixed(1)}" stroke="var(--ink-3)" stroke-width="1.4" opacity=".6"></line>`
       + `<text x="${W-mr+5}" y="${(Y(peer)+3.2).toFixed(1)}" font-size="9.5" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">Peers ${peer.toFixed(1)}</text>`;
  }
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(p.pe).toFixed(1)}`).join(" ");
  s += `<path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"></path>`;
  const lx = X(pts.length - 1);
  s += `<circle cx="${lx.toFixed(1)}" cy="${lyv.toFixed(1)}" r="3" fill="${col}"></circle>`
     + `<text x="${(W-mr+5).toFixed(1)}" y="${endLabelY.toFixed(1)}" font-size="9.5" font-weight="600" fill="${col}" font-family="IBM Plex Mono,monospace">${last.pe.toFixed(1)}</text>`;
  const tip = pts.map((p, i) => ({ x: +X(i).toFixed(1), y: +Y(p.pe).toFixed(1),
    t: fmtDay(p.d), r: [["P/E", p.pe.toFixed(1)],
      ...(peer ? [["Index peers", peer.toFixed(1)]] : [])] }));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="P/E against its own record and index peers"${tipData("P/E", tip, { hair: 1 })}>${s}</svg>`;
}

/* The weighting behind every score, shown on hover/focus of the number. */
const WEIGHTS = [["Price vs own history", 25], ["Smart money", 20],
                 ["Valuation vs peers", 15], ["Fundamentals", 15],
                 ["The Street", 15], ["Momentum & season", 10]];
const WEIGHTS_HTML = `<span class="wgt" role="tooltip">
  <h5>How the score is weighted</h5>
  ${WEIGHTS.map(([l, w]) => `<span class="wr"><span>${l}</span><b>${w}%</b></span>`).join("")}
  <p>Each family is scored 0–100 across the universe, then blended by these
     weights. A family with no data behind it scores a neutral 50 and cannot
     count toward conviction. A screen over public data by fixed rules — not
     investment advice.</p></span>`;

/* ---- slides ------------------------------------------------------------- */

/* ---- chart hover ---------------------------------------------------------
   Every chart here carries its own readout: each one emits the points it
   drew as a data-tip payload in viewBox coordinates, and one delegated
   handler finds the nearest and shows the page's usual tooltip. Line charts
   also get a crosshair; bar and lollipop charts just highlight the mark. */

/** Attribute string for a chart's hover payload.
    pts: [{x, y, r: [[label, value], ...]}]  — r is what the tooltip lists. */
function tipData(title, pts, opts){
  const o = opts || {};
  if (!pts || !pts.length) return "";
  return ` data-tip="${esc(JSON.stringify(pts))}" data-tip-title="${esc(title)}"`
       + (o.axis === "y" ? ` data-tip-axis="y"` : "")
       + (o.hair ? ` data-tip-hair="1"` : "");
}

const SVGNS = "http://www.w3.org/2000/svg";

function wireChartTips(root){
  (root || document).querySelectorAll("#alphaday svg[data-tip]").forEach(svg => {
    let pts;
    try { pts = JSON.parse(svg.dataset.tip); } catch { return; }
    if (!Array.isArray(pts) || !pts.length) return;
    const vb = svg.viewBox.baseVal;
    const byY = svg.dataset.tipAxis === "y";
    const hair = svg.dataset.tipHair === "1";
    let line = null, dot = null;
    const clear = () => {
      hideTip();
      if (line){ line.remove(); line = null; }
      if (dot){ dot.remove(); dot = null; }
    };
    svg.style.cursor = "crosshair";
    svg.addEventListener("mousemove", ev => {
      const r = svg.getBoundingClientRect();
      if (!r.width) return;
      const k = vb.width / r.width;                  // uniform: height is auto
      const mx = (ev.clientX - r.left) * k, my = (ev.clientY - r.top) * k;
      let best = pts[0], bd = Infinity;
      for (const p of pts){
        const d = byY ? Math.abs(p.y - my) : Math.abs(p.x - mx);
        if (d < bd){ bd = d; best = p; }
      }
      if (hair && !line){
        line = document.createElementNS(SVGNS, "line");
        line.setAttribute("stroke", "var(--ink-3)");
        line.setAttribute("stroke-width", "1");
        line.setAttribute("opacity", ".5");
        line.setAttribute("pointer-events", "none");
        svg.appendChild(line);
      }
      if (!dot){
        dot = document.createElementNS(SVGNS, "circle");
        dot.setAttribute("r", "3.6");
        dot.setAttribute("fill", "var(--ink)");
        dot.setAttribute("stroke", "var(--sunk)");
        dot.setAttribute("stroke-width", "2");
        dot.setAttribute("pointer-events", "none");
        svg.appendChild(dot);
      }
      if (line){
        line.setAttribute("x1", best.x); line.setAttribute("x2", best.x);
        line.setAttribute("y1", 0); line.setAttribute("y2", vb.height);
      }
      dot.setAttribute("cx", best.x); dot.setAttribute("cy", best.y);
      showTip(ev, best.t || svg.dataset.tipTitle, best.r || []);
    });
    svg.addEventListener("mouseleave", clear);
  });
}

/* The second chart, per idea. Six kinds are available; which one an idea
   gets is decided for the whole day at once by assignCharts below. */
const CHART_KINDS = {
  drawdown: { fam: "hist", title: "Drawdown from 10-year high",
              has: ev => (ev.ddSeries || []).length > 10 },
  ma:       { fam: "hist", title: "Price vs 50- &amp; 200-day",
              has: ev => (ev.maSeries || []).length > 20 },
  seasonality: { fam: "mom", title: "Avg return by month, 10 years",
              has: ev => (ev.seasonality || []).filter(x => x && x.r != null).length >= 8 },
  targets:  { fam: "street", title: "Wall Street price targets",
              has: ev => (ev.streetTargets || []).length > 0 || !!ev.targetRange },
  revenue:  { fam: "fund", title: "Revenue by quarter",
              has: ev => (ev.revSeries || []).length >= 4 },
  pe:       { fam: "val", title: "P/E vs its record &amp; peers",
              has: ev => (ev.peHistory || []).length >= 8 || !!(ev.ownPe && ev.peerPe) },
};
const LEAD_TO_KIND = { drawdown: "drawdown", ma: "ma", seasonality: "seasonality",
                       targets: "targets", revenue: "revenue", pe: "pe" };
const FAM_STRONG = 55;    // a family worth illustrating on its own
const FAM_OK = 40;        // still real evidence, if the day needs variety

/** Decide the day's charts together rather than one slide at a time.

    Price-vs-history carries the heaviest weight and is also what the buy
    screen selects for, so ranking each idea independently gave nine slides
    the same drawdown chart. An idea whose sentence names a chart always
    keeps it -- the claim has to be the thing on screen. The rest prefer a
    kind the day has not used yet, chosen among the families that actually
    scored, so the carousel shows the evidence from several angles. */
function assignCharts(ideas){
  const used = new Set();
  ideas.forEach(d => {
    const ev = d.evidence || {};
    const k = LEAD_TO_KIND[ev.lead];
    if (k && CHART_KINDS[k].has(ev)){ d._chart = k; used.add(k); }
    else d._chart = null;
  });
  ideas.forEach(d => {
    if (d._chart) return;
    const ev = d.evidence || {};
    const fams = Object.entries(d.families || {})
      .filter(([f]) => !(ev.thin || []).includes(f) && f !== "smart")
      .sort((a, b) => b[1] - a[1]);
    const kindsFor = list => list.flatMap(([f]) =>
      Object.entries(CHART_KINDS)
        .filter(([, spec]) => spec.fam === f && spec.has(ev)).map(([k]) => k));
    const strong = kindsFor(fams.filter(([, v]) => v >= FAM_STRONG));
    const ok = kindsFor(fams.filter(([, v]) => v >= FAM_OK));
    const any = kindsFor(fams);
    // An unused kind from a family that still scored beats a repeat of one
    // the day has already shown -- taking strong[0] first put three
    // identical target boards in one carousel.
    const unused = list => list.find(k => !used.has(k));
    d._chart = unused(strong) || unused(ok) || strong[0] || unused(any)
            || ok[0] || any[0] || null;
    if (d._chart) used.add(d._chart);
  });
}

const barColour = v => v >= 80 ? "var(--up)" : v >= 60 ? "var(--accent)" : "var(--ink-3)";
const sellBarColour = v => v >= 80 ? "var(--down)" : v >= 60 ? "var(--accent)" : "var(--ink-3)";

function convLine(idea){
  const ev = idea.evidence || {};
  const strong = Object.entries(idea.families || {})
    .filter(([f, v]) => v >= 80 && !(ev.thin || []).includes(f)).length;
  if (idea.side === "SELL"){
    const anchor = (ev.peOwnPct || 0) >= 88 ? "own-history valuation"
      : (ev.insiderSellers || 0) >= 3 ? "insider selling" : "news pile-up";
    return `Sell anchor: ${anchor} · ${strong} of 6 families ≥ 80`;
  }
  const ei = (ev.congress || []).length ? "Event-driven buy · " :
    (ev.insiderBuyers || 0) >= 3 ? "Event-driven buy · " : "";
  return `${ei}${strong} of 6 families ≥ 80`;
}

function slide(idea, idx, total){
  const ev = idea.evidence || {};
  const sell = idea.side === "SELL";
  const tone = sell ? "down" : "up";
  const eyebrow = idea.isPick
    ? `<div class="eyebrow today">Today’s pick</div>`
    : `<div class="eyebrow rank">${sell ? "Sell" : "Buy"} candidate · rank ${idea.rank}</div>`;
  const fams = Object.entries(idea.families || {})
    .sort((a, b) => b[1] - a[1]);
  const colour = sell ? sellBarColour : barColour;
  const famHtml = fams.map(([f, v]) => {
    const thin = (ev.thin || []).includes(f);
    return `<div class="fam${thin ? " thin" : ""}"><div class="fr"><span>${FAMILY_LABEL[f] || f}${thin ? " · thin data" : ""}</span><b>${thin ? "—" : v}</b></div>
      <div class="bar2"><i style="width:${thin ? 0 : v}%;background:${colour(v)}"></i></div></div>`;
  }).join("");
  const gates = (idea.gates || []).map(g =>
    `<div class="gate"><span class="ok">✓</span><span>${esc(g.l)}</span></div>`).join("");
  const chips = (ev.chips || []).map(c =>
    `<span class="chip"><span class="d ${c.t === "up" ? "up" : c.t === "down" ? "down" : "mut"}"></span>${esc(c.l)} <b>${esc(c.v)}</b></span>`).join("");
  const toneKey = sell ? "down" : "up";
  // Days stored before marks existed carry only congress rows — synthesise.
  const marks = ev.marks || (ev.congress || []).map(m => ({ d: m.d, s: "buy",
    l: `${(m.person || "Congress").split(" ").slice(-1)[0]} ~${money(m.amt || 0)}` }));
  const price = priceChart(ev.priceSeries, marks, toneKey);
  // assignCharts picked this idea's chart with the rest of the day in view.
  const kind = idea._chart;
  let second = null, secondTitle = (CHART_KINDS[kind] || {}).title || "";
  if (kind === "drawdown") second = drawdownChart(ev.ddSeries, toneKey);
  else if (kind === "ma") second = maChart(ev.maSeries, toneKey);
  else if (kind === "seasonality") second = seasonalityChart(ev.seasonality, MONTH);
  else if (kind === "targets") second = targetChart(ev.streetTargets, ev.targetRange, +idea.price);
  else if (kind === "revenue") second = revenueChart(ev.revSeries, toneKey);
  else if (kind === "pe") second = peChart(ev.peHistory, ev.peerPe, ev.ownPe, toneKey);
  if (!second){
    second = peChart(ev.peHistory, ev.peerPe, ev.ownPe, toneKey);
    secondTitle = "P/E vs its record &amp; peers";
  }
  // Once the next session closes the line carries the outcome; until then it
  // carries nothing -- "price at the scan" only restated the number above it.
  const result = idea.resultPct != null
    ? `next session <b class="${(sell ? -idea.resultPct : idea.resultPct) >= 0 ? "up" : "down"}">${idea.resultPct >= 0 ? "+" : ""}${idea.resultPct.toFixed(1)}%</b>`
    : "";
  const url = `company.html?t=${encodeURIComponent(idea.symbol)}&src=alpha_page`;
  return `<div class="slide" role="group" aria-label="${esc(idea.symbol)}, ${idx+1} of ${total}"><div class="pick">
    <div class="pick-main">
      ${eyebrow}
      <div class="idrow">
        <span class="dot" data-logo="${esc(idea.symbol)}" style="background:${avatarColour(idea.symbol)}">${esc(idea.symbol.slice(0, 2))}</span>
        <span class="nm"><b><a href="${url}">${esc(idea.symbol)}</a> <span class="side-in ${tone}">${sell ? "SELL" : "BUY"}</span></b>
          <span>${esc(ev.industry || "")}</span></span>
        <span class="px"><div class="p">$${(+idea.price).toFixed(2)}</div>${result ? `<div class="c">${result}</div>` : ""}</span>
      </div>
      <p class="case">${esc(idea.headline || "")}</p>
      <div class="charts">
        <div class="ch"><h4>Price, 3 years <a href="${url}">full chart →</a></h4>
          ${price || `<div class="empty">price history arrives with the next refresh</div>`}</div>
        <div class="ch"><h4>${secondTitle} <a href="${url}">company page →</a></h4>
          ${second || `<div class="empty">no P/E on record</div>`}</div>
      </div>
      <div class="chips">${chips}</div>
    </div>
    <aside class="rail">
      <h3>Alpha score</h3>
      <span class="scorewrap" tabindex="0" role="button"
            aria-label="Alpha score ${idea.score} of 100. How it is weighted.">
        <span class="big ${sell ? "down" : ""}">${idea.score}<small> / 100</small></span>
        ${WEIGHTS_HTML}
      </span>
      <div class="conv">${esc(convLine(idea))}</div>
      ${famHtml}
      ${gates}
    </aside>
  </div></div>`;
}

/* ---- candidate rows ------------------------------------------------------ */

/* ---- carousel ------------------------------------------------------------ */

let IDEAS = [];
let cur = 0;
let MONTH = new Date().getMonth() + 1;

/** Fit the carousel to the slide on screen. Re-run on resize and whenever the
    active slide reflows (late fonts, a hydrated logo), so the panel never
    carries another slide's height. */
let slideRO = null;
function fitHero(){
  const slides = document.getElementById("a-slides");
  const clip = slides && slides.parentElement;
  const active = slides && slides.children[cur];
  if (!clip || !active) return;
  clip.style.height = active.offsetHeight + "px";
  if (window.ResizeObserver){
    if (!slideRO) slideRO = new ResizeObserver(() => {
      const el = document.getElementById("a-slides").children[cur];
      if (el) clip.style.height = el.offsetHeight + "px";
    });
    slideRO.disconnect();
    slideRO.observe(active);
  }
}
addEventListener("resize", fitHero);

function go(i, scroll){
  if (!IDEAS.length) return;
  cur = (i + IDEAS.length) % IDEAS.length;
  document.getElementById("a-slides").style.transform = `translateX(-${cur * 100}%)`;
  fitHero();
  document.querySelectorAll("#a-dots button").forEach((b, j) =>
    b.classList.toggle("on", j === cur));
  const cnt = document.getElementById("a-cnt");
  if (cnt) cnt.textContent = `${cur + 1} / ${IDEAS.length} · ${IDEAS[cur].symbol}`;
  if (scroll){
    const y = document.getElementById("a-hero").getBoundingClientRect().top
      + window.scrollY - 68;
    window.scrollTo({ top: y, behavior: "smooth" });
  }
}

function renderDay(payload, track){
  const ideas = (payload || {}).ideas || [];
  const slides = document.getElementById("a-slides");
  if (!ideas.length){
    slides.innerHTML = `<div class="note" style="width:100%">The first scan runs before
      the next trading open — the worker scores the whole universe each morning and the
      day's ideas land here.</div>`;
    return;
  }
  // pick first, then buys by rank, then sells by rank
  IDEAS = ideas.slice().sort((a, b) =>
    (b.isPick - a.isPick)
    || (a.side === b.side ? a.rank - b.rank : (a.side === "BUY" ? -1 : 1)));

  MONTH = +(payload.day || "").slice(5, 7) || MONTH;
  document.getElementById("a-meta").innerHTML =
    `S&amp;P 500 + Nasdaq-100 · scanned before the open · ${fmtDay(payload.day)}`;

  assignCharts(IDEAS);
  slides.innerHTML = IDEAS.map((d, i) => slide(d, i, IDEAS.length)).join("");
  wireChartTips(slides);
  const ctrl = document.getElementById("a-ctrl");
  ctrl.hidden = IDEAS.length < 2;
  document.getElementById("a-dots").innerHTML = IDEAS.map((d, i) =>
    `<button data-i="${i}" aria-label="Show ${esc(d.symbol)}"></button>`).join("")
    + `<span class="cnt" id="a-cnt"></span>`;
  document.querySelectorAll("#a-dots button").forEach(b =>
    b.onclick = () => go(+b.dataset.i));
  document.getElementById("a-prev").onclick = () => go(cur - 1);
  document.getElementById("a-next").onclick = () => go(cur + 1);
  addEventListener("keydown", e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === "ArrowLeft") go(cur - 1);
    if (e.key === "ArrowRight") go(cur + 1);
  });
  go(0);

  document.getElementById("alphaday").hidden = false;

  const rows = (track || []).filter(t => t.day !== payload.day).slice(0, 6);
  if (rows.length){
    const el = document.getElementById("a-track");
    el.innerHTML = `<h2>Recent picks</h2>` + rows.map(t => {
      const pending = t.resultPct == null;
      const good = t.side === "SELL" ? t.resultPct < 0 : t.resultPct > 0;
      const cls = pending ? "" : good ? "up" : "down";
      const val = pending ? "…"
        : `${t.resultPct >= 0 ? "+" : ""}${(+t.resultPct).toFixed(1)}%`;
      return `<span class="tr-chip">${dow(t.day)} · <b>${esc(t.symbol)}</b> ${t.side.toLowerCase()} <b class="${cls}">${val}</b></span>`;
    }).join("");
    el.hidden = false;
  }

  if (window.TickerLogos)
    window.TickerLogos.hydrate(IDEAS.map(d => d.symbol), document);
}

(async () => {
  try {
    const [day, track] = await Promise.all([
      rpc("get_alpha_day", {}),
      rpc("get_alpha_track_record", { p_days: 14 }).catch(() => []),
    ]);
    renderDay(day, track);
  } catch (e) {
    // A page that cannot reach the scan simply does not show the section.
    console.warn("alpha of the day unavailable:", e.message);
  }
})();
})();
