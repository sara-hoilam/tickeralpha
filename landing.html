/* ===========================================================================
   Watchlist

   A visitor can build one before signing in -- asking for an account first is
   how a feature never gets tried. It lives in the browser until they sign in,
   and merges into the account then, so nothing they did is lost.
=========================================================================== */
const WATCH_KEY = "alphaticker-watchlist";

const localWatch = {
  read(){ try { return JSON.parse(localStorage.getItem(WATCH_KEY) || "[]"); } catch { return []; } },
  write(list){ try { localStorage.setItem(WATCH_KEY, JSON.stringify([...new Set(list)])); } catch {} },
  has(sym){ return this.read().includes(sym); },
  toggle(sym){
    const l = this.read();
    const i = l.indexOf(sym);
    if (i >= 0) l.splice(i, 1); else l.push(sym);
    this.write(l);
    return i < 0;                        // true when it was added
  },
  clear(){ try { localStorage.removeItem(WATCH_KEY); } catch {} },
};

const signedIn = () => !!(window.TA && window.TA.signedIn());

/** Ask the worker for a quote and a chart the moment a name is followed, so
    the price column does not wait on the next market-wide refresh. */
function askWatchPrices(sym){
  rpc("request_intraday", { p_symbol: sym }).catch(() => {});
  rpc("request_prices", { p_symbol: sym }).catch(() => {});
}

/** Add or remove, wherever this visitor's list lives. `source` says which
    part of the page the star was on; see analytics.js for the vocabulary. */
async function toggleWatch(symbol, source){
  const sym = String(symbol || "").toUpperCase();
  if (!sym) return false;
  const report = watching => GA.track(
    watching ? "add_to_watchlist" : "remove_from_watchlist", { ticker: sym, source });
  // The watchlist is the gate. This used to save to localStorage and *then*
  // ask for an account, which meant the visitor already had what they came
  // for and the modal was pure interruption -- the reason it converted at
  // nothing. Now the ask comes first and the star does not move until it is
  // answered.
  if (!signedIn()) {
    GA.track("gate_view", { gate: "watchlist", ticker: sym, source });
    if (window.TA?.showSignupModal) window.TA.showSignupModal({ reason: "watchlist" });
    return false;
  }
  try {
    const d = await rpc("toggle_watchlist", { p_symbol: sym });
    const w = !!(d && d.watching);
    if (w) askWatchPrices(sym);
    report(w);
    dispatchEvent(new CustomEvent("watchchange", { detail: { symbol: sym, watching: w } }));
    return w;
  } catch { return false; }
}

/** The symbols on this visitor's list, from wherever it lives. */
async function watchSymbols(){
  if (!signedIn()) return localWatch.read();
  try {
    const d = await rpc("get_watchlist");
    return ((d && d.items) || []).map(i => i.symbol);
  } catch { return []; }
}

/** On sign-in, hand the browser's list to the account and forget the copy. */
async function mergeLocalWatchlist(){
  const local = localWatch.read();
  if (!local.length || !signedIn()) return 0;
  try {
    const d = await rpc("merge_watchlist", { p_symbols: local });
    if (d && !d.error) { localWatch.clear(); return d.added || 0; }
  } catch {}
  return 0;
}

async function setView(v){
  S.view = v;
  document.querySelectorAll("#views button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.v === v));
  document.getElementById("rows").innerHTML = `<div class="note"><span class="load"></span></div>`;

  await refreshWatched();
  if (v === "watchlist") return renderWatchlist();

  S.rows = await rpc("get_market_summary", { p_view: v, p_limit: 20 }) || [];
  // Draw the table first, always. selectSymbol only moves the highlight now,
  // so relying on it to render left the list showing its loading spinner
  // whenever the previous selection was absent from the new view -- which is
  // every first load.
  renderRows();
  if (!S.rows.some(r => r.symbol === S.symbol) && S.rows.length) selectSymbol(S.rows[0].symbol);
}

/** The star beside the ticker on the chart. Present on every tab, so a
    company can be followed from wherever it was noticed rather than only from
    its own page. Yellow when watched, grey when not. */
async function paintChartStar(sym){
  const el = document.getElementById("c-star");
  if (!el) return;
  el.hidden = false;

  let watching;
  if (signedIn()) {
    try {
      const d = await rpc("is_watched", { p_symbol: sym });
      watching = !!(d && d.watching);
    } catch { watching = false; }
  } else {
    watching = localWatch.has(sym);
  }

  const paint = w => {
    el.textContent = w ? "★" : "☆";
    el.classList.toggle("on", w);
    el.setAttribute("aria-pressed", String(w));
    el.title = w ? `Remove ${sym} from your watchlist` : `Add ${sym} to your watchlist`;
  };
  paint(watching);

  el.onclick = async e => {
    e.stopPropagation();
    el.disabled = true;
    paint(await toggleWatch(sym, S.view === "watchlist" ? "watchlist" : "market_page"));
    el.disabled = false;
    // Watching the list you are looking at: reflect the change immediately.
    if (S.view === "watchlist") renderWatchlist();
  };
}

/** A brief line at the foot of the screen; used only for things the reader
    did not ask to be told twice. */
function toast(msg){
  const el = document.createElement("div");
  el.className = "wl-toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

/* ---- the watchlist view -------------------------------------------------- */
/** Resolve prices for an arbitrary set of tickers — not only the top market
    caps. Prefers get_symbol_quotes; falls back to per-symbol intraday/daily
    when that RPC is not applied yet. */
async function enrichWatchPrices(syms){
  const out = {};
  if (!syms.length) return out;
  try {
    const rows = await rpc("get_symbol_quotes", { p_symbols: syms }) || [];
    if (Array.isArray(rows) && rows.length) {
      rows.forEach(r => { if (r && r.symbol) out[r.symbol] = r; });
      return out;
    }
  } catch {}
  await Promise.all(syms.map(async sym => {
    try {
      const d = await rpc("get_intraday", { p_symbol: sym });
      if (d && d.quote && d.quote.price != null) {
        out[sym] = { symbol: sym, name: d.quote.name, price: d.quote.price,
                     changePct: d.quote.changePct, marketCap: null };
        return;
      }
      const last = d && d.points && d.points.length ? d.points[d.points.length - 1].c : null;
      if (last != null) { out[sym] = { symbol: sym, price: last, changePct: null }; return; }
      const p = await rpc("get_prices", { p_symbol: sym });
      const q = p && p.quote;
      const bars = (p && p.bars) || [];
      const px = (q && q.price != null) ? q.price
        : (bars.length ? bars[bars.length - 1].c : null);
      if (px != null) {
        out[sym] = { symbol: sym, name: q && q.name, price: px,
                     changePct: q && (q.change_pct ?? q.changePct), marketCap: q && q.market_cap };
      }
    } catch {}
  }));
  return out;
}

async function renderWatchlist(){
  const host = document.getElementById("rows");
  // Prefer the watchlist RPC's own quote join — not the top-50 market-cap
  // summary, which left followed names like HOOD as "—" even when a quote
  // was already in ledger.
  let items = [];
  if (signedIn()) {
    try {
      const d = await rpc("get_watchlist");
      items = ((d && d.items) || []).map(i => ({
        symbol: i.symbol, name: i.name, price: i.price,
        changePct: i.changePct, marketCap: i.marketCap,
      }));
    } catch {}
  }
  if (!items.length) {
    const syms = await watchSymbols();
    items = syms.map(symbol => ({ symbol, price: null, changePct: null }));
  }

  S.watched = new Set(items.map(i => i.symbol));
  if (!items.length) return renderWatchEmpty(host);

  const missing = items.filter(i => i.price == null).map(i => i.symbol);
  if (missing.length) {
    const by = await enrichWatchPrices(missing);
    items = items.map(i => {
      if (i.price != null || !by[i.symbol]) return i;
      const e = by[i.symbol];
      return {
        symbol: i.symbol,
        name: i.name || e.name,
        price: e.price,
        changePct: i.changePct ?? e.changePct,
        marketCap: i.marketCap ?? e.marketCap,
      };
    });
    // Still blank: ask the worker so the next pass fills ledger.quote.
    const still = items.filter(i => i.price == null).map(i => i.symbol);
    still.forEach(askWatchPrices);
    if (still.length) {
      clearTimeout(S.wlPricePoll);
      S.wlPricePoll = setTimeout(() => {
        if (S.view === "watchlist") renderWatchlist();
      }, 8000);
    }
  }

  S.rows = items;

  // The search stays above the list rather than only appearing when the list
  // is empty: adding the second company should be no harder than the first.
  host.innerHTML = `<div class="wl-bar">${watchSearchMarkup("Add a company…")}</div>
                    <div id="wl-rows"></div>`;
  renderRows(document.getElementById("wl-rows"));
  wireWatchSearch();

  // Show the top of the list straight away, the way the other tabs do; an
  // empty chart beside a full list looks like something failed.
  if (!S.rows.some(r => r.symbol === S.symbol)) selectSymbol(S.rows[0].symbol);

  if (!signedIn()) promptSaveWatchlist(items.length);
}

/** One search field, used above the list and inside the empty state. */
function watchSearchMarkup(placeholder){
  return `
    <form class="wl-search" id="wl-search">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none"
        stroke="currentColor" stroke-width="2"/><path d="M13.5 13.5 18 18" stroke="currentColor"
        stroke-width="2" stroke-linecap="round"/></svg>
      <input type="text" id="wl-q" placeholder="${esc(placeholder)}" autocomplete="off">
      <div class="wl-ac" id="wl-ac"></div>
    </form>`;
}

/** Nothing on the list yet: offer the obvious names and a search, rather than
    an empty table that gives no way forward. */
async function renderWatchEmpty(host){
  // Array.isArray, not `|| []`: a rejected token can come back 200 with an
  // error object rather than a row set, and `{}.map` took the whole empty
  // state down with it. That state is now the only thing a signed-out visitor
  // sees on this tab, so it is the last thing that should be able to break.
  let popular = [];
  try {
    const rows = await rpc("get_market_summary", { p_view: "market_cap", p_limit: 6 });
    if (Array.isArray(rows)) popular = rows;
  } catch {}

  host.innerHTML = `
    <div class="wl-empty">
      <div class="wl-star">★</div>
      <h3>Add companies to your watchlist</h3>

      ${watchSearchMarkup("Search for a ticker to add…")}

      <div class="wl-grid">${popular.map(q => `
        <div class="wl-card" data-add="${esc(q.symbol)}">
          <div class="wl-top">
            <span class="dot" data-logo="${esc(q.symbol)}" style="background:${avatarColour(q.symbol)}">${esc(q.symbol.slice(0,2))}</span>
            <b>${esc(q.symbol)}</b>
            <button type="button" class="wl-plus" aria-label="Add ${esc(q.symbol)}">+</button>
          </div>
          <div class="wl-px">${esc(price(q.price))}
            <span class="${dir(q.changePct)}">${esc(pct(q.changePct))}</span></div>
          <div class="wl-name">${esc(q.name || "")}</div>
        </div>`).join("")}</div>

    </div>`;

  if (window.TickerLogos) {
    window.TickerLogos.hydrate(popular.map(q => q.symbol), host);
  }

  host.querySelectorAll("[data-add]").forEach(card => {
    card.onclick = async () => {
      await toggleWatch(card.dataset.add, "watchlist");
      renderWatchlist();
    };
  });
  wireWatchSearch();
}

function wireWatchSearch(){
  const q = document.getElementById("wl-q"), ac = document.getElementById("wl-ac");
  if (!q) return;
  let timer = null;
  const close = () => { ac.innerHTML = ""; ac.classList.remove("open"); };
  q.addEventListener("input", () => {
    clearTimeout(timer);
    const term = q.value.trim();
    if (!term) return close();
    timer = setTimeout(async () => {
      let items = [];
      try {
        items = (window.TA && window.TA.searchCompanies
          ? await window.TA.searchCompanies(term)
          : await rpc("search_companies", { q: term })) || [];
      } catch {}
      if (!items.length) return close();
      ac.innerHTML = items.slice(0, 6).map(x => {
        const kind = x.kind && x.kind !== "stock" ? ` · ${x.kind}` : "";
        return `<div data-s="${esc(x.ticker)}"><b>${esc(x.ticker)}</b>` +
          `<span>${esc(x.name)}${esc(kind)}</span></div>`;
      }).join("");
      ac.classList.add("open");
      ac.querySelectorAll("[data-s]").forEach(d => d.onmousedown = async e => {
        e.preventDefault();
        const sym = d.dataset.s;
        GA.track("search", { search_term: term });
        // Add it if it is new, then show it on the chart either way -- picking
        // a company should put it in front of you, not just on a list.
        if (!(await watchSymbols()).includes(sym)) await toggleWatch(sym, "watchlist");
        await renderWatchlist();
        selectSymbol(sym);
      });
    }, 140);
  });
  q.addEventListener("blur", () => setTimeout(close, 150));
  document.getElementById("wl-search").onsubmit = async e => {
    e.preventDefault();
    const sym = q.value.trim().toUpperCase();
    if (!sym) return;
    GA.track("search", { search_term: sym });
    if (!(await watchSymbols()).includes(sym)) await toggleWatch(sym, "watchlist");
    await renderWatchlist();
    selectSymbol(sym);
  };
}

/** A list built without an account lives in one browser. Prefer the shared
    Google signup modal; keep the old sheet only if nav.js is unavailable. */
function promptSaveWatchlist(n){
  if (sessionStorage.getItem("wl-prompted")) return;
  sessionStorage.setItem("wl-prompted", "1");
  if (window.TA?.showSignupModal) {
    window.TA.showSignupModal({ reason: "watchlist" });
    return;
  }
  const el = document.createElement("div");
  el.className = "wl-prompt";
  el.innerHTML = `
    <div class="wl-prompt-in">
      <b>Keep your watchlist</b>
      <p>${n} ${n === 1 ? "company is" : "companies are"} saved in this browser only.
         Sign in and they follow you to any device.</p>
      <div class="wl-prompt-btns">
        <button type="button" class="ghost" data-later>Not now</button>
        <button type="button" class="wl-cta" data-signin>Sign in</button>
      </div>
    </div>`;
  document.body.appendChild(el);
  el.querySelector("[data-later]").onclick = () => el.remove();
  el.querySelector("[data-signin]").onclick = () => {
    el.remove();
    if (window.TA) window.TA.signIn();
  };
}

/* ---- chart --------------------------------------------------------------- */
async function selectSymbol(sym){
  S.symbol = sym;
  const sel = ++S.sel;
  S.gotIntraday = false;
  S.chartBars = [];
  clearTimeout(S.pricePoll);
  clearTimeout(S.intraPoll);
  document.querySelectorAll("#rows tr[data-s], #wl-rows tr[data-s]").forEach(tr =>
    tr.setAttribute("aria-selected", String(tr.dataset.s === sym)));
  if (window.TickerLogos && window.TickerLogos.setHeading) {
    window.TickerLogos.setHeading(
      document.getElementById("c-sym"),
      document.getElementById("c-logo"),
      sym);
  } else {
    document.getElementById("c-sym").textContent = sym;
  }
  paintChartStar(sym);
  document.getElementById("c-price").textContent = "";
  document.getElementById("c-meta").textContent = "";
  document.getElementById("chart").innerHTML = `<div class="note"><span class="load"></span></div>`;

  const row = S.rows.find(r => r.symbol === sym);
  if (row) fillQuoteHead(sym, row, row.price);

  let d = null;
  try { d = await rpc("get_prices", { p_symbol: sym }); } catch {}
  if (sel !== S.sel) return;

  const bars = (d && d.bars) || [];
  const dailyClose = bars.length ? bars[bars.length - 1].c : null;
  if (d && d.quote || dailyClose != null) {
    fillQuoteHead(sym, (d && d.quote) || row, dailyClose);
  }

  if (bars.length) {
    S.chartBars = bars;
    drawRangedChart(sym);
    if (d && d.stale) { try { rpc("request_prices", { p_symbol: sym }); } catch {} }
    return;
  }

  try { await rpc("request_prices", { p_symbol: sym }); } catch {}
  if (sel !== S.sel) return;
  document.getElementById("chart").innerHTML =
    `<div class="note"><span class="load"></span> &nbsp;Fetching prices for ${esc(sym)}…</div>`;
  pollDaily(sym, sel);
}

/** Price, name and change above the chart. */
function fillQuoteHead(sym, q, fallbackPrice){
  const px = (q && q.price != null && q.price !== undefined)
    ? q.price
    : fallbackPrice;
  document.getElementById("c-price").textContent = price(px);
  const cp = q ? (q.changePct ?? q.change_pct) : null;
  const label = INDEX_LABELS[sym] || (q && q.name) || "";
  const link = INDEX_LABELS[sym] ? "view index →" : "view financials →";
  document.getElementById("c-meta").innerHTML =
    `${esc(label)} ${cp !== undefined && cp !== null
      ? `· <b class="${dir(cp)}">${pct(cp)}</b>` : ""}
     · <a href="company.html?t=${encodeURIComponent(sym)}"
          style="color:var(--accent);text-decoration:none">${link}</a>`;
}

function pollDaily(sym, sel){
  clearTimeout(S.pricePoll);
  let tries = 0;
  const tick = async () => {
    if (sel !== S.sel) return;
    if (tries++ > 40) {
      document.getElementById("chart").innerHTML =
        `<div class="note">Prices for ${esc(sym)} are still being fetched. Check back in a minute.<br>
         <a href="company.html?t=${encodeURIComponent(sym)}"
            style="color:var(--accent)">Open details →</a></div>`;
      return;
    }
    let d = null;
    try { d = await rpc("get_prices", { p_symbol: sym }); } catch {}
    if (sel !== S.sel) return;
    if (d && (d.bars || []).length) {
      S.chartBars = d.bars;
      if (d.quote) fillQuoteHead(sym, d.quote, d.bars[d.bars.length - 1].c);
      return drawRangedChart(sym);
    }
    S.pricePoll = setTimeout(tick, 3000);
  };
  S.pricePoll = setTimeout(tick, 2000);
}

/** Daily closes filtered by the 1W / 1M / YTD / 1Y control (default 1W). */
function drawRangedChart(sym){
  const from = rangeStartISO(S.chartRange);
  const points = (S.chartBars || [])
    .filter(b => b && b.d && b.c != null && b.d >= from)
    .map(b => ({ t: b.d, c: b.c }));
  if (points.length < 2) {
    // Short history (or brand-new ticker): show whatever we have.
    const fallback = (S.chartBars || [])
      .filter(b => b && b.d && b.c != null)
      .slice(-10)
      .map(b => ({ t: b.d, c: b.c }));
    if (fallback.length < 2) {
      document.getElementById("chart").innerHTML =
        `<div class="note">No price history for ${esc(sym)}.<br>
         <a href="company.html?t=${encodeURIComponent(sym)}"
            style="color:var(--accent)">Open details →</a></div>`;
      return;
    }
    drawChart(fallback, true);
    return;
  }
  drawChart(points, true);
}

function wireChartRange(){
  const host = document.getElementById("chart-range");
  if (!host) return;
  host.querySelectorAll("button").forEach(b => {
    b.onclick = () => {
      S.chartRange = b.dataset.r;
      host.querySelectorAll("button").forEach(x =>
        x.setAttribute("aria-pressed", String(x.dataset.r === S.chartRange)));
      GA.track("change_chart_range", { range: S.chartRange, source: "market_page" });
      if (S.symbol && S.chartBars.length) drawRangedChart(S.symbol);
    };
  });
}

/** `daily` switches the time axis from clock times to dates. The geometry is
    the same either way; only what a point is called changes. */
function drawChart(points, daily){
  const W = 900, H = 380, ml = 8, mr = 62, mt = 16, mb = 34;
  const pw = W - ml - mr, ph = H - mt - mb;
  const vals = points.map(p => p.c);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.08 || 1;
  const y = v => mt + ph - ((v - (lo - pad)) / ((hi + pad) - (lo - pad))) * ph;
  const x = i => ml + (pw * i) / Math.max(1, points.length - 1);

  const parts = [];
  // Horizontal guides, labelled on the right the way a price axis reads.
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const v = (lo - pad) + ((hi + pad) - (lo - pad)) * i / ticks;
    parts.push(`<line x1="${ml}" y1="${y(v)}" x2="${W-mr}" y2="${y(v)}" stroke="var(--rule-2)"></line>
      <text x="${W-mr+8}" y="${y(v)+4}" font-size="10.5" class="tnum" fill="var(--ink-3)">${v.toFixed(2)}</text>`);
  }

  // Boundaries: sessions on an intraday series, months on a daily one. Every
  // daily bar starts a new day, so dividing on days there would put a rule
  // between every pair of points.
  const unit = p => daily ? p.t.slice(0,7) : p.t.slice(0,10);
  let prev = unit(points[0]);
  points.forEach((p,i) => {
    const u = unit(p);
    if (u !== prev) {
      parts.push(`<line x1="${x(i)}" y1="${mt}" x2="${x(i)}" y2="${mt+ph}" stroke="var(--rule)"></line>
        <text x="${x(i)+5}" y="${H-mb+16}" font-size="10.5" fill="var(--ink-2)" font-weight="600">${
          daily ? MONTHS[+u.slice(5,7)-1] : u.slice(8,10)}</text>`);
      prev = u;
    }
  });

  const first = vals[0], last = vals[vals.length-1];
  const stroke = last >= first ? "var(--up)" : "var(--down)";
  const d = points.map((p,i) => `${i?"L":"M"}${x(i)},${y(p.c)}`).join(" ");
  parts.push(`<path d="${d} L${x(points.length-1)},${mt+ph} L${x(0)},${mt+ph} Z"
    fill="${stroke}" opacity=".08"></path>`);
  parts.push(`<path d="${d}" fill="none" stroke="${stroke}" stroke-width="1.8"
    stroke-linejoin="round" stroke-linecap="round"></path>`);

  // Last value, called out on the axis.
  parts.push(`<line x1="${ml}" y1="${y(last)}" x2="${W-mr}" y2="${y(last)}"
      stroke="${stroke}" stroke-width="1" stroke-dasharray="3 3" opacity=".55"></line>
    <rect x="${W-mr+2}" y="${y(last)-9}" width="56" height="18" rx="4" fill="${stroke}"></rect>
    <text x="${W-mr+30}" y="${y(last)+4}" text-anchor="middle" font-size="11"
      class="tnum" fill="#fff" font-weight="600">${last.toFixed(2)}</text>`);

  // Time labels -- enough to orient without clutter. A daily series is already
  // labelled at every month, so it only needs its two ends.
  const axisAt = daily ? [0, points.length-1] : [0, Math.floor(points.length/2), points.length-1];
  axisAt.forEach(i => {
    const t = points[i].t;
    const lab = daily ? `${+t.slice(8,10)} ${MONTHS[+t.slice(5,7)-1]}` : t.slice(11,16);
    parts.push(`<text x="${Math.min(Math.max(x(i),ml+16), W-mr-16)}" y="${H-mb+16}"
      text-anchor="middle" font-size="10.5" class="tnum" fill="var(--ink-3)">${lab}</text>`);
  });

  // Crosshair, hidden until the pointer is actually over the plot.
  parts.push(`<g id="cross" style="display:none;pointer-events:none">
      <line id="cx" y1="${mt}" y2="${mt+ph}" stroke="var(--ink-3)"
            stroke-width="1" stroke-dasharray="4 4"></line>
      <line id="cy" x1="${ml}" x2="${W-mr}" stroke="var(--ink-3)"
            stroke-width="1" stroke-dasharray="4 4"></line>
      <circle id="cdot" r="4" fill="var(--ink-2)" stroke="var(--card)" stroke-width="2"></circle>
      <g id="cplab"><rect x="${W-mr+2}" width="56" height="18" rx="4" fill="var(--ink)"></rect>
        <text x="${W-mr+30}" text-anchor="middle" font-size="11" class="tnum"
              fill="var(--card)" font-weight="600"></text></g>
      <g id="ctlab"><rect height="18" rx="4" fill="var(--ink)"></rect>
        <text text-anchor="middle" font-size="10.5" class="tnum"
              fill="var(--card)" font-weight="600"></text></g>
    </g>`);
  // A transparent surface above everything, so the pointer is tracked even
  // between data points rather than only over the line itself.
  parts.push(`<rect id="hit" x="${ml}" y="${mt}" width="${pw}" height="${ph}"
      fill="transparent" style="cursor:crosshair"></rect>`);

  document.getElementById("chart").innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" class="fullchart" role="img"
       aria-label="${daily ? "Daily closing price" : "Intraday price"}">${parts.join("")}</svg>`;

  wireCrosshair({points, x, y, W, H, ml, mr, mt, mb, ph, daily});
}

/** Follow the pointer along the series, snapping to the nearest bar. */
function wireCrosshair(g){
  const svg = document.querySelector("#chart svg");
  const hit = svg.querySelector("#hit"), cross = svg.querySelector("#cross");
  const cx = svg.querySelector("#cx"), cy = svg.querySelector("#cy");
  const dot = svg.querySelector("#cdot");
  const pRect = svg.querySelector("#cplab rect"), pText = svg.querySelector("#cplab text");
  const tRect = svg.querySelector("#ctlab rect"), tText = svg.querySelector("#ctlab text");

  const toLocal = ev => {
    const b = svg.getBoundingClientRect();
    return (ev.clientX - b.left) * (g.W / b.width);
  };

  hit.addEventListener("mousemove", ev => {
    const px = toLocal(ev);
    const step = (g.W - g.ml - g.mr) / Math.max(1, g.points.length - 1);
    const i = Math.max(0, Math.min(g.points.length - 1, Math.round((px - g.ml) / step)));
    const p = g.points[i], X = g.x(i), Y = g.y(p.c);

    cross.style.display = "";
    cx.setAttribute("x1", X); cx.setAttribute("x2", X);
    cy.setAttribute("y1", Y); cy.setAttribute("y2", Y);
    dot.setAttribute("cx", X); dot.setAttribute("cy", Y);

    pRect.setAttribute("y", Y - 9);
    pText.setAttribute("y", Y + 4);
    pText.textContent = p.c.toFixed(2);

    // Date, and the time too where there is one, clamped so the label never
    // runs off either end.
    const label = `${p.t.slice(8,10)} ${MONTHS[+p.t.slice(5,7)-1]} '${p.t.slice(2,4)}`
                + (g.daily ? "" : `  ${p.t.slice(11,16)}`);
    const w = Math.max(96, label.length * 6.2);
    const lx = Math.min(Math.max(X - w/2, g.ml), g.W - g.mr - w);
    tRect.setAttribute("x", lx); tRect.setAttribute("width", w);
    tRect.setAttribute("y", g.H - g.mb + 2);
    tText.setAttribute("x", lx + w/2);
    tText.setAttribute("y", g.H - g.mb + 15);
    tText.textContent = label;
  });

  hit.addEventListener("mouseleave", () => { cross.style.display = "none"; });
}

/* ===========================================================================
   Heatmap

   A squarified treemap: sector blocks sized by combined market cap, each
   subdivided by company. Colour is the day's move on a diverging red-green
   scale with a neutral middle, so "flat" reads as flat rather than as a weak
   version of either direction.
=========================================================================== */
// Deep and desaturated in the middle, bright at the extremes, so the day's
// real movers separate from the crowd instead of being one shade off it.
const HEAT_SCALE = [
  [-6,   "#e8433a"], [-3,   "#c9342c"], [-1.5, "#8f3029"],
  [-0.5, "#5c2b28"], [-0.05,"#3b2f2e"],
  [ 0.05,"#2c3a30"], [ 0.5, "#26543a"], [ 1.5, "#2c8a4e"],
  [ 3,   "#39b862"], [ 6,   "#5fe083"],
];
function heatColour(p){
  if (p === null || p === undefined) return "var(--rule)";
  let c = HEAT_SCALE[0][1];
  for (const [t, col] of HEAT_SCALE) if (p >= t) c = col;
  return c;
}

/** Slice-and-dice layout: good enough aspect ratios without a full squarify. */
function treemap(items, x, y, w, h, valueOf){
  const total = items.reduce((a, it) => a + valueOf(it), 0) || 1;
  const out = [];
  let cx = x, cy = y, remW = w, remH = h, rem = total;
  items.forEach((it, i) => {
    const v = valueOf(it);
    const frac = v / rem;
    if (i === items.length - 1) { out.push({it, x: cx, y: cy, w: remW, h: remH}); return; }
    if (remW >= remH) {
      const tw = remW * frac;
      out.push({it, x: cx, y: cy, w: tw, h: remH});
      cx += tw; remW -= tw;
    } else {
      const th = remH * frac;
      out.push({it, x: cx, y: cy, w: remW, h: th});
      cy += th; remH -= th;
    }
    rem -= v;
  });
  return out;
}

const HEAT = { sectors: null };
const MOBILE_MQ = matchMedia("(max-width:720px)");

function heatmapSize(host){
  // Phone: fill the screen width and use a taller canvas so tiles stay
  // tappable. Desktop keeps the wide dashboard frame.
  if (MOBILE_MQ.matches) {
    const w = Math.max(300, Math.floor(host.clientWidth || innerWidth));
    return { W: w, H: Math.round(Math.min(innerHeight * 0.72, Math.max(420, w * 1.25))),
             GAP: 5, HEAD: 18, minW: 40, minH: 24 };
  }
  // Desktop: fill whatever the panel actually is. A fixed 1180 left a stripe
  // of empty ground on the right the moment the page grew wider than that.
  // A few pixels short of the panel: laid out to the exact width, rounding in
  // the tile maths pushed it over and the panel grew a scrollbar.
  const w = Math.max(900, Math.floor((host.clientWidth || 1180) - 44));
  return { W: w, H: Math.round(Math.min(460, Math.max(380, w * 0.26))),
           GAP: 8, HEAD: 22, minW: 30, minH: 15 };
}

// The treemap is laid out in pixels, so a resized window needs it recomputed
// rather than stretched.
addEventListener("resize", () => {
  clearTimeout(renderHeatmap._t);
  renderHeatmap._t = setTimeout(() => { if (HEAT.sectors) renderHeatmap(); }, 180);
}, { passive: true });

function renderHeatmap(sectors){
  const host = document.getElementById("heatmap");
  if (sectors) HEAT.sectors = sectors;
  sectors = HEAT.sectors;
  if (!sectors || !sectors.length){
    host.innerHTML = `<div class="note">No heatmap data yet.</div>`;
    document.getElementById("hm-legend").innerHTML = "";
    return;
  }
  const { W, H, GAP, HEAD, minW, minH } = heatmapSize(host);
  const blocks = treemap(sectors, 0, 0, W, H, s => s.marketCap);

  const html = blocks.map(({it: sec, x, y, w, h}) => {
    const iw = Math.max(0, w - GAP), ih = Math.max(0, h - GAP - HEAD);

    // Every tile must be able to carry its ticker. Rather than leave the
    // smallest ones blank, drop them until the remainder are all legible --
    // a tile nobody can read is not information, it is texture.
    let items = sec.items.slice();
    let laid = treemap(items, 0, 0, iw, ih, c => c.marketCap);
    while (items.length > 1 &&
           laid.some(t => t.w < minW || t.h < minH)) {
      items = items.slice(0, -1);
      laid = treemap(items, 0, 0, iw, ih, c => c.marketCap);
    }
    const hidden = sec.items.length - items.length;

    const tiles = laid.map(({it: c, x: tx, y: ty, w: tw, h: th}) => {
      // Type scales with the tile: big names read as headlines, small ones
      // still name themselves. Mobile starts a notch larger for thumb text.
      const fs = Math.max(MOBILE_MQ.matches ? 10 : 8, Math.min(26, Math.sqrt(tw * th) / 4.6));
      const showPct = th > (MOBILE_MQ.matches ? 28 : 34) && tw > (MOBILE_MQ.matches ? 44 : 52);
      const colour = heatColour(c.changePct);
      return `<a class="tile" href="company.html?t=${encodeURIComponent(c.symbol)}"
                 style="left:${tx}px;top:${ty}px;width:${Math.max(0,tw-2)}px;height:${Math.max(0,th-2)}px;
                        background:${colour}"
                 data-name="${esc(c.name || c.symbol)}"
                 data-symbol="${esc(c.symbol)}"
                 data-pct="${esc(pct(c.changePct))}"
                 data-cap="${esc(cap(c.marketCap))}"
                 data-colour="${esc(colour)}">
                <b style="font-size:${fs.toFixed(1)}px">${esc(c.symbol)}</b>
                ${showPct ? `<span style="font-size:${Math.max(9, fs*0.5).toFixed(1)}px;
                   top:${(fs*1.15).toFixed(0)}px">${esc(pct(c.changePct))}</span>` : ""}
              </a>`;
    }).join("");
    return `<div class="sectorbox" style="left:${x}px;top:${y}px;width:${iw}px;height:${h-GAP}px">
              <h4>${esc(sec.sector)}${hidden ? ` <span style="font-weight:400;color:var(--ink-3)">+${hidden}</span>` : ""}</h4>
              <div style="position:relative;width:${iw}px;height:${ih}px">${tiles}</div>
            </div>`;
  }).join("");

  host.innerHTML = `<div style="position:relative;width:${W}px;height:${H}px">${html}</div>`;
  document.getElementById("hm-legend").innerHTML =
    `<span>Day change</span>` +
    [-6,-3,-1.5,-0.5,0.5,1.5,3,6].map(v =>
      `<span><i style="background:${heatColour(v)}"></i>${v > 0 ? "+" : ""}${v}%</span>`).join("");

  // Same tip chrome as the sector charts: coloured swatch + label + value,
  // plus market cap on a second row.
  host.querySelectorAll("a.tile").forEach(el => {
    el.addEventListener("mousemove", ev => showTip(ev, el.dataset.name, [
      [el.dataset.symbol, el.dataset.pct, el.dataset.colour],
      ["Market cap", el.dataset.cap],
    ]));
    el.addEventListener("mouseleave", hideTip);
  });
}

// Rebuild when the phone rotates or the card width changes.
addEventListener("resize", () => {
  if (!HEAT.sectors || !MOBILE_MQ.matches) return;
  clearTimeout(renderHeatmap._rz);
  renderHeatmap._rz = setTimeout(() => renderHeatmap(), 120);
});

/* ===========================================================================
   Sector movement
=========================================================================== */
const SECTOR_COLOURS = ["--k1","--k2","--k3","--k4","--k5","--k6",
                        "--k7","--k8","--k9","--k10","--k11"];
const sectorColour = i => `var(${SECTOR_COLOURS[i % SECTOR_COLOURS.length]})`;

// The chart holds 120 days; the filter decides how much of it to show.
const PERF = { days: 7, history: null };

/* ---- Risk & Return ---------------------------------------------------------
   Every period/interval pair is precomputed by the worker, so switching a
   filter is a redraw of numbers already in hand rather than a fetch. */
const RISK = { period: "10Y", interval: "annual", sectors: null };

const RISK_PERIOD_LABEL = {
  "1W": "the last week", "1M": "the last month", "YTD": "the year so far",
  "1Y": "the last year", "5Y": "the last 5 years", "10Y": "the last 10 years",
  "ALL": "each fund's whole history",
};
const RISK_INTERVAL_ADJ = {
  daily: "daily", weekly: "weekly", monthly: "monthly", annual: "annual",
};
// Labels ride on the bubbles now, where "Communication Services" is wider
// than the space between two of them. Shortened only where it is unambiguous.
const RISK_SHORT_NAME = {
  "Communication Services": "Comm. Services",
  "Consumer Defensive": "Cons. Defensive",
  "Consumer Cyclical": "Cons. Cyclical",
  "Financial Services": "Financials",
  "Basic Materials": "Materials",
};

/** The cell for the current selection, or null where the window is too short
    to hold enough whole intervals to measure. */
const riskCell = s =>
  ((s.stats || {})[RISK.period] || {})[RISK.interval] || null;

function renderRisk(payload){
  if (payload) RISK.sectors = payload.sectors || [];
  const host = document.getElementById("riskchart");
  if (!host) return;
  syncRiskControls();

  if (!RISK.sectors || !RISK.sectors.length){
    host.innerHTML = `<div class="note">Sector risk data is not available yet.</div>`;
    return;
  }

  // XLRE launched in 2015 and XLC in 2018, so a "10Y" or "ALL" reading of
  // those covers less ground than the same reading of XLK. Flag it rather
  // than letting an eight-year record sit unmarked beside a twenty-year one.
  const want = riskWindowStart(RISK.period);
  const pts = RISK.sectors
    .map((s, i) => ({ s, i, c: riskCell(s) }))
    .filter(p => p.c)
    // Compare the fund's inception, not the cell's first date: an annual
    // bucket's first point always lands months after the window opens, so
    // testing that would flag every sector on every period.
    .map(p => ({ ...p, c: { ...p.c,
      partial: !!(want && p.s.inception && p.s.inception > want) } }));

  if (!pts.length){
    // 1W holds no whole year, so "1W + Annual" is not a short answer -- it is
    // not a question. Say which pair failed rather than showing an empty box.
    host.innerHTML =
      `<div class="note">${RISK_INTERVAL_ADJ[RISK.interval][0].toUpperCase()
        + RISK_INTERVAL_ADJ[RISK.interval].slice(1)} returns need a longer window than
       ${esc(RISK_PERIOD_LABEL[RISK.period])}.<br>Pick a longer period, or a shorter interval.</div>`;
    return;
  }

  // Labels sit on the bubbles, so the top and side margins carry a little
  // more room than the plot itself needs -- a label on the highest or
  // widest bubble would otherwise run off the frame.
  // H is set so this panel finishes level with Sector Performance beside it.
  // Its header wraps to two rows at half-width where that one's does not, so
  // the plot is the shorter of the two to make the panels the same height.
  const W = 570, H = 310, ml = 52, mr = 16, mt = 20, mb = 40;
  const pw = W - ml - mr, ph = H - mt - mb;

  // Pad the extents so no bubble is clipped by the frame, and always include
  // zero on the return axis -- a scatter that hides the break-even line makes
  // a losing sector look merely low.
  const xs = pts.map(p => p.c.vol), ys = pts.map(p => p.c.ret);
  const x1 = Math.max(...xs) * 1.12, x0 = 0;
  let y0 = Math.min(0, ...ys), y1 = Math.max(...ys);
  const ypad = (y1 - y0) * 0.16 || 0.01;
  y0 -= ypad; y1 += ypad;

  const X = v => ml + ((v - x0) / (x1 - x0 || 1)) * pw;
  const Y = v => mt + ph - ((v - y0) / (y1 - y0 || 1)) * ph;

  // Area, not radius, tracks market cap -- a radius scale exaggerates the
  // biggest sector by the square of its lead.
  const caps = pts.map(p => p.s.cap || 0);
  const capMax = Math.max(...caps, 1);
  const R = c => 7 + 20 * Math.sqrt((c || 0) / capMax);

  const parts = [];
  const ticks = 4;
  for (let i = 0; i <= ticks; i++){
    const v = y0 + (y1 - y0) * i / ticks;
    parts.push(`<line x1="${ml}" y1="${Y(v)}" x2="${W-mr}" y2="${Y(v)}"
      stroke="var(--rule-2)" ${Math.abs(v) < 1e-9 ? '' : 'stroke-dasharray="3 4"'}></line>
      <text x="${ml-8}" y="${Y(v)+3.2}" text-anchor="end" font-size="9" class="tnum"
        fill="var(--ink-3)">${(v*100).toFixed(v === 0 ? 0 : 1)}%</text>`);
  }
  for (let i = 0; i <= ticks; i++){
    const v = x0 + (x1 - x0) * i / ticks;
    parts.push(`<text x="${X(v)}" y="${H-mb+15}" text-anchor="middle" font-size="9"
      class="tnum" fill="var(--ink-3)">${(v*100).toFixed(1)}%</text>`);
  }

  // Break-even, drawn solid so it reads as the reference the dashes are not.
  if (y0 < 0 && y1 > 0)
    parts.push(`<line x1="${ml}" y1="${Y(0)}" x2="${W-mr}" y2="${Y(0)}" stroke="var(--rule)"></line>`);

  // The risk/return line: least squares through the bubbles, which is the
  // grey diagonal in the reference. Two points cannot describe a trend.
  if (pts.length > 2){
    const n = pts.length;
    const mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
    let num = 0, den = 0;
    pts.forEach(p => { num += (p.c.vol-mx)*(p.c.ret-my); den += (p.c.vol-mx)**2; });
    if (den){
      const m = num/den, b = my - m*mx;
      const ya = m*x0 + b, yb = m*x1 + b;
      parts.push(`<line x1="${X(x0)}" y1="${Y(ya)}" x2="${X(x1)}" y2="${Y(yb)}"
        stroke="var(--ink-3)" stroke-width="1.4" opacity=".55"></line>`);
    }
  }

  // Largest first, so a big bubble cannot bury a small one -- and so the
  // biggest gets first choice of label position below.
  const ordered = pts.slice().sort((a, b) => (b.s.cap || 0) - (a.s.cap || 0));
  ordered.forEach(p => {
    const cx = X(p.c.vol), cy = Y(p.c.ret), r = R(p.s.cap);
    parts.push(`<circle class="rbub" data-k="${esc(p.s.sector)}" cx="${cx}" cy="${cy}" r="${r}"
      fill="${sectorColour(p.i)}" fill-opacity=".82" stroke="var(--card)" stroke-width="1.5"
      style="cursor:pointer"></circle>`);
  });

  // Labels on the bubbles rather than in a legend below, so the eye does not
  // have to travel to a colour key and back. Eleven of them in one frame will
  // collide, so each takes the first of four positions -- above, below,
  // right, left -- that stays inside the plot and clear of the labels already
  // placed. Biggest bubbles choose first, since they are the ones a reader
  // looks for.
  const FS = 9.5, CW = 5.05;                 // char width at this size
  const boxes = [];
  const clear = b => boxes.every(o =>
    b.x1 < o.x0 || b.x0 > o.x1 || b.y1 < o.y0 || b.y0 > o.y1);

  ordered.forEach(p => {
    const cx = X(p.c.vol), cy = Y(p.c.ret), r = R(p.s.cap);
    const text = (RISK_SHORT_NAME[p.s.sector] || p.s.sector) + (p.c.partial ? " *" : "");
    const w = text.length * CW;
    // Four sides, then the diagonals, then the sides pushed further out. A
    // short window bunches the bubbles into one corner, and with only the
    // four cardinal slots two labels there had nowhere left to go.
    const mid = (x, y) => ({ x, y, anchor: "middle", x0: x - w/2, x1: x + w/2 });
    const rt  = (x, y) => ({ x, y, anchor: "start",  x0: x, x1: x + w });
    const lf  = (x, y) => ({ x, y, anchor: "end",    x0: x - w, x1: x });
    const cands = [
      mid(cx, cy - r - 5),          mid(cx, cy + r + 11),
      rt(cx + r + 5, cy + 3.4),     lf(cx - r - 5, cy + 3.4),
      rt(cx + r * 0.7 + 4, cy - r * 0.7 - 3),
      lf(cx - r * 0.7 - 4, cy - r * 0.7 - 3),
      rt(cx + r * 0.7 + 4, cy + r * 0.7 + 9),
      lf(cx - r * 0.7 - 4, cy + r * 0.7 + 9),
      mid(cx, cy - r - 16),         mid(cx, cy + r + 22),
      rt(cx + r + 5, cy - 8),       lf(cx - r - 5, cy - 8),
      rt(cx + r + 5, cy + 15),      lf(cx - r - 5, cy + 15),
    ].map(c => ({ ...c, y0: c.y - FS, y1: c.y + 2 }));

    const inFrame = c => c.x0 >= ml - 44 && c.x1 <= W - mr + 2 && c.y0 >= 2 && c.y1 <= mt + ph + 10;
    const shift = (c, dy) => ({ ...c, y: c.y + dy, y0: c.y0 + dy, y1: c.y1 + dy });

    let pick = cands.find(c => inFrame(c) && clear(c));
    if (!pick) {
      // Over a short window every sector lands on nearly the same return and
      // volatility, so the bubbles genuinely overlap and no fixed set of slots
      // can separate their labels. Walk one outwards until it is clear.
      const base = cands.find(inFrame) || cands[0];
      pick = base;
      for (let dy = 4; dy <= 72; dy += 4) {
        const up = shift(base, -dy), down = shift(base, dy);
        if (inFrame(up) && clear(up)) { pick = up; break; }
        if (inFrame(down) && clear(down)) { pick = down; break; }
      }
    }
    boxes.push(pick);
    parts.push(`<text class="rlab" data-k="${esc(p.s.sector)}" x="${pick.x.toFixed(1)}"
      y="${pick.y.toFixed(1)}" text-anchor="${pick.anchor}" font-size="${FS}"
      font-weight="600" fill="var(--ink-2)" style="cursor:pointer;pointer-events:auto"
      >${esc(text)}</text>`);
  });

  parts.push(`<text x="${ml + pw/2}" y="${H-6}" text-anchor="middle" font-size="10.5"
      fill="var(--ink-2)">${esc(riskAxisLabel("x"))}</text>
    <text transform="translate(13,${mt + ph/2}) rotate(-90)" text-anchor="middle"
      font-size="10.5" fill="var(--ink-2)">${esc(riskAxisLabel("y"))}</text>`);

  host.innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" class="fullchart" role="img"
       aria-label="${esc(riskAxisLabel("y"))} against ${esc(riskAxisLabel("x"))} by sector">
       ${parts.join("")}</svg>`;

  spreadRiskLabels(host.querySelector("svg"), mt, mt + ph);

  wireRiskHover(pts);
}

/** Separate any labels still overlapping after placement.

    Placement has to guess each label's width from its character count, and the
    guess is never exactly what the browser draws -- so on the crowded windows
    a label chosen as "clear" can still land on its neighbour. This measures
    the real boxes and eases the offenders apart, which no estimate can do
    before the text exists. Symmetric: both labels in a colliding pair move,
    so neither drifts far from its own bubble. */
function spreadRiskLabels(svg, top, bottom){
  if (!svg) return;
  const labs = [...svg.querySelectorAll("text.rlab")];
  if (labs.length < 2) return;

  const box = labs.map(t => t.getBBox());
  const dy = labs.map(() => 0);
  const at = i => ({
    x0: box[i].x, x1: box[i].x + box[i].width,
    y0: box[i].y + dy[i], y1: box[i].y + box[i].height + dy[i],
  });

  for (let pass = 0; pass < 40; pass++) {
    let moved = false;
    for (let i = 0; i < labs.length; i++) {
      for (let j = i + 1; j < labs.length; j++) {
        const a = at(i), b = at(j);
        if (a.x1 < b.x0 || a.x0 > b.x1 || a.y1 < b.y0 || a.y0 > b.y1) continue;
        if (a.y0 <= b.y0) { dy[i] -= 1.5; dy[j] += 1.5; }
        else              { dy[i] += 1.5; dy[j] -= 1.5; }
        moved = true;
      }
    }
    if (!moved) break;
  }

  labs.forEach((t, i) => {
    if (!dy[i]) return;
    // Never push a label out of the plot; the axis area below is not free space.
    let d = dy[i];
    if (box[i].y + d < top - 12) d = top - 12 - box[i].y;
    if (box[i].y + box[i].height + d > bottom + 10) d = bottom + 10 - box[i].height - box[i].y;
    t.setAttribute("y", (parseFloat(t.getAttribute("y")) + d).toFixed(1));
  });
}

/** The date a period nominally reaches back to. ALL has no fixed start -- it
    is whatever each fund has -- so nothing is "partial" under it by
    definition, and a month of slack keeps a fund that listed a few days late
    from being flagged. */
function riskWindowStart(period){
  if (period === "ALL") return null;
  const now = new Date();
  if (period === "YTD") return `${now.getFullYear()}-01-01`;
  const days = { "1W": 7, "1M": 30, "1Y": 365, "5Y": 1826, "10Y": 3653 }[period];
  if (!days) return null;
  const d = new Date(now.getTime() - (days - 31) * 864e5);
  return d.toISOString().slice(0, 10);
}

/** Axis titles follow the interval, because "average return" means something
    different for a day than for a year. */
function riskAxisLabel(axis){
  const adj = RISK_INTERVAL_ADJ[RISK.interval];
  return axis === "y" ? `Average ${adj} return` : `${adj[0].toUpperCase()}${adj.slice(1)} volatility`;
}

function wireRiskHover(pts){
  const host = document.getElementById("riskchart");
  const svg = host.querySelector("svg");
  if (!svg) return;
  const byKey = {};
  pts.forEach(p => byKey[p.s.sector] = p);

  const show = (ev, key) => {
    const p = byKey[key];
    if (!p) return;
    const c = p.c, adj = RISK_INTERVAL_ADJ[RISK.interval];
    const rows = [
      [`Average ${adj} return`, `${c.ret >= 0 ? "+" : ""}${(c.ret*100).toFixed(2)}%`],
      [`${adj[0].toUpperCase()}${adj.slice(1)} volatility`, `${(c.vol*100).toFixed(2)}%`],
      ["Annualised volatility", `${(c.annVol*100).toFixed(1)}%`],
      ["Market cap", p.s.cap ? `$${(p.s.cap/1e12).toFixed(2)}T` : "—"],
      [`${adj[0].toUpperCase()}${adj.slice(1)} periods`, String(c.n)],
      ["Measured from", c.from || "—"],
      ["Tracked by", p.s.etf],
    ];
    showTip(ev, p.s.sector, rows.map(r => [r[0], r[1], null]));
  };

  // The label is part of the bubble as far as a reader is concerned, so it
  // carries the same tooltip -- and it is the easier target of the two for
  // the small sectors.
  svg.querySelectorAll(".rbub, .rlab").forEach(el => {
    el.addEventListener("mousemove", ev => show(ev, el.dataset.k));
    el.addEventListener("mouseleave", hideTip);
  });
}

/** Grey out the pairs that cannot be computed, so the controls tell the truth
    about what is available before it is clicked rather than after. */
function syncRiskControls(){
  const has = (period, interval) => (RISK.sectors || []).some(
    s => ((s.stats || {})[period] || {})[interval]);

  // Only grey a control out once there is data to say it is unavailable.
  // An empty array is truthy, so testing the array itself disabled every
  // button whenever the panel had nothing loaded.
  const loaded = !!(RISK.sectors && RISK.sectors.length);
  document.querySelectorAll("#risk-range button").forEach(b => {
    const p = b.dataset.p;
    b.setAttribute("aria-pressed", String(p === RISK.period));
    b.disabled = loaded && !RISK_INTERVALS_ANY(p);
  });
  document.querySelectorAll("#risk-interval-menu button[data-i]").forEach(b => {
    const i = b.dataset.i;
    b.setAttribute("aria-selected", String(i === RISK.interval));
    b.disabled = loaded && !has(RISK.period, i);
  });
  const btn = document.getElementById("risk-interval-btn");
  if (btn) btn.firstChild.nodeValue =
    RISK_INTERVAL_ADJ[RISK.interval][0].toUpperCase() + RISK_INTERVAL_ADJ[RISK.interval].slice(1) + " ";
}

const RISK_INTERVALS_ANY = period => ["daily","weekly","monthly","annual"].some(
  i => (RISK.sectors || []).some(s => ((s.stats || {})[period] || {})[i]));

function wireRiskControls(){
  document.querySelectorAll("#risk-range button").forEach(b => b.onclick = () => {
    if (b.disabled) return;
    RISK.period = b.dataset.p;
    // Keep the chart populated when the new period cannot serve the current
    // interval: step down to the finest one it can, rather than showing the
    // "needs a longer window" note for a period that has perfectly good data.
    if (!((RISK.sectors || []).some(s => ((s.stats || {})[RISK.period] || {})[RISK.interval]))) {
      const fallback = ["annual","monthly","weekly","daily"].find(i =>
        (RISK.sectors || []).some(s => ((s.stats || {})[RISK.period] || {})[i]));
      if (fallback) RISK.interval = fallback;
    }
    GA.track("change_chart_range", { range: RISK.period, source: "sector_risk" });
    renderRisk();
  });

  const btn = document.getElementById("risk-interval-btn");
  const menu = document.getElementById("risk-interval-menu");
  if (!btn || !menu) return;
  const close = () => { menu.hidden = true; btn.setAttribute("aria-expanded", "false"); };
  btn.onclick = ev => {
    ev.stopPropagation();
    const open = menu.hidden;
    menu.hidden = !open;
    btn.setAttribute("aria-expanded", String(open));
  };
  menu.querySelectorAll("button[data-i]").forEach(b => b.onclick = () => {
    if (b.disabled) return;
    RISK.interval = b.dataset.i;
    GA.track("change_chart_interval", { interval: RISK.interval, source: "sector_risk" });
    close();
    renderRisk();
  });
  document.addEventListener("click", ev => {
    if (!menu.hidden && !menu.contains(ev.target) && ev.target !== btn) close();
  });
  document.addEventListener("keydown", ev => { if (ev.key === "Escape") close(); });
}

function sectorPerfRows(days){
  const hist = PERF.history;
  if (!hist || !hist.length) return [];
  return hist.map(s => {
    const pts = (s.series || []).slice(-days);
    const changePct = pts.reduce((a, p) => a + (p.v || 0), 0);
    return { sector: s.sector, changePct };
  }).sort((a, b) => b.changePct - a.changePct);
}

function renderSectorPerf(history){
  if (history) PERF.history = history;
  const host = document.getElementById("sectorperf");
  const rows = sectorPerfRows(PERF.days);
  const sub = document.getElementById("perf-sub");
  if (sub) sub.textContent =
    `Cumulative performance per sector over the last ${PERF.days} days.`;
  if (!rows.length){ host.innerHTML = `<div class="note">No sector data yet.</div>`; return; }
  // The left margin has to clear the longest sector name -- "Communication
  // Services" is the one that sets it -- and the height is chosen so the bars
  // fill the panel rather than sitting in its top third.
  const W = 570, H = 380, ml = 198, mr = 18, mt = 10, mb = 16;
  const pw = W - ml - mr, ph = H - mt - mb;
  const max = Math.max(...rows.map(r => Math.abs(r.changePct)), 0.5);
  const zero = ml + pw / 2;
  // The longest bar stops short of the edge so its value label has room.
  const scale = v => (v / max) * (pw / 2) * 0.68;
  const bh = Math.min(24, ph / rows.length - 8);

  const parts = [`<line x1="${zero}" y1="${mt}" x2="${zero}" y2="${mt+ph}" stroke="var(--rule)"></line>`];
  rows.forEach((r, i) => {
    const cy = mt + (ph * (i + 0.5)) / rows.length;
    const w = scale(r.changePct);
    const up = r.changePct >= 0;
    parts.push(`<rect x="${up ? zero : zero + w}" y="${cy - bh/2}" width="${Math.abs(w)}"
        height="${bh}" rx="3" fill="var(${up ? "--up" : "--down"})"
        data-s="${esc(r.sector)}" data-v="${r.changePct}" style="cursor:default"></rect>
      <text x="${ml-10}" y="${cy+5}" text-anchor="end" font-size="15.5"
        fill="var(--ink-2)">${esc(r.sector)}</text>
      <text x="${up ? zero + w + 6 : zero + w - 6}" y="${cy+5}"
        text-anchor="${up ? "start" : "end"}" font-size="12.5" class="tnum"
        fill="var(${up ? "--up" : "--down"})" font-weight="600">${esc(pct(r.changePct))}</text>`);
  });
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="fullchart" role="img"
    aria-label="Sector performance">${parts.join("")}</svg>`;

  const asOf = (S.movement && S.movement.asOf) || "";
  host.querySelectorAll("rect[data-s]").forEach(el => {
    el.addEventListener("mousemove", ev => showTip(ev, el.dataset.s,
      [[`${PERF.days}d cumulative`, asOf ? `as of ${asOf}` : ""],
       ["Change", pct(+el.dataset.v)]]));
    el.addEventListener("mouseleave", hideTip);
  });
}

/* ===========================================================================
   Congress and insiders
=========================================================================== */
const shares = v => !v ? "—"
  : v >= 1e6 ? (v/1e6).toFixed(2) + "M" : v >= 1e3 ? (v/1e3).toFixed(1) + "K" : String(Math.round(v));
const amount = v => {
  if (v === null || v === undefined || !v) return "—";
  const a = Math.abs(v), sign = v < 0 ? "−" : "";
  return sign + (a >= 1e9 ? `$${(a/1e9).toFixed(2)}B`
       : a >= 1e6 ? `$${(a/1e6).toFixed(2)}M`
       : a >= 1e3 ? `$${(a/1e3).toFixed(0)}K` : `$${a.toFixed(0)}`);
};
// Ticker over company name, as the summary rows do. get_trades carries the
// name from 0019; before that migration it is absent and only the symbol
// shows, which is what the page did before.
const symLink = (s, name) =>
  `<a class="tsym" href="company.html?t=${encodeURIComponent(s)}&src=market_page">
     <span class="tsym-t">${esc(s)}</span>
     ${name ? `<span class="tsym-n">${esc(name)}</span>` : ""}
   </a>`;

/** Role over name — same stack as ticker/company. Insider titles are
    normalised by the worker (CEO, CFO, …); congress uses Senator / Rep. */
const peopleStack = (title, person, fallback = "Insider") => {
  const role = (title || "").trim() || fallback;
  const who = (person || "").trim();
  return `<div class="ppl" title="${esc(who ? `${role} · ${who}` : role)}">
     <span class="ppl-t">${esc(role)}</span>
     ${who ? `<span class="ppl-n">${esc(who)}</span>` : ""}
   </div>`;
};

const congressRole = chamber => {
  const c = String(chamber || "").toLowerCase();
  if (c.includes("senate")) return "Senator";
  if (c.includes("house")) return "Representative";
  return "Member";
};

/** Normalise FMP side strings (Purchase, Sale (Partial), …) to Buy/Sell pills. */
const sidePill = side => {
  const raw = String(side || "").trim();
  const s = raw.toLowerCase();
  let label = raw || "—", cls = "";
  if (/^(buy|purchase|receive)/.test(s) || s.includes("purchase") || s.includes("receive")) {
    label = "Buy"; cls = "buy";
  } else if (/^(sell|sale)/.test(s) || s.includes("sale") || s.includes("sell") || s.includes("exchange")) {
    label = "Sell"; cls = "sell";
  }
  return `<span class="side ${cls}">${esc(label)}</span>`;
};

/** Congressional disclosures are reported as a band, never an exact figure,
    so the band is what gets shown -- compacted, not rounded to a single
    number that would imply a precision the filing does not have. */
const range = raw => {
  if (!raw) return "—";
  const nums = String(raw).match(/[\d,]+/g);
  if (!nums || !nums.length) return String(raw);
  const short = n => {
    const v = +n.replace(/,/g, "");
    return v >= 1e6 ? `${(v/1e6).toFixed(v % 1e6 ? 1 : 0)}M`
         : v >= 1e3 ? `${Math.round(v/1e3)}K` : String(v);
  };
  return nums.length > 1 ? `${short(nums[0])}–${short(nums[1])}` : short(nums[0]);
};

/* Paginated trade feeds. Insiders use 7 days; congress uses 14. Each panel
   scrolls independently and asks for the next page near the bottom. */
const TRADES = {
  page: 20,
  insider:  { days: 7,  rows: [], total: 0, loading: false, done: false, wired: false },
  congress: { days: 14, rows: [], total: 0, loading: false, done: false, wired: false },
};

const insiderRow = r =>
  `<tr><td>${esc(r.filed || "")}</td>
       <td class="idcol">${symLink(r.symbol, r.name)}</td>
       <td class="idcol">${peopleStack(r.title, r.person)}</td>
       <td>${sidePill(r.side)}</td>
       <td>${esc(shares(r.shares))}</td>
       <td>${esc(amount(r.amount))}</td></tr>`;

const congressRow = r =>
  `<tr><td>${esc(r.disclosed || "")}</td>
       <td class="idcol">${symLink(r.symbol, r.name)}</td>
       <td class="idcol">${peopleStack(congressRole(r.chamber), r.person)}</td>
       <td>${sidePill(r.side)}</td>
       <td title="${esc(r.amount || "")}">${esc(range(r.amount))}</td></tr>`;

function renderTradePanel(kind){
  const isIns = kind === "insider";
  const host = document.getElementById(isIns ? "insiders" : "congress");
  const bucket = TRADES[isIns ? "insider" : "congress"];
  if (!host) return;

  if (!bucket.rows.length) {
    host.innerHTML = bucket.loading
      ? `<div class="note"><span class="load"></span></div>`
      : `<div class="note">${isIns
          ? "No insider filings in the last 7 days."
          : "No congressional disclosures in the last 14 days."}</div>`;
    return;
  }

  const head = isIns
    ? `<th>Filed</th><th class="idcol">Ticker</th><th class="idcol">People</th>
       <th>Side</th><th>Shares</th><th>Amount</th>`
    : `<th>Disclosed</th><th class="idcol">Ticker</th>
       <th class="idcol">People</th><th>Side</th><th>Amount</th>`;
  const body = bucket.rows.map(isIns ? insiderRow : congressRow).join("");
  const more = bucket.loading
    ? `<div class="trade-more"><span class="load"></span>Loading more…</div>`
    : bucket.done ? ""
    : `<div class="trade-more">Scroll for more · ${bucket.rows.length} of ${bucket.total}</div>`;
  const top = host.scrollTop;
  host.innerHTML = `<table class="mini"><thead><tr>${head}</tr></thead>
                    <tbody>${body}</tbody></table>${more}`;
  host.scrollTop = top;
  wireTradeScroll(kind);
}

function wireTradeScroll(kind){
  const isIns = kind === "insider";
  const host = document.getElementById(isIns ? "insiders" : "congress");
  const bucket = TRADES[isIns ? "insider" : "congress"];
  if (!host || bucket.wired) return;
  bucket.wired = true;
  host.addEventListener("scroll", () => {
    if (bucket.loading || bucket.done) return;
    if (host.scrollTop + host.clientHeight < host.scrollHeight - 48) return;
    loadTrades(kind);
  }, { passive: true });
}

async function loadTrades(kind){
  const isIns = kind === "insider";
  const bucket = TRADES[isIns ? "insider" : "congress"];
  if (bucket.loading || bucket.done) return;
  bucket.loading = true;
  if (bucket.rows.length) renderTradePanel(kind);
  try {
    const d = await rpc("get_trades", {
      p_limit: TRADES.page,
      p_offset: bucket.rows.length,
      p_days: bucket.days,
      p_kind: isIns ? "insider" : "congress",
    });
    const key = isIns ? "insiders" : "congress";
    const totalKey = isIns ? "insidersTotal" : "congressTotal";
    const chunk = (d && d[key]) || [];
    bucket.total = (d && d[totalKey]) || 0;
    bucket.rows = bucket.rows.concat(chunk);
    bucket.done = !chunk.length
      || chunk.length < TRADES.page
      || (bucket.total > 0 && bucket.rows.length >= bucket.total);
  } catch {
    if (!bucket.rows.length) {
      bucket.done = true;
    }
  } finally {
    bucket.loading = false;
    renderTradePanel(kind);
  }
}

function bootTrades(){
  loadTrades("insider");
  loadTrades("congress");
  wirePanelInfoTips();
}

/** Pin .info-i bubbles on document.body so panel/button overflow cannot crop them. */
function wirePanelInfoTips(root){
  (root || document).querySelectorAll(".info-i").forEach(btn => {
    const tip = btn.querySelector(".info-bubble");
    if (!tip || btn.dataset.tipWired) return;
    btn.dataset.tipWired = "1";
    document.body.appendChild(tip);
    const place = () => {
      tip.classList.add("on");
      const r = btn.getBoundingClientRect();
      const tw = tip.offsetWidth || 280;
      const th = tip.offsetHeight || 72;
      let left = r.left;
      if (left + tw > window.innerWidth - 8) left = Math.max(8, r.right - tw);
      let top = r.bottom + 8;
      if (top + th > window.innerHeight - 8) top = Math.max(8, r.top - th - 8);
      tip.style.left = `${left}px`;
      tip.style.top = `${top}px`;
    };
    const hide = () => {
      tip.classList.remove("on");
      tip.style.left = "";
      tip.style.top = "";
    };
    btn.addEventListener("mouseenter", place);
    btn.addEventListener("focus", place);
    btn.addEventListener("mousemove", place);
    btn.addEventListener("mouseleave", hide);
    btn.addEventListener("blur", hide);
  });
}

/* ---- boot ---------------------------------------------------------------- */
(async function boot(){
  wireChartRange();

  // Wired here rather than inside setView, which also runs on boot: a view
  // the visitor never chose is not a screener they ran.
  document.querySelectorAll("#views button").forEach(b => b.onclick = () => {
    GA.track("run_screener", { screener_name: b.dataset.v });
    setView(b.dataset.v);
  });

  document.getElementById("foot").innerHTML =
    `<strong>Prices and movers</strong> come from Financial Modeling Prep and are
     end-of-day for the last completed session, not live quotes.
     <strong>Company financials</strong> — everything on the
     <a href="company.html">company page</a> — come only from SEC filings.
     Two sources, two different questions: what the market did, and what the
     business earned.
     <span class="foot-links"> · <a href="privacy.html">Privacy Policy</a></span>`;

  if (!HOSTED) {
    document.getElementById("cards").innerHTML =
      `<div class="card" style="grid-column:1/-1"><div class="k">Not configured</div>
       <div class="v" style="font-size:16px">config.js is missing</div>
       <div class="d">This page reads from Supabase and has no local fallback.</div></div>`;
    return;
  }

  try {
    S.overview = await rpc("get_market_overview");
    renderAsOf(S.overview);
  } catch (e) {
    document.getElementById("asof").textContent = "Market data unavailable: " + e.message;
  }

  // Pulse bar: prefer the dedicated RPC (needs migration 0015); otherwise
  // assemble the same shape from overview + heatmap + tape.
  (async () => {
    let pulse = null;
    try { pulse = await rpc("get_market_pulse"); }
    catch { try { pulse = await assemblePulseFallback(); } catch {} }
    renderPulse(pulse);
  })();

  wireDiscover();
  loadDiscover();

  // A signed-in visitor came back for their own list; everyone else gets the
  // market. ?tab= overrides both, which is what sign-in redirects back to.
  const wanted = new URLSearchParams(location.search).get("tab");
  await setView(wanted === "watchlist" || (!wanted && signedIn()) ? "watchlist" : "market_cap");

  // Signing in mid-session: fold the browser's list into the account, then
  // show it. Signing out drops back to the market.
  if (window.TA) window.TA.onAuthChange(async isIn => {
    if (isIn) {
      const added = await mergeLocalWatchlist();
      document.querySelectorAll(".wl-prompt").forEach(el => el.remove());
      await setView("watchlist");
      if (added) toast(`${added} ${added === 1 ? "company" : "companies"} added to your watchlist`);
    } else if (S.view === "watchlist") {
      await setView("market_cap");
    }
  });

  // If the page loaded already signed in with a local list left over from
  // before, merge that too.
  if (signedIn() && localWatch.read().length) {
    const added = await mergeLocalWatchlist();
    if (added && S.view === "watchlist") await setView("watchlist");
  }

  // The sections below load independently, so one failing does not take the
  // rest of the page with it.
  rpc("get_heatmap").then(renderHeatmap).catch(() =>
    document.getElementById("heatmap").innerHTML = `<div class="note">Heatmap unavailable.</div>`);

  // Risk & Return stands on its own table, so it loads independently of the
  // sector movement payload the panel beside it uses.
  rpc("get_sector_risk").then(renderRisk).catch(() => {
    document.getElementById("riskchart").innerHTML =
      `<div class="note">Risk and return data is unavailable.</div>`;
  });
  wireRiskControls();

  rpc("get_sector_movement").then(d => {
    S.movement = d;
    renderSectorPerf(d && d.history);
    document.querySelectorAll("#perf-range button").forEach(b => b.onclick = () => {
      PERF.days = +b.dataset.d;
      GA.track("change_chart_range", { range: `${PERF.days}d`, source: "sector_performance" });
      document.querySelectorAll("#perf-range button").forEach(x =>
        x.setAttribute("aria-pressed", x === b));
      renderSectorPerf();
    });
  }).catch(() => {
    document.getElementById("rotation").innerHTML = `<div class="note">Unavailable.</div>`;
    document.getElementById("sectorperf").innerHTML = `<div class="note">Unavailable.</div>`;
  });

  bootTrades();
})();
</script>
