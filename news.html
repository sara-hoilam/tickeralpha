<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticker Alpha — market news</title>
<meta name="description" content="Market news from across the wire, ranked by what's most covered — filter by topic or ticker and trace every story to its source.">
<link rel="canonical" href="https://tickeralpha.ai/news">
<meta property="og:type" content="website">
<meta property="og:title" content="Ticker Alpha — market news">
<meta property="og:description" content="Market news ranked by what's most covered — filter by topic or ticker and trace every story to its source.">
<meta property="og:url" content="https://tickeralpha.ai/news">
<meta property="og:site_name" content="Ticker Alpha">
<script src="config.js"></script>
<script src="logo.js"></script>
<script src="analytics.js"></script>
<script src="posthog-init.js"></script>
<script type="module" src="clarity-init.js"></script>
<link rel="stylesheet" href="nav.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Every page's first act is an RPC to Supabase; warming the connection here
     saves the DNS + TCP + TLS setup that otherwise sits in front of the first
     byte of data. The origin is already public in config.js. -->
<link rel="preconnect" href="https://etembhwwbqswzcepfhxp.supabase.co" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   News — a front page, not a firehose. One wide reading column: the biggest
   stories first, ranked by how many publishers are writing them; then the
   day sorted into sections; then the full time-ordered wire. The rail on the
   right carries the market summary and the live feed. Search sits beside the
   title, and searching collapses the page to the flat filtered list.
--------------------------------------------------------------------------- */
:root {
  color-scheme: light;
  --ground:#eef0f3; --card:#ffffff; --sunk:#f6f7f9;
  --ink:#111820; --ink-2:#4a5866; --ink-3:#78889a;
  --rule:#dde2e8; --rule-2:#eaeef2;
  --accent:#1e4fbf; --accent-soft:#e6ecfb;
  --up:#0b7a4b; --down:#c0392e;
  --up-soft:#e3f4ec; --down-soft:#fbe9e7;
  --shadow:0 1px 2px rgba(17,24,32,.06), 0 6px 20px -12px rgba(17,24,32,.22);
  --r:10px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:#0d1219; --card:#151c25; --sunk:#111821;
  --ink:#e7edf4; --ink-2:#a3b1c0; --ink-3:#77879a;
  --rule:#232d3a; --rule-2:#1c2531;
  --accent:#6e9bff; --accent-soft:#1a2740;
  --up:#38b37d; --down:#f0736a;
  --up-soft:#12291f; --down-soft:#2b1614;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box;margin:0;padding:0}
/* The hidden attribute must always win: several containers here carry their
   own display:grid/flex, which outranks the UA's [hidden]{display:none} and
   once left a "hidden" panel sitting visibly on the page. */
[hidden]{display:none!important}
body{font-family:"IBM Plex Sans",system-ui,sans-serif;background:var(--ground);
  color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:var(--page,1680px);margin:0 auto;padding:20px 28px 72px}
a{color:inherit}
.up{color:var(--up)} .down{color:var(--down)}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
h3{font-size:14px;font-weight:600;letter-spacing:-.005em}

/* Two columns: the stories, and a rail. The old left rail's market summary
   moved to the rail and its topic chips retired -- search covers them -- so
   the reading column gets the width back. */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}

/* ---- right rail: market summary above the live feed ---------------------- */
.side-r{display:flex;flex-direction:column;gap:18px;
  position:sticky;top:calc(var(--nav-h,56px) + 16px)}
.side-r h3{padding:13px 15px 9px}
.rows{max-height:298px;overflow-y:auto;scrollbar-width:thin;
  scrollbar-color:var(--rule) transparent}
.rows::-webkit-scrollbar{width:8px}
.rows::-webkit-scrollbar-thumb{background:var(--rule);border-radius:5px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
thead{position:relative;z-index:2}
thead th{position:sticky;top:0;background:var(--card);z-index:2;
  background-clip:padding-box;box-shadow:0 1px 0 var(--rule);
  font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;text-align:right;padding:7px 15px 7px 0}
thead th:first-child{text-align:left;padding-left:15px}
tbody td{padding:8px 0;border-bottom:1px solid var(--rule-2);text-align:right;
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
tbody td:first-child{text-align:left;padding-left:15px;font-family:"IBM Plex Sans",sans-serif}
tbody td:last-child{padding-right:15px}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}
.sym{display:flex;align-items:center;gap:8px}
.dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:8.5px;font-weight:600;color:#fff}
.pill{display:inline-block;padding:1px 6px;border-radius:5px;font-size:12px;font-weight:500}
.pill.up{background:var(--up-soft)} .pill.down{background:var(--down-soft)}
.seg{display:flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;margin:0 15px 11px}
.seg button{flex:1;background:transparent;border:0;padding:6px 4px;font:inherit;font-size:11.5px;
  cursor:pointer;color:var(--ink-2);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:500}

/* ---- header: title, meta, and the search beside them --------------------- */
.newshead{display:flex;justify-content:space-between;align-items:center;gap:14px;
  margin-bottom:12px;flex-wrap:wrap}
.newshead h1{font-family:"IBM Plex Serif",Georgia,serif;font-size:26px;font-weight:600;
  letter-spacing:-.018em}
.newshead .meta{font-size:12px;color:var(--ink-3)}
.headtools{display:flex;align-items:center;gap:10px;flex:1;justify-content:flex-end;min-width:0}
.tsearch{position:relative;width:min(420px,100%)}
.tsearch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;
  color:var(--ink-3);pointer-events:none}
.tsearch input{width:100%;background:var(--card);border:1px solid var(--rule);border-radius:8px;
  padding:8px 11px 8px 31px;font:inherit;font-size:12.5px;color:var(--ink)}
.tsearch input::placeholder{color:var(--ink-3)}
.tsearch input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chip-active{display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);
  color:var(--accent);border-radius:20px;padding:3px 6px 3px 12px;font-size:12.5px;font-weight:500;
  white-space:nowrap}
.chip-active button{background:none;border:0;cursor:pointer;color:inherit;font:inherit;
  font-size:15px;line-height:1;padding:0 4px}

/* ---- section nav: anchors down one reading column ------------------------ */
.secnav{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:18px;
  overflow-x:auto;scrollbar-width:none}
.secnav::-webkit-scrollbar{display:none}
.secnav a{text-decoration:none;padding:9px 14px 8px;font-size:13.5px;font-weight:600;
  color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.secnav a.on{color:var(--accent);border-bottom-color:var(--accent)}
.secnav a:hover{color:var(--ink)}

/* ---- top stories band ---------------------------------------------------- */
.topband{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);margin-bottom:20px}
.bandhead{grid-column:1 / -1;display:flex;align-items:baseline;justify-content:space-between;
  gap:12px;padding:13px 18px 11px;border-bottom:1px solid var(--rule-2)}
.bandhead h3{color:var(--accent);font-size:15px}
.bandhead .why{font-size:11.5px;color:var(--ink-3)}
.lead{padding:18px;border-right:1px solid var(--rule-2);text-decoration:none;display:block}
.lead .thumb{width:100%;aspect-ratio:16/8.4;border-radius:9px;overflow:hidden;background:var(--sunk);
  margin-bottom:13px}
.lead .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.lead h2{font-family:"IBM Plex Serif",Georgia,serif;font-size:23px;font-weight:600;line-height:1.25;
  letter-spacing:-.015em;margin-bottom:8px}
.lead:hover h2{color:var(--accent)}
.lead p{font-size:13.5px;color:var(--ink-2);margin-bottom:10px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.by{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap}
.tag{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;background:var(--sunk);
  border:1px solid var(--rule);border-radius:5px;padding:1px 6px;color:var(--ink-2)}
.srcs{color:var(--accent);font-weight:600}
.tlist{display:flex;flex-direction:column;min-width:0}
.tlist a{display:block;text-decoration:none;padding:13px 18px;border-bottom:1px solid var(--rule-2)}
.tlist a:last-child{border-bottom:0}
.tlist h4{font-size:15px;font-weight:600;line-height:1.32;letter-spacing:-.01em;margin-bottom:4px}
.tlist a:hover h4{color:var(--accent)}
/* The other publishers writing the lead story, folded behind its source count. */
.alts{display:inline}
.alts summary{list-style:none;cursor:pointer;display:inline}
.alts summary::-webkit-details-marker{display:none}
.alts summary .srcs::after{content:" ▾"} .alts[open] summary .srcs::after{content:" ▴"}
.altlist{display:block;margin-top:8px;padding:8px 0 0;border-top:1px dashed var(--rule)}
.altlist a{display:block;font-size:12px;color:var(--ink-2);text-decoration:none;padding:3px 0}
.altlist a:hover{color:var(--accent)}
.altlist a b{font-weight:600;color:var(--ink-3);margin-right:6px}

/* ---- section cards ------------------------------------------------------- */
.secgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-bottom:22px}
.seccard .shead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:13px 16px 9px;border-bottom:1px solid var(--rule-2)}
.seccard .shead h3{font-size:14.5px}
.seccard .shead small{font-weight:400;color:var(--ink-3);font-size:11.5px}
.seccard .shead button{background:none;border:0;font:inherit;font-size:12px;color:var(--accent);
  font-weight:600;cursor:pointer;white-space:nowrap}
.srow{display:flex;gap:12px;padding:11px 16px;border-bottom:1px solid var(--rule-2);
  text-decoration:none;align-items:flex-start}
.srow>div:first-child{flex:1;min-width:0}
.srow h4{font-size:13.8px;font-weight:600;line-height:1.34;letter-spacing:-.008em;margin-bottom:3px}
.srow:hover h4{color:var(--accent)}
.srow .thumb{width:72px;height:54px;border-radius:7px;overflow:hidden;background:var(--sunk);flex-shrink:0}
.srow .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.srow .by{font-size:11px}
/* Five rows on the Top Stories tab; "More" opens the section's own tab. */
.seccard .srow:nth-of-type(n+6){display:none}
.seccard .srow:last-of-type{border-bottom:0}

/* ---- a section as its own tab: full-width rows, the article's photograph
   on the right. The story with no photograph simply has none -- an unrelated
   placeholder is worse than blank space. */
.secrow{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;
  padding:20px 22px;border-bottom:1px solid var(--rule-2);text-decoration:none;
  align-items:start}
.secrow.noimg{grid-template-columns:minmax(0,1fr)}
.secrow:last-child{border-bottom:0}
.secrow .pub{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.secrow h3{font-size:19px;font-weight:600;line-height:1.32;letter-spacing:-.012em;
  padding:0}
.secrow:hover h3{color:var(--accent)}
.secrow p{font-size:13px;color:var(--ink-2);line-height:1.5;margin-top:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.secrow .by{margin-top:9px}
.secrow .thumb{width:220px;height:124px;border-radius:12px;overflow:hidden;
  background:var(--sunk)}
.secrow .thumb img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:720px){
  .secrow{grid-template-columns:minmax(0,1fr) 96px;gap:12px;padding:14px 14px}
  .secrow .thumb{width:96px;height:96px;border-radius:9px}
  .secrow h3{font-size:15.5px}
  .secrow p{display:none}
}

/* ---- the wire: the flat time-ordered grid (home foot, and all of a search) */
.latest-h{font-family:"IBM Plex Serif",Georgia,serif;font-size:19px;font-weight:600;
  letter-spacing:-.014em;margin:4px 0 12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.story{display:flex;flex-direction:column;text-decoration:none}
.story .thumb{width:100%;aspect-ratio:16/9;border-radius:9px;overflow:hidden;
  background:var(--sunk);margin-bottom:11px;flex-shrink:0}
.story .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.story h2{font-size:16.5px;font-weight:600;line-height:1.32;letter-spacing:-.01em;
  margin-bottom:6px}
.story:hover h2{color:var(--accent)}
.story p{font-size:13px;color:var(--ink-2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.story .by{margin-top:9px}
.more{display:block;width:100%;margin:22px 0 4px;padding:11px;background:var(--card);
  border:1px solid var(--rule);border-radius:9px;font:inherit;font-size:13px;
  color:var(--ink-2);cursor:pointer}
.more:hover{border-color:var(--accent);color:var(--accent)}
/* display:block above would defeat the hidden attribute's display:none. */
.more[hidden]{display:none}

/* ---- the live feed ------------------------------------------------------- */
.feedhead{display:flex;align-items:center;gap:10px;padding:14px 15px 10px;
  border-bottom:1px solid var(--ink)}
.feedhead .bolt{width:26px;height:26px;border-radius:50%;background:#e2694a;color:#fff;
  display:grid;place-items:center;font-size:13px;flex-shrink:0}
.feedhead h3{letter-spacing:.09em;text-transform:uppercase;font-size:12px;padding:0}
/* The feed drifts by moving its own scroll position rather than by a CSS
   transform, so a reader can grab it and scroll back to a story that has
   already gone past. It picks the drift back up once they stop. The market
   summary sits above it now, so the feed takes what height is left. */
.feedwrap{height:calc(100vh - var(--nav-h,56px) - 500px);min-height:320px;
  overflow-y:auto;position:relative;
  scrollbar-width:thin;scrollbar-color:var(--rule) transparent;overscroll-behavior:contain}
.feedwrap::-webkit-scrollbar{width:8px}
.feedwrap::-webkit-scrollbar-thumb{background:var(--rule);border-radius:5px}
.feedwrap::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
.item{display:block;text-decoration:none;padding:15px;border-bottom:1px solid var(--rule-2)}
.item:hover{background:var(--sunk)}
.item .when{font-size:11.5px;color:var(--ink-3);margin-bottom:5px}
.item h4{font-size:14.5px;font-weight:600;line-height:1.3;letter-spacing:-.01em;margin-bottom:5px}
.item p{font-size:12.5px;color:var(--ink-2);line-height:1.45}
.item .tag{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--accent);
  font-weight:600;background:none;border:0;padding:0}

.note{padding:28px 16px;color:var(--ink-3);font-size:13px;text-align:center}
.load{display:inline-block;width:13px;height:13px;border:2px solid var(--rule);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;
  vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:1500px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1180px){
  .cols{grid-template-columns:minmax(0,1fr) 300px}
}
@media (max-width:900px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .side-r{position:static}
  .grid{grid-template-columns:minmax(0,1fr)}
  .secgrid{grid-template-columns:minmax(0,1fr)}
  .topband{grid-template-columns:minmax(0,1fr)}
  .lead{border-right:0;border-bottom:1px solid var(--rule-2)}
}

/* ---- mobile: headline lists, search first -------------------------------- */
@media (max-width:720px){
  .newshead h1{font-size:21px}
  .newshead{gap:10px}
  .headtools{flex-basis:100%;justify-content:stretch}
  .tsearch{width:100%}
  .lead{padding:14px}
  .lead h2{font-size:18.5px}
  .tlist a{padding:11px 14px}
  .seccard .srow{padding:10px 14px}

  .story{
    display:grid;grid-template-columns:minmax(0,1fr) 84px;
    gap:10px;align-items:start;padding:12px 0;
    border-bottom:1px solid var(--rule-2);border-radius:0;background:none;
  }
  .story .thumb{
    grid-column:2;grid-row:1 / span 3;width:84px;aspect-ratio:1/1;
    border-radius:7px;margin:0;
  }
  .story h2{grid-column:1;font-size:14.5px;line-height:1.35;font-weight:600}
  /* The summary is a second paragraph of the headline on a phone; the headline
     alone is what a list is scanned by. */
  .story p{display:none}
  .story .by{grid-column:1;font-size:11px;margin-top:5px}
}
</style>
</head>
<body>
<main>
  <div class="newshead">
    <div>
      <h1>News</h1>
      <div class="meta" id="news-meta">Loading…</div>
    </div>
    <div class="headtools">
      <div id="active-filter"></div>
      <form class="tsearch" id="tsearch">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none"
          stroke="currentColor" stroke-width="2"/><path d="M13.5 13.5 18 18" stroke="currentColor"
          stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" id="tq" placeholder="Search the news — a topic, a ticker, a company"
               autocomplete="off" aria-label="Search the news">
      </form>
    </div>
  </div>

  <div class="cols">
    <!-- centre ----------------------------------------------------------- -->
    <section>
      <nav class="secnav" id="secnav" hidden></nav>

      <div id="home">
        <div class="panel topband" id="topband" hidden></div>
        <div class="secgrid" id="sections"></div>
        <div class="panel secpage" id="secpage" hidden></div>
      </div>

      <h2 class="latest-h" id="latest-h" hidden>Results</h2>
      <div class="grid" id="stories" hidden><div class="note"><span class="load"></span></div></div>
      <button class="more" id="more" hidden>Show more</button>
    </section>

    <!-- right: market summary, then the live feed -------------------------- -->
    <aside class="side-r">
      <div class="panel">
        <h3>Market Summary</h3>
        <div class="seg" id="views">
          <button data-v="market_cap" aria-pressed="true">Mkt cap</button>
          <button data-v="gainers" aria-pressed="false">Gainers</button>
          <button data-v="losers" aria-pressed="false">Losers</button>
        </div>
        <div class="rows" id="rows"><div class="note"><span class="load"></span></div></div>
      </div>

      <div class="panel">
        <div class="feedhead"><span class="bolt">⚡</span><h3>The Feed</h3></div>
        <div class="feedwrap" id="feedwrap">
          <div class="feedtrack" id="feed"><div class="note"><span class="load"></span></div></div>
        </div>
      </div>
    </aside>
  </div>
</main>

<script>
"use strict";

const CFG = window.ALPHATICKER_CONFIG || window.LEDGER_CONFIG || {};
const HOSTED = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
// analytics.js loads first, in the head. The fallback is only so a missing one
// breaks analytics rather than the page.
const GA = window.TAnalytics || { track(){}, pageView(){} };

async function rpc(fn, args){
  if (!HOSTED) throw new Error("config.js is missing, so there is no data source");
  const r = await fetch(`${CFG.supabaseUrl}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { apikey: CFG.supabaseAnonKey, "Content-Type": "application/json" },
    body: JSON.stringify(args || {}),
  });
  if (!r.ok) throw new Error(`${fn} failed (${r.status})`);
  return r.json();
}

const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = v => v === null || v === undefined ? "—" : `${v>=0?"+":""}${v.toFixed(2)}%`;
const dir = v => v >= 0 ? "up" : "down";
const price = v => v === null || v === undefined ? "—"
  : v >= 1000 ? v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})
  : v.toFixed(2);

/** Relative time, because "2 hours ago" is what a reader wants from a feed. */
function ago(iso){
  if (!iso) return "";
  const then = new Date(iso.replace(" ", "T") + (/[Zz+]/.test(iso) ? "" : "Z"));
  const mins = Math.max(0, Math.round((Date.now() - then.getTime()) / 60000));
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} minute${mins === 1 ? "" : "s"} ago`;
  const h = Math.round(mins / 60);
  if (h < 24) return `${h} hour${h === 1 ? "" : "s"} ago`;
  const d = Math.round(h / 24);
  return `${d} day${d === 1 ? "" : "s"} ago`;
}
const agoShort = iso => ago(iso)
  .replace(/ minutes? ago/, "m").replace(/ hours? ago/, "h").replace(/ days? ago/, "d")
  .replace("just now", "now");

/** Hours since publication, for the recency decay in the ranking. */
function hoursOld(iso){
  if (!iso) return 999;
  const then = new Date(iso.replace(" ", "T") + (/[Zz+]/.test(iso) ? "" : "Z"));
  return Math.max(0, (Date.now() - then.getTime()) / 3600000);
}

const AVATAR = ["--accent","#eb6834","#1baf7a","#eda100","#e87ba4","#4a3aa7","#2a78d6","#e34948"];
const avatarColour = s => {
  let h = 0; for (const ch of s) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  const c = AVATAR[h % AVATAR.length];
  return c.startsWith("--") ? `var(${c})` : c;
};

const S = { view: "market_cap", q: null, label: null, page: 0, total: 0,
            offset: 0, loading: false,
            // Cross-page memory of headlines already shown, so a wire story
            // syndicated to four publishers appears once with a count instead
            // of four times; and the reader's own symbols, for the boost.
            seenKeys: null, mySyms: null,
            // The home page's working set: every deduped story of the batch,
            // the day's AI brief for seeding the top band, and which tab of
            // the front page is open ("top" or a section id).
            batch: [], brief: null, htab: "top" };
const PAGE = 12;          // a filtered search pages at this size
const HOME_PAGE = 60;     // get_news serves at most 60 a call; home fetches two

/* ---- relevance ----------------------------------------------------------
   The feed pulls plenty and fresh; what makes a front page is an editor. Two
   mechanical ones stand in. Near-duplicate headlines are collapsed to one
   story that remembers who else wrote it -- syndication is most of the
   sameness in a finance feed, and the number of publishers on a story is the
   most honest signal of how big it is. And stories naming a symbol the
   reader holds or watches are boosted, labelled with why.
   No model anywhere: a token key and a set lookup. */

/** Symbols this browser cares about: the portfolio's local mirror plus the
    watchlist cache. Both best-effort -- an empty set just means no boost. */
function mySymbols(){
  if (S.mySyms) return S.mySyms;
  const out = new Set();
  try {
    (JSON.parse(localStorage.getItem("alphaticker-portfolio") || "[]") || [])
      .forEach(t => { const s = String(t.symbol || "").toUpperCase();
                      if (s && s !== "CASH") out.add(s); });
  } catch {}
  try {
    const wl = JSON.parse(localStorage.getItem("alphaticker-watchlist") || "[]");
    (Array.isArray(wl) ? wl : (wl && wl.items) || []).forEach(x =>
      { const s = String((x && x.symbol) || x || "").toUpperCase(); if (s) out.add(s); });
  } catch {}
  S.mySyms = out;
  return out;
}

/** One key per story-as-written: significant title words, sorted, plus the
    symbol. Publishers reword syndicated copy lightly and suffix themselves
    ("— Reuters"), so token identity beats string identity. */
function newsKey(a){
  const toks = String(a.title || "").toLowerCase()
    .replace(/[-–—|:]\s*[a-z .]{3,24}$/, "")      // trailing "— publisher"
    .replace(/[^a-z0-9 ]+/g, " ")
    .split(/\s+/).filter(w => w.length >= 3);
  return `${a.symbol || ""}|${[...new Set(toks)].sort().slice(0, 10).join(" ")}`;
}

/** Dedupe against everything shown so far. The first copy of a story keeps
    the count and the other publishers' links, so the front page can say
    "11 more sources" and actually name them. */
function prepareBatch(arts, reset){
  if (reset || !S.seenKeys) S.seenKeys = new Map();
  const mine = mySymbols();
  const kept = [];
  for (const a of arts) {
    const k = newsKey(a);
    const first = S.seenKeys.get(k);
    if (first) {
      first._dupes = (first._dupes || 0) + 1;
      if ((first._alts = first._alts || []).length < 6 && a.url &&
          a.publisher !== first.publisher) {
        first._alts.push({ url: a.url, publisher: a.publisher, title: a.title,
                           image: a.image, summary: a.summary });
      }
      continue;
    }
    a._dupes = 0;
    a._alts = [];
    if (a.symbol && mine.has(String(a.symbol).toUpperCase())) a._mine = true;
    S.seenKeys.set(k, a);
    kept.push(a);
  }
  return kept;
}

/* ---- ranking and sections ------------------------------------------------
   score = (1 + publishers also writing it) decayed by age. The day's Today's
   Brief -- an AI-ranked top five written each weekday morning for the market
   page -- seeds the top band: a story it mentions is a story an editor
   already chose. */
/** Which of the brief's insights a story matches -- 0 is the editor's top
    pick -- or null. Order matters: the seed below sorts by it. */
function briefRank(a){
  const b = S.brief;
  if (!b) return null;
  const t = ` ${String(a.title || "").toLowerCase()} `;
  for (let i = 0; i < b.ins.length; i++) {
    const ins = b.ins[i];
    if (a.symbol && ins.syms.has(String(a.symbol).toUpperCase())) return i;
    let hit = 0;
    for (const w of ins.toks) if (t.includes(` ${w} `)) hit++;
    if (hit >= 3) return i;
  }
  return null;
}
const briefMatch = a => briefRank(a) !== null;

/* On the real wire, near-identical titles measure syndication, not
   importance: a "So-and-so Bank Increases Holdings in NVDA" filing note is
   reworded fifteen times by the aggregator mills, while Bloomberg, Reuters
   and the Times each write their own headline for the story that actually
   moves markets -- so raw cluster size ranks the filing note first. Three
   correctives, no model anywhere:

     - filing-note and listicle patterns, and the mills that churn them, are
       marked down hard;
     - the majors are marked up a little;
     - stories that share a salient word with many *different* stories today
       ("tariff", "canada") get a theme boost -- the day's big story is a
       theme across headlines, even when no two headlines match. */
const JUNK_RE = new RegExp([
  /\b13f\b/, /holdings? (in|of)\b/, /(stake|position) in\b/,
  /(boosts?|trims?|raises?|lowers?|cuts?|increases?|decreases?|acquires?|buys?|sells?) (its )?(stake|position|holdings?|shares)/,
  /shares (bought|sold|acquired|purchased) by/,
  /price target/, /\bpt\b (raised|lowered)/,
  /why .{0,45}(stock|shares) (is|are|rose|fell|jumped|plunged|moved|soar|sank)/,
  /stocks? to (buy|watch|own|sell)/, /\b(top|best) \d+\b/,
  /should you buy/, /prediction/, /\bvs\.?\b.{0,30}which/,
].map(r => r.source).join("|"), "i");

const MILL_RE = /marketbeat|zacks|motley ?fool|fool\.com|etf daily|insider monkey|benzinga|simply wall|gurufocus|24\/7 wall|investorplace|stocknews|tipranks|thestreet/i;
const MAJOR_RE = /bloomberg|reuters|wall street journal|\bwsj\b|financial times|\bft\b|cnbc|associated press|ap news|new york times|barron|the economist|axios|semafor|politico|washington post/i;

const isJunk  = a => JUNK_RE.test(a.title || "") || MILL_RE.test(a.publisher || "");
const isMajor = a => MAJOR_RE.test(a.publisher || "");

/* How many distinct stories share each salient title word today. Recomputed
   when the batch changes; a Map lookup afterwards. */
const THEME_STOP = new Set(("the a an and or to of in on for as at by with from after " +
  "before into over under amid says say said its his her their this that these those " +
  "is are was were be been has have had will would could should may might can new news " +
  "stock stocks shares share market markets inc corp company companies group report " +
  "reports today week year years quarter billion million percent price prices trading " +
  "investors wall street what when where which who why how more most up down here your " +
  "you not now just still first last big top best does about than analyst analysts " +
  "earnings buy sell hold rating").split(" "));
function themeTokens(a){
  return [...new Set(String(a.title || "").toLowerCase()
    .replace(/'s\b/g, "").replace(/[^a-z ]+/g, " ").split(/\s+/)
    // The crudest stemmer that works: tariffs and tariff are one subject.
    .map(w => w.length > 4 && w.endsWith("s") ? w.slice(0, -1) : w)
    .filter(w => w.length >= 4 && !THEME_STOP.has(w)))];
}
function buildThemes(){
  const df = new Map();
  for (const a of S.batch)
    for (const w of themeTokens(a)) df.set(w, (df.get(w) || 0) + 1);
  S.themeDf = df;
}
function themeBoost(a){
  if (!S.themeDf) return 1;
  let peak = 0;
  for (const w of themeTokens(a)) peak = Math.max(peak, S.themeDf.get(w) || 0);
  // Four distinct stories on one subject is a theme; the boost grows slowly
  // and stops at about double so no single word can own the page.
  return peak < 4 ? 1 : 1 + Math.min(0.9, Math.log2(peak) / 4);
}

function storyScore(a){
  let s = (1 + (a._dupes || 0)) * Math.exp(-hoursOld(a.published) / 18);
  s *= themeBoost(a);
  if (isJunk(a)) s *= 0.25;
  else if (isMajor(a)) s *= 1.25;
  // Macro stories -- no ticker, classified policy/fed/commodities -- are the
  // ones that move the whole tape; the tape is what this site is about.
  if (!a.symbol) {
    const sec = classify(a);
    if (sec === "policy" || sec === "fed" || sec === "commodities") s *= 1.2;
  }
  if (briefMatch(a)) s *= 1.6;
  if (a._mine) s *= 1.3;
  return s;
}

/* What lands where. Order is precedence: a tariff story naming NVDA is
   policy first, company second. The rules are the same subjects the topic
   chips used to search for, applied to title + summary. */
const SECTIONS = [
  { id: "policy", name: "Policy & Politics",
    re: /tariff|sanction|geopolit|\bwar\b|congress|senate|white house|election|antitrust|regulat|supreme court/i },
  { id: "fed", name: "Fed & Economy",
    re: /\bfed\b|fomc|inflation|interest rate|rate (cut|hike)|jobs report|payroll|unemployment|recession|treasur|yield|\bcpi\b|\bgdp\b|central bank/i },
  { id: "commodities", name: "Commodities & Crypto",
    re: /\boil\b|crude|opec|\bgold\b|silver price|copper|natural gas|bitcoin|crypto|ethereum|\bbtc\b/i },
  { id: "tech", name: "Tech & AI",
    re: /artificial intelligence|\ba\.?i\b|semiconductor|\bchips?\b|data ?center|cloud|software|robot/i },
  { id: "companies", name: "Companies & Earnings",
    re: /earnings|guidance|acquisition|merger|\bipo\b|buyback|dividend|analyst|upgrade|downgrade|forecast/i,
    symbolCounts: true },
];

function classify(a){
  const text = `${a.title || ""} ${a.summary || ""}`;
  for (const s of SECTIONS) {
    if (s.re.test(text)) return s.id;
    if (s.symbolCounts && a.symbol) return s.id;
  }
  return null;
}

/* ---- home: top stories, sections, then the wire -------------------------- */
const srcCount = a => a._dupes
  ? `<span class="srcs">${a._dupes + 1} sources</span>` : "";

function byline(a, extra){
  return `<span class="by">
    ${a.symbol ? `<span class="tag">${esc(a.symbol)}</span>` : ""}
    ${a._mine ? `<span class="tag" style="background:var(--up-soft,#e3f4ec);color:var(--up,#0b7a4b)">yours</span>` : ""}
    <span>${esc(a.publisher || "")}</span><span>·</span><span>${esc(ago(a.published))}</span>
    ${extra ? `<span>·</span>${extra}` : ""}</span>`;
}

/** The copy of a cluster worth showing: a major's headline and photograph
    over a mill's, and any image over none. The dedup kept whichever copy
    arrived first, which on the wire is usually the mill -- so the picture
    looked random because it was a filing-note's stock photo. The copies not
    chosen become the "more sources" list. */
function bestCopy(a){
  const cands = [
    { url: a.url, title: a.title, publisher: a.publisher,
      image: a.image, summary: a.summary },
    ...(a._alts || []),
  ];
  let best = cands[0], bestScore = -1;
  for (const c of cands) {
    const sc = (MAJOR_RE.test(c.publisher || "") ? 2 : 0)
             + (MILL_RE.test(c.publisher || "") ? -2 : 0)
             + (c.image ? 1 : 0);
    if (sc > bestScore) { best = c; bestScore = sc; }
  }
  return { ...best, others: cands.filter(c => c !== best) };
}

function renderTopband(top){
  const host = document.getElementById("topband");
  if (!top.length){ host.hidden = true; return; }
  const [lead, ...rest] = top;
  const v = bestCopy(lead);
  const alts = v.others.slice(0, 6).map(x =>
    `<a href="${esc(x.url)}" target="_blank" rel="noopener" data-ta-news="news_top"
       ${lead.symbol ? `data-ta-ticker="${esc(lead.symbol)}"` : ""}><b>${esc(x.publisher || "…")}</b>${esc(x.title)}</a>`).join("");
  host.innerHTML = `
    <div class="bandhead">
      <h3>Top Stories</h3>
      <span class="why">the day's brief, and what most publishers are writing</span>
    </div>
    <div>
      <a class="lead" href="${esc(v.url)}" target="_blank" rel="noopener"
         data-ta-news="news_top"${lead.symbol ? ` data-ta-ticker="${esc(lead.symbol)}"` : ""}>
        ${v.image ? `<span class="thumb"><img src="${esc(v.image)}" alt="" loading="lazy"
            onerror="this.parentNode.style.display='none'"></span>` : ""}
        <h2>${esc(v.title)}</h2>
        <p>${esc(v.summary || lead.summary || "")}</p>
        ${byline({ ...lead, publisher: v.publisher }, srcCount(lead) && !alts ? srcCount(lead) : "")}
      </a>
      ${alts ? `<div style="padding:0 18px 16px"><details class="alts">
        <summary>${srcCount(lead)}</summary>
        <div class="altlist">${alts}</div>
      </details></div>` : ""}
    </div>
    <div class="tlist">${rest.map(a => { const c = bestCopy(a); return `
      <a href="${esc(c.url)}" target="_blank" rel="noopener"
         data-ta-news="news_top"${a.symbol ? ` data-ta-ticker="${esc(a.symbol)}"` : ""}>
        <h4>${esc(c.title)}</h4>
        ${byline({ ...a, publisher: c.publisher }, srcCount(a))}
      </a>`; }).join("")}</div>`;
  host.hidden = false;
}

function sectionRow(a){
  return `<a class="srow" href="${esc(a.url)}" target="_blank" rel="noopener"
      data-ta-news="news_section"${a.symbol ? ` data-ta-ticker="${esc(a.symbol)}"` : ""}>
    <div>
      <h4>${esc(a.title)}</h4>
      ${byline(a, srcCount(a))}
    </div>
    ${a.image ? `<span class="thumb"><img src="${esc(a.image)}" alt="" loading="lazy"
        onerror="this.parentNode.style.display='none'"></span>` : ""}
  </a>`;
}

function renderHome(){
  const topband = document.getElementById("topband");
  const sections = document.getElementById("sections");
  const nav = document.getElementById("secnav");
  if (!S.batch.length){
    topband.hidden = true; nav.hidden = true;
    sections.innerHTML = `<div class="note" style="grid-column:1/-1">No stories yet.</div>`;
    return;
  }

  buildThemes();
  const ranked = [...S.batch].sort((x, y) => storyScore(y) - storyScore(x));

  // The band seats the day's brief first -- those stories were chosen by an
  // editor, not a counter -- then fills by score. Filing notes and listicles
  // never lead the page, whatever their syndication count.
  const seed = ranked.filter(a => !isJunk(a) && briefMatch(a))
    .sort((x, y) => briefRank(x) - briefRank(y)).slice(0, 3);
  const top = [...seed];
  for (const a of ranked) {
    if (top.length >= 5) break;
    if (!top.includes(a) && !isJunk(a)) top.push(a);
  }
  // A wire hour that is nothing but filing notes still gets a front page.
  if (!top.length && ranked.length) top.push(ranked[0]);

  // The lead wants an image; swap one into the front if the highest-ranked
  // story has none but a near peer does.
  if (top.length && !bestCopy(top[0]).image) {
    const i = top.findIndex(a => bestCopy(a).image);
    if (i > 0) top.unshift(...top.splice(i, 1));
  }
  renderTopband(top);
  if (S.htab !== "top") document.getElementById("topband").hidden = true;
  const used = new Set(top.map(a => a.url));

  // Sections draw from everything the top band did not take, best first, and
  // a section that cannot fill three rows does not print a heading over two.
  const bySec = new Map(SECTIONS.map(s => [s.id, []]));
  const mine = [];
  for (const a of ranked) {
    if (used.has(a.url)) continue;
    if (a._mine && mine.length < 12) mine.push(a);
    const sec = classify(a);
    if (sec) bySec.get(sec).push(a);
  }

  const cards = [];
  const inMine = new Set();
  if (mine.length >= 3) {
    cards.push({ id: "foryou", name: "For You",
      small: "— your holdings and watchlist", rows: mine });
    mine.forEach(a => inMine.add(a.url));
  }
  for (const s of SECTIONS) {
    const rows = bySec.get(s.id).filter(a => !inMine.has(a.url));
    if (rows.length >= 3) cards.push({ id: s.id, name: s.name, rows });
  }

  // The nav is tabs now, not anchors: a section opens as a page of its own,
  // the way Top Stories does, rather than a scroll position. A tab that no
  // longer exists after a refetch falls back to the front.
  const secpage = document.getElementById("secpage");
  if (S.htab !== "top" && !cards.some(c => c.id === S.htab)) S.htab = "top";
  const onTop = S.htab === "top";

  sections.innerHTML = onTop ? cards.map(c => `
    <div class="panel seccard" id="sec-${c.id}">
      <div class="shead">
        <h3>${esc(c.name)} ${c.small ? `<small>${esc(c.small)}</small>` : ""}</h3>
        ${c.rows.length > 5 ? `<button type="button" data-tab="${c.id}">More →</button>` : ""}
      </div>
      ${c.rows.slice(0, 5).map(sectionRow).join("")}
    </div>`).join("") : "";

  sections.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
    S.htab = b.dataset.tab;
    renderHome();
    scrollTo({ top: 0, behavior: "auto" });
  });

  /* One section, the whole of it: full-width rows in the reading order the
     ranking chose, each with the article's own photograph when it has one. */
  const active = cards.find(c => c.id === S.htab);
  secpage.hidden = onTop || !active;
  secpage.innerHTML = !onTop && active ? active.rows.slice(0, 40).map(a => {
    const c = bestCopy(a);
    return `<a class="secrow${c.image ? "" : " noimg"}" href="${esc(c.url)}"
       target="_blank" rel="noopener" data-ta-news="news_section"${
       a.symbol ? ` data-ta-ticker="${esc(a.symbol)}"` : ""}>
      <span>
        <span class="pub">${esc(c.publisher || "")}</span>
        <h3>${esc(c.title)}</h3>
        ${c.summary || a.summary ? `<p>${esc(c.summary || a.summary)}</p>` : ""}
        ${byline(a, srcCount(a))}
      </span>
      ${c.image ? `<span class="thumb"><img src="${esc(c.image)}" alt="" loading="lazy"
          onerror="this.closest('.secrow').classList.add('noimg');this.parentNode.remove()"></span>` : ""}
    </a>`;
  }).join("") : "";

  const tabs = [["top", "Top Stories"], ...cards.map(c => [c.id, c.name])];
  nav.innerHTML = tabs.map(([id, label]) =>
    `<a data-tab="${id}" class="${id === S.htab ? "on" : ""}">${esc(label)}</a>`).join("");
  nav.hidden = false;
  nav.querySelectorAll("a").forEach(a => a.onclick = () => {
    if (S.htab === a.dataset.tab) return;
    S.htab = a.dataset.tab;
    renderHome();
    scrollTo({ top: 0, behavior: "auto" });
  });
}

/* ---- the wire ------------------------------------------------------------ */
function storyCard(a){
  return `<a class="story" href="${esc(a.url)}" target="_blank" rel="noopener"
    data-ta-news="news_feed"${a.symbol ? ` data-ta-ticker="${esc(a.symbol)}"` : ""}>
    ${a.image ? `<span class="thumb"><img src="${esc(a.image)}" alt="" loading="lazy"
        onerror="this.parentNode.style.display='none'"></span>` : ""}
    <h2>${esc(a.title)}</h2>
    <p>${esc(a.summary || "")}</p>
    ${byline(a, a._dupes ? `<span>${a._dupes} more source${a._dupes === 1 ? "" : "s"}</span>` : "")}
  </a>`;
}

function setMeta(newest){
  document.getElementById("news-meta").textContent =
    `${S.total.toLocaleString()} stories${newest ? ` · newest ${ago(newest)}` : ""}`;
}

/* ---- home load: two pages of the wire, and the day's brief --------------- */
async function loadHome(){
  const host = document.getElementById("sections");
  host.innerHTML = `<div class="note" style="grid-column:1/-1"><span class="load"></span></div>`;
  S.loading = true;

  // The brief seeds the ranking but must never block or break it.
  const briefP = rpc("get_market_brief", {}).then(b => {
    const ins = (b && b.insights) || [];
    if (!ins.length) return;
    // Kept insight by insight, in rank order: the brief is an editor's list,
    // and its #1 should lead the page over its #2 whatever the counters say.
    S.brief = { ins: ins.map(i => ({
      syms: new Set((i.symbols || []).map(s => String(s).toUpperCase())),
      toks: String(i.headline || "").toLowerCase()
        .replace(/[^a-z0-9 ]+/g, " ").split(/\s+/).filter(w => w.length >= 4),
    })) };
  }).catch(() => {});

  let pages = [];
  try {
    pages = await Promise.all([
      rpc("get_news", { p_q: null, p_limit: HOME_PAGE, p_offset: 0 }),
      rpc("get_news", { p_q: null, p_limit: HOME_PAGE, p_offset: HOME_PAGE })
        .catch(() => null),
    ]);
  } catch (e) {
    // get_news down entirely: the feed RPC still knows the last two days.
    try {
      const feed = await rpc("get_news_feed", { p_hours: 48, p_limit: 60 }) || [];
      pages = [{ articles: feed, total: feed.length,
                 newest: feed[0] && feed[0].published }];
    } catch {
      host.innerHTML = `<div class="note">News unavailable: ${esc(e.message)}</div>`;
      S.loading = false;
      return;
    }
  }
  await briefP;

  const arts = pages.filter(Boolean).flatMap(p => (p && p.articles) || []);
  S.total = (pages[0] && pages[0].total) || arts.length;
  // The tail resumes where the fetched pages actually ended, so a failed
  // second page is retried by "Show more" rather than silently skipped.
  S.offset = HOME_PAGE * pages.filter(Boolean).length;
  S.batch = prepareBatch(arts, true);
  S.loading = false;

  renderHome();
  setMeta(pages[0] && pages[0].newest);
}

/* ---- filtered mode: search or a ticker collapses to the flat list -------- */
async function loadNews(reset){
  if (reset) S.page = 0;
  const host = document.getElementById("stories");
  if (reset) host.innerHTML = `<div class="note"><span class="load"></span></div>`;

  let d;
  S.loading = true;
  try {
    d = await rpc("get_news", { p_q: S.q, p_limit: PAGE, p_offset: S.page * PAGE });
  } catch (e) {
    // get_news used to time out recounting every topic chip. Until that
    // migration is applied, still show the day's stories from the feed RPC
    // rather than leaving the centre column on an error.
    try {
      const feed = await rpc("get_news_feed", { p_hours: 168, p_limit: PAGE }) || [];
      const q = (S.q || "").toLowerCase();
      const arts = !q ? feed : feed.filter(a =>
        (a.symbol && a.symbol.toLowerCase() === q) ||
        (a.title && a.title.toLowerCase().includes(q)) ||
        (a.summary && a.summary.toLowerCase().includes(q)));
      d = { articles: arts, total: arts.length, newest: arts[0] && arts[0].published };
    } catch {
      host.innerHTML = `<div class="note">News unavailable: ${esc(e.message)}</div>`;
      S.loading = false;
      return;
    }
  }
  const arts = prepareBatch((d && d.articles) || [], reset);
  S.total = (d && d.total) || 0;

  if (reset && !arts.length){
    host.innerHTML = `<div class="note">Nothing matches ${S.q ? `“${esc(S.q)}”` : "this filter"} yet.</div>`;
  } else {
    const html = arts.map(storyCard).join("");
    if (reset) host.innerHTML = html; else host.insertAdjacentHTML("beforeend", html);
  }

  setMeta(d && d.newest);
  const shown = (S.page + 1) * PAGE;
  document.getElementById("more").hidden = shown >= S.total;
  S.loading = false;
}

/** One switch between the front page and the filtered list. Searching hides
    the top band and the sections -- a filter is a question, and the answer
    is the matching stories, not the day's layout around them. */
function setFilter(query, label){
  S.q = query || null;
  S.label = S.q ? (label || query) : null;
  document.getElementById("active-filter").innerHTML = S.q
    ? `<span class="chip-active">${esc(S.label)}<button id="clear" aria-label="Clear filter">×</button></span>`
    : "";
  const c = document.getElementById("clear");
  if (c) c.onclick = () => setFilter(null);
  const tq = document.getElementById("tq");
  if (tq && tq.value.trim() !== (S.q || "")) tq.value = "";

  document.getElementById("home").hidden = !!S.q;
  document.getElementById("secnav").hidden = !!S.q || !S.batch.length;
  document.getElementById("latest-h").hidden = !S.q;
  document.getElementById("stories").hidden = !S.q;
  if (!S.q) document.getElementById("more").hidden = true;

  if (S.q) loadNews(true);
  else if (S.batch.length) renderHome();
  else loadHome();
  scrollTo({ top: 0, behavior: "smooth" });
}

/* ---- right rail: market summary ------------------------------------------ */
async function setView(v){
  S.view = v;
  document.querySelectorAll("#views button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.v === v));
  const host = document.getElementById("rows");
  host.innerHTML = `<div class="note"><span class="load"></span></div>`;
  let rows = [];
  // Twenty fetched, eight visible: the cap is on the panel's height, not on
  // the data, so the rest are a scroll away rather than absent.
  try { rows = await rpc("get_market_summary", { p_view: v, p_limit: 20 }) || []; } catch {}
  if (!rows.length){ host.innerHTML = `<div class="note">No data.</div>`; return; }
  host.innerHTML = `<table><thead><tr><th>Token</th><th>Price</th><th>Change</th></tr></thead>
    <tbody>${rows.map(r => `
      <tr data-s="${esc(r.symbol)}">
        <td><span class="sym"><span class="dot" data-logo="${esc(r.symbol)}" style="background:${avatarColour(r.symbol)}">${esc(r.symbol.slice(0,2))}</span>${esc(r.symbol)}</span></td>
        <td>${esc(price(r.price))}</td>
        <td><span class="pill ${dir(r.changePct)}">${esc(pct(r.changePct))}</span></td>
      </tr>`).join("")}</tbody></table>`;
  if (window.TickerLogos) {
    window.TickerLogos.hydrate(rows.map(r => r.symbol), host);
  }
  // Clicking a row filters the news to that company -- the whole reason the
  // list sits beside the stories rather than on its own page.
  host.querySelectorAll("tr[data-s]").forEach(tr =>
    tr.onclick = () => setFilter(tr.dataset.s));
}

/* ---- right rail: the scrolling feed -------------------------------------- */
async function loadFeed(){
  const host = document.getElementById("feed");
  let rows = [];
  try { rows = await rpc("get_news_feed", { p_hours: 24, p_limit: 30 }) || []; } catch {}
  if (!rows.length){ host.innerHTML = `<div class="note">No stories in the last 24 hours.</div>`; return; }

  const item = a => `<a class="item" href="${esc(a.url)}" target="_blank" rel="noopener"
      data-ta-news="news_feed"${a.symbol ? ` data-ta-ticker="${esc(a.symbol)}"` : ""}>
      <div class="when">${esc(ago(a.published))}${a.symbol ? ` · <span class="tag">${esc(a.symbol)}</span>` : ""}</div>
      <h4>${esc(a.title)}</h4>
      <p>${esc(a.summary || "")}</p></a>`;

  // Rendered twice. The drift below wraps by exactly one copy's height in
  // either direction, so the reader can scroll backwards past the start and
  // keep finding stories instead of hitting a wall.
  host.innerHTML = `<div id="feed-a">${rows.map(item).join("")}</div>` +
                   `<div aria-hidden="true">${rows.map(item).join("")}</div>`;

  requestAnimationFrame(() => startFeedDrift());
}

/** Auto-scroll the feed, yielding to the reader whenever they take hold. */
function startFeedDrift(){
  const wrap = document.getElementById("feedwrap");
  const copy = document.getElementById("feed-a");
  if (!wrap || !copy) return;

  const h = () => copy.offsetHeight;
  let held = 0;                       // timestamp until which the reader has it
  let last = 0;
  let pos = 1;                        // kept as a float; scrollTop may round
  const SPEED = 22;                   // px a second — slow enough to read
  const HOLD = 1200;                  // ms of quiet before the drift resumes

  // Only an actual scroll gesture takes hold. Hovering must not: the drift
  // moves content under a resting cursor, which fires pointermove, which
  // would renew the hold forever and stop the feed for good.
  const hold = () => { held = Date.now() + HOLD; pos = wrap.scrollTop; };
  ["wheel", "touchstart", "touchmove", "pointerdown", "keydown"].forEach(e =>
    wrap.addEventListener(e, hold, { passive: true }));

  function frame(now){
    requestAnimationFrame(frame);
    const dt = last ? Math.min(100, now - last) : 0;
    last = now;
    const one = h();
    if (!one) return;

    // While the reader is driving, follow them. Otherwise advance our own
    // float — a frame's worth of drift is a fraction of a pixel, so keeping
    // the position outside scrollTop is what makes it move at all.
    if (Date.now() < held) pos = wrap.scrollTop;
    else pos += SPEED * dt / 1000;

    // Wrap in both directions, so scrolling up past the top lands on the
    // second copy rather than stopping.
    if (pos >= one * 2 - wrap.clientHeight) pos -= one;
    else if (pos < 1) pos += one;

    if (Math.abs(wrap.scrollTop - pos) > 0.01) wrap.scrollTop = pos;
  }
  wrap.scrollTop = pos;
  requestAnimationFrame(frame);
}

/* ---- boot ---------------------------------------------------------------- */
(async function boot(){
  if (!HOSTED){
    document.getElementById("stories").innerHTML =
      `<div class="note">config.js is missing, so this page has no data source.</div>`;
    return;
  }
  // Wired here rather than inside setView, which also runs on boot: a view the
  // visitor never chose is not a screener they ran.
  document.querySelectorAll("#views button").forEach(b => b.onclick = () => {
    GA.track("run_screener", { screener_name: b.dataset.v });
    setView(b.dataset.v);
  });

  // A ticker in the URL pre-filters, so a company page can link straight to
  // "news about this company".
  const t = new URLSearchParams(location.search).get("t");
  if (t) S.q = t.toUpperCase();

  if (S.q) setFilter(S.q);
  else loadHome();
  setView("market_cap");
  loadFeed();

  // Free-text search, on the same filter the summary rows use.
  const tq = document.getElementById("tq");
  let typing = null;
  // Reported where the filter is actually applied, so a search is one event
  // per question asked rather than one per keystroke.
  const searched = term => {
    if (term) GA.track("search", { search_term: term });
    setFilter(term || null);
  };
  document.getElementById("tsearch").onsubmit = e => {
    e.preventDefault();
    clearTimeout(typing);
    searched(tq.value.trim());
  };
  tq.addEventListener("input", () => {
    clearTimeout(typing);
    typing = setTimeout(() => searched(tq.value.trim()), 350);
  });

  const more = document.getElementById("more");
  more.onclick = () => { if (S.q) { S.page++; loadNews(false); } };

  // Reaching the bottom of the results is the same intent as pressing the
  // button, so don't make them press it. Search results only -- the front
  // page's tabs are each a bounded read.
  addEventListener("scroll", () => {
    if (!S.q || S.loading || more.hidden) return;
    if (scrollY + innerHeight < document.body.scrollHeight - 480) return;
    S.page++;
    loadNews(false);
  }, { passive: true });
})();
</script>
