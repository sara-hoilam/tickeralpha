/* ---- 3. monthly seasonality ---------------------------------------------- */
// One hue each way, shaded continuously by size: pale for a quiet month, deep
// for a violent one. Running it the other way round buried the ordinary months
// under the darkest fills and made the grid read heavier than the data is.
//
// A ramp that reaches from near-white to near-black cannot carry a single text
// colour, so every cell picks the one it can actually be read in.
// Every ramp stops in the light half of the range. Running on into the dark
// half would cross the band where neither black nor white reaches 4.5:1 on
// the fill -- the deep ends measured 4.1:1, and no choice of ink fixes a
// background sitting at that luminance.
const SEASON_RAMP = {
  up:   [[0xdd, 0xf3, 0xe4], [0x3f, 0xa7, 0x6e]],
  down: [[0xfb, 0xe2, 0xdf], [0xe2, 0x63, 0x59]],
  // How often a month closes positive is a different quantity from a return,
  // so it gets its own hue rather than a third shade of green.
  // Lemon, from white to fully saturated. Yellow occupies a narrow band of
  // lightness, so a ramp between two yellows has little to separate its ends;
  // starting at white and driving blue to zero roughly doubles the range the
  // row can use while keeping the hue where it should be.
  pos:  [[0xff, 0xff, 0xff], [0xd9, 0xb7, 0x00]],
};

const mixRamp = (ramp, t) => {
  const [from, to] = ramp;
  const at = i => Math.round(from[i] + (to[i] - from[i]) * Math.min(1, Math.max(0, t)));
  return [at(0), at(1), at(2)];
};

const INK_DARK = "#14181d", INK_LIGHT = "#f8fafc";

function luminance(rgb){
  const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
  return 0.2126 * lin(rgb[0]) + 0.7152 * lin(rgb[1]) + 0.0722 * lin(rgb[2]);
}

/** Whichever ink actually contrasts better against this fill.
    Choosing on a fixed luminance threshold instead put white on mid-tone
    greens where black was three times more legible -- 2:1 where the standard
    asks for 4.5:1. Comparing the two ratios cannot make that mistake. */
function inkOn(rgb){
  const L = luminance(rgb);
  const withLight = (1.05) / (L + 0.05);
  const withDark = (L + 0.05) / (luminance([20, 24, 29]) + 0.05);
  return withDark >= withLight ? INK_DARK : INK_LIGHT;
}

const swatch = (ramp, t) => {
  const rgb = mixRamp(ramp, t);
  return `background:rgb(${rgb.join(",")});color:${inkOn(rgb)}`;
};

// Saturating at 12% keeps one extraordinary month from flattening the rest.
const seasonStyle = v => swatch(SEASON_RAMP[v >= 0 ? "up" : "down"], Math.abs(v) / 12);
// A hit rate never approaches 0% or 100% in practice -- these sit between
// roughly a quarter and three quarters -- so mapping the raw percentage onto
// the ramp would spend it all in the middle and look flat. Stretching the
// realistic band across the whole ramp is what makes the row readable.
const positiveStyle = pct => swatch(SEASON_RAMP.pos, (pct - 20) / 60);


function drawSeasonality(){
  const host = document.getElementById("season-grid");
  const m = EXTRA.data.monthly || [];
  if (m.length < 13) { host.innerHTML = `<div class="note">Needs a year of history.</div>`; return; }

  // Month-on-month total return from consecutive month-end closes.
  const ret = {};
  for (let i = 1; i < m.length; i++) {
    const prev = m[i - 1].c, cur = m[i].c;
    if (!prev) continue;
    const [y, mo] = m[i].d.split("-");
    (ret[y] = ret[y] || {})[+mo] = (cur / prev - 1) * 100;
  }
  const years = Object.keys(ret).sort((a, b) => b - a).slice(0, 11);
  const mobile = matchMedia("(max-width:720px)").matches;
  const MON = mobile
    ? ["J","F","M","A","M","J","J","A","S","O","N","D"]
    : ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const avgLab = mobile ? "Avg" : "Average";
  const hitLab = mobile ? "Hit %" : "Positive return";

  const cell = v => v === undefined || v === null
    ? `<td class="sc empty"></td>`
    : `<td class="sc" style="${seasonStyle(v)}">${v >= 0 ? "+" : ""}${v.toFixed(1)}%</td>`;

  const avg = mo => {
    const vs = years.map(y => ret[y][mo]).filter(v => v !== undefined);
    return vs.length ? vs.reduce((a, v) => a + v, 0) / vs.length : null;
  };
  const green = mo => {
    const vs = years.map(y => ret[y][mo]).filter(v => v !== undefined);
    return vs.length ? vs.filter(v => v >= 0).length / vs.length * 100 : null;
  };

  host.innerHTML = `<table class="season">
    <thead><tr><th>${mobile ? "" : "Year"}</th>${MON.map(x => `<th>${x}</th>`).join("")}</tr></thead>
    <tbody>${years.map(y =>
      `<tr><th>${mobile ? String(y).slice(2) : y}</th>${MON.map((_, i) => cell(ret[y][i + 1])).join("")}</tr>`).join("")}
    </tbody>
    <tfoot>
      <tr><th>${avgLab}</th>${MON.map((_, i) => {
        const v = avg(i + 1);
        return `<td class="sf">${v === null ? "" : (v >= 0 ? "+" : "") + v.toFixed(1) + "%"}</td>`;
      }).join("")}</tr>
      <tr><th>${hitLab}</th>${MON.map((_, i) => {
        const v = green(i + 1);
        return v === null ? `<td class="sf"></td>`
          : `<td class="sf tint" style="${positiveStyle(v)}">${v.toFixed(0)}%</td>`;
      }).join("")}</tr>
    </tfoot></table>`;
}


/* ===========================================================================
   Watchlist

   A visitor can build one before signing in -- asking for an account first is
   how a feature never gets tried. It lives in the browser until they sign in,
   and merges into the account then, so nothing they did is lost.
=========================================================================== */
const WATCH_KEY = "alphaticker-watchlist";

const localWatch = {
  read(){ try { return JSON.parse(localStorage.getItem(WATCH_KEY) || "[]"); } catch { return []; } },
  write(list){ try { localStorage.setItem(WATCH_KEY, JSON.stringify([...new Set(list)])); } catch {} },
  has(sym){ return this.read().includes(sym); },
  toggle(sym){
    const l = this.read();
    const i = l.indexOf(sym);
    if (i >= 0) l.splice(i, 1); else l.push(sym);
    this.write(l);
    return i < 0;                        // true when it was added
  },
  clear(){ try { localStorage.removeItem(WATCH_KEY); } catch {} },
};

const signedIn = () => !!(window.TA && window.TA.signedIn());

/** Add or remove, wherever this visitor's list lives. `source` says which
    part of the page the star was on; see analytics.js for the vocabulary. */
async function toggleWatch(symbol, source){
  const sym = String(symbol || "").toUpperCase();
  if (!sym) return false;
  const report = watching => {
    GA.track(watching ? "add_to_watchlist" : "remove_from_watchlist", { ticker: sym, source });
    if (window.posthog) window.posthog.capture(
      watching ? "watchlist_ticker_added" : "watchlist_ticker_removed",
      { ticker: sym, source });
  };
  // Following a company is a gate: the ask comes before the save, not after
  // it. See the note on the same branch in landing.html.
  if (!signedIn()) {
    GA.track("gate_view", { gate: "watchlist", ticker: sym, source });
    if (window.TA?.showSignupModal) window.TA.showSignupModal({ reason: "watchlist" });
    return false;
  }
  try {
    const d = await rpc("toggle_watchlist", { p_symbol: sym });
    const w = !!(d && d.watching);
    report(w);
    dispatchEvent(new CustomEvent("watchchange", { detail: { symbol: sym, watching: w } }));
    return w;
  } catch { return false; }
}

/** The symbols on this visitor's list, from wherever it lives. */
async function watchSymbols(){
  if (!signedIn()) return localWatch.read();
  try {
    const d = await rpc("get_watchlist");
    return ((d && d.items) || []).map(i => i.symbol);
  } catch { return []; }
}

/** On sign-in, hand the browser's list to the account and forget the copy. */
async function mergeLocalWatchlist(){
  const local = localWatch.read();
  if (!local.length || !signedIn()) return 0;
  try {
    const d = await rpc("merge_watchlist", { p_symbols: local });
    if (d && !d.error) { localWatch.clear(); return d.added || 0; }
  } catch {}
  return 0;
}

/** The star beside the company name: on for a company already watched, with
    how many people watch it, and it works before signing in. */
async function wireStar(){
  const el = document.getElementById("wstar");
  if (!el) return;
  const sym = el.dataset.sym;

  const paint = (watching, n) => {
    el.setAttribute("aria-pressed", String(!!watching));
    el.classList.toggle("on", !!watching);
    el.querySelector(".wstar-i").textContent = watching ? "★" : "☆";
    el.querySelector(".wstar-n").textContent = n ? compact(n) : "";
    el.title = watching ? `Remove ${sym} from your watchlist`
                        : `Add ${sym} to your watchlist`;
  };

  // `others` is everyone except this visitor, so the number shown is simply
  // others plus one when they are watching too. Counting from the total and
  // adjusting by the click is what produced a star reading "-1".
  let watching = false, others = 0;
  try {
    const d = await rpc("is_watched", { p_symbol: sym });
    const total = (d && d.watchers) || 0;
    // Only a signed-in visitor is counted in that total; a list held in the
    // browser has never reached the database, so it cannot be in it.
    watching = signedIn() ? !!(d && d.watching) : localWatch.has(sym);
    others = signedIn() && d && d.watching ? Math.max(0, total - 1) : total;
  } catch {
    watching = signedIn() ? false : localWatch.has(sym);
  }
  paint(watching, others + (watching ? 1 : 0));

  el.onclick = async () => {
    el.disabled = true;
    watching = await toggleWatch(sym, "ticker_page");
    // A signed-out visitor changes nothing anyone else can see, so the public
    // count stays put rather than claiming a watcher the database has not got.
    paint(watching, others + (watching && signedIn() ? 1 : 0));
    el.disabled = false;
  };
}

/** Kept for compatibility; signup modal is shown from toggleWatch. */
function starHint(anchor){
  if (window.TA?.showSignupModal) {
    window.TA.showSignupModal({ reason: "watchlist" });
    return;
  }
  if (sessionStorage.getItem("wl-hinted")) return;
  sessionStorage.setItem("wl-hinted", "1");
  const tip = document.createElement("div");
  tip.className = "wstar-hint";
  tip.innerHTML = `Saved in this browser. <button type="button">Sign in to keep it</button>`;
  anchor.parentNode.appendChild(tip);
  tip.querySelector("button").onclick = () => { if (window.TA) window.TA.signIn(); };
  setTimeout(() => tip.remove(), 8000);
}

/* ---- 5. news about this company and its industry -------------------------- */
// Three searches, widening as they go: the ticker, the company's own name, and
// its industry. A quiet week for one company is not a quiet week for its
// sector, and the neighbours are usually what moves it.
async function loadTickerNews(){
  const host = document.getElementById("co-news");
  const sym = S.company.ticker;
  const name = (S.company.name || "").replace(/,?\s+(inc|corp|corporation|plc|ltd|limited|holdings?|group|co)\.?$/i, "").trim();
  const industry = EXTRA.data.industry || "";
  // "Drug Manufacturers - General" never appears in a headline; the head of it
  // sometimes does.
  const industryTerm = industry.split(" - ")[0].trim();

  const searches = [[sym, sym], [name, name], [industryTerm, industryTerm]]
    .filter(([t], i, arr) => t && t.length > 2 && arr.findIndex(x => x[0] === t) === i);

  // One round trip, not three. These searches are independent -- the symbol,
  // the company name and the industry -- so awaiting each in turn cost three
  // sequential trips to Supabase and was over half the ticker page's load.
  // Results are folded back in the original order, so which article wins a
  // duplicate URL, and the order of `scopes`, are unchanged.
  const seen = new Set(), arts = [];
  const scopes = [];
  const found = await Promise.all(searches.map(([term]) =>
    rpc("get_news", { p_q: term, p_limit: 10 }).catch(() => null)));
  searches.forEach(([, label], i) => {
    const got = (found[i] && found[i].articles) || [];
    if (got.length) scopes.push(label);
    for (const a of got) {
      if (seen.has(a.url)) continue;
      seen.add(a.url);
      arts.push(a);
    }
  });
  arts.sort((a, b) => (b.published || "").localeCompare(a.published || ""));

  const scopeEl = document.getElementById("news-scope");
  if (!arts.length) {
    scopeEl.textContent = `Nothing recent for ${sym}`;
    host.innerHTML = `<div class="note">No recent stories.</div>`;
    return;
  }
  scopeEl.textContent = `${sym}, ${name || "the company"} and ${industryTerm || "its industry"}`;

  try {
    const item = a => `
      <a class="conews" href="${esc(a.url)}" target="_blank" rel="noopener"
         data-ta-news="ticker_page"${a.symbol ? ` data-ta-ticker="${esc(a.symbol)}"` : ""}>
        <div class="when">${esc(ago(a.published))}${a.symbol ? ` · <span class="tag">${esc(a.symbol)}</span>` : ""}</div>
        <h4>${esc(a.title)}</h4>
        <p>${esc((a.summary || "").slice(0, 150))}</p>
      </a>`;
    // Desktop: render twice so the drift below can wrap without a seam.
    // Mobile: no auto-scroll — one list, manual scroll only.
    const mobile = MOBILE_MQ.matches;
    host.innerHTML = `<div id="conews-a">${arts.map(item).join("")}</div>` +
      (mobile ? "" : `<div aria-hidden="true">${arts.map(item).join("")}</div>`);
    if (!mobile) requestAnimationFrame(() => driftNews(host));
  } catch (e) {
    host.innerHTML = `<div class="note">Could not render the news: ${esc(e.message)}</div>`;
    console.error("[news]", e);
  }
}

/** Scroll the list slowly, yielding the moment a reader takes hold of it.
    Only a real gesture counts: the drift moves content under a resting
    cursor, and treating that as intent would stop the feed for good.
    Mobile never calls this — news stays still for thumb scrolling. */
function driftNews(wrap){
  if (MOBILE_MQ.matches) return;
  const copy = document.getElementById("conews-a");
  if (!copy || wrap.dataset.drifting) return;
  wrap.dataset.drifting = "1";

  let held = 0, last = 0, pos = 1;
  const SPEED = 16, HOLD = 1500;
  const hold = () => { held = Date.now() + HOLD; pos = wrap.scrollTop; };
  ["wheel", "touchstart", "touchmove", "pointerdown", "keydown"].forEach(e =>
    wrap.addEventListener(e, hold, { passive: true }));

  function frame(now){
    requestAnimationFrame(frame);
    const dt = last ? Math.min(100, now - last) : 0;
    last = now;
    const one = copy.offsetHeight;
    if (!one || one <= wrap.clientHeight) return;   // nothing to scroll

    if (Date.now() < held) pos = wrap.scrollTop;
    else pos += SPEED * dt / 1000;

    if (pos >= one * 2 - wrap.clientHeight) pos -= one;
    else if (pos < 1) pos += one;
    if (Math.abs(wrap.scrollTop - pos) > 0.01) wrap.scrollTop = pos;
  }
  wrap.scrollTop = pos;
  requestAnimationFrame(frame);
}


/* ===========================================================================
   Analyst rating

   Where the houses covering this company think it is going, and what they
   said. Every figure here is Financial Modeling Prep's -- consensus targets,
   the rating tally, each firm's latest action, and the wire story behind each
   target change -- so each number can be followed back to its note.
=========================================================================== */
const ANALYST = { symbol: null, data: null,
                  tries: 0, asked: false, queued: true, poll: null };

async function loadAnalyst(){
  const sym = S.company && S.company.ticker;
  if (!sym || !HOSTED) return;
  const host = document.getElementById("analyst");
  if (!host) return;

  if (ANALYST.symbol !== sym) {
    clearTimeout(ANALYST.poll);
    ANALYST.symbol = sym;
    ANALYST.data = null;
    ANALYST.tries = 0;
    ANALYST.asked = false;
    try { ANALYST.data = await API.analyst(sym); }
    catch { return analystState(`Analyst coverage for ${sym} is unavailable.`); }
    if (ANALYST.symbol !== sym) return;        // another company was opened
  }
  showAnalyst(sym);
}

/** Three states, and they are not the same thing. A row carrying figures is
    drawn; a row without means the houses were asked and none cover this
    company; no row at all means nobody has opened it since coverage was
    added, so it is requested and waited for. */
function showAnalyst(sym){
  const d = ANALYST.data || {};
  if (!d.consensus && !d.target) {
    if (d.updatedAt) return analystState(`No analyst coverage published for ${sym}.`);
    return awaitAnalyst(sym);
  }
  drawAnalyst();
  wireHelp();
  // The price panel carries the consensus beside the price, and whichever of
  // the two arrives second is the one that can draw it.
  if ((PRICE.bars || []).length && document.getElementById("price-stats")) drawPriceStats();
}

function analystState(msg, busy){
  const host = document.getElementById("analyst");
  if (!host) return;
  host.innerHTML = `<section class="card panel"><div class="note">`
    + `${busy ? `<span class="load"></span> &nbsp;` : ""}${esc(msg)}</div></section>`;
}

/** Coverage is fetched on demand, like prices: the page asks, the worker
    answers within a few seconds. Say so while waiting, and say plainly when
    it has not arrived rather than spinning forever.

    Where the request function is not deployed there is nothing to wait for,
    so the wait is skipped entirely. Coverage still reaches that company with
    its next price fetch, which is how it worked before it had a queue. */
async function awaitAnalyst(sym){
  clearTimeout(ANALYST.poll);
  if (!ANALYST.asked) {
    ANALYST.asked = true;
    ANALYST.queued = true;
    try { await API.requestAnalyst(sym); }
    catch (e) { if (e && e.status === 404) ANALYST.queued = false; }
    if (ANALYST.symbol !== sym) return;
  }
  if (!ANALYST.queued) {
    return analystState(`Analyst coverage for ${sym} has not been fetched yet. `
      + `It arrives with the next refresh of this company's prices.`);
  }
  if (ANALYST.tries++ > 20) {                    // ~2 minutes, as for prices
    return analystState(`Coverage for ${sym} is still being fetched. Reload in a minute.`);
  }
  analystState(`Fetching analyst coverage for ${sym}…`, true);
  ANALYST.poll = setTimeout(async () => {
    if (!S.company || S.company.ticker !== sym) return;
    let d = null;
    try { d = await API.analyst(sym); } catch { return; }
    if (ANALYST.symbol !== sym) return;
    ANALYST.data = d;
    showAnalyst(sym);
  }, 6000);
}

const GRADE_TONE = g => {
  const s = (g || "").toLowerCase();
  if (/strong buy|outperform|overweight|positive/.test(s)) return "g-buy";
  if (/buy|accumulate/.test(s)) return "g-buy";
  if (/hold|neutral|market perform|equal ?weight|in ?line/.test(s)) return "g-hold";
  if (/sell|underperform|underweight|reduce|negative/.test(s)) return "g-sell";
  return "";
};

const ACTION_TONE = a => ({ upgrade: "up", downgrade: "down" }[(a || "").toLowerCase()] || "");

/** The tally as one word and the ratings behind it. FMP publishes a consensus
    string of its own, but a word and a count shown together have to come from
    the same five numbers or they contradict each other -- so the word is the
    largest of the three groups, and FMP's only breaks a tie. Strong buy counts
    as a buy and strong sell as a sell: five degrees is more than a summary
    line can carry, and the section below keeps every one of them. */
function consensusCall(c){
  if (!c) return null;
  const groups = [
    { word: "Buy",  tone: "buy",  n: (c.strongBuy || 0) + (c.buy || 0) },
    { word: "Hold", tone: "hold", n: c.hold || 0 },
    { word: "Sell", tone: "sell", n: (c.sell || 0) + (c.strongSell || 0) },
  ];
  const total = groups.reduce((a, g) => a + g.n, 0);
  if (!total) return null;
  const most = Math.max(...groups.map(g => g.n));
  const tied = groups.filter(g => g.n === most);
  const said = (c.rating || "").toLowerCase();
  return { ...(tied.find(g => said.includes(g.tone)) || tied[0]), total, groups };
}

/** The last traded price: the quote where there is one, the final bar's close
    otherwise. What the consensus target is measured against. */
function lastPrice(){
  const q = PRICE.quote;
  if (q && q.price !== null && q.price !== undefined) return q.price;
  const bars = PRICE.bars || [];
  return bars.length ? bars[bars.length - 1].c : null;
}

/** Where the houses think the price is going, under the price it is measured
    against: the consensus target and what it implies, the range around it,
    and the split that produced it. */
function consensusSummary(spot){
  const d = ANALYST.data;
  if (!d) return "";
  const t = d.target || {};
  const call = consensusCall(d.consensus);
  const mid = t.consensus ?? t.median ?? null;
  if (!call && mid == null) return "";

  const to = mid != null && spot ? (mid / spot - 1) * 100 : null;
  const bar = !call ? "" : `
    <div class="wst-bar">${call.groups.filter(g => g.n).map(g =>
      `<span class="${g.tone}" style="width:${(g.n / call.total * 100).toFixed(1)}%"
             title="${g.n} ${g.word.toLowerCase()}"></span>`).join("")}</div>
    <div class="wst-k">${call.groups.map(g =>
      `<b>${g.n}</b> ${g.word}`).join(" · ")}</div>`;

  return `
    <div class="wst">
      <div class="wst-h">Wall Street consensus${call
        ? `<button type="button" class="wst-n" data-analysts>${call.total} analyst${
            call.total === 1 ? "" : "s"}</button>` : ""}</div>
      ${mid == null ? "" : `<div class="wst-t"><b>$${mid.toFixed(2)}</b>${to === null ? ""
        : `<span class="${to >= 0 ? "up" : "down"}">${to >= 0 ? "+" : ""}${to.toFixed(1)}%</span>`}
      </div>`}
      ${t.low == null || t.high == null ? ""
        : `<div class="wst-r">Range $${t.low.toFixed(2)}–$${t.high.toFixed(2)}</div>`}
      ${bar}
    </div>`;
}

/* ---- Earnings -----------------------------------------------------------
   What the company reported against what was expected of it. Neither half is
   a filing figure: the filing carries the result, never the estimate it was
   measured against, and the estimate is what made the result news.

   The market-wide earnings calendar cannot answer this -- the worker rewrites
   it to a rolling 90-day window on every run -- so the per-symbol record is
   fetched and kept separately, and read here alongside the calendar's next
   date. */
const EARN = { symbol: null, data: null, loading: false, failed: false };

function earningsMarkup(){
  return `
    <div class="erow" id="earn-next"></div>

    <section class="card panel">
      <div class="phead"><div>
        <h2>Reported vs expected ${helpIcon("beats")}</h2>
        <p>Each bar is the quarter's reported EPS; the notch across it is the
           consensus it was measured against.</p>
      </div></div>
      <div class="scroll" id="earn-chart"><div class="note">
        <span class="load"></span> &nbsp;Loading earnings history…</div></div>
      <div class="legend" id="earn-legend"></div>
    </section>

    <section class="card panel">
      <div class="phead"><div>
        <h2>Quarters reported</h2>
      </div></div>
      <div class="scroll" id="earn-table"></div>
    </section>`;
}

/** A surprise is only meaningful against an estimate that is not ~zero: a
    penny against a one-cent estimate is not a 100% beat in any useful sense. */
function epsSurprise(actual, est){
  if (actual == null || est == null || Math.abs(est) < 0.01) return null;
  return (actual - est) / Math.abs(est) * 100;
}

const earnPct = v => v == null ? "—" : `${v >= 0 ? "+" : "−"}${Math.abs(v).toFixed(1)}%`;
const earnEps = v => v == null ? "—"
  : (v < 0 ? "−$" : "$") + Math.abs(v).toFixed(2);

/** Bars for the reported EPS, a notch for the estimate it was measured
    against. Drawn at the width the card is shown at, like the cost stack. */
function renderEarningsChart(reports){
  const host = document.getElementById("earn-chart");
  const legend = document.getElementById("earn-legend");
  if (!host) return;
  const rows = reports.filter(r => r.epsActual != null)
    .slice(0, MOBILE_MQ.matches ? 8 : 12).reverse();   // oldest → newest
  if (!rows.length) {
    host.innerHTML = `<div class="note">No reported quarter carries an EPS figure yet.</div>`;
    if (legend) legend.innerHTML = "";
    return;
  }

  const wide = !MOBILE_MQ.matches;
  const W = wide ? 1180 : 560, H = wide ? 320 : 290;
  const ml = 58, mr = 14, mt = 18, mb = 46;
  const pw = W - ml - mr, ph = H - mt - mb;

  const vals = rows.flatMap(r => [r.epsActual, r.epsEstimated])
    .filter(v => v != null);
  let hi = Math.max(...vals, 0), lo = Math.min(...vals, 0);
  const pad = (hi - lo) * 0.12 || 1;
  hi += pad; lo -= (lo < 0 ? pad : 0);
  const y = v => mt + ph - (v - lo) / (hi - lo) * ph;
  const zero = y(0);

  // Five ticks over the range, rounded to something a reader would choose.
  const rawStep = (hi - lo) / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep || 1)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(v => v >= rawStep) || mag * 10;
  const ticks = [];
  for (let t = Math.ceil(lo / step) * step; t <= hi + step * 1e-6; t += step) ticks.push(t);

  const bw = Math.min(wide ? 56 : 32, pw / rows.length - (wide ? 12 : 8));
  const grid = ticks.map(t => `
    <line x1="${ml}" y1="${y(t).toFixed(1)}" x2="${W - mr}" y2="${y(t).toFixed(1)}"
      stroke="var(--rule-2)"></line>
    <text x="${ml - 8}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end" font-size="10.5"
      class="tnum" fill="var(--ink-3)">${earnEps(t)}</text>`).join("");

  const bars = rows.map((r, i) => {
    const cx = ml + pw * (i + 0.5) / rows.length;
    const beat = r.epsEstimated == null ? null : r.epsActual >= r.epsEstimated;
    const col = beat === null ? "var(--ink-3)" : beat ? "var(--up)" : "var(--down)";
    const ya = y(r.epsActual);
    const top = Math.min(ya, zero), h = Math.abs(ya - zero);
    const notch = r.epsEstimated == null ? "" : `
      <line x1="${(cx - bw / 2 - 4).toFixed(1)}" x2="${(cx + bw / 2 + 4).toFixed(1)}"
        y1="${y(r.epsEstimated).toFixed(1)}" y2="${y(r.epsEstimated).toFixed(1)}"
        stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"></line>`;
    const surprise = epsSurprise(r.epsActual, r.epsEstimated);
    return `<g>
      <title>${esc(shortDate(r.date))} — reported ${earnEps(r.epsActual)}${
        r.epsEstimated == null ? "" : `, expected ${earnEps(r.epsEstimated)}${
          surprise == null ? "" : ` (${earnPct(surprise)})`}`}</title>
      <rect x="${(cx - bw / 2).toFixed(1)}" y="${top.toFixed(1)}"
        width="${bw.toFixed(1)}" height="${Math.max(1, h).toFixed(1)}"
        fill="${col}" rx="2"></rect>
      ${notch}
      <text x="${cx.toFixed(1)}" y="${H - 26}" text-anchor="middle" font-size="10.5"
        class="tnum" fill="var(--ink-3)">${esc(shortDate(r.date).slice(0, 6))}</text>
      <text x="${cx.toFixed(1)}" y="${H - 12}" text-anchor="middle" font-size="10.5"
        class="tnum" fill="var(--ink-3)">'${esc(String(r.date).slice(2, 4))}</text>
    </g>`;
  }).join("");

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Reported earnings per share against consensus">
    ${grid}
    <line x1="${ml}" y1="${zero.toFixed(1)}" x2="${W - mr}" y2="${zero.toFixed(1)}"
      stroke="var(--rule)"></line>
    ${bars}
  </svg>`;
  if (legend) legend.innerHTML =
    `<div><i style="background:var(--up)"></i>Beat</div>` +
    `<div><i style="background:var(--down)"></i>Miss</div>` +
    // The consensus is a rule across the bar, not a block of colour; its key
    // says so rather than showing a third square.
    `<div><i style="background:var(--ink);height:3px;border-radius:2px"></i>Consensus</div>`;
}

function renderEarningsTable(reports){
  const host = document.getElementById("earn-table");
  if (!host) return;
  const rows = reports.filter(r => r.epsActual != null || r.revenueActual != null);
  if (!rows.length) {
    host.innerHTML = `<div class="note">No quarter has reported figures yet.</div>`;
    return;
  }
  host.innerHTML = `<table class="otab">
    <thead><tr>
      <th>Reported</th>
      <th class="num">EPS est.</th><th class="num">EPS actual</th><th class="num">Surprise</th>
      <th class="num col-rev">Revenue est.</th><th class="num col-rev">Revenue actual</th>
      <th class="num col-rev">Surprise</th>
    </tr></thead>
    <tbody>${rows.map(r => {
      const eSur = epsSurprise(r.epsActual, r.epsEstimated);
      const rSur = r.revenueActual != null && r.revenueEstimated
        ? (r.revenueActual - r.revenueEstimated) / Math.abs(r.revenueEstimated) * 100 : null;
      const tone = v => v == null ? "" : v >= 0 ? "up" : "down";
      return `<tr>
        <td class="dt">${esc(shortDate(r.date))}</td>
        <td class="num">${esc(earnEps(r.epsEstimated))}</td>
        <td class="num">${esc(earnEps(r.epsActual))}</td>
        <td class="num ${tone(eSur)}">${esc(earnPct(eSur))}</td>
        <td class="num col-rev">${esc(r.revenueEstimated == null ? "—" : money(r.revenueEstimated, 1))}</td>
        <td class="num col-rev">${esc(r.revenueActual == null ? "—" : money(r.revenueActual, 1))}</td>
        <td class="num col-rev ${tone(rSur)}">${esc(earnPct(rSur))}</td>
      </tr>`;
    }).join("")}</tbody></table>`;
}

/** The date ahead, and the consensus going into it. */
function renderNextEarnings(d){
  const host = document.getElementById("earn-next");
  if (!host) return;
  const next = d && d.next;
  const reports = (d && d.reports) || [];
  const last = reports.find(r => r.epsActual != null);
  const lastSurprise = last ? epsSurprise(last.epsActual, last.epsEstimated) : null;
  const beats = reports.filter(r => r.epsActual != null && r.epsEstimated != null);
  const won = beats.filter(r => r.epsActual >= r.epsEstimated).length;

  // "bmo"/"amc" is how the calendar files the session; spell it out.
  const session = (next && next.time) ? ({
    bmo: "Before the open", amc: "After the close",
  }[String(next.time).toLowerCase()] || String(next.time)) : null;

  const tiles = [
    ["Next report", next ? shortDate(next.date) : "Not scheduled",
     session || (next ? "Date confirmed by the company" : "No date on the calendar yet")],
    ["EPS consensus", next ? earnEps(next.epsEstimated) : "—",
     next && next.revenueEstimated != null
       ? `Revenue ${money(next.revenueEstimated, 1)}` : "For the quarter ahead"],
    ["Last reported", last ? earnEps(last.epsActual) : "—",
     last ? `${shortDate(last.date)}${lastSurprise == null ? ""
       : ` · <b class="${lastSurprise >= 0 ? "up" : "down"}">${earnPct(lastSurprise)}</b>`}` : "—"],
    ["Beat rate", beats.length ? `${won}/${beats.length}` : "—",
     beats.length ? `Quarters above consensus` : "No estimates on record"],
  ];
  host.innerHTML = tiles.map(([k, v, d2]) => `
    <div class="kpi">
      <div class="k">${esc(k)}</div>
      <div class="v">${esc(v)}</div>
      <div class="d">${d2}</div>
    </div>`).join("");
}

function earningsState(msg, busy){
  ["earn-chart", "earn-table"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = `<div class="note">`
      + `${busy ? `<span class="load"></span> &nbsp;` : ""}${esc(msg)}</div>`;
  });
  const legend = document.getElementById("earn-legend");
  if (legend) legend.innerHTML = "";
}

function drawEarnings(){
  const d = EARN.data;
  if (!document.getElementById("earn-chart")) return;
  renderNextEarnings(d);
  // null reports = never fetched for this symbol; [] = fetched and empty. The
  // page has different things to say about those, so it keeps them apart.
  const reports = d && d.reports;
  if (!reports) {
    return earningsState(EARN.failed
      ? `Earnings history for ${EARN.symbol} is unavailable.`
      : `Earnings history for ${EARN.symbol} arrives with the next price refresh.`);
  }
  if (!reports.length) {
    return earningsState(`No reported quarter is on record for ${EARN.symbol}.`);
  }
  renderEarningsChart(reports);
  renderEarningsTable(reports);
  wireHelp();
}

/** Fetched when the tab is first opened, and once per company. */
async function loadEarnings(){
  const sym = S.company && S.company.ticker;
  if (!sym || !HOSTED || !document.getElementById("earn-chart")) return;
  if (EARN.symbol === sym && !EARN.loading) return drawEarnings();
  if (EARN.loading) return;
  EARN.symbol = sym;
  EARN.loading = true;
  EARN.data = null;
  EARN.failed = false;
  earningsState(`Loading earnings for ${sym}…`, true);
  try {
    const d = await API.earnings(sym);
    if (EARN.symbol !== sym) return;              // another company was opened
    EARN.data = d || { reports: null, next: null };
  } catch {
    if (EARN.symbol !== sym) return;
    EARN.failed = true;
    EARN.data = { reports: null, next: null };
  } finally {
    EARN.loading = false;
    if (EARN.symbol === sym) drawEarnings();
  }
}

/* ---- Ownership ----------------------------------------------------------
   Who holds the stock and who is paid to have an opinion on it: the Form 4
   filings, the congressional disclosures, and the houses covering it. The
   trades come from the same get_trades the portfolio page reads, narrowed to
   this one symbol. */
const OWN = { symbol: null, insiders: null, congress: null, loading: false,
              complete: false, asked: false, poll: 0 };
const HELD = { symbol: null, data: null, loading: false, failed: false };
const OWNH = { symbol: null, data: null, loading: false, failed: false, range: "5Y" };
// 13F is filed quarterly, so the only honest period is a quarter; the picker
// chooses how many of them. "Max" is whatever history the feed keeps (~10y).
const OWNH_RANGES = { "3Y": 12, "5Y": 20, "Max": Infinity };

/** The panel bodies. Built as one string because all three renders drop it
    into a tab panel and nothing else varies between them.

    The institutional-ownership and institutional-holders panels are withheld:
    the data plan does not include 13F endpoints, so both charts would render
    only their empty state. Their renderers below stay wired — restoring the
    two sections here brings the panels back the day the data does. */
function ownershipMarkup(){
  return `
    <div class="pairrow">
      <section class="card panel">
        <div class="phead"><div>
          <h2>Insider transactions ${helpIcon("insiders")}</h2>
          <p>Form 4 filings, last 90 days</p>
        </div></div>
        <div class="scroll own-scroll" id="own-insiders"><div class="note">
          <span class="load"></span> &nbsp;Loading insider filings…</div></div>
      </section>
      <section class="card panel">
        <div class="phead"><div>
          <h2>Congress disclosures ${helpIcon("congress")}</h2>
          <p>Periodic transaction reports, last 90 days</p>
        </div></div>
        <div class="scroll own-scroll" id="own-congress"><div class="note">
          <span class="load"></span> &nbsp;Loading disclosures…</div></div>
      </section>
    </div>

    <div class="acol" id="analyst"><section class="card panel"><div class="note">
      <span class="load"></span> &nbsp;Loading analyst coverage…</div></section></div>`;
}

const ownSide = side => {
  const raw = String(side || "").trim(), l = raw.toLowerCase();
  if (/^(buy|purchase|receive)/.test(l) || l.includes("purchase") || l.includes("receive"))
    return `<span class="oside buy">Buy</span>`;
  if (/^(sell|sale)/.test(l) || l.includes("sale") || l.includes("sell") || l.includes("exchange"))
    return `<span class="oside sell">Sell</span>`;
  return `<span class="oside">${esc(raw || "—")}</span>`;
};

const ownShares = v => v == null ? "—" : compact(Math.abs(+v));

/** Congressional amounts are filed as a band ("$1,001 - $15,000"), not a
    figure, so they are shortened rather than formatted as a number. */
const ownBand = raw => {
  if (!raw) return "—";
  const nums = String(raw).match(/[\d,]+/g);
  if (!nums || !nums.length) return String(raw);
  const short = n => {
    const v = +n.replace(/,/g, "");
    return v >= 1e6 ? `${(v / 1e6).toFixed(v % 1e6 ? 1 : 0)}M`
         : v >= 1e3 ? `${Math.round(v / 1e3)}K` : String(v);
  };
  return nums.length > 1 ? `${short(nums[0])}–${short(nums[1])}` : short(nums[0]);
};

const ownRole = chamber => {
  const c = String(chamber || "").toLowerCase();
  if (c.includes("senate")) return "Senator";
  if (c.includes("house")) return "Representative";
  return "Member";
};

/** A person and what they are, stacked, so a long title does not push the
    figures off the card. */
const ownWho = (who, what) => `<span class="owho"><b>${esc(who || "—")}</b>${
  what ? `<em>${esc(what)}</em>` : ""}</span>`;

function drawOwnership(){
  const ins = document.getElementById("own-insiders");
  const con = document.getElementById("own-congress");
  if (!ins || !con) return;
  const sym = (S.company && S.company.ticker) || "this ticker";

  if (OWN.insiders === null || OWN.congress === null) return;   // still loading

  ins.innerHTML = OWN.insiders.length
    ? `<table class="otab">
        <thead><tr><th>Filed</th><th>Insider</th><th>Side</th>
          <th class="num col-shares">Shares</th><th class="num">Value</th></tr></thead>
        <tbody>${OWN.insiders.map(r => `<tr>
          <td class="dt">${esc(shortDate(r.filed))}</td>
          <td>${ownWho(r.person, r.title)}</td>
          <td>${ownSide(r.side)}</td>
          <td class="num col-shares">${esc(ownShares(r.shares))}</td>
          <td class="num"${r.price ? ` title="at $${(+r.price).toFixed(2)} a share"` : ""}>${
            esc(r.amount == null ? "—" : money(Math.abs(r.amount), 1))}</td>
        </tr>`).join("")}</tbody></table>`
    : OWN.complete
      ? `<div class="note">No open-market insider purchase or sale filed for
         ${esc(sym)} in the last 90 days.</div>`
      : `<div class="note"><span class="load"></span> &nbsp;Reading
         ${esc(sym)}'s Form 4 filings…</div>`;

  con.innerHTML = OWN.congress.length
    ? `<table class="otab">
        <thead><tr><th>Disclosed</th><th>Member</th><th>Side</th>
          <th class="num">Amount</th></tr></thead>
        <tbody>${OWN.congress.map(r => `<tr>
          <td class="dt">${esc(shortDate(r.disclosed))}</td>
          <td>${ownWho(r.person, ownRole(r.chamber))}</td>
          <td>${ownSide(r.side)}</td>
          <td class="num" title="${esc(r.amount || "")}">${esc(ownBand(r.amount))}</td>
        </tr>`).join("")}</tbody></table>`
    : `<div class="note">No congressional disclosure naming ${esc(sym)} in the
       last 90 days.</div>`;
  wireHelp();
}

/** Ask the worker for this company's own filings, and wait for them.

    Until that fetch lands the table is showing the market-wide table's view,
    which carries only filings above the market-wide materiality floor -- so
    the difference between "nothing was filed" and "nothing large was filed"
    is not visible yet. */
async function ensureSymbolInsiders(sym){
  if (OWN.complete || OWN.asked || !HOSTED) return;
  OWN.asked = true;
  try { await API.requestInsiders(sym); } catch { return; }
  let tries = 0;
  const tick = async () => {
    if (OWN.symbol !== sym || !document.getElementById("own-insiders")) return;
    if (tries++ >= 12) return;                   // ~2 minutes, then give up
    let d = null;
    try { d = await API.symbolInsiders(sym); } catch {}
    if (OWN.symbol !== sym) return;
    if (d && d.complete) {
      OWN.insiders = d.trades || [];
      OWN.complete = true;
      drawOwnership();
      return;
    }
    OWN.poll = setTimeout(tick, tries < 4 ? 4000 : 10000);
  };
  OWN.poll = setTimeout(tick, 3500);
}

/** Who owns the company, as filed. Shares are worth more than dollars here:
    a 13F's market value is struck at the quarter end, so it is stale in a way
    a share count is not. */
function drawHolders(){
  const host = document.getElementById("own-holders");
  const scope = document.getElementById("holders-scope");
  if (!host) return;
  const d = HELD.data;
  const rows = d && d.holders;
  const out = d && d.sharesOut;

  if (!rows) {
    host.innerHTML = `<div class="note">Institutional holders for `
      + `${esc(HELD.symbol || "this ticker")} are not available.</div>`;
    if (scope) scope.textContent = "From the latest 13F filings.";
    return;
  }
  if (!rows.length) {
    host.innerHTML = `<div class="note">No institution files a 13F position in `
      + `${esc(HELD.symbol || "this ticker")}.</div>`;
    return;
  }

  if (scope) {
    const share = out && d.totalShares ? (d.totalShares / out * 100) : null;
    scope.innerHTML = `${d.holderCount || rows.length} institution${
      (d.holderCount || rows.length) === 1 ? "" : "s"} on file${
      share == null ? "" : `, holding <b>${share.toFixed(1)}%</b> of shares outstanding`}${
      d.reported ? ` · as of ${esc(shortDate(d.reported))}` : ""}`;
  }

  host.innerHTML = `<table class="otab">
    <thead><tr><th>Institution</th>
      <th class="num">Shares</th>
      <th class="num col-pct">% out</th>
      <th class="num col-val">Value</th>
      <th class="num">Change</th></tr></thead>
    <tbody>${rows.map(r => {
      const pctOut = out && r.shares != null ? r.shares / out * 100 : null;
      const ch = r.change;
      return `<tr>
        <td>${esc(r.holder || "—")}</td>
        <td class="num">${esc(r.shares == null ? "—" : compact(r.shares))}</td>
        <td class="num col-pct">${pctOut == null ? "—" : esc(pctOut.toFixed(2) + "%")}</td>
        <td class="num col-val">${esc(r.value == null ? "—" : money(r.value, 1))}</td>
        <td class="num ${ch == null || ch === 0 ? "" : ch > 0 ? "up" : "down"}">${
          ch == null ? "—" : ch === 0 ? "—"
            : esc((ch > 0 ? "+" : "−") + compact(Math.abs(ch)))}</td>
      </tr>`;
    }).join("")}</tbody></table>`;
  wireHelp();
}

/** Fetched when the tab is first opened, and once per company. */
async function loadHolders(){
  const sym = S.company && S.company.ticker;
  if (!sym || !HOSTED || !document.getElementById("own-holders")) return;
  if (HELD.symbol === sym && !HELD.loading) return drawHolders();
  if (HELD.loading) return;
  HELD.symbol = sym;
  HELD.loading = true;
  HELD.data = null;
  HELD.failed = false;
  try {
    const d = await API.holders(sym);
    if (HELD.symbol !== sym) return;             // another company was opened
    HELD.data = d || { holders: null };
  } catch {
    if (HELD.symbol !== sym) return;
    HELD.failed = true;
    HELD.data = { holders: null };
  } finally {
    HELD.loading = false;
    if (HELD.symbol === sym) drawHolders();
  }
}

/* ---- Institutional ownership through time --------------------------------
   Bars for the total 13F position at each quarter end, a line on its own
   right axis for the percent of the company that position amounts to. One
   point per quarter because 13F is a quarterly filing — the range picker
   chooses how many quarters, not a finer period that does not exist. */

function wireOwnhistRange(){
  document.querySelectorAll("#ownhist-range [data-r]").forEach(b => b.onclick = () => {
    if (OWNH.range === b.dataset.r) return;
    OWNH.range = b.dataset.r;
    document.querySelectorAll("#ownhist-range [data-r]").forEach(x =>
      x.setAttribute("aria-pressed", String(x.dataset.r === OWNH.range)));
    drawOwnershipHistory();
  });
}

function ownhistState(msg, busy){
  const host = document.getElementById("ownhist-chart");
  if (host) host.innerHTML = `<div class="note">`
    + `${busy ? `<span class="load"></span> &nbsp;` : ""}${esc(msg)}</div>`;
  const legend = document.getElementById("ownhist-legend");
  if (legend) legend.innerHTML = "";
}

function drawOwnershipHistory(){
  const host = document.getElementById("ownhist-chart");
  if (!host) return;
  wireOwnhistRange();
  const d = OWNH.data;
  const points = d && d.points;
  const sym = OWNH.symbol || "this ticker";
  if (!points) {
    // Not "arrives with the next price refresh": 13F sits above the data
    // plan's tier, so on the current subscription no refresh ever brings it
    // and that sentence was a promise the page could not keep.
    return ownhistState(`Institutional ownership for ${sym} is not available.`);
  }
  const all = points.filter(p => p && p.shares != null);
  if (!all.length) {
    return ownhistState(`No institution files a 13F position in ${sym}.`);
  }

  const out = d.sharesOut;
  // The feed's own percentage when it filed one; otherwise the position
  // against today's share count — close enough for the line's shape.
  const pctOf = p => p.ownershipPct != null && p.ownershipPct > 0
    ? p.ownershipPct
    : (out && p.shares != null ? p.shares / out * 100 : null);

  const scope = document.getElementById("ownhist-scope");
  if (scope) {
    const last = all[all.length - 1];
    const lp = pctOf(last);
    scope.innerHTML = `${last.investors != null
        ? `${last.investors.toLocaleString()} institutions hold ` : `Institutions hold `}` +
      `<b>${esc(compact(last.shares))}</b> shares` +
      `${lp != null ? ` — <b>${lp.toFixed(1)}%</b> of shares outstanding` : ""}` +
      ` · as of ${esc(shortDate(last.date))}`;
  }

  const keep = OWNH_RANGES[OWNH.range] || Infinity;
  const rows = Number.isFinite(keep) ? all.slice(-keep) : all;

  const wide = !MOBILE_MQ.matches;
  const W = wide ? 1180 : 560, H = wide ? 320 : 290;
  const ml = 64, mr = 50, mt = 18, mb = 46;
  const pw = W - ml - mr, ph = H - mt - mb;

  // Shares on the left, from zero: the bar's whole height is the position.
  const maxS = Math.max(...rows.map(r => r.shares)) || 1;
  const topS = maxS * 1.08;
  const yS = v => mt + ph - v / topS * ph;
  const rawStep = topS / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep || 1)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(v => v >= rawStep) || mag * 10;
  const grid = [];
  for (let t = 0; t <= topS; t += step) grid.push(`
    <line x1="${ml}" y1="${yS(t).toFixed(1)}" x2="${W - mr}" y2="${yS(t).toFixed(1)}"
      stroke="var(--rule-2)"></line>
    <text x="${ml - 8}" y="${(yS(t) + 4).toFixed(1)}" text-anchor="end" font-size="10.5"
      class="tnum" fill="var(--ink-3)">${t === 0 ? "0" : compact(t)}</text>`);

  // Percent on the right, its own scale, labelled in the line's colour so the
  // two axes cannot be read as one.
  const pcts = rows.map(pctOf);
  const havePct = pcts.some(v => v != null);
  const topP = havePct ? Math.max(...pcts.filter(v => v != null)) * 1.15 || 1 : 1;
  const yP = v => mt + ph - v / topP * ph;
  const rTicks = havePct ? [1, 2, 3].map(i => topP * i / 4) : [];
  const rAxis = rTicks.map(t => `
    <text x="${W - mr + 8}" y="${(yP(t) + 4).toFixed(1)}" text-anchor="start" font-size="10.5"
      class="tnum" fill="var(--accent)">${t.toFixed(t < 10 ? 1 : 0)}%</text>`).join("");

  const bw = Math.min(wide ? 42 : 24, Math.max(4, pw / rows.length - (wide ? 8 : 5)));
  const labelStep = Math.ceil(rows.length / (wide ? 10 : 6));
  const bars = rows.map((r, i) => {
    const cx = ml + pw * (i + 0.5) / rows.length;
    const p = pcts[i];
    const label = i % labelStep === 0 ? `
      <text x="${cx.toFixed(1)}" y="${H - 26}" text-anchor="middle" font-size="10.5"
        class="tnum" fill="var(--ink-3)">${esc(shortDate(r.date).slice(0, 6))}</text>
      <text x="${cx.toFixed(1)}" y="${H - 12}" text-anchor="middle" font-size="10.5"
        class="tnum" fill="var(--ink-3)">'${esc(String(r.date).slice(2, 4))}</text>` : "";
    return `<g>
      <title>${esc(shortDate(r.date))} — ${esc(compact(r.shares))} shares${
        r.investors != null ? ` across ${r.investors.toLocaleString()} institutions` : ""}${
        p != null ? `, ${p.toFixed(1)}% of shares outstanding` : ""}</title>
      <rect x="${(cx - bw / 2).toFixed(1)}" y="${yS(r.shares).toFixed(1)}"
        width="${bw.toFixed(1)}" height="${Math.max(1, mt + ph - yS(r.shares)).toFixed(1)}"
        fill="var(--accent)" fill-opacity="0.42" rx="2"></rect>
      ${label}
    </g>`;
  }).join("");

  // The percent line lifts the pen over quarters with no percentage rather
  // than drawing a bridge through them.
  let path = "", pen = false;
  const dots = [];
  rows.forEach((r, i) => {
    const p = pcts[i];
    if (p == null) { pen = false; return; }
    const cx = ml + pw * (i + 0.5) / rows.length;
    path += `${pen ? "L" : "M"}${cx.toFixed(1)} ${yP(p).toFixed(1)} `;
    pen = true;
    dots.push(`<circle cx="${cx.toFixed(1)}" cy="${yP(p).toFixed(1)}" r="2.4"
      fill="var(--accent)"></circle>`);
  });

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Institutional ownership by quarter">
    ${grid.join("")}
    ${rAxis}
    ${bars}
    ${havePct ? `<path d="${path.trim()}" fill="none" stroke="var(--accent)"
      stroke-width="2" stroke-linejoin="round"></path>${dots.join("")}` : ""}
  </svg>`;

  const legend = document.getElementById("ownhist-legend");
  if (legend) legend.innerHTML =
    `<div><i style="background:var(--accent);opacity:.42"></i>Shares held (all 13F filers)</div>` +
    (havePct
      ? `<div><i style="background:var(--accent);height:3px;border-radius:2px"></i>% of shares outstanding (right axis)</div>`
      : `<div>Share count on record; percent needs shares outstanding.</div>`);
  wireHelp();
}

/** Fetched when the tab is first opened, and once per company. */
async function loadOwnershipHistory(){
  const sym = S.company && S.company.ticker;
  if (!sym || !HOSTED || !document.getElementById("ownhist-chart")) return;
  if (OWNH.symbol === sym && !OWNH.loading) return drawOwnershipHistory();
  if (OWNH.loading) return;
  OWNH.symbol = sym;
  OWNH.loading = true;
  OWNH.data = null;
  OWNH.failed = false;
  ownhistState(`Loading ownership history for ${sym}…`, true);
  try {
    const d = await API.ownership(sym);
    if (OWNH.symbol !== sym) return;             // another company was opened
    OWNH.data = d || { points: null };
  } catch {
    if (OWNH.symbol !== sym) return;
    OWNH.failed = true;
    OWNH.data = { points: null };
  } finally {
    OWNH.loading = false;
    if (OWNH.symbol === sym) drawOwnershipHistory();
  }
}

function ownState(msg){
  ["own-insiders", "own-congress"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = `<div class="note">${esc(msg)}</div>`;

}

/** Fetched when the tab is first opened, and once per company. */
async function loadOwnershipTrades(){
  const sym = S.company && S.company.ticker;
  if (!sym || !document.getElementById("own-insiders")) return;
  if (OWN.symbol === sym && !OWN.loading) return drawOwnership();
  if (OWN.loading) return;
  OWN.symbol = sym;
  OWN.loading = true;
  OWN.insiders = OWN.congress = null;
  OWN.complete = false; OWN.asked = false;
  clearTimeout(OWN.poll);
  try {
    // get_trades still serves the congressional side, which is market-wide by
    // nature; the insider side comes from this company's own filings.
    const [d, own] = await Promise.all([API.trades(sym), API.symbolInsiders(sym)]);
    if (OWN.symbol !== sym) return;              // another company was opened
    OWN.insiders = (own && own.trades) || (d && d.insiders) || [];
    OWN.complete = !!(own && own.complete);
    OWN.congress = (d && d.congress) || [];
    drawOwnership();
    ensureSymbolInsiders(sym);
  } catch {
    if (OWN.symbol !== sym) return;
    OWN.insiders = OWN.congress = null;
    ownState(`Insider and congressional filings for ${sym} are unavailable.`);
  } finally {
    OWN.loading = false;
  }
}

/* The "N analysts" count beside the Wall Street consensus used to open a
   dialog. The ratings have a tab of their own now, so it goes there. The
   count is rebuilt every time the price panel redraws, so the click is bound
   once on the document rather than to a button that keeps being replaced. */
addEventListener("click", e => {
  const t = e.target;
  if (!t || !t.closest || !t.closest("[data-analysts]")) return;
  e.preventDefault();
  selectTab("ownership");
  const host = document.getElementById("analyst");
  if (host) requestAnimationFrame(() =>
    host.scrollIntoView({ behavior: "smooth", block: "start" }));
});

/** Leave the empty state for the report, and put the ticker in the URL so the
    page can be linked to, reloaded and gone back from. */
function openReport(ticker){
  document.getElementById("hero").hidden = true;
  main.hidden = false;
  // Compared on the ticker rather than on the whole query string, so arriving
  // with a `src` on the URL is not mistaken for a different company and
  // pushed over again -- which would also have counted the page twice.
  if (new URLSearchParams(location.search).get("t") === ticker) return;
  history.pushState({ t: ticker }, "", `${location.pathname}?t=${encodeURIComponent(ticker)}`);
  // A company opened from within this page never reloads it, so its page view
  // has to be sent by hand.
  GA.pageView(location.pathname + location.search);
}

const INDEX_INTERVALS = [
  ["Daily", "daily"], ["Weekly", "weekly"], ["Monthly", "monthly"], ["Annual", "annual"],
];

function indexRangeStartISO(range){
  const d = new Date();
  if (range === "1W") d.setDate(d.getDate() - 7);
  else if (range === "1M") d.setMonth(d.getMonth() - 1);
  else if (range === "1Y") d.setFullYear(d.getFullYear() - 1);
  else if (range === "5Y") d.setFullYear(d.getFullYear() - 5);
  else if (range === "10Y") d.setFullYear(d.getFullYear() - 10);
  else if (range === "ALL") return "1900-01-01";
  else d.setMonth(0, 1); // YTD
  return d.toISOString().slice(0, 10);
}

/** PE chart: ≤1Y → daily; 5Y/10Y/ALL → annual. */
function indexDefaultInterval(range){
  return (range === "5Y" || range === "10Y" || range === "ALL") ? "annual" : "daily";
}

/** Drawdown chart: prefer daily; annual only for 10Y/ALL density. */
function indexDdDefaultInterval(range){
  return (range === "10Y" || range === "ALL") ? "annual" : "daily";
}

function indexIntervalKey(d, interval){
  if (interval === "annual") return String(d).slice(0, 4);
  if (interval === "monthly") return String(d).slice(0, 7);
  if (interval === "weekly") {
    const dt = new Date(String(d).slice(0, 10) + "T00:00:00Z");
    dt.setUTCDate(dt.getUTCDate() - ((dt.getUTCDay() + 6) % 7));
    return dt.toISOString().slice(0, 10);
  }
  return String(d).slice(0, 10);
}

/* Granularity follows the window, not the interval alone.

   A daily series over five years was labelled "31 Aug", "20 Oct", "5 Jan" --
   six ticks with no year, which read as one twelve-month stretch when they
   actually spanned half a decade. opts.year adds it; opts.noDay drops the day
   once the window is long enough that an exact date is noise rather than
   information. Both default off, so callers that pass nothing are unchanged. */
function indexAxisLabel(d, interval, opts){
  if (!d) return "";
  if (interval === "annual") return String(d).slice(0, 4);
  const [y, m, day] = String(d).split("-").map(Number);
  const mon = MONTHS[m - 1].slice(0, 3);
  if (interval === "monthly") return `${mon} ${y}`;
  const yr = opts && opts.year ? ` ’${String(y).slice(2)}` : "";
  return opts && opts.noDay ? `${mon}${yr}` : `${day} ${mon}${yr}`;
}

/** Which of those a window needs, from the dates actually plotted. */
function axisDateOpts(dates){
  if (!dates || dates.length < 2) return {};
  const first = String(dates[0]), last = String(dates[dates.length - 1]);
  return {
    // Any window straddling New Year is ambiguous without a year, however short.
    year: first.slice(0, 4) !== last.slice(0, 4),
    // Past a couple of years the day is precision nobody reads off an axis.
    noDay: (Date.parse(last) - Date.parse(first)) / 864e5 > 730,
  };
}

/** Keep the last date in each interval bucket (sorted ascending). */
function bucketDatesByInterval(dates, interval){
  if (interval === "daily" || dates.length < 2) return dates.slice();
  const last = new Map();
  for (const d of dates) last.set(indexIntervalKey(d, interval), d);
  return [...last.values()].sort();
}

const signedPct = (v, d = 2) => {
  if (v === null || v === undefined || Number.isNaN(+v)) return "—";
  const n = +v;
  return `${n > 0 ? "+" : ""}${n.toFixed(d)}%`;
};
const retClass = v => (v == null || Number.isNaN(+v)) ? "" : (+v > 0 ? "up" : +v < 0 ? "down" : "");
