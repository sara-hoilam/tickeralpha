const HOLDINGS_VISIBLE_ROWS = 14;

/** Cap the holdings scrollport to about 14 visible body rows. */
function fitHoldingsRows(){
  const scroll = document.querySelector("#idx-holdings .scroll");
  const table = scroll && scroll.querySelector("table");
  if (!scroll || !table) return;
  const head = table.querySelector("thead");
  const rows = [...table.querySelectorAll("tbody tr")].slice(0, HOLDINGS_VISIBLE_ROWS);
  if (!rows.length) return;
  const headH = head ? head.getBoundingClientRect().height : 0;
  const bodyH = rows.reduce((a, r) => a + r.getBoundingClientRect().height, 0);
  scroll.style.maxHeight = Math.ceil(headH + bodyH + 1) + "px";
}

async function loadIndexHoldings(symbol, sector){
  const holdHost = document.getElementById("idx-holdings");
  const indHost = document.getElementById("idx-industry");
  if (!holdHost || !indHost) return;
  let rows = [];
  // A sector page reads the S&P book and keeps its own slice of it.
  const src = sector ? "SPX" : symbol;
  try { rows = await rpc("get_index_holdings", { p_symbol: src }) || []; } catch {}
  if (sector) {
    rows = rows.filter(r => String(r.sector || "").trim() === sector);
    const tot = rows.reduce((a, r) => a + (+(r.weightPct ?? r.weight_pct) || 0), 0);
    if (tot > 0) {
      rows = rows
        .map(r => ({ ...r, weightPct: (+(r.weightPct ?? r.weight_pct) || 0) * 100 / tot }))
        .sort((a, b) => b.weightPct - a.weightPct);
    }
  }
  if (!rows.length) {
    holdHost.innerHTML = `<div class="note">${sector
      ? `No cached S&P 500 members carry the ${esc(sector)} label yet; they appear
         after the next index holdings refresh.`
      : `Holdings for ${esc(symbol)} are not cached yet.
      They appear after the next worker refresh (apply migration 0048/0049 if needed).`}</div>`;
    indHost.innerHTML = `<div class="note">No industry weights yet.</div>`;
    return;
  }

  // Prefer server-provided returns (0049); fall back to quote batch for today %.
  const needQuotes = rows.some(r => r.changePct == null && r.change_pct == null);
  if (needQuotes) {
    try {
      const syms = rows.map(r => r.symbol);
      const quotes = await rpc("get_symbol_quotes", { p_symbols: syms }) || [];
      const by = Object.fromEntries(quotes.map(q => [q.symbol, q]));
      rows.forEach(r => {
        const q = by[r.symbol];
        if (q && r.changePct == null) r.changePct = q.changePct;
      });
    } catch {}
  }

  holdHost.innerHTML = `<div class="scroll"><table class="htab">
    <thead><tr>
      <th>Ticker</th><th>Company</th><th>Industry</th>
      <th style="text-align:right">% Holding</th>
      <th style="text-align:right">Today</th>
      <th style="text-align:right">YTD</th>
    </tr></thead>
    <tbody>${rows.map(r => {
      const day = r.changePct ?? r.change_pct;
      const ytd = r.ytdPct ?? r.ytd_pct;
      return `<tr>
      <td><a href="company.html?t=${encodeURIComponent(r.symbol)}">${esc(r.symbol)}</a></td>
      <td class="name" title="${esc(r.name || "")}"><span class="hname">${
        window.TickerLogos ? window.TickerLogos.chip(r.symbol) : ""}<span>${esc(r.name || "—")}</span></span></td>
      <td class="ind" title="${esc(r.industry || r.sector || "")}">${esc(r.industry || r.sector || "—")}</td>
      <td class="w">${r.weightPct != null ? esc((+r.weightPct).toFixed(2) + "%") : "—"}</td>
      <td class="ret ${retClass(day)}">${esc(signedPct(day))}</td>
      <td class="ret ${retClass(ytd)}">${esc(signedPct(ytd))}</td>
    </tr>`;
    }).join("")}</tbody></table></div>
    <p class="note" style="text-align:left;padding:10px 2px 0;flex-shrink:0">Today from the latest quote close.
      YTD from cached daily bars when available. Scroll for full holdings.</p>`;
  if (window.TickerLogos) window.TickerLogos.hydrate(rows.map(r => r.symbol), holdHost);
  requestAnimationFrame(() => fitHoldingsRows());

  // Prefer GICS-style sector for the donut (fewer, clearer slices). Fall back
  // to industry when sector is missing so older caches still chart. On a
  // sector page every row shares one sector, so the donut slices by industry
  // -- the level at which that page still has a mix to show.
  const byBucket = new Map();
  rows.forEach(r => {
    const w = r.weightPct != null ? +r.weightPct : +(r.weight_pct || 0);
    if (!w) return;
    const key = (sector ? (r.industry || "") : (r.sector || r.industry || "")).trim()
      || "Other / unlisted";
    byBucket.set(key, (byBucket.get(key) || 0) + w);
  });
  const slices = [...byBucket.entries()]
    .map(([label, weight]) => ({ label, weight }))
    .sort((a, b) => b.weight - a.weight);
  let top = slices.slice(0, 9);
  const rest = slices.slice(9);
  if (rest.length) {
    top.push({ label: "Other", weight: rest.reduce((a, s) => a + s.weight, 0) });
  }
  const total = top.reduce((a, s) => a + s.weight, 0) || 1;
  const onlyOther = top.length === 1
    && /^other/i.test(top[0].label);
  // Keep the donut and labels inside one card border.
  indHost.innerHTML = `
    <section class="card panel idx-pie-card">
      <div class="idx-pie-title">${sector ? "Industry breakdown" : "Sector breakdown"}</div>
      <div class="idx-pie-wrap" id="idx-pie"></div>
      <div class="idx-pie-legend">${top.map((s, i) => {
        const colour = `var(${INDEX_PIE[i % INDEX_PIE.length]})`;
        const share = (100 * s.weight / total).toFixed(1);
        return `<span data-i="${i}"><i style="background:${colour}"></i>
          <em title="${esc(s.label)}">${esc(s.label)}</em>
          <b>${esc(share)}%</b></span>`;
      }).join("")}</div>
      ${onlyOther
        ? `<div class="note" style="text-align:left;padding:0">Sector labels fill in after the next index holdings refresh.</div>`
        : ""}
    </section>`;
  drawIndexPie(document.getElementById("idx-pie"), top, total);
  requestAnimationFrame(() => fitHoldingsRows());
}

/** Donut slice path. Full rings use two semicircles — SVG drops a single
 *  arc whose start and end points are identical (100% slice). */
function indexDonutSlicePath(cx, cy, r, r0, a0, a1){
  const sweep = a1 - a0;
  if (sweep >= Math.PI * 2 - 1e-6) {
    return `M${(cx + r).toFixed(2)},${cy.toFixed(2)}
      A${r},${r} 0 1 1 ${(cx - r).toFixed(2)},${cy.toFixed(2)}
      A${r},${r} 0 1 1 ${(cx + r).toFixed(2)},${cy.toFixed(2)}
      M${(cx + r0).toFixed(2)},${cy.toFixed(2)}
      A${r0},${r0} 0 1 0 ${(cx - r0).toFixed(2)},${cy.toFixed(2)}
      A${r0},${r0} 0 1 0 ${(cx + r0).toFixed(2)},${cy.toFixed(2)} Z`;
  }
  const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
  const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
  const xi0 = cx + r0 * Math.cos(a0), yi0 = cy + r0 * Math.sin(a0);
  const xi1 = cx + r0 * Math.cos(a1), yi1 = cy + r0 * Math.sin(a1);
  const large = sweep > Math.PI ? 1 : 0;
  return `M${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1}
          L${xi1},${yi1} A${r0},${r0} 0 ${large} 0 ${xi0},${yi0} Z`;
}

function drawIndexPie(host, slices, total){
  if (!host || !slices.length) return;
  // Roomy viewBox so on-slice labels stay inside the SVG / card border.
  const size = 300, cx = size / 2, cy = size / 2, r = 108, r0 = 56, rLab = (r + r0) / 2;
  let angle = -Math.PI / 2;
  const parts = [];
  const labels = [];
  const meta = [];
  slices.forEach((s, i) => {
    const frac = s.weight / total;
    const a0 = angle;
    const a1 = angle + frac * Math.PI * 2;
    angle = a1;
    if (frac <= 0) return;
    const colour = `var(${INDEX_PIE[i % INDEX_PIE.length]})`;
    const d = indexDonutSlicePath(cx, cy, r, r0, a0, a1);
    const share = 100 * frac;
    meta[i] = { label: s.label, share, weight: s.weight };
    parts.push(`<path d="${d}" fill="${colour}" fill-rule="evenodd" data-i="${i}"></path>`);

    // Label larger slices inside the ring so names stay within the chart border.
    if (share >= 7) {
      const mid = (a0 + a1) / 2;
      const lx = cx + rLab * Math.cos(mid);
      const ly = cy + rLab * Math.sin(mid);
      const short = s.label.length > 14 ? s.label.slice(0, 13) + "…" : s.label;
      labels.push(`
        <text x="${lx.toFixed(1)}" y="${(ly - 4).toFixed(1)}" text-anchor="middle"
          class="pie-lab">${esc(short)}</text>
        <text x="${lx.toFixed(1)}" y="${(ly + 9).toFixed(1)}" text-anchor="middle"
          class="pie-lab-pct">${share.toFixed(0)}%</text>`);
    }
  });
  host.innerHTML = `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"
    role="img" aria-label="Sector breakdown">${parts.join("")}${labels.join("")}</svg>`;

  const svg = host.querySelector("svg");
  svg.querySelectorAll("path[data-i]").forEach(path => {
    path.addEventListener("mousemove", ev => {
      const i = +path.dataset.i;
      const m = meta[i];
      if (!m) return;
      svg.classList.add("path-dim");
      path.classList.add("is-hot");
      showTip(ev, m.label, [
        ["Weight", `${m.share.toFixed(1)}%`],
        ["Index share", `${m.weight.toFixed(2)} pts`],
      ]);
    });
    path.addEventListener("mouseleave", () => {
      svg.classList.remove("path-dim");
      path.classList.remove("is-hot");
      hideTip();
    });
  });
}

/** Seasonality for a sector ETF, from its own price history. The index pages
 *  read worker-cached monthly closes; nothing caches them for the SPDRs, but
 *  the chart's stitched decade of closes is already on the page, and month-end
 *  closes are one pass over it. Waits for the bars (and the long-close stitch,
 *  which is what turns one year of months into ten) before computing. */
async function loadEtfSeasonality(symbol){
  const host = document.getElementById("season-grid");
  if (!host) return;
  for (let i = 0; i < 60 && (PRICE.symbol !== symbol || !PRICE.bars.length); i++) {
    await new Promise(r => setTimeout(r, 250));
  }
  for (let i = 0; i < 24 && PRICE.longFor !== symbol; i++) {
    await new Promise(r => setTimeout(r, 250));
  }
  if (PRICE.symbol !== symbol) return;          // moved on to another page
  const bars = PRICE.bars;
  if (!bars.length) {
    host.innerHTML = `<div class="note">Seasonality appears once price history has loaded.</div>`;
    return;
  }
  const monthly = [];
  let cur = null;
  for (const b of bars) {
    const k = String(b.d).slice(0, 7);
    if (!cur || cur.k !== k) { if (cur) monthly.push({ d: cur.d, c: cur.c }); cur = { k, d: b.d, c: b.c }; }
    else { cur.d = b.d; cur.c = b.c; }
  }
  if (cur) monthly.push({ d: cur.d, c: cur.c });
  EXTRA.symbol = symbol;
  EXTRA.data = { ...(EXTRA.data || {}), monthly };
  drawSeasonality();
  // The drawdown chart merges these monthly closes under the daily bars, the
  // same way the index pages do -- redraw now that the history exists.
  if (document.getElementById("idx-dd-chart")) drawIndexDrawdown();
}

async function loadIndexSeasonality(symbol){
  const host = document.getElementById("season-grid");
  if (!host || !HOSTED) return;
  try {
    EXTRA.data = await API.extras(symbol);
    EXTRA.symbol = symbol;
  } catch {
    host.innerHTML = `<div class="note">Seasonality unavailable.</div>`;
    return;
  }
  // Monthly closes also feed the returns/drawdown chart.
  if (document.getElementById("idx-dd-chart")) drawIndexDrawdown();
  if (!EXTRA.data || !(EXTRA.data.monthly || []).length) {
    try { await API.requestPrices(symbol); } catch {}
    host.innerHTML = `<div class="note">Seasonality will appear after the next index refresh
      (monthly closes are cached by the worker).</div>`;
    return;
  }
  drawSeasonality();
}

function wireIndexRange(hostId, getRange, setRange, onChange){
  const host = document.getElementById(hostId);
  if (!host) return;
  host.querySelectorAll("button").forEach(b => {
    b.onclick = () => {
      setRange(b.dataset.r);
      host.querySelectorAll("button").forEach(x =>
        x.setAttribute("aria-pressed", String(x.dataset.r === getRange())));
      onChange();
    };
  });
}

/** Time interval dropdown matching the price-chart toolbar. */
function renderIndexTimeMenu(hostId, getInterval, setInterval, onChange){
  const host = document.getElementById(hostId);
  if (!host) return;
  const cur = getInterval();
  const body = INDEX_INTERVALS.map(([lab, v]) =>
    `<button type="button" data-interval="${v}" class="${cur === v ? "on" : ""}">${lab}</button>`
  ).join("");
  host.innerHTML = `
    <div class="tmenu" data-menu="interval">
      <button type="button" class="tbtn" aria-expanded="false">Time
        <svg viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none"
          stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <div class="tpop"><div class="tpop-h">Interval</div>${body}</div>
    </div>`;
  const menu = host.querySelector(".tmenu");
  const btn = host.querySelector(".tbtn");
  btn.onclick = e => {
    e.stopPropagation();
    const open = menu.classList.contains("open");
    document.querySelectorAll(".idx-chart-tools .tmenu").forEach(m => m.classList.remove("open"));
    menu.classList.toggle("open", !open);
    btn.setAttribute("aria-expanded", String(!open));
  };
  host.querySelectorAll("[data-interval]").forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      setInterval(b.dataset.interval);
      menu.classList.remove("open");
      btn.setAttribute("aria-expanded", "false");
      renderIndexTimeMenu(hostId, getInterval, setInterval, onChange);
      onChange();
    };
  });
  if (!renderIndexTimeMenu._docClose) {
    renderIndexTimeMenu._docClose = true;
    document.addEventListener("click", () => {
      document.querySelectorAll(".idx-chart-tools .tmenu").forEach(m => {
        m.classList.remove("open");
        const t = m.querySelector(".tbtn");
        if (t) t.setAttribute("aria-expanded", "false");
      });
    });
  }
}

async function loadIndexPE(focusSymbol){
  const host = document.getElementById("idx-pe-chart");
  const filters = document.getElementById("idx-pe-filters");
  if (!host) return;

  let rows = [];
  try { rows = await rpc("get_index_pe_history") || []; } catch {}

  // Fallback: pull peHistory from each index's extras if the bulk RPC
  // is not applied yet.
  if (!rows.length) {
    const syms = Object.keys(INDEX_PE_META);
    rows = [];
    for (const sym of syms) {
      try {
        const d = await API.extras(sym);
        const pts = (d && d.peHistory) || [];
        if (pts.length) rows.push({ symbol: sym, name: INDEX_PE_META[sym].label, points: pts });
      } catch {}
    }
  }

  INDEX_PE.series = (rows || []).map(r => ({
    symbol: r.symbol,
    name: (INDEX_PE_META[r.symbol] && INDEX_PE_META[r.symbol].label) || r.name || r.symbol,
    colour: (INDEX_PE_META[r.symbol] && INDEX_PE_META[r.symbol].colour) || "var(--c-blue)",
    points: (r.points || r.peHistory || [])
      .filter(p => p && p.d && p.pe > 0)
      .map(p => ({ d: p.d, pe: +p.pe }))
      .sort((a, b) => a.d < b.d ? -1 : 1),
  })).filter(s => s.points.length >= 2);

  if (!INDEX_PE.series.length) {
    host.innerHTML = `<div class="note">Index P/E history is not cached yet.
      Run <span class="mono">python worker.py indexes</span> after applying migration 0049.</div>`;
  } else {
    Object.keys(INDEX_PE.on).forEach(k => { INDEX_PE.on[k] = false; });
    INDEX_PE.series.forEach(s => {
      INDEX_PE.on[s.symbol] = s.symbol !== "RUT";
    });
    if (INDEX_PE.series.some(s => s.symbol === focusSymbol))
      INDEX_PE.on[focusSymbol] = true;

    if (filters) {
      filters.hidden = false;
      filters.innerHTML = INDEX_PE.series.map(s =>
        `<button type="button" data-sym="${esc(s.symbol)}"
           aria-pressed="${INDEX_PE.on[s.symbol] ? "true" : "false"}">
           <i style="background:${s.colour}"></i>${esc(s.name)}</button>`).join("");
      filters.querySelectorAll("button").forEach(b => {
        b.onclick = () => {
          const sym = b.dataset.sym;
          const onCount = Object.values(INDEX_PE.on).filter(Boolean).length;
          if (INDEX_PE.on[sym] && onCount <= 1) return;
          INDEX_PE.on[sym] = !INDEX_PE.on[sym];
          b.setAttribute("aria-pressed", String(INDEX_PE.on[sym]));
          drawIndexPE();
        };
      });
    }
  }

  const peRangeChange = () => {
    INDEX_PE.interval = indexDefaultInterval(INDEX_PE.range);
    renderIndexTimeMenu("idx-pe-time",
      () => INDEX_PE.interval, v => { INDEX_PE.interval = v; }, drawIndexPE);
    drawIndexPE();
  };
  const ddRangeChange = () => {
    INDEX_DD.interval = indexDdDefaultInterval(INDEX_DD.range);
    renderIndexTimeMenu("idx-dd-time",
      () => INDEX_DD.interval, v => { INDEX_DD.interval = v; }, drawIndexDrawdown);
    drawIndexDrawdown();
  };
  wireIndexRange("idx-pe-range",
    () => INDEX_PE.range, r => { INDEX_PE.range = r; }, peRangeChange);
  wireIndexRange("idx-dd-range",
    () => INDEX_DD.range, r => { INDEX_DD.range = r; }, ddRangeChange);
  renderIndexTimeMenu("idx-pe-time",
    () => INDEX_PE.interval, v => { INDEX_PE.interval = v; }, drawIndexPE);
  renderIndexTimeMenu("idx-dd-time",
    () => INDEX_DD.interval, v => { INDEX_DD.interval = v; }, drawIndexDrawdown);
  drawIndexPE();
  drawIndexDrawdown();
}

function drawIndexPE(){
  const host = document.getElementById("idx-pe-chart");
  if (!host) return;
  if (!INDEX_PE.series.length) return;
  const active = INDEX_PE.series.filter(s => INDEX_PE.on[s.symbol]);
  if (!active.length) {
    host.innerHTML = `<div class="note">Select at least one index.</div>`;
    return;
  }

  const from = indexRangeStartISO(INDEX_PE.range);
  const interval = INDEX_PE.interval || "daily";
  // Align all series onto a shared date axis (union of dates), carrying
  // each line's last known PE forward between prints.
  let dates = [...new Set(active.flatMap(s => s.points.map(p => p.d)))]
    .filter(d => d >= from)
    .sort();
  if (dates.length < 2) {
    dates = [...new Set(active.flatMap(s => s.points.map(p => p.d)))].sort();
  }
  dates = bucketDatesByInterval(dates, interval);
  // Keep the polyline readable on long daily windows.
  const step = dates.length > 180 ? Math.ceil(dates.length / 140) : 1;
  const axis = dates.filter((_, i) => i % step === 0 || i === dates.length - 1);

  // Same ambiguity as the drawdown axis: this one is daily up to 1Y, and a
  // twelve-month window always straddles a New Year.
  const peAxisOpts = axisDateOpts(axis);
  const series = active.map(s => {
    let j = 0, last = null;
    while (j < s.points.length && s.points[j].d < axis[0]) {
      last = s.points[j].pe;
      j++;
    }
    const pts = axis.map(d => {
      while (j < s.points.length && s.points[j].d <= d) {
        last = s.points[j].pe;
        j++;
      }
      return {
        v: last,
        label: indexAxisLabel(d, interval, peAxisOpts),
        full: longDate(d),
      };
    });
    return { name: s.name, colour: s.colour, pts };
  });

  linePlot(host, series, {
    id: "idxpe", zero: false,
    H: MOBILE_MQ.matches ? 240 : 200,
    mb: 36, mr: 44, insideY: true, xLabels: 4,
    fmtY: v => v.toFixed(0),
    fmtV: v => v.toFixed(2) + "x",
    alt: "Forward P/E across market indexes",
    idle: "Hover to compare forward P/E across indexes.",
  });
  const key = host.querySelector(".lkey");
  if (key) key.remove();
}

/** Merged close series: monthly history plus daily bars (daily wins on overlap). */
function indexCloseSeries(){
  const map = new Map();
  ((EXTRA.data && EXTRA.data.monthly) || []).forEach(b => {
    if (b && b.d && b.c != null && +b.c > 0) map.set(String(b.d).slice(0, 10), +b.c);
  });
  (PRICE.bars || []).forEach(b => {
    if (b && b.d && b.c != null && +b.c > 0) map.set(String(b.d).slice(0, 10), +b.c);
  });
  return [...map.entries()]
    .map(([d, c]) => ({ d, c }))
    .sort((a, b) => a.d < b.d ? -1 : 1);
}

/** % below the running all-time high for every close in the series. */
function indexAthDrawdownSeries(closes){
  if (!closes.length) return [];
  let peak = closes[0].c;
  return closes.map(b => {
    if (b.c > peak) peak = b.c;
    const dd = peak > 0 ? ((b.c / peak) - 1) * 100 : 0;
    return { d: b.d, c: b.c, peak, dd };
  });
}

/**
 * Historical probability guides: for each p in INDEX_DD_PROBS, the drawdown
 * depth that was reached or exceeded on about p% of trading days in the
 * last 25 years of available history.
 */
function indexDrawdownProbLevels(fullSeries){
  if (!fullSeries.length) return [];
  const from = (() => {
    const d = new Date();
    d.setFullYear(d.getFullYear() - 25);
    return d.toISOString().slice(0, 10);
  })();
  const hist = fullSeries.filter(p => p.d >= from).map(p => p.dd);
  if (hist.length < 60) return [];
  // Ascending: most negative first so the p-th percentile is the deep end.
  const sorted = hist.slice().sort((a, b) => a - b);
  return INDEX_DD_PROBS.map(p => {
    const idx = Math.min(
      sorted.length - 1,
      Math.max(0, Math.floor((p / 100) * (sorted.length - 1)))
    );
    return { p, dd: sorted[idx] };
  }).filter(l => Number.isFinite(l.dd) && l.dd < -0.05);
}

/** Resample ATH-drawdown points to the chart interval (last print per bucket). */
function bucketAthDrawdown(series, interval){
  if (interval === "daily" || series.length < 2) return series.slice();
  const last = new Map();
  for (const p of series) last.set(indexIntervalKey(p.d, interval), p);
  return [...last.values()].sort((a, b) => a.d < b.d ? -1 : 1);
}

/** Pastel green fills for probability bands (lighter = higher probability). */
const DD_PROB_BAND_FILL = {
  50: "var(--dd-band-50)",
  25: "var(--dd-band-25)",
  10: "var(--dd-band-10)",
  5: "var(--dd-band-5)",
  1: "var(--dd-band-1)",
  deep: "var(--dd-band-deep)",
};

/** Underwater chart: % off last all-time high with historical probability bands.

    Parameterised so the company page can draw the same chart for one stock.
    The maths does not care what the series is -- indexCloseSeries() already
    merges EXTRA monthly history with PRICE daily bars, and both pages fill
    those -- so only the host, its state, and the ids of the hover elements
    differ. Defaults keep the index page's call sites unchanged. */
function drawIndexDrawdown(hostId, state, idPrefix){
  hostId = hostId || "idx-dd-chart";
  state = state || INDEX_DD;
  idPrefix = idPrefix || "idxdd";
  const host = document.getElementById(hostId);
  if (!host) return;

  const closes = indexCloseSeries();
  if (closes.length < 2) {
    host.innerHTML = `<div class="note">Drawdown appears once price history is loaded.</div>`;
    return;
  }

  const full = indexAthDrawdownSeries(closes);
  const probs = indexDrawdownProbLevels(full);
  const from = indexRangeStartISO(state.range);
  const interval = state.interval || "daily";
  let pts = full.filter(p => p.d >= from);
  if (pts.length < 2) pts = full.slice();
  pts = bucketAthDrawdown(pts, interval);
  if (pts.length < 2) {
    host.innerHTML = `<div class="note">Not enough history in this window.</div>`;
    return;
  }
  // Average over the filtered window (before display thinning).
  const avgDd = pts.reduce((a, p) => a + p.dd, 0) / pts.length;
  /* Thin by time, not by index. Dropping every Nth point thinned the sparse
     older years exactly as hard as the dense recent ones -- and those are the
     years the time axis now gives real width to, so halving twelve monthly
     points for 2022 was throwing away the part of the line that had least to
     spare. A point survives if it is the first, the last, or far enough from
     the one kept before it to earn its own pixel, which leaves sparse
     stretches untouched and thins only the crowded end. */
  if (pts.length > 220) {
    const gapMin = (Date.parse(pts[pts.length - 1].d) - Date.parse(pts[0].d)) / 400;
    const keep = [pts[0]];
    for (let i = 1; i < pts.length - 1; i++) {
      if (Date.parse(pts[i].d) - Date.parse(keep[keep.length - 1].d) >= gapMin) {
        keep.push(pts[i]);
      }
    }
    keep.push(pts[pts.length - 1]);
    pts = keep;
  }

  const low = Math.min(...pts.map(p => p.dd));
  const W = 620;
  const H = MOBILE_MQ.matches ? 280 : 240;
  // Extra right margin so drawdown % labels sit outside the plot (no overlap).
  const ml = 40, mr = 58, mt = 16, mb = 34;
  const pw = W - ml - mr, ph = H - mt - mb;
  // Always pin 0% at the top; deepen the floor for probability bands in view.
  const floor = Math.min(low, avgDd, ...probs.map(l => l.dd), -5);
  const y0 = floor * 1.08 - 0.5;
  const y1 = 0;
  const y = v => mt + ph - (v - y0) / (y1 - y0) * ph;
  /* Position by date, not by index.

     The cached series is not evenly spaced: older history is monthly and
     recent history is daily. On NVDA's 5Y window that is 12 points for 2022
     and 152 for 2026, so spacing points evenly by index put the halfway mark
     at February 2026 -- half the width spent on the last six months while
     four and a half years crowded into the other half. The line was a real
     drawdown series drawn on a lying axis, and a five-year window looked like
     a one-year one. Mapping the date onto the width fixes the geometry; the
     sparse years simply carry fewer vertices. */
  const t0 = Date.parse(pts[0].d);
  const t1 = Date.parse(pts[pts.length - 1].d);
  const tSpan = Math.max(1, t1 - t0);
  const x = i => ml + (pts.length < 2 ? pw / 2
    : (Date.parse(pts[i].d) - t0) / tSpan * pw);
  const clampY = v => Math.max(y0, Math.min(y1, v));

  // Right-axis labels only — no solid horizontal grid lines across the plot.
  const ticks = bandTicks(y0, y1, 5).filter(t => t <= 0.0001);
  const yLabels = ticks.map(t => `
    <text x="${W - mr + 6}" y="${(y(t) + 3.5).toFixed(1)}" class="ax" text-anchor="start">${
      t.toFixed(0)}%</text>`).join("");

  // Green probability bands behind the pink series.
  // Sorted shallow→deep (50% → 1%); lighter green for higher probability.
  const byP = Object.fromEntries(probs.map(l => [l.p, l.dd]));
  const bandEdges = [
    { top: 0, bot: byP[50], fill: DD_PROB_BAND_FILL[50], p: 50 },
    { top: byP[50], bot: byP[25], fill: DD_PROB_BAND_FILL[25], p: 25 },
    { top: byP[25], bot: byP[10], fill: DD_PROB_BAND_FILL[10], p: 10 },
    { top: byP[10], bot: byP[5], fill: DD_PROB_BAND_FILL[5], p: 5 },
    { top: byP[5], bot: byP[1], fill: DD_PROB_BAND_FILL[1], p: 1 },
    { top: byP[1], bot: y0, fill: DD_PROB_BAND_FILL.deep, p: null },
  ];
  const bandsSvg = probs.length ? bandEdges.map(b => {
    if (b.top == null || b.bot == null || !Number.isFinite(b.top) || !Number.isFinite(b.bot)) return "";
    const top = clampY(b.top), bot = clampY(b.bot);
    if (!(bot < top - 1e-6)) return "";
    const yTop = y(top), yBot = y(bot);
    return `<rect x="${ml}" y="${yTop.toFixed(1)}" width="${pw}" height="${Math.max(0, yBot - yTop).toFixed(1)}"
      fill="${b.fill}" stroke="none"/>`;
  }).join("") : "";

  // Left-axis probability labels at each threshold (no dotted lines).
  const probLabels = probs.map(l => {
    if (l.dd < y0 || l.dd > y1) return "";
    return `<text x="${ml - 6}" y="${(y(l.dd) + 3.5).toFixed(1)}" class="ax" text-anchor="end"
      fill="var(--ink-3)">${l.p}%</text>`;
  }).join("");

  const linePts = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.dd).toFixed(1)}`).join(" ");
  const fillD = `M${x(0).toFixed(1)},${y(0).toFixed(1)} `
    + pts.map((p, i) => `L${x(i).toFixed(1)},${y(p.dd).toFixed(1)}`).join(" ")
    + ` L${x(pts.length - 1).toFixed(1)},${y(0).toFixed(1)} Z`;

  // Pink dotted average for the active date + time filter window.
  const avgY = y(avgDd);
  const avgLabel = `Avg. drawdown ${avgDd.toFixed(1)}%`;
  const avgSvg = Number.isFinite(avgDd) ? `
    <line x1="${ml}" x2="${W - mr}" y1="${avgY.toFixed(1)}" y2="${avgY.toFixed(1)}"
      stroke="var(--dd)" stroke-width="1.2" stroke-dasharray="4 3" opacity=".9"/>
    <text x="${(ml + pw / 2).toFixed(1)}" y="${
      (avgY < mt + 16 ? avgY + 14 : avgY - 6).toFixed(1)}"
      class="ax" text-anchor="middle" fill="var(--dd)">${esc(avgLabel)}</text>` : "";

  const axisOpts = axisDateOpts(pts.map(p => p.d));
  /* Ticks are placed at even points in time and then snapped to the nearest
     real observation. Stepping by index instead would crowd every label into
     the dense recent end, which is the same mistake the axis itself used to
     make. */
  const TICKS = 6;
  const tickIdx = [];
  for (let k = 0; k < TICKS; k++) {
    const want = t0 + tSpan * (k / (TICKS - 1));
    let best = 0, bestGap = Infinity;
    for (let i = 0; i < pts.length; i++) {
      const gap = Math.abs(Date.parse(pts[i].d) - want);
      if (gap < bestGap) { bestGap = gap; best = i; }
    }
    if (!tickIdx.includes(best)) tickIdx.push(best);
  }
  const dates = tickIdx.map(i => {
    const anchor = i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle";
    return `<text x="${x(i).toFixed(1)}" y="${H - 10}" class="ax" text-anchor="${anchor}">${
      esc(indexAxisLabel(pts[i].d, interval, axisOpts))}</text>`;
  }).join("");

  const name = (S.company && (INDEX_PE_META[S.company.ticker]?.label || S.company.ticker)) || "Index";
  const yearsUsed = full.length
    ? Math.max(1, Math.round((Date.parse(full[full.length - 1].d) - Date.parse(full[0].d)) / (365.25 * 864e5)))
    : 0;

  /* The finding, in words: where the price stands against its high today,
     and how rare that is in the cached history -- the exact question the
     green bands answer, for readers who do not read bands. */
  const ddNow = pts[pts.length - 1].dd;
  const rarest = probs.filter(l => ddNow <= l.dd).map(l => l.p).sort((a, b) => a - b)[0];
  const takeaway = `<div class="chart-take">${esc(name)} sits <b>${Math.abs(ddNow).toFixed(1)}%
      below</b> its all-time high${
      rarest ? ` — it has closed at least this far down on only ~<b>${rarest}%</b> of days${
                  yearsUsed ? ` in ${yearsUsed} years` : ""}` :
      Number.isFinite(avgDd) ? ` — shallower than the ${Math.abs(avgDd).toFixed(1)}% a typical
        day in this window has sat below its high` : ""}.</div>`;

  host.innerHTML = `${takeaway}
    <svg viewBox="0 0 ${W} ${H}" class="lchart" role="img"
      aria-label="${esc(name)} percent off all-time high">
      ${bandsSvg}${probLabels}${yLabels}
      <path d="${fillD}" fill="var(--dd-fill)"/>
      <polyline points="${linePts}" fill="none" stroke="var(--dd)"
        stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${avgSvg}${dates}
      <g id="${idPrefix}-cross" style="display:none">
        <line class="xh" y1="${mt}" y2="${H - mb}" stroke="var(--ink-3)"
          stroke-width="1" stroke-dasharray="3 3"/>
        <line class="yh" x1="${ml}" x2="${W - mr}" stroke="var(--ink-3)"
          stroke-width="1" stroke-dasharray="3 3"/>
      </g>
      <rect x="${ml}" y="${mt}" width="${pw}" height="${ph}" fill="transparent" class="hit"/>
    </svg>
    <div class="lkey">
      <span><i style="background:var(--dd)"></i>% off high</span>
      <span><i class="dd-prob-swatch" aria-hidden="true"></i>Hist. probability</span>
      ${probs.length ? "" : `<span class="note" style="margin:0">Probability bands need more history</span>`}
    </div>
    <div class="lread" id="${idPrefix}-read">Hover to read date and drawdown depth.${
      yearsUsed ? ` Guides use ~${yearsUsed}y of cached history.` : ""}</div>`;

  const svg = host.querySelector("svg");
  const cross = host.querySelector("#" + idPrefix + "-cross");
  const xh = cross.querySelector(".xh");
  const yh = cross.querySelector(".yh");
  const hit = host.querySelector(".hit");
  const read = host.querySelector("#" + idPrefix + "-read");

  const showAt = (clientX) => {
    const r = svg.getBoundingClientRect();
    const px = (clientX - r.left) / r.width * W;
    // Pixel back to a date, then the nearest observation to it -- the inverse
    // of the axis, so the crosshair lands where the pointer actually is even
    // where the series is sparse.
    const want = t0 + Math.max(0, Math.min(1, (px - ml) / Math.max(1e-6, pw))) * tSpan;
    let i = 0, bestGap = Infinity;
    for (let k = 0; k < pts.length; k++) {
      const gap = Math.abs(Date.parse(pts[k].d) - want);
      if (gap < bestGap) { bestGap = gap; i = k; }
    }
    const p = pts[i];
    cross.style.display = "";
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i));
    yh.setAttribute("y1", y(p.dd)); yh.setAttribute("y2", y(p.dd));
    if (read) {
      read.innerHTML = `<b>${esc(longDate(p.d))}</b>
        <span><i style="background:var(--dd)"></i>${p.dd.toFixed(2)}% off high</span>`;
    }
  };

  hit.addEventListener("pointermove", e => {
    if (e.pointerType === "touch") return;
    showAt(e.clientX);
  });
  hit.addEventListener("pointerleave", () => {
    cross.style.display = "none";
    if (read) {
      read.innerHTML = `Hover to read date and drawdown depth.${
        yearsUsed ? ` Guides use ~${yearsUsed}y of cached history.` : ""}`;
    }
  });
}

/* ---- company page: drawdown + correlation ---------------------------------
   The drawdown chart is the index page's, drawn against this company's own
   close series. The correlation chart is new. Both share the drawdown's box so
   the pair reads as one row. */
const CO_DD = { range: "5Y", interval: "daily" };
// SPX carries five years of daily bars where an ordinary company has ten
// months, so it is both the comparison people want and the deepest series
// available to compare against.
const CORR_DEFAULT = "SPX";
const CORR = { range: "1Y", other: null, bars: null, state: "idle", poll: null };

function drawCompanyDrawdown(){
  drawIndexDrawdown("co-dd-chart", CO_DD, "codd");
}

/** Index symbols read as tickers in the data but not to a reader. */
const CORR_LABEL = { SPX: "S&P 500", IXIC: "Nasdaq 100", DJI: "Dow Jones" };
const corrLabel = sym => CORR_LABEL[sym] || sym || "";

/** Plain words for r, on the five bands a reader actually distinguishes. */
function corrStrength(r){
  if (r >= 0.6) return "strongly positive correlation";
  if (r >= 0.2) return "slightly positive correlation";
  if (r > -0.2) return "no correlation";
  if (r > -0.6) return "slightly negative correlation";
  return "strongly negative correlation";
}

/** Daily returns keyed by date, from a bars array. */
function returnsByDate(bars){
  const clean = (bars || [])
    .filter(b => b && b.d && b.c != null && +b.c > 0)
    .map(b => ({ d: String(b.d).slice(0, 10), c: +b.c }))
    .sort((a, b) => a.d < b.d ? -1 : 1);
  const out = new Map();
  for (let i = 1; i < clean.length; i++)
    out.set(clean[i].d, clean[i].c / clean[i - 1].c - 1);
  return out;
}

/** Pearson correlation over paired samples. */
function pearson(xs, ys){
  const n = xs.length;
  if (n < 3) return null;
  const mx = xs.reduce((a, b) => a + b, 0) / n;
  const my = ys.reduce((a, b) => a + b, 0) / n;
  let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) {
    const dx = xs[i] - mx, dy = ys[i] - my;
    sxy += dx * dy; sxx += dx * dx; syy += dy * dy;
  }
  if (sxx <= 0 || syy <= 0) return null;
  return { r: sxy / Math.sqrt(sxx * syy), slope: sxy / sxx, mx, my };
}

async function loadCorrelation(sym){
  sym = String(sym || "").toUpperCase().trim();
  if (!/^[A-Z][A-Z.\-]{0,9}$/.test(sym)) {
    CORR.state = "bad"; return drawCorrelation();
  }
  if (sym === (S.ticker || "").toUpperCase()) {
    // Reaching here from the default on an S&P page is not a user error, so
    // swap to a different benchmark rather than showing a scolding.
    if (sym === CORR_DEFAULT) return loadCorrelation("SPY");
    CORR.state = "self"; return drawCorrelation();
  }
  clearTimeout(CORR.poll);
  CORR.other = sym; CORR.bars = null; CORR.state = "loading";
  drawCorrelation();

  let d = null;
  try { d = await API.prices(sym); } catch {}
  if (CORR.other !== sym) return;                 // another ticker was asked for

  if (d && (d.bars || []).length) {
    CORR.bars = d.bars; CORR.state = "ok";
    return drawCorrelation();
  }
  // Nobody has opened this company before: queue it and wait, the same way
  // the price panel does.
  try { await API.requestPrices(sym); } catch {}
  if (CORR.other !== sym) return;
  CORR.state = "fetching"; drawCorrelation();

  let tries = 0;
  const tick = async () => {
    if (CORR.other !== sym) return;
    if (tries++ > 30) { CORR.state = "timeout"; return drawCorrelation(); }
    let r = null;
    try { r = await API.prices(sym); } catch {}
    if (CORR.other !== sym) return;
    if (r && (r.bars || []).length) {
      CORR.bars = r.bars; CORR.state = "ok";
      return drawCorrelation();
    }
    CORR.poll = setTimeout(tick, 3000);
  };
  CORR.poll = setTimeout(tick, 2000);
}

function corrNote(msg){
  const host = document.getElementById("corr-chart");
  if (host) host.innerHTML = `<div class="note">${msg}</div>`;
}

/** Scatter of this company's daily returns against another ticker's.

    Returns, not price levels: two rising stocks correlate near 1 on price
    whatever they do day to day, which says only that both went up. Returns
    answer the question actually being asked -- do they move together. */
function drawCorrelation(){
  const host = document.getElementById("corr-chart");
  if (!host) return;

  if (CORR.state === "idle")
    return corrNote("Enter a ticker above to plot it against " + esc(S.ticker || "this company") + ".");
  if (CORR.state === "bad")     return corrNote("That does not look like a ticker.");
  if (CORR.state === "self")    return corrNote("Pick a different company to compare against.");
  if (CORR.state === "loading") return corrNote(`<span class="load"></span> &nbsp;Loading ${esc(CORR.other)}…`);
  if (CORR.state === "fetching")
    return corrNote(`<span class="load"></span> &nbsp;Fetching prices for ${esc(CORR.other)}…`);
  if (CORR.state === "timeout")
    return corrNote(`Prices for ${esc(CORR.other)} are still being fetched. Try again in a minute.`);

  const mine = returnsByDate(PRICE.bars || []);
  const theirs = returnsByDate(CORR.bars || []);
  if (!mine.size) return corrNote("Correlation appears once this company's price history is loaded.");

  const from = indexRangeStartISO(CORR.range);
  const days = [...mine.keys()].filter(d => d >= from && theirs.has(d)).sort();
  if (days.length < 10)
    return corrNote(`Only ${days.length} overlapping trading day${days.length === 1 ? "" : "s"} in this window. Pick a longer range.`);

  const ys = days.map(d => mine.get(d));          // this company, vertical
  const xs = days.map(d => theirs.get(d));        // the comparison, horizontal
  const fit = pearson(xs, ys);
  if (!fit) return corrNote("Not enough variation in this window to measure correlation.");

  // Same box as the drawdown chart beside it, so the pair matches.
  const W = 620;
  const H = MOBILE_MQ.matches ? 280 : 240;
  const ml = 40, mr = 58, mt = 16, mb = 34;
  const pw = W - ml - mr, ph = H - mt - mb;

  const span = v => { const m = Math.max(...v.map(Math.abs)) || 0.01; return m * 1.08; };
  const xm = span(xs), ym = span(ys);
  const X = v => ml + ((v + xm) / (2 * xm)) * pw;
  const Y = v => mt + ph - ((v + ym) / (2 * ym)) * ph;

  const parts = [];
  const pct = v => (v * 100).toFixed(v === 0 ? 0 : 1) + "%";
  for (let i = 0; i <= 4; i++) {
    const vx = -xm + (2 * xm) * i / 4, vy = -ym + (2 * ym) * i / 4;
    parts.push(`<text x="${X(vx).toFixed(1)}" y="${H - mb + 15}" class="ax"
        text-anchor="middle">${pct(vx)}</text>
      <text x="${W - mr + 6}" y="${(Y(vy) + 3.5).toFixed(1)}" class="ax"
        text-anchor="start">${pct(vy)}</text>`);
  }
  // Zero lines: the quadrants are the reading. Points in the lower-right and
  // upper-left are days the two moved opposite ways.
  parts.push(`<line x1="${X(0)}" y1="${mt}" x2="${X(0)}" y2="${mt + ph}" stroke="var(--rule)"/>
    <line x1="${ml}" y1="${Y(0)}" x2="${W - mr}" y2="${Y(0)}" stroke="var(--rule)"/>`);

  // A dot is one day's pair, so it cannot belong to one ticker or the other.
  // What it can say is whether the two agreed that day: green where both moved
  // the same way, pink where they moved opposite ways. Correlation is exactly
  // the balance between those two colours, so the scatter now shows its own
  // headline number. The axis titles carry a colour each to name the tickers.
  let agree = 0;
  days.forEach((d, i) => {
    const same = (xs[i] >= 0) === (ys[i] >= 0);
    if (same) agree++;
    parts.push(`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(ys[i]).toFixed(1)}" r="2.3"
      fill="${same ? "var(--up)" : "var(--down)"}" fill-opacity=".62"
      ><title>${esc(d)} · ${esc(CORR.other)} ${pct(xs[i])} · ${
      esc(S.ticker || "")} ${pct(ys[i])} · ${same ? "same direction" : "opposite directions"
      }</title></circle>`);
  });

  // Least-squares line, clipped to the plot.
  const b = fit.my - fit.slope * fit.mx;
  const ends = [-xm, xm].map(vx => ({ vx, vy: fit.slope * vx + b }));
  const clamp = p => Math.max(-ym, Math.min(ym, p));
  parts.push(`<line x1="${X(ends[0].vx).toFixed(1)}" y1="${Y(clamp(ends[0].vy)).toFixed(1)}"
    x2="${X(ends[1].vx).toFixed(1)}" y2="${Y(clamp(ends[1].vy)).toFixed(1)}"
    stroke="var(--accent)" stroke-width="1.8" opacity=".95"/>`);

  const mineName = esc(S.ticker || "");
  const theirName = esc(corrLabel(CORR.other));
  parts.push(`<text x="${ml + pw / 2}" y="${H - 3}" text-anchor="middle" class="ax"
      fill="var(--down)">${theirName} daily return</text>
    <text transform="translate(11,${mt + ph / 2}) rotate(-90)" text-anchor="middle" class="ax"
      fill="var(--up)">${mineName} daily return</text>`);

  const r = fit.r;
  host.innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" class="lchart" role="img"
       aria-label="Daily returns of ${mineName} against ${theirName}">
       ${parts.join("")}</svg>
     <div class="lkey">
       <span><b style="font-size:13px;color:var(--ink)">r = ${r.toFixed(2)}</b></span>
       <span><b>${esc(corrStrength(r))}</b></span>
       <span><i style="background:var(--up)"></i>same direction (${agree})</span>
       <span><i style="background:var(--down)"></i>opposite (${days.length - agree})</span>
       <span>β ${fit.slope.toFixed(2)}</span>
       <span>${days.length} shared days</span>
     </div>
     <div class="lread">Each dot is one trading day. The blue line is the
       least-squares fit; β is its slope.</div>`;
}

/** Same suggestion list as the header search, on the correlation box: typing
    "Tesla" should offer TSLA rather than requiring the ticker to be known. */
function wireCorrSuggest(input, onPick, acId){
  const ac = document.getElementById(acId || "corr-ac");
  if (!ac) return () => {};
  let items = [], idx = -1, timer = null;
  const close = () => {
    ac.classList.remove("open"); ac.innerHTML = "";
    input.setAttribute("aria-expanded", "false"); idx = -1;
  };
  const take = x => { if (!x) return; input.value = x.ticker; close(); onPick(x.ticker); };

  input.addEventListener("input", () => {
    clearTimeout(timer);
    const term = input.value.trim();
    if (term.length < 1) return close();
    timer = setTimeout(async () => {
      let rows = [];
      try { rows = (await API.search(term)) || []; } catch { return close(); }
      if (input.value.trim() !== term) return;       // typed on while waiting
      items = rows.slice(0, 8); idx = -1;
      if (!items.length) return close();
      ac.innerHTML = items.map((x, i) => {
        const kind = x.kind && x.kind !== "stock" ? ` · ${x.kind}` : "";
        return `<div role="option" data-i="${i}" aria-selected="false"><b>${esc(x.ticker)}</b>` +
               `<span>${esc(x.name || "")}${esc(kind)}</span></div>`;
      }).join("");
      ac.classList.add("open");
      input.setAttribute("aria-expanded", "true");
    }, 130);
  });

  ac.addEventListener("mousedown", ev => {
    const d = ev.target.closest("[data-i]");
    if (d) { ev.preventDefault(); take(items[+d.dataset.i]); }
  });
  input.addEventListener("keydown", ev => {
    if (!ac.classList.contains("open")) return;
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      idx = (idx + (ev.key === "ArrowDown" ? 1 : items.length - 1)) % items.length;
      [...ac.children].forEach((c, i) => c.setAttribute("aria-selected", i === idx));
    } else if (ev.key === "Enter") {
      ev.preventDefault(); take(idx >= 0 ? items[idx] : items[0]);
    } else if (ev.key === "Escape") close();
  });
  input.addEventListener("blur", () => setTimeout(close, 120));
  return close;
}

function wireCorrelation(){
  const input = document.getElementById("corr-q");
  const go = document.getElementById("corr-go");
  if (!input || !go) return;
  const closeAc = wireCorrSuggest(input, sym => loadCorrelation(sym));
  const submit = () => {
    closeAc();
    const v = input.value.trim();
    if (v) loadCorrelation(v);
  };
  go.onclick = submit;
  input.addEventListener("keydown", ev => {
    // The suggestion list handles Enter while it is open.
    if (ev.key === "Enter" && !document.getElementById("corr-ac").classList.contains("open")) {
      ev.preventDefault(); submit();
    }
  });

  wireIndexRange("corr-range", () => CORR.range, r => { CORR.range = r; }, drawCorrelation);
  wireIndexRange("co-dd-range", () => CO_DD.range, r => {
    CO_DD.range = r;
    CO_DD.interval = indexDdDefaultInterval(r);
  }, drawCompanyDrawdown);

  // Against the market by default: the comparison almost everyone wants first,
  // and the one that makes beta mean what people expect it to mean. Deferred
  // until the panel is actually on screen, though -- fetching SPX during the
  // first paint added a request to a page that may never show this tab.
  drawCorrelation();
  if (!CORR.other) {
    const host = document.getElementById("corr-chart");
    if (!host) return;
    if (typeof IntersectionObserver !== "function") return loadCorrelation(CORR_DEFAULT);
    const io = new IntersectionObserver(entries => {
      if (!entries.some(e => e.isIntersecting)) return;
      io.disconnect();
      if (!CORR.other) loadCorrelation(CORR_DEFAULT);
    }, { rootMargin: "200px" });
    io.observe(host);
  }
}

async function load(ticker, source){
  S.ticker = ticker;
  GA.track("view_ticker", { ticker, source });
  if (window.posthog) window.posthog.capture("ticker_viewed", { ticker, source });
  openReport(ticker);
  busy(`Loading ${ticker}…`);
  fyEl.disabled = fqEl.disabled = true;
  try {
    let j = await API.company(ticker);

    if (j && j.error) return fail(j.error);

    if (!j || !j.quarters || !j.quarters.length) {
      if (!HOSTED)
        return fail(`No quarterly income-statement data found for ${ticker} in SEC XBRL filings.`);

      // Not in the SEC directory (or no company row yet): serve FMP ETF/crypto
      // as a price chart instead of queuing a doomed EDGAR backfill.
      if (!j || !j.ticker) {
        const meta = await marketSymbolMeta(ticker);
        if (meta) return openMarketSymbol(ticker, meta);

        // A foreign private issuer is in EDGAR but files 20-F under IFRS, not
        // 10-Q under US GAAP, so the backfill has nothing to find and the page
        // used to spend two minutes discovering that -- which is why HSBC, SAP
        // and Toyota were slow. They do have a price. Show it at once, and let
        // the ingest run behind the page so filings appear if any ever land.
        let px = null;
        try { px = await API.prices(ticker); } catch {}
        if (!px || !(px.quote || (px.bars || []).length)) {
          // Nothing cached: ask for both and give prices a moment, since they
          // arrive in seconds where filings take a minute or more.
          try { await API.requestPrices(ticker); } catch {}
          await new Promise(r => setTimeout(r, 2500));
          try { px = await API.prices(ticker); } catch {}
        }
        if (px && (px.quote || (px.bars || []).length)) {
          API.requestBackfill(ticker).catch(() => {});
          return openMarketSymbol(ticker, {
            symbol: ticker,
            name: (px.quote && px.quote.name) || ticker,
            exchange: (px.quote && (px.quote.exchange || px.quote.exchangeShortName)) || "",
          });
        }
      }

      busy(`${ticker} has not been read yet — fetching it from SEC EDGAR…`);
      const got = await waitForBackfill(ticker);
      if (got.refused) {
        const meta = await marketSymbolMeta(ticker);
        if (meta) return openMarketSymbol(ticker, meta);
        return fail(`${ticker}: ${got.refused}.`);
      }
      // No filings to read is not the same as nothing to show. The market
      // still prices these companies, so fall back to what FMP knows and say
      // plainly which half is missing.
      if (got.failed)   return marketOnly(ticker, j, got.failed);
      if (got.empty)    return marketOnly(ticker, j,
        `No quarterly income-statement data was found for ${ticker} in SEC ` +
        `XBRL filings.`);
      if (got.timedOut) return marketOnly(ticker, j,
        `${ticker} is still being read from SEC EDGAR. Reload in a minute for ` +
        `the filed financials.`);
      j = got.company;
    }
    S.company = j;
    // Default to the most recent quarter the company has actually reported.
    S.quarter = j.quarters[0];
    buildPeriodControls();
    render();
    loadSegments();
    history.replaceState(null,"", "?t=" + encodeURIComponent(ticker));
  } catch (e) {
    fail("Could not reach the local server. Is server.py still running? (" + e.message + ")");
  }
}

function buildPeriodControls(){
  const qs = S.company.quarters;
  const years = [...new Set(qs.map(q => q.fy))].sort((a,b) => b-a);
  fyEl.innerHTML = years.map(y => `<option value="${y}">FY ${y}</option>`).join("");
  fyEl.value = S.quarter.fy;
  syncQuarters();
  fyEl.disabled = fqEl.disabled = false;
}
function syncQuarters(){
  const fy = +fyEl.value;
  const avail = S.company.quarters.filter(q => q.fy === fy).sort((a,b) => a.fq - b.fq);
  fqEl.innerHTML = avail.map(q => `<option value="${q.fq}">Q${q.fq}</option>`).join("");
  const match = avail.find(q => q.fq === S.quarter.fq) || avail[avail.length-1];
  fqEl.value = match.fq;
  return match;
}
fyEl.addEventListener("change", () => { S.quarter = syncQuarters(); render(); loadSegments(); });
fqEl.addEventListener("change", () => {
  S.quarter = S.company.quarters.find(q => q.fy === +fyEl.value && q.fq === +fqEl.value);
  render(); loadSegments();
});

/** The same fiscal quarter one year earlier, when the company has filed it. */
function prevYearQuarter(){
  if (!S.company || !S.quarter) return null;
  return S.company.quarters.find(q =>
    q.fy === S.quarter.fy - 1 && q.fq === S.quarter.fq) || null;
}

async function loadSegments(){
  S.breakdowns = null; S.breakdownsPrior = null; S.cut = 0;
  renderMix();
  // The prior year's segments ride along for the Sankey's Y/Y figures. In
  // parallel: the second call must not delay the diagram, and a company
  // without last year's filing simply shows no deltas.
  const prev = prevYearQuarter();
  const [cur, old] = await Promise.all([
    API.segments(S.ticker, S.quarter.end).catch(() => []),
    prev ? API.segments(S.ticker, prev.end).catch(() => null) : Promise.resolve(null),
  ]);
  S.breakdowns = cur || [];
  S.breakdownsPrior = old;
  renderMix();
  renderSankey();
}

/* ===========================================================================
   Derived helpers
=========================================================================== */
const at = (q,k) => q && q.lines ? q.lines[k] : null;
function yoy(key){
  const qs = S.company.quarters;
  const i = qs.indexOf(S.quarter);
  const prior = qs.find(q => q.fy === S.quarter.fy - 1 && q.fq === S.quarter.fq);
  const a = at(S.quarter,key), b = at(prior,key);
  if (a === null || b === null || !b) return null;
  return (a - b) / Math.abs(b) * 100;
}
const marginOf = k => {
  const r = at(S.quarter,"revenue"), v = at(S.quarter,k);
  return (r && v !== null) ? v / r * 100 : null;
};
/** The last n quarters up to and including the selected one, oldest first. */
/** The SEC stores registered names in capitals -- "SPACE EXPLORATION
    TECHNOLOGIES CORP" -- which reads as a different company from the one the
    rest of the site calls Space Exploration Technologies Corp. The market feed
    carries the same name properly cased, including the capitals inside a word
    that no title-casing rule could recover: AstraZeneca, not Astrazeneca.

    So the heading is corrected from the quote rather than transformed. It only
    replaces a name that is entirely uppercase, so a company already cased in
    its filings keeps exactly what it filed. */
function applyQuoteName(){
  const nice = PRICE.quote && PRICE.quote.name;
  if (!nice || !S.company) return;
  const shown = String(S.company.name || "").trim();
  // Patching the heading in the DOM was not enough: the report re-renders once
  // the quarter is set and wrote the filed name back over it. Correcting the
  // company record instead means every later render uses the cased name.
  if (!shown || /[a-z]/.test(shown)) return;
  // Guard against a feed name for a different listing: require the same words.
  const words = t => String(t).toUpperCase().replace(/[^A-Z0-9 ]/g, " ")
                     .split(/\s+/).filter(w => w.length > 2);
  const a = words(shown), b = new Set(words(nice));
  const overlap = a.filter(w => b.has(w)).length;
  if (a.length && overlap / a.length < 0.6) return;

  S.company.name = nice;
  const h1 = document.querySelector(".ident h1");
  if (h1) h1.textContent = nice;                 // already on screen
}

function recentQuarters(n){
  const qs = S.company.quarters;
  const i = qs.indexOf(S.quarter);
  return qs.slice(i, i + n).reverse();
}

/** The fiscal period immediately before this one -- Q1 for a Q2, Q4 of the
    prior year for a Q1 -- and null when the company did not report it.

    Taking "the next row in the list" instead looks right for a company that
    files every quarter and is wrong for one that does not: AstraZeneca tags
    only Q2, so the next row is Q2 a year earlier and QoQ came out identical
    to YoY. An absent comparison should read as absent. */
function priorQuarter(q){
  const fy = q.fq > 1 ? q.fy : q.fy - 1;
  const fq = q.fq > 1 ? q.fq - 1 : 4;
  return S.company.quarters.find(x => x.fy === fy && x.fq === fq) || null;
}

const sameQuarterLastYear = q =>
  S.company.quarters.find(x => x.fy === q.fy - 1 && x.fq === q.fq) || null;

/** Change against the previous quarter and the same quarter a year earlier. */
function growth(q, key){
  const prev = priorQuarter(q);
  const back = sameQuarterLastYear(q);
  const rel = (a, b) =>
    (a === null || a === undefined || b === null || b === undefined || !b)
      ? null : (a - b) / Math.abs(b) * 100;
  return {qoq: rel(q.lines[key], prev && prev.lines[key]),
          yoy: rel(q.lines[key], back && back.lines[key])};
}

/** Tooltip rows for the two growth rates, coloured by direction. */
function growthRows(q, key){
  const g = growth(q, key);
  const fmt = v => v === null ? ["—", ""]
    : [`${sign(v)}${v.toFixed(1)}%`, v >= 0 ? "up" : "down"];
  const [qs_, qc] = fmt(g.qoq), [ys, yc] = fmt(g.yoy);
  return [["QoQ", qs_, qc], ["YoY", ys, yc]];
}

/* ---------------------------------------------------------------------------
   The fields a chart can plot. Only those the loaded company actually
   reports are ever offered, so a chart can never be built from data that
   is not in the filings.
--------------------------------------------------------------------------- */
const FIELDS = [
  {k:"revenue",           label:"Revenue",              unit:"usd",   syn:["revenue","sales","top line","turnover"]},
  {k:"cogs",              label:"Cost of revenue",      unit:"usd",   syn:["cost of revenue","cogs","cost of sales","cost of goods"]},
  {k:"grossProfit",       label:"Gross profit",         unit:"usd",   syn:["gross profit","gross margin","gross income"]},
  {k:"rd",                label:"R&D",                  unit:"usd",   syn:["r&d","rd","research","research and development","research & development"]},
  {k:"sm",                label:"Sales & marketing",    unit:"usd",   syn:["sales and marketing","sales & marketing","s&m","marketing"]},
  {k:"ga",                label:"General & admin",      unit:"usd",   syn:["general and admin","g&a","administrative"]},
  {k:"sga",               label:"SG&A",                 unit:"usd",   syn:["sga","sg&a","selling general"]},
  {k:"opexOther",         label:"Other operating exp.", unit:"usd",   syn:["other operating"]},
  {k:"opex",              label:"Operating expenses",   unit:"usd",   syn:["operating expenses","opex","operating cost","non-interest expense","noninterest expense"]},
  {k:"provisions",        label:"Credit provisions",    unit:"usd",   syn:["provisions","credit provisions","provision for credit losses","loan losses"]},
  {k:"operatingIncome",   label:"Operating income",     unit:"usd",   syn:["operating income","operating profit","ebit"]},
  {k:"otherIncome",       label:"Other income",         unit:"usd",   syn:["other income","non-operating"]},
  {k:"pretaxIncome",      label:"Pre-tax income",       unit:"usd",   syn:["pre-tax","pretax","before tax"]},
  {k:"tax",               label:"Income tax",           unit:"usd",   syn:["tax","income tax","taxes"]},
  {k:"netIncome",         label:"Net income",           unit:"usd",   syn:["net income","net profit","bottom line","earnings"]},
  {k:"epsDiluted",        label:"Diluted EPS",          unit:"eps",   syn:["eps","earnings per share","diluted eps"]},
  {k:"sharesDiluted",     label:"Diluted shares",       unit:"count", syn:["shares","share count","diluted shares"]},
  {k:"operatingCashFlow", label:"Operating cash flow",  unit:"usd",   syn:["operating cash flow","cash from operations","ocf","cfo","cash flow"]},
  {k:"capex",             label:"Capital expenditure",  unit:"usd",   syn:["capex","capital expenditure","capital spending","ppe"]},
  {k:"freeCashFlow",      label:"Free cash flow",       unit:"usd",   syn:["free cash flow","fcf"]},
  {k:"investingCashFlow", label:"Investing cash flow",  unit:"usd",   syn:["investing cash flow","cash from investing"]},
  {k:"financingCashFlow", label:"Financing cash flow",  unit:"usd",   syn:["financing cash flow","cash from financing"]},
  {k:"depreciation",      label:"Depreciation & amort.",unit:"usd",   syn:["depreciation","amortization","d&a"]},
  {k:"stockComp",         label:"Stock compensation",   unit:"usd",   syn:["stock compensation","sbc","share-based"]},
];
const FIELD = Object.fromEntries(FIELDS.map(f => [f.k, f]));

/** Fields this company reports — anything else is never offered. */
function availableFields(){
  const qs = S.company.quarters;
  return FIELDS.filter(f => qs.some(q => q.lines[f.k] !== null && q.lines[f.k] !== undefined));
}

function fmtBy(unit, v, dp){
  if (v === null || v === undefined || Number.isNaN(v)) return "—";
  if (unit === "eps")   return (v < 0 ? "−$" : "$") + Math.abs(v).toFixed(2);
  if (unit === "count") return (v/1e6).toFixed(0) + "M";
  return money(v, dp);
}
