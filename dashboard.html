<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticker Alpha — quarterly financials from SEC filings</title>
<!-- Deployed builds ship this pointing at Supabase. Absent locally, where the
     page falls back to server.py. -->
<script src="config.js"></script>
<script src="logo.js"></script>
<script src="analytics.js"></script>
<script src="posthog-init.js"></script>
<script type="module" src="clarity-init.js"></script>
<link rel="stylesheet" href="nav.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Every page's first act is an RPC to Supabase; warming the connection here
     saves the DNS + TCP + TLS setup that otherwise sits in front of the first
     byte of data. The origin is already public in config.js. -->
<link rel="preconnect" href="https://etembhwwbqswzcepfhxp.supabase.co" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   Ticker Alpha — a reading surface for filed financial statements.

   Neutrals are biased blue so the accent belongs to the same family; the
   categorical data colours are the validated palette (see README) and are the
   only saturated hues that appear on a chart.
--------------------------------------------------------------------------- */
:root {
  color-scheme: light;
  --ground:#eef0f3; --card:#ffffff; --sunk:#f6f7f9;
  --ink:#111820; --ink-2:#4a5866; --ink-3:#78889a;
  --rule:#dde2e8; --rule-2:#eaeef2;
  --accent:#1e4fbf; --accent-soft:#e6ecfb;
  /* Chart colours that must read as distinct at a glance, rather than
     as shades of the interface. */
  --c-blue:#2f7dff; --c-grey:#98a2b3; --c-band:#7c3aed; --c-bandfill:#7c3aed1f;
  --up:#0b7a4b; --down:#c0392e;
  --up-soft:#e3f5ec; --down-soft:#fce8e6;

  --revenue:#2a78d6; --profit:#008300; --cost:#e34948;

  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  /* Underwater / % off high drawdown chart + pastel probability bands
     (lighter = more common / higher probability). */
  --dd:#c73d8a; --dd-fill:#c73d8acc; --dd-soft:#f7e6ef;
  --dd-band-50:#e5f3e4; --dd-band-25:#d0e9cf; --dd-band-10:#b7dcb6;
  --dd-band-5:#9ccf9b; --dd-band-1:#7fbe80; --dd-band-deep:#63ad68;

  --shadow:0 1px 2px rgba(17,24,32,.06), 0 6px 20px -12px rgba(17,24,32,.22);
  --r:10px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:#0d1219; --card:#151c25; --sunk:#111821;
  --ink:#e7edf4; --ink-2:#a3b1c0; --ink-3:#77879a;
  --rule:#232d3a; --rule-2:#1c2531;
  --accent:#6e9bff; --accent-soft:#1a2740;
  --c-blue:#4d94ff; --c-grey:#7d8899; --c-band:#a78bfa; --c-bandfill:#a78bfa26;
  --up:#38b37d; --down:#f0736a;
  --up-soft:#163528; --down-soft:#3a1c1c;

  --revenue:#3987e5; --profit:#00a300; --cost:#e66767;

  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --dd:#e85aa3; --dd-fill:#e85aa3c0; --dd-soft:#3a1a2c;
  --dd-band-50:#1e3224; --dd-band-25:#23402c; --dd-band-10:#274c33;
  --dd-band-5:#2b583a; --dd-band-1:#306644; --dd-band-deep:#35744e;

  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.8);
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  background:var(--ground); color:var(--ink);
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---- form controls ------------------------------------------------------- */
.field{position:relative;display:flex;flex-direction:column;gap:3px}
.field>label{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
input,select,button{font:inherit;color:inherit}
input[type=text],select{
  background:var(--card); border:1px solid var(--rule); border-radius:7px;
  padding:7px 10px; min-height:34px; color:var(--ink);
}
input[type=text]{width:230px;font-family:"IBM Plex Mono",monospace;font-size:13px}
select{cursor:pointer;font-size:13px;padding-right:26px;
  appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 14px) 51%, calc(100% - 9px) 51%;
  background-size:5px 5px,5px 5px; background-repeat:no-repeat;
}
input:focus-visible,select:focus-visible,button:focus-visible{
  outline:2px solid var(--accent); outline-offset:1px;
}
select:disabled{opacity:.45;cursor:not-allowed}

.ac{
  position:absolute; top:calc(100% + 5px); left:0; z-index:60; width:340px;
  background:var(--card); border:1px solid var(--rule); border-radius:9px;
  box-shadow:var(--shadow); overflow:hidden; display:none;
}
.ac.open{display:block}
.ac div{padding:8px 11px;cursor:pointer;display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--rule-2)}
.ac div:last-child{border-bottom:0}
.ac div:hover,.ac div[aria-selected=true]{background:var(--accent-soft)}
.ac b{font-family:"IBM Plex Mono",monospace;font-size:12.5px;min-width:62px;color:var(--accent)}
.ac span{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.spacer{flex:1}
.ghost{
  background:transparent;border:1px solid var(--rule);border-radius:7px;
  padding:7px 11px;cursor:pointer;color:var(--ink-2);font-size:12.5px;min-height:34px;
}
.ghost:hover{border-color:var(--accent);color:var(--accent)}

/* ---- page ---------------------------------------------------------------- */
main{max-width:var(--page,1680px);margin:0 auto;padding:24px 28px 72px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px 22px}

.ident{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:20px}
.ident-with-logo{display:flex;flex-direction:row;align-items:flex-start;gap:12px;min-width:0}
/* Locked until generated reports ship. Reads as a real control so the offer
   registers, but muted so nobody thinks it failed when it does not unlock. */
/* Its own line at the foot of the identity block, left edge flush with the
   price chart card below it. */
/* The wrapper claims its own line so the button escapes the title block, then
   mirrors .pricerow's grid so its right edge lands exactly on the chart card's
   -- 292px panel plus an 18px gap in from the row's right edge. Mirroring the
   grid rather than hard-coding 310px means the two stay together if the split
   ever changes, including when it collapses to one column below 1080px.
   The negative margin lifts the line back up level with the ticker chips; the
   title block ends at ~510px and the button starts past 950, so nothing
   collides. */
.unlockrow{flex-basis:100%;order:3;display:grid;gap:18px;
  grid-template-columns:minmax(0,1fr) 292px;margin-top:-34px;
  /* .ident aligns its items to flex-end, which swallows a top margin past a
     point -- the item's bottom stays pinned to the line. A relative offset
     moves it regardless, and leaves the chart below exactly where it was. */
  position:relative;top:-17px}
.unlockrow>.unlockbtn{grid-column:1;justify-self:end}
@media (max-width:1080px){
  .unlockrow{grid-template-columns:1fr;margin-top:2px;top:0}
}
.unlockbtn{display:inline-flex;align-items:center;gap:7px;flex-shrink:0;
  padding:7px 13px;border:1px dashed var(--rule);border-radius:8px;
  background:var(--sunk);color:var(--ink-2);text-decoration:none;
  font-size:12.5px;font-weight:600;letter-spacing:-.005em;font-family:inherit;
  cursor:default}
.unlockbtn[disabled]{opacity:.9}
.unlockbtn svg{width:15px;height:15px;flex-shrink:0}
.unlockbtn em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:2px 6px;border-radius:99px;
  background:var(--accent);color:#fff}
@media (max-width:640px){ .unlockbtn span{display:none} .unlockbtn{padding:7px 10px} }
.ident-with-logo .tick-logo{margin-top:4px}
.ident h1{font-family:"IBM Plex Serif",Georgia,serif;font-size:31px;font-weight:600;letter-spacing:-.018em;line-height:1.14}
.ident .sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:7px;color:var(--ink-3);font-size:12.5px}
.price-title{display:inline-flex;align-items:center;gap:8px;margin:0}
.price-title .price-sym{font-family:"IBM Plex Mono",monospace;font-weight:600;letter-spacing:-.01em}
.chip{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.02em;
  border:1px solid var(--rule);border-radius:5px;padding:2px 7px;color:var(--ink-2);
}
.chip.key{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.period{text-align:right}
/* The period pickers sit where the period used to be printed, so choosing a
   quarter happens at the place the reader is already looking. */
.qpick{display:flex;gap:10px;justify-content:flex-end}
.qpick .field>label{text-align:left}
.qpick select{font-size:14px;min-height:38px}
.period .small{font-size:11.5px;color:var(--ink-3);margin-top:7px}
.period a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.period a:hover{border-bottom-color:var(--accent)}

/* ---- KPI ----------------------------------------------------------------- */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
.kpi .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;letter-spacing:-.035em;margin-top:7px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11.5px;margin-top:4px;color:var(--ink-3);display:flex;align-items:center;gap:4px}
.kpi .d b{font-family:"IBM Plex Mono",monospace;font-weight:600}
.kpi .h{font-size:11px;color:var(--ink-3);margin-top:4px;line-height:1.35}
.kpi .h b{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink-2)}
.up{color:var(--up)} .down{color:var(--down)}

/* ---- panels -------------------------------------------------------------- */
.panel{margin-bottom:20px}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:16px 22px 0;flex-wrap:wrap}
.phead h2{font-size:14px;font-weight:600;letter-spacing:-.005em}
.phead p{font-size:12px;color:var(--ink-3);margin-top:2px;max-width:62ch}
.phead-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.seg{display:flex;gap:0;border:1px solid var(--rule);border-radius:7px;overflow:hidden;flex-shrink:0}
.seg:empty{display:none}
.seg button{background:transparent;border:0;padding:6px 11px;font-size:12px;cursor:pointer;color:var(--ink-2);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}

.scroll{overflow-x:auto;padding:8px 22px 20px}
svg{display:block;max-width:100%}
/* A viewBox gives an SVG its proportions, not its size: without a width it
   draws at its intrinsic 560-odd pixels and leaves the rest of a wider panel
   empty. Scoped to the chart containers so inline icons keep their own size. */
.scroll > svg{width:100%;height:auto}
svg text{font-family:"IBM Plex Sans",sans-serif}
.schart{width:100%;height:auto;display:block}
.tnum{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:0 22px 16px}
.legend div{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2)}
.legend i{width:10px;height:10px;border-radius:3px;flex-shrink:0}

/* ---- table --------------------------------------------------------------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;border-bottom:1px solid var(--rule);
}
tbody td{border-bottom:1px solid var(--rule-2);font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
tbody td:first-child{font-family:"IBM Plex Sans",sans-serif}
tbody tr.rule td{font-weight:600;border-bottom:1px solid var(--rule)}
tbody tr.sub td:first-child{padding-left:26px;color:var(--ink-2)}
tbody tr:hover td{background:var(--sunk)}
.tag{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);border:1px solid var(--rule);border-radius:4px;padding:1px 5px;margin-left:7px;vertical-align:2px}

/* ---- chart builder ------------------------------------------------------- */
.bpad{padding:16px 22px 4px}
.bctl{margin-top:2px}
.bctl + .bctl{margin-top:15px}
.bctl>label,.bctl div>label{
  display:block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;margin-bottom:5px;
}
.bctl.row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{
  background:var(--sunk);border:1px solid var(--rule);border-radius:6px;
  padding:5px 10px;font-size:12px;color:var(--ink-2);cursor:pointer;
}
.chips button:hover{border-color:var(--accent)}
.chips button[aria-checked=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.axes{display:flex;gap:14px;font-size:11.5px;color:var(--ink-3);padding-bottom:8px;flex-wrap:wrap}
.axes b{font-family:"IBM Plex Mono",monospace;color:var(--ink-2);margin-right:3px}

/* ---- tooltip ------------------------------------------------------------- */
#tip{
  position:fixed;z-index:200;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--card);border:1px solid var(--rule);border-radius:8px;
  box-shadow:var(--shadow);padding:9px 11px;font-size:12.5px;max-width:290px;
}
#tip.on{opacity:1}
#tip b{display:block;font-size:12.5px;margin-bottom:3px}
#tip .r{display:flex;justify-content:space-between;gap:16px;color:var(--ink-2)}
#tip .r span:last-child{font-family:"IBM Plex Mono",monospace;color:var(--ink);font-variant-numeric:tabular-nums}

/* ---- states -------------------------------------------------------------- */
.note{padding:26px 22px;color:var(--ink-3);font-size:13px;text-align:center}
.err{border-color:var(--down);color:var(--down)}

.load{display:inline-block;width:13px;height:13px;border:2px solid var(--rule);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}

@media (max-width:1180px){ .kpis{grid-template-columns:repeat(3,1fr)} .grid2{grid-template-columns:minmax(0,1fr)} }
@media (max-width:640px){ .ident h1{font-size:25px} main{padding:16px 14px 60px} .bar-in{padding:10px 14px} }
/* ---- the empty state: ask for a company ---------------------------------- */
.hero{display:grid;place-items:center;padding:clamp(48px,12vh,120px) 24px 90px}
/* display:grid above would otherwise beat [hidden] and leave the empty state
   sitting on top of the report. */
.hero[hidden]{display:none}
.hero-in{width:100%;max-width:660px;text-align:center}
.hero-badge{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--accent);
  background:var(--accent-soft);border-radius:20px;padding:5px 12px;margin-bottom:20px}
.hero h1{font-family:"IBM Plex Serif",Georgia,serif;font-size:clamp(30px,5vw,44px);
  font-weight:600;letter-spacing:-.026em;line-height:1.12;margin-bottom:14px}
.hero-sub{font-size:14.5px;line-height:1.6;color:var(--ink-2);
  max-width:520px;margin:0 auto 30px}

.hero-search{position:relative;text-align:left}
.hero-search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);
  width:19px;height:19px;color:var(--ink-3);pointer-events:none}
.hero-search input{width:100%;background:var(--card);border:1px solid var(--rule);
  border-radius:13px;box-shadow:var(--shadow);padding:17px 20px 17px 48px;
  font:inherit;font-size:16px;color:var(--ink)}
.hero-search input::placeholder{color:var(--ink-3)}
.hero-search input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* The bar's dropdown is a fixed 340px beside a narrow field; here it should
   match the full width of the search it belongs to. */
.hero-search .ac{top:calc(100% + 8px);right:0;width:auto;border-radius:12px}
.hero-search .ac div{padding:12px 16px}
.hero-search .ac b,.hero-search .ac span{font-size:14px}

.hero-eg{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:7px;
  margin-top:20px;font-size:12.5px;color:var(--ink-3)}
.hero-eg button{background:var(--sunk);border:1px solid var(--rule);border-radius:7px;
  padding:5px 11px;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;
  color:var(--ink-2);cursor:pointer}
.hero-eg button:hover{border-color:var(--accent);color:var(--accent)}


/* ---- price: the market's view, beside the filing's ----------------------- */
/* The chart is the point and the numbers are the footnote, so the split is
   deliberately lopsided rather than even. */
.pricerow{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:18px;margin-bottom:20px}
.pricerow[hidden]{display:none}
.pricerow.waiting{grid-template-columns:minmax(0,1fr)}
.pricechart{padding-bottom:10px}
.pricechart .phead p{font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  color:var(--ink-3);letter-spacing:-.01em}
#price-chart{padding:0 14px;position:relative}

/* The readout sits at the crossing point rather than in the caption, so the
   eye does not have to travel to read the day it is pointing at. */
.ptip{
  position:absolute;z-index:5;pointer-events:none;
  background:var(--card);border:1px solid var(--rule);border-radius:9px;
  box-shadow:var(--shadow);padding:9px 11px;min-width:152px;
}
.ptip[hidden]{display:none}
.ptip-h{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
  color:var(--ink);padding-bottom:6px;margin-bottom:5px;border-bottom:1px solid var(--rule-2)}
.ptip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ptip-dot.up{background:var(--up)} .ptip-dot.down{background:var(--down)}
.ptip-r{display:flex;justify-content:space-between;gap:14px;padding:2px 0}
.ptip-r span{font-size:11.5px;color:var(--ink-3)}
.ptip-r b{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:500;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.pchart{width:100%;height:auto;display:block;touch-action:none}
.pchart .ax{font-family:"IBM Plex Mono",monospace;font-size:9.5px;fill:var(--ink-3)}
.pchart .ax.mid{text-anchor:middle}

.ranges{display:flex;gap:4px;flex-shrink:0}
.ranges button{background:var(--sunk);border:1px solid var(--rule);border-radius:6px;
  padding:4px 10px;font-size:11.5px;font-weight:500;color:var(--ink-2);cursor:pointer;
  min-height:0}
.ranges button:hover{border-color:var(--accent);color:var(--accent)}
.ranges button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);
  color:#fff}

.pricestats{padding:16px 18px 14px;display:flex;flex-direction:column;
  perspective:1400px;position:relative}
.pflip{display:grid;flex:1;min-height:0}
.pflip > .pface{grid-area:1/1;display:flex;flex-direction:column;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  transition:transform .5s cubic-bezier(.2,.7,.2,1);min-width:0}
.pflip > .pface-front{transform:rotateY(0deg)}
.pflip > .pface-back{transform:rotateY(180deg);pointer-events:none}
.pflip.is-flipped > .pface-front{transform:rotateY(-180deg);pointer-events:none}
.pflip.is-flipped > .pface-back{transform:rotateY(0deg);pointer-events:auto}
.pflip-btn{
  position:absolute;top:10px;right:10px;z-index:3;
  width:30px;height:30px;border-radius:8px;cursor:pointer;
  background:var(--sunk);border:1px solid var(--rule);color:var(--ink-2);
  display:grid;place-items:center;padding:0;
}
.pflip-btn:hover{border-color:var(--accent);color:var(--accent)}
.pflip-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pqhead{padding-bottom:13px;border-bottom:1px solid var(--rule);padding-right:28px}
.pq{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.pq-price{font-family:"IBM Plex Mono",monospace;font-size:29px;font-weight:600;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pq-pill{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;
  border-radius:6px;padding:2px 7px;line-height:1.5}
.pq-pill.up{background:var(--up-soft);color:var(--up)}
.pq-pill.down{background:var(--down-soft);color:var(--down)}
/* What the shown price IS right now: last close, pre-market, after hours,
   open session, or a 24/7 market. One glance, one pill, dot coloured by
   session. Sized to wrap cleanly under the price on a phone. */
.pq-state{display:inline-flex;align-items:center;gap:6px;margin-top:7px;
  font-size:11.5px;font-weight:600;border-radius:99px;padding:3px 10px;
  border:1px solid var(--rule);color:var(--ink-2);background:var(--sunk);
  width:fit-content;max-width:100%;cursor:help}
.pq-state i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex-shrink:0}
.pq-state.st-open i,.pq-state.st-live i{background:var(--up)}
.pq-state.st-pre i{background:#eda100}
.pq-state.st-after i{background:var(--accent)}
/* What the houses call it, under the price it is called on. */
.pq-call{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.pq-call b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.pq-call span{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
.pq-call.buy b{color:var(--up)}
.pq-call.hold b{color:var(--ink-3)}
.pq-call.sell b{color:var(--down)}
.pstats{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin-top:4px}
.pstats>div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  padding:7px 0;border-bottom:1px solid var(--rule-2)}
.pstats dt{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.pstats dd{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:500;
  font-variant-numeric:tabular-nums;text-align:right}
.pnote{margin-top:11px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3)}

/* Flip-side company profile (FMP /profile). */
.pabout-h{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 6px;padding-right:28px}
.pabout{display:flex;flex-direction:column;margin:0}
.pabout>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:8px 0;border-bottom:1px solid var(--rule-2)}
.pabout dt{font-size:12px;color:var(--ink-3);white-space:nowrap}
.pabout dd{font-size:12.5px;font-weight:500;color:var(--ink);text-align:right;
  overflow-wrap:anywhere}
.pdesc{margin-top:14px;font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.pdesc-more{display:inline-flex;align-items:center;gap:4px;margin-top:8px;
  background:none;border:0;padding:0;font:inherit;font-size:12.5px;font-weight:600;
  color:var(--accent);cursor:pointer}
.pdesc-more:hover{text-decoration:underline}
.pdesc-more svg{width:12px;height:12px;transition:transform .2s}
.pdesc-more[aria-expanded=true] svg{transform:rotate(180deg)}
.pflip-hint{margin-top:auto;padding-top:12px;font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3)}

/* Where the houses think the price is going, under the price it is measured
   against. Same shape as the quote above it: a heading, a figure, the spread. */
.wst{margin-top:15px;padding-top:14px;border-top:1px solid var(--rule)}
.wst-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;
  color:var(--ink-2)}
.wst-h span{font-weight:500;color:var(--ink-3);white-space:nowrap}
/* The analyst count opens the ratings. Styled as the label it replaced, with
   an underline so it reads as something you can press rather than a caption. */
.wst-n{
  font:inherit;font-size:inherit;letter-spacing:inherit;text-transform:inherit;
  font-weight:500;color:var(--ink-3);white-space:nowrap;
  background:none;border:0;padding:0;cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;
  text-decoration-color:var(--rule);
}
.wst-n:hover{color:var(--accent);text-decoration-color:currentColor}
.wst-n:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---- analyst ratings dialog --------------------------------------------- */
.amodal{
  position:fixed;inset:0;z-index:400;display:grid;place-items:center;padding:20px;
  background:rgba(17,24,32,.48);backdrop-filter:blur(4px);
}
.amodal[hidden]{display:none}
.amodal-card{
  position:relative;width:min(660px,100%);max-height:min(78vh,720px);
  overflow:auto;background:var(--card);border-radius:var(--r);
  box-shadow:0 18px 50px -20px rgba(17,24,32,.55);
}
/* The card inside is already a .panel; a second border would double it. */
.amodal-card .acol>.panel{border:0;box-shadow:none;margin:0}
.amodal-card .ascroll{max-height:none}
.amodal-x{
  position:absolute;top:10px;right:10px;z-index:2;
  width:30px;height:30px;border:0;border-radius:8px;
  background:var(--sunk);color:var(--ink-3);cursor:pointer;
  font-size:19px;line-height:1;display:grid;place-items:center;
}
.amodal-x:hover{background:var(--rule);color:var(--ink)}
@media (max-width:720px){
  .amodal{padding:12px}
  .amodal-card{max-height:86vh}
}
.wst-t{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.wst-t b{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wst-t span{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600}
.wst-t span.up{color:var(--up)} .wst-t span.down{color:var(--down)}
.wst-r{margin-top:3px;font-size:11.5px;color:var(--ink-3)}
.wst-bar{display:flex;gap:2px;height:9px;border-radius:5px;overflow:hidden;
  margin:11px 0 8px}
.wst-bar span{display:block}
.wst-bar span.buy{background:var(--up)}
.wst-bar span.hold{background:var(--c-grey)}
.wst-bar span.sell{background:var(--down)}
.wst-k{font-size:11.5px;color:var(--ink-3)}
.wst-k b{font-family:"IBM Plex Mono",monospace;color:var(--ink-2);font-weight:600}

@media (max-width:1080px){
  .pricerow{grid-template-columns:minmax(0,1fr)}
  .pstats{grid-template-columns:1fr 1fr 1fr}
}
@media (max-width:640px){ .pstats{grid-template-columns:1fr 1fr} }

/* ---- index holdings + industry pie (market-only index view) -------------- */
.idx-split{
  display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.9fr);
  gap:18px;margin:0 0 22px;align-items:start;
}
.idx-hold{min-width:0;margin:0;display:flex;flex-direction:column}
.idx-hold .htab{
  /* separate + spacing 0 keeps sticky th backgrounds opaque while scrolling
     (collapse lets body rows paint through the header in Chromium). */
  width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;
}
.idx-hold .htab th{
  text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--rule);
  position:sticky;top:0;z-index:2;white-space:nowrap;
  background-color:var(--card);background-clip:padding-box;
  box-shadow:0 1px 0 var(--rule);
}
.idx-hold .htab thead{position:relative;z-index:2}
.idx-hold .htab td{padding:8px 10px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.idx-hold .htab tr:hover td{background:var(--sunk)}
.idx-hold .htab a{color:var(--accent);text-decoration:none;font-family:"IBM Plex Mono",monospace;font-weight:600}
.idx-hold .htab a:hover{text-decoration:underline}
.idx-hold .htab .name{color:var(--ink-2);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idx-hold .htab .ind{color:var(--ink-3);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idx-hold .htab .w,.idx-hold .htab .ret{
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap
}
.idx-hold .htab .ret.up{color:var(--up)} .idx-hold .htab .ret.down{color:var(--down)}
/* Show ~14 body rows; scroll for the rest. */
.idx-hold .scroll{
  overflow:auto;border:1px solid var(--rule);border-radius:var(--r);background:var(--card);
  max-height:calc(38px + 14 * 37px);
}
.idx-chart-tools{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto;
}
.idx-chart-tools .ranges button{padding:5px 8px;font-size:11px}
.idx-chart-tools .ptools{flex-shrink:0}
.idx-hold > .note{flex-shrink:0}
.idx-pie-col{min-width:0}
.idx-pie-card{
  display:flex;flex-direction:column;gap:12px;padding:16px 16px 14px;
  overflow:hidden;min-height:0;
}
.idx-pie-title{
  font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-3);margin:0;
}
.idx-pie-wrap{
  display:flex;align-items:center;justify-content:center;padding:4px 0 0;
  position:relative;overflow:visible;min-height:220px;
}
.idx-pie-wrap svg{display:block;max-width:100%;height:auto;overflow:visible}
.idx-pie-wrap svg path{cursor:pointer;transition:opacity .12s}
.idx-pie-wrap svg.path-dim path{opacity:.35}
.idx-pie-wrap svg.path-dim path.is-hot{opacity:1}
.idx-pie-wrap .pie-lab{
  font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:9.5px;fill:var(--ink);
  pointer-events:none;
}
.idx-pie-wrap .pie-lab-pct{
  font-family:"IBM Plex Mono",monospace;font-size:9px;fill:var(--ink-2);
  pointer-events:none;
}
.idx-pie-legend{display:flex;flex-direction:column;gap:6px;padding:2px 2px 0;font-size:12.5px}
.idx-pie-legend span{display:flex;align-items:center;gap:8px;color:var(--ink-2);min-width:0}
.idx-pie-legend span em{
  font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
}
.idx-pie-legend i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.idx-pie-legend b{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink);flex-shrink:0}
.idx-filters{display:flex;flex-wrap:wrap;gap:8px;padding:8px 14px 4px}
.idx-filters button{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);
  background:var(--card);border-radius:99px;padding:5px 12px 5px 10px;
  font:inherit;font-size:12.5px;color:var(--ink-2);cursor:pointer;
}
.idx-filters button i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.idx-filters button[aria-pressed=true]{
  border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600;
}
.idx-filters button[aria-pressed=false]{opacity:.72}
.idx-valrow{margin-bottom:8px}
.idx-valrow > .panel{margin-bottom:0;display:flex;flex-direction:column}
.idx-valrow .lwrap{flex:1}
.idx-dd-chart{position:relative}
.idx-dd-chart .lkey{padding:2px 0 4px}
.idx-dd-chart .dd-prob-swatch{
  width:14px;height:10px;border-radius:2px;flex-shrink:0;
  background:linear-gradient(to bottom, var(--dd-band-50), var(--dd-band-deep));
}
@media (max-width:980px){
  .idx-split{grid-template-columns:minmax(0,1fr)}
}

/* ---- industry benchmark, seasonality, bollinger, news -------------------- */
.grouphead{font-family:"IBM Plex Serif",Georgia,serif;font-size:19px;font-weight:600;
  letter-spacing:-.015em;margin:26px 0 12px}
/* Ticker box for the correlation panel. Sits between the header and the plot
   so the plot keeps the same box as the drawdown chart beside it. */
.corr-search{display:flex;gap:7px;padding:2px 14px 8px}
/* The suggestion list is absolute, so the field needs to be its containing
   block -- on the flex row itself it would be measured against the panel. */
.corr-field{position:relative;flex:1;min-width:0}
.corr-search input{
  width:100%;min-width:0;background:var(--sunk);border:1px solid var(--rule);
  border-radius:8px;padding:7px 11px;font:inherit;font-size:12.5px;color:var(--ink);
  text-transform:uppercase}
.corr-search input::placeholder{color:var(--ink-3);text-transform:none}
.corr-search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.corr-search button{
  background:var(--accent);color:#fff;border:0;border-radius:8px;padding:7px 14px;
  font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;flex-shrink:0}
.corr-search button:hover{filter:brightness(1.08)}
.corr-search button[disabled]{opacity:.5;cursor:not-allowed}

.pairrow{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:4px}
.pairrow>.panel{margin-bottom:16px}

.lwrap{padding:2px 14px 12px}
.lchart{width:100%;height:auto;display:block;touch-action:none}
.lchart .ax{font-family:"IBM Plex Mono",monospace;font-size:9.5px;fill:var(--ink-3)}
.lchart .ax.mid{text-anchor:middle}
.lkey,.lread{display:flex;flex-wrap:wrap;gap:6px 15px;align-items:center;
  font-size:11.5px;color:var(--ink-3);padding:7px 2px 0}
.lkey i,.lread i{display:inline-block;width:9px;height:2.5px;border-radius:2px;
  margin-right:5px;vertical-align:2px}
.lkey i.dash{height:0;border-top:2px dashed currentColor;background:none!important}
.lread{min-height:19px;font-family:"IBM Plex Mono",monospace;font-size:11px}
/* One plain sentence per chart saying what it shows. The chart is the
   evidence; this is the finding, for the reader who does not speak chart. */
.chart-take{padding:2px 0 8px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.chart-take b{color:var(--ink)}
.lread b{color:var(--ink);font-family:"IBM Plex Sans",sans-serif;font-size:11.5px}

.swrap{padding:0 14px 14px;overflow-x:auto}
.season{width:100%;border-collapse:separate;border-spacing:2px;font-size:11px;
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.season th{font-family:"IBM Plex Sans",sans-serif;font-size:10.5px;font-weight:600;
  color:var(--ink-3);text-align:center;padding:4px 2px;white-space:nowrap}
.season tbody th{text-align:right;padding-right:8px;color:var(--ink-2)}
.season td{text-align:center;padding:5px 3px;border-radius:4px;white-space:nowrap}
/* Opacity carries magnitude, so a strong month reads as strong without a
   second colour scale to learn. */
/* Fill and text colour are both set inline, from one ramp definition, because
   a pale cell and a deep one cannot share a text colour. */
.season .sc.empty{background:var(--sunk)}
.season .sf.tint{font-weight:600}
.season tbody th,.season tfoot th{white-space:nowrap}
.season tfoot th{color:var(--ink-2)}
.season .sf{background:var(--sunk);color:var(--ink-2);font-weight:500}

.newswrap{padding:0 4px 6px;height:340px;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.newswrap::-webkit-scrollbar{width:8px}
.newswrap::-webkit-scrollbar-thumb{background:var(--rule);border-radius:5px}
.conews{display:block;text-decoration:none;padding:11px 14px;border-bottom:1px solid var(--rule-2)}
.conews:last-child{border-bottom:0}
.conews:hover{background:var(--sunk)}
.conews .when{font-size:11px;color:var(--ink-3);margin-bottom:4px}
.conews .tag{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--accent);font-weight:600}
.conews h4{font-size:13.5px;font-weight:600;line-height:1.3;margin-bottom:3px}
.conews p{font-size:12px;color:var(--ink-2);line-height:1.4}

/* ---- the (i) beside every chart title ------------------------------------ */
.info{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;
  background:var(--sunk);border:1px solid var(--rule);color:var(--ink-3);
  font-family:"IBM Plex Serif",Georgia,serif;font-size:10px;font-style:italic;
  font-weight:600;cursor:help;vertical-align:1px;margin-left:5px;user-select:none}
.info:hover,.info:focus-visible{border-color:var(--accent);color:var(--accent)}
.helptip{position:absolute;z-index:200;background:var(--card);
  border:1px solid var(--rule);border-radius:9px;box-shadow:var(--shadow);
  padding:10px 12px;font-size:12px;line-height:1.45;color:var(--ink-2)}
.helptip[hidden]{display:none}

@media (max-width:1000px){ .pairrow{grid-template-columns:minmax(0,1fr)} }

/* ---- mobile report: Futu-style tabs, full-bleed charts, pinch zoom -------- */
.mtabs{display:none}
.chart-fs-btn{display:none}
.zoom-host{position:relative}
.zoom-layer{transform-origin:0 0;will-change:transform}

@media (max-width:720px){
  main{padding:12px 12px 72px}

  /* The identity block was 32% of the screen, and the chip row alone was 22%
     of it -- taller than the company name -- because four chips wrapped onto
     three lines. One line that scrolls sideways instead: the ticker and
     exchange are what matter, and the CIK and SIC stay reachable. */
  .ident .sub{
    flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
    margin-top:5px;padding-bottom:2px;font-size:11.5px;gap:6px;
  }
  .ident .sub::-webkit-scrollbar{display:none}
  .ident .sub > *{flex:0 0 auto}
  .ident h1{line-height:1.1}
  .ident .chip{padding:2px 7px;font-size:11px}
  /* The star is a 44px control beside a 20px title; shrink it to match. */
  .wstar{transform:scale(.85);transform-origin:left center}

  /* Cards keep a gutter so there is somewhere to start a scroll that is not a
     chart, and so a card reads as a card. */
  .card,.panel{border-radius:var(--r)}

  /* Type scale: these were desktop sizes inherited down. */
  h2{font-size:17px}
  h3.grouphead{font-size:15px}
  .phead h2{font-size:13.5px}
  .note{font-size:12.5px}

  /* No chart takes more than about 40% of the viewport. The price chart was
     490px on an 844px screen, which left nothing else in view. */
  .lwrap > svg,.scroll > svg,.lchart,#price-chart svg{max-height:40vh}
  .swrap{max-height:44vh}
  /* Period pickers sit top-right under the nav Log In control. */
  .ident{
    display:flex;justify-content:space-between;align-items:flex-start;
    /* wrap, not nowrap. .unlockrow is flex-basis:100% so it can take its own
       line on desktop; with nowrap it could not wrap, so it consumed the whole
       line and crushed its siblings to zero width -- the title then overflowed
       its own box and rendered on top of the fiscal-year pickers. */
    flex-wrap:wrap;gap:8px 10px;padding:0 14px;margin-bottom:4px;
  }
  .ident > .unlockrow{flex-basis:100%;order:3;margin-top:6px;top:0}
  .ident > div:first-child{flex:1;min-width:0}
  .ident h1{font-size:20px;padding-right:4px}
  .ident .period{
    text-align:right;width:auto;flex:0 0 auto;max-width:46%;
  }
  .qpick{
    display:flex;justify-content:flex-end;align-items:flex-end;
    gap:5px;flex-wrap:nowrap;
  }
  .qpick .field{gap:2px;min-width:0}
  .qpick .field>label{
    font-size:8px;letter-spacing:.07em;line-height:1.1;white-space:nowrap;
  }
  .qpick select{
    font-size:11px;min-height:28px;padding:3px 18px 3px 6px;
    max-width:86px;border-radius:6px;
    background-position:calc(100% - 10px) 52%, calc(100% - 6px) 52%;
    background-size:4px 4px,4px 4px;
  }
  /* Same compact header on every tab — hide date/filing under the pickers. */
  .period .small{display:none}

  .mtabs{
    display:flex;gap:0;overflow-x:auto;scrollbar-width:none;
    position:sticky;top:var(--mtab-top, 96px);z-index:80;
    background:color-mix(in srgb, var(--card) 94%, transparent);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--rule);
    padding:0 8px;margin-bottom:0;
    -webkit-overflow-scrolling:touch;
  }
  .mtabs::-webkit-scrollbar{display:none}
  .mtabs button{
    flex:0 0 auto;background:transparent;border:0;border-bottom:2px solid transparent;
    padding:11px 14px 9px;font-size:13px;font-weight:600;color:var(--ink-3);
    cursor:pointer;white-space:nowrap;min-height:0;
  }
  .mtabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}

  /* One tab at a time — desktop keeps the long scroll via the rule below. */
  body.mreport .mtab-panel{display:none}
  body.mreport .mtab-panel.on{display:block}

  .pricerow{margin-bottom:0;gap:0}
  .pricechart,.pricestats{
    border-radius:0;border-left:0;border-right:0;box-shadow:none;
  }
  .pricechart{border-bottom:0}
  .pricechart .phead{padding:12px 14px 0}
  /* Was 52vh, which left nothing else on screen beside it. 40vh is still a
     chart you can read and leaves room for the metrics below it. */
  #price-chart{padding:0;min-height:40vh}
  .pchart{width:100%;height:min(58vh,560px);max-width:none}
  .chart-fs-btn{
    display:inline-grid;place-items:center;width:32px;height:32px;margin-left:6px;
    background:var(--sunk);border:1px solid var(--rule);border-radius:8px;
    color:var(--ink-2);cursor:pointer;flex-shrink:0;padding:0;
  }
  .chart-fs-btn:hover,.chart-fs-btn:focus-visible{border-color:var(--accent);color:var(--accent)}
  .pricestats{padding:14px}
  .ranges{padding-right:0}
  .ranges button{padding:6px 11px;font-size:12px}

  .kpis{

<body>

<!-- The period pickers live here between renders and are moved into the report
     header once it exists. Moving the nodes rather than re-creating them keeps

     time it rewrites main. Company search is in the top nav. -->
<div id="controls" hidden>
  <div class="field">
    <label for="fy">Fiscal year</label>
    <select id="fy" disabled></select>
  </div>
  <div class="field">

    <select id="fq" disabled></select>
  </div>
</div>

<!-- Shown when no ticker is in the URL: the page has nothing to report on yet,
     so it asks rather than guessing. -->

  <div class="hero-in">
    <span class="hero-badge">SEC EDGAR</span>

        stroke="currentColor" stroke-width="2"/><path d="M13.5 13.5 18 18" stroke="currentColor"
        stroke-width="2" stroke-linecap="round"/></svg>
      <input type="text" id="hq" placeholder="Search a ticker or company…" autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="hac" aria-label="Search a ticker or company">

    </div>

      <button data-t="NVDA">NVDA</button>
      <button data-t="AAPL">AAPL</button>
      <button data-t="GOOGL">GOOGL</button>
      <button data-t="MSFT">MSFT</button>
      <button data-t="JPM">JPM</button>
    </div>
  </div>
</section>

<main id="main">
  <div class="card note" id="boot">Loading the latest filed quarter…</div>
</main>

<div id="tip" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ===========================================================================
   Formatting
=========================================================================== */
const money = (v, dp) => {
  if (v === null || v === undefined || Number.isNaN(v)) return "—";
  const a = Math.abs(v), s = v < 0 ? "−" : "";
  const d = dp === undefined ? 2 : dp;
  if (a >= 1e12) return `${s}$${(a/1e12).toFixed(d)}T`;
  if (a >= 1e9)  return `${s}$${(a/1e9 ).toFixed(d)}B`;
  if (a >= 1e6)  return `${s}$${(a/1e6 ).toFixed(d)}M`;
  if (a >= 1e3)  return `${s}$${(a/1e3 ).toFixed(0)}K`;
  return `${s}$${a.toFixed(0)}`;
};
const pct  = (v, d=1) => (v===null||v===undefined||Number.isNaN(v)) ? "—" : `${v.toFixed(d)}%`;
const sign = v => v>0 ? "+" : "";
const esc  = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
/** Long segment names have to be cut to fit a chart edge; the full name
    stays available in the tooltip and in the table. */
const clip = (s,n) => s.length > n ? s.slice(0, n-1).trimEnd() + "…" : s;
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const MONTHS = ["January","February","March","April","May","June","July",
                "August","September","October","November","December"];
const longDate = iso => {
  if (!iso) return "";
  const [y,m,d] = iso.split("-").map(Number);
  return `${MONTHS[m-1]} ${d}, ${y}`;
};
const shortDate = iso => {
  if (!iso) return "";
  const [y,m,d] = iso.split("-").map(Number);
  return `${d} ${MONTHS[m-1].slice(0,3)} ${y}`;
};

/* ===========================================================================
   Tooltip
=========================================================================== */
const tipEl = document.getElementById("tip");
function showTip(ev, title, rows){
  tipEl.innerHTML = `<b>${esc(title)}</b>` +
    rows.map(r => `<div class="r"><span>${esc(r[0])}</span>` +
      `<span class="${r[2] || ""}">${esc(r[1])}</span></div>`).join("");
  tipEl.classList.add("on");
  const pad = 14, w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + w > innerWidth  - 8) x = ev.clientX - w - pad;
  if (y + h > innerHeight - 8) y = ev.clientY - h - pad;
  tipEl.style.left = Math.max(8,x) + "px";
  tipEl.style.top  = Math.max(8,y) + "px";
}
const hideTip = () => tipEl.classList.remove("on");
function hoverable(el, title, rows){
  el.style.cursor = "default";
  el.addEventListener("mousemove", e => showTip(e, title, rows));
  el.addEventListener("mouseleave", hideTip);
}

/* ===========================================================================
   State
=========================================================================== */
const S = { company:null, quarter:null, breakdowns:null, cut:0, ticker:null };

/* ===========================================================================
   Where the data comes from

   Hosted: Supabase, through four read-only functions. The key below is the
   anon key, which is meant to be public — it reaches those four functions and
   nothing else, because the tables live in a schema the API does not expose.

   Local: config.js is absent, so this falls back to server.py and the page
   works exactly as it did before.
=========================================================================== */
// ALPHATICKER_CONFIG is set by config.js. The older LEDGER_CONFIG name is
// still honoured so a cached copy of the previous config.js cannot silently
// drop the page back to local mode.
const CFG = window.ALPHATICKER_CONFIG || window.LEDGER_CONFIG || {};
const HOSTED = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
const MOBILE_MQ = matchMedia("(max-width:720px)");
// analytics.js loads first, in the head. The fallback is only so a missing one
// breaks analytics rather than the page.
const GA = window.TAnalytics || { track(){}, pageView(){} };

async function rpc(fn, args){
  // A stale token must never take the page down with it. If Supabase rejects
  // one, renew it and retry; if it cannot be renewed the session is dropped
  // and the same call goes out anonymously, so public data always arrives.
  const send = tok => fetch(`${CFG.supabaseUrl}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: {
      apikey: CFG.supabaseAnonKey,
      "Content-Type": "application/json",
      ...(tok ? { Authorization: `Bearer ${tok}` } : {}),
    },
    body: JSON.stringify(args || {}),
  });

  let tok = window.TA && window.TA.token();
  let r = await send(tok);
  if (r.status === 401 && tok && window.TA && window.TA.recover) {
    r = await send(await window.TA.recover());
  }
  if (!r.ok) {
    // The status is carried, not just printed: a function the database does
    // not have is a deployment that is behind, and a caller may want to say
    // something different about that than about a network failure.
    const err = new Error(`${fn} failed (${r.status})`);
    err.status = r.status;
    throw err;
  }
  return r.json();
}
const asJson = r => r.json();

const API = {
  search: term => HOSTED
    ? (window.TA && window.TA.searchCompanies
        ? window.TA.searchCompanies(term)
        : rpc("search_companies", { q: term }))
    : fetch("/api/search?q=" + encodeURIComponent(term)).then(asJson).then(j => j.results || []),

  company: ticker => HOSTED
    ? rpc("get_company", { p_ticker: ticker })
    : fetch("/api/company?ticker=" + encodeURIComponent(ticker)).then(asJson),

  segments: (ticker, end) => HOSTED
    ? rpc("get_segments", { p_ticker: ticker, p_end: end })
    : fetch(`/api/segments?ticker=${encodeURIComponent(ticker)}&end=${end}`)
        .then(asJson).then(j => j.breakdowns || []),

  requestBackfill: ticker => HOSTED
    ? rpc("request_backfill", { p_ticker: ticker })
    : Promise.resolve(null),

  backfillStatus: ticker => HOSTED
    ? rpc("get_backfill_status", { p_ticker: ticker })
    : Promise.resolve(null),

  prices: symbol => HOSTED ? rpc("get_prices", { p_symbol: symbol })
                           : Promise.resolve(null),
  requestPrices: symbol => HOSTED ? rpc("request_prices", { p_symbol: symbol })
                                  : Promise.resolve(null),
  extras: symbol => HOSTED ? rpc("get_company_extras", { p_symbol: symbol })
                           : Promise.resolve(null),
  analyst: symbol => HOSTED ? rpc("get_analyst", { p_symbol: symbol })
                            : Promise.resolve(null),
  requestAnalyst: symbol => HOSTED ? rpc("request_analyst", { p_symbol: symbol })
                                   : Promise.resolve(null),
};

/* ===========================================================================
   Ticker search
=========================================================================== */
// One implementation, two places it appears: the command bar once a report is
// open, and the hero when the page is asked for without a company.
function wireSearch(input, ac){
  let items = [], idx = -1, timer = null;
  const close = () => {
    ac.classList.remove("open");
    input.setAttribute("aria-expanded","false");
    idx = -1;
  };
  const pick = item => {
    if (!item) return;
    // What was typed, not what was chosen: the term is the question, and a
    // search nobody could answer is the interesting half of the report.
    const term = input.value.trim();
    input.value = item.ticker;
    close();
    if (term) GA.track("search", { search_term: term });
    load(item.ticker, "search_results");
  };

  input.addEventListener("input", () => {
    clearTimeout(timer);
    const term = input.value.trim();
    if (term.length < 1) return close();
    timer = setTimeout(async () => {
      try {
        items = (await API.search(term)) || [];
        idx = -1;
        if (!items.length) return close();
        ac.innerHTML = items.map((x,i) => {
          const kind = x.kind && x.kind !== "stock" ? ` · ${x.kind}` : "";
          return `<div role="option" data-i="${i}" aria-selected="false"><b>${esc(x.ticker)}</b>` +
            `<span>${esc(x.name)}${esc(kind)}</span></div>`;
        }).join("");
        ac.classList.add("open");
        input.setAttribute("aria-expanded","true");
      } catch { close(); }
    }, 130);
  });

  ac.addEventListener("mousedown", e => {
    const d = e.target.closest("[data-i]");
    if (d) { e.preventDefault(); pick(items[+d.dataset.i]); }
  });
  input.addEventListener("keydown", e => {
    if (!ac.classList.contains("open")) {
      if (e.key === "Enter" && input.value.trim()) {
        const term = input.value.trim();
        GA.track("search", { search_term: term });
        load(term.toUpperCase(), "search_results");
      }
      return;
    }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      idx = (idx + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length;
      [...ac.children].forEach((c,i) => c.setAttribute("aria-selected", i === idx));
    } else if (e.key === "Enter") {
      e.preventDefault();
      pick(idx >= 0 ? items[idx] : items[0]);
    } else if (e.key === "Escape") close();
  });
  input.addEventListener("blur", () => setTimeout(close, 120));
}

const hqEl = document.getElementById("hq");
wireSearch(hqEl, document.getElementById("hac"));

document.querySelectorAll(".hero-eg button").forEach(b =>
  b.onclick = () => load(b.dataset.t, "ticker_page"));

/* ===========================================================================
   Load
=========================================================================== */
const main = document.getElementById("main");
const fyEl = document.getElementById("fy"), fqEl = document.getElementById("fq");

function fail(msg){
  document.body.classList.remove("mreport", "chart-fs-open", "sankey-fs-open");
  main.innerHTML = `<div class="card note err">${esc(msg)}</div>`;
}

const busy = msg => {
  document.body.classList.remove("mreport", "chart-fs-open", "sankey-fs-open");
  main.innerHTML = `<div class="card note"><span class="load"></span> &nbsp;${esc(msg)}</div>`;
};

/** A company nobody has opened yet is not in the database. Ask the worker to
    fetch it, then wait for it to land. Reading the filings takes a few
    seconds, and it only ever happens once per company. */
async function waitForBackfill(ticker){
  const asked = await API.requestBackfill(ticker);
  if (asked && asked.queued === false) return { refused: asked.reason };
  for (let i = 0; i < 40; i++) {
    await new Promise(r => setTimeout(r, 3000));
    busy(`Reading ${ticker} from SEC EDGAR — ${Math.round(i * 3)}s…`);
    const j = await API.company(ticker);
    if (j && j.quarters && j.quarters.length) return { company: j };

    // The worker may have finished and failed. Some companies have nothing
    // here to find -- a foreign private issuer files 20-F under IFRS, not
    // 10-Q under US GAAP -- and waiting longer will not change that.
    let st = null;
    try { st = await API.backfillStatus(ticker); } catch {}
    if (st && st.status === "failed") return { failed: st.error };
    if (st && st.status === "done") return { empty: true };
  }
  return { timedOut: true };
}


/* ===========================================================================
   Industry benchmark, seasonality, Bollinger and company news

   Four panels that sit between the price row and the chart builder. All of
   them describe the market's view of the company rather than the company's
   own account of itself, so they are grouped away from the filed statements.
=========================================================================== */
const EXTRA = { symbol: null, data: null, _askingExtras: false };

/** Relative time, because "2 hours ago" is what a reader wants from a feed.
    The news page has its own copy; this page had none, and the missing
    function took the whole news panel down without a word. */
function ago(iso){
  if (!iso) return "";
  const then = new Date(iso.replace(" ", "T") + (/[Zz+]/.test(iso) ? "" : "Z"));
  const mins = Math.max(0, Math.round((Date.now() - then.getTime()) / 60000));
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} minute${mins === 1 ? "" : "s"} ago`;
  const h = Math.round(mins / 60);
  if (h < 24) return `${h} hour${h === 1 ? "" : "s"} ago`;
  const d = Math.round(h / 24);
  return `${d} day${d === 1 ? "" : "s"} ago`;
}

/** One tooltip element, positioned next to whichever icon is hovered. */
function wireHelp(){
  let tip = document.getElementById("helptip");
  if (!tip) {
    tip = document.createElement("div");
    tip.id = "helptip";
    tip.className = "helptip";
    tip.hidden = true;
    document.body.appendChild(tip);
  }
  const show = el => {
    tip.textContent = el.dataset.help;
    tip.hidden = false;
    const r = el.getBoundingClientRect();
    const w = Math.min(300, innerWidth - 24);
    tip.style.width = w + "px";
    let left = r.left + r.width / 2 - w / 2 + scrollX;
    left = Math.max(12, Math.min(left, innerWidth - w - 12));
    tip.style.left = left + "px";
    tip.style.top = (r.bottom + scrollY + 9) + "px";
  };
  const hide = () => { tip.hidden = true; };
  document.querySelectorAll(".info").forEach(el => {
    el.onpointerenter = () => show(el);
    el.onpointerleave = hide;
    el.onfocus = () => show(el);
    el.onblur = hide;
  });
}

async function loadExtras(){
  const sym = S.company && S.company.ticker;
  if (!sym || !HOSTED) return;
  const row = document.getElementById("extras");
  if (!row) return;

  if (EXTRA.symbol !== sym) {
    EXTRA.symbol = sym;
    EXTRA.data = null;
    EXTRA._askingExtras = false;
    try { EXTRA.data = await API.extras(sym); } catch { return; }
  }
  if (!EXTRA.data) return;
  row.hidden = false;
  drawSeasonality();          // needs only the monthly closes
  loadTickerNews();
  marketPanels();             // the rest wait on the price bars
  // Profile / headcount arrive with extras; redraw panels that use them.
  if ((PRICE.bars || []).length && document.getElementById("price-stats")) drawPriceStats();
  if (S.company && document.getElementById("revtrend")) renderRevTrend();
  wireHelp();
  // Profile only writes on a price/extras refresh. Ask once if About is empty.
  if (!EXTRA.data.profile && !EXTRA._askingExtras) ensureCompanyExtras(sym);
}

/** Queue a price/extras refresh and poll until the About flip face has data. */
async function ensureCompanyExtras(sym){
  EXTRA._askingExtras = true;
  try { await API.requestPrices(sym); } catch {}
  let tries = 0;
  const tick = async () => {
    if (!S.company || S.company.ticker !== sym) { EXTRA._askingExtras = false; return; }
    if (tries++ > 40) { EXTRA._askingExtras = false; return; }  // ~2 minutes
    try {
      const d = await API.extras(sym);
      if (d && d.profile) {
        EXTRA.data = d;
        EXTRA._askingExtras = false;
        if (document.getElementById("price-stats")) drawPriceStats();
        return;
      }
    } catch {}
    setTimeout(tick, 3000);
  };
  setTimeout(tick, 2500);
}

/* ---- shared line-chart plumbing ------------------------------------------ */
function linePlot(host, series, opts){
  const W = opts.W || 620;
  const H = opts.H != null ? opts.H : (MOBILE_MQ.matches ? 360 : 260);
  const ml = opts.ml != null ? opts.ml : 6;
  const mr = opts.mr != null ? opts.mr : 52;
  const mt = opts.mt != null ? opts.mt : 12;
  const mb = opts.mb != null ? opts.mb : 32;
  const insideY = !!opts.insideY;
  const pw = W - ml - mr, ph = H - mt - mb;
  const all = series.flatMap(s => s.pts.map(p => p.v)).filter(v => v !== null);
  if (!all.length) { host.innerHTML = `<div class="note">Not enough data.</div>`; return; }

  const lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * 0.08 || 1;
  const y0 = opts.zero ? Math.min(0, lo - pad) : lo - pad, y1 = hi + pad;
  const n = Math.max(...series.map(s => s.pts.length));
  const x = i => ml + (n < 2 ? pw / 2 : (i / (n - 1)) * pw);
  const y = v => mt + ph - (v - y0) / (y1 - y0) * ph;

  const ticks = bandTicks(y0, y1, opts.tickCount || 5);
  const yLabelX = insideY ? (W - mr - 4) : (W - mr + 6);
  const yAnchor = insideY ? "end" : "start";
  const grid = ticks.map(t => `
    <line x1="${ml}" x2="${W - mr}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"
      stroke="var(--rule-2)" stroke-width="1"/>
    <text x="${yLabelX}" y="${(y(t) + 3.5).toFixed(1)}" class="ax"
      text-anchor="${yAnchor}">${opts.fmtY(t)}</text>`).join("");

  const fillUnder = opts.fillUnder ? series.map(s => {
    if (!s.fill || !s.pts.some(p => p.v !== null)) return "";
    const pts = s.pts.map((p, i) => p.v === null ? null : [x(i), y(p.v)]).filter(Boolean);
    if (pts.length < 2) return "";
    const d = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ")
      + ` L${pts[pts.length - 1][0].toFixed(1)},${(mt + ph).toFixed(1)}`
      + ` L${pts[0][0].toFixed(1)},${(mt + ph).toFixed(1)} Z`;
    return `<path d="${d}" fill="${s.fill}" opacity="${s.fillOpacity != null ? s.fillOpacity : .18}"/>`;
  }).join("") : "";

  const paths = series.map(s => {
    const d = s.pts.map((p, i) => p.v === null ? null : `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`)
      .filter(Boolean).join(" ");
    return d ? `<polyline points="${d}" fill="none" stroke="${s.colour}"
      stroke-width="1.6" stroke-linejoin="round"/>` : "";
  }).join("");

  const refs = (opts.refs || []).map(r => `
    <line x1="${ml}" x2="${W - mr}" y1="${y(r.v).toFixed(1)}" y2="${y(r.v).toFixed(1)}"
      stroke="${r.colour}" stroke-width="1.4" stroke-dasharray="5 4"/>`).join("");

  const labs = series[0].pts;
  const labelN = opts.xLabels || 5;
  const every = Math.max(1, Math.round((labs.length - 1) / Math.max(1, labelN - 1)));
  const dateIdx = new Set([0, labs.length - 1]);
  for (let i = every; i < labs.length - 1; i += every) dateIdx.add(i);
  const dates = [...dateIdx].sort((a, b) => a - b).map(i => {
    const p = labs[i];
    if (!p) return "";
    // Keep edge labels inside the plot so they are not cropped.
    const anchor = i === 0 ? "start" : i === labs.length - 1 ? "end" : "middle";
    return `<text x="${x(i).toFixed(1)}" y="${H - 8}" class="ax" text-anchor="${anchor}">${p.label}</text>`;
  }).join("");

  host.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" class="lchart" role="img" aria-label="${esc(opts.alt || "")}">
      ${grid}${fillUnder}${refs}${paths}${dates}
      <g id="${opts.id}-cross" style="display:none">
        <line class="xh" y1="${mt}" y2="${H - mb}" stroke="var(--ink-3)"
          stroke-width="1" stroke-dasharray="3 3"/>
      </g>
      <rect x="${ml}" y="0" width="${pw}" height="${H}" fill="transparent" class="hit"/>
    </svg>
    <div class="lkey">${series.map(s =>
      `<span><i style="background:${s.colour}"></i>${esc(s.name)}</span>`).join("")}
      ${(opts.refs || []).map(r =>
      `<span><i class="dash" style="background:${r.colour}"></i>${esc(r.name)}</span>`).join("")}
    </div>
    <div class="lread" id="${opts.id}-read">${opts.idle || ""}</div>`;

  // Crosshair reading every series at the hovered point.
  const svg = host.querySelector("svg");
  const cross = host.querySelector(`#${opts.id}-cross`);
  const xh = cross.querySelector(".xh");
  const read = host.querySelector(`#${opts.id}-read`);
  const hit = host.querySelector(".hit");
  hit.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(n - 1, Math.round((px - ml) / pw * (n - 1))));
    cross.style.display = "";
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i));
    read.innerHTML = `<b>${esc(labs[i] ? labs[i].full || labs[i].label : "")}</b>` +
      series.map(s => s.pts[i] && s.pts[i].v !== null
        ? ` <span><i style="background:${s.colour}"></i>${esc(s.name)} ${opts.fmtV(s.pts[i].v)}</span>`
        : "").join("");
  });
  hit.addEventListener("pointerleave", () => {
    cross.style.display = "none";
    read.innerHTML = opts.idle || "";
  });
}

/* ---- 1. price against the sector ----------------------------------------- */
function drawBenchmark(){
  const host = document.getElementById("bench-chart");
  const bars = PRICE.bars || [];
  const bm = EXTRA.data.benchmark;
  if (!bars.length || !bm || !(bm.closes || []).length) {
    host.innerHTML = `<div class="note">No sector benchmark for this company.</div>`;
    return;
  }
  // Both rebased to 100 at the first common date, so the lines compare
  // performance rather than price -- a $600 stock and a $170 fund otherwise
  // share no axis worth reading.
  const byDate = Object.fromEntries(bm.closes.map(c => [c.d, c.c]));
  const pts = bars.filter(b => byDate[b.d] !== undefined);
  if (pts.length < 2) {
    host.innerHTML = `<div class="note">No overlapping history with the sector.</div>`;
    return;
  }
  const c0 = pts[0].c, b0 = byDate[pts[0].d];
  const label = d => shortDate(d);
  linePlot(host, [
    { name: S.company.ticker, colour: "var(--c-blue)",
      pts: pts.map(p => ({ v: p.c / c0 * 100, label: label(p.d), full: longDate(p.d) })) },
    { name: `${bm.symbol} · ${EXTRA.data.sector || "sector"}`, colour: "var(--c-grey)",
      pts: pts.map(p => ({ v: byDate[p.d] / b0 * 100, label: label(p.d), full: longDate(p.d) })) },
  ], { id: "bench", fmtY: v => v.toFixed(0), fmtV: v => (v - 100).toFixed(1) + "%",
       alt: "Company against its sector", idle: "Both rebased to 100 at the start." });
}

/* ---- 2. price/earnings against the industry ------------------------------ */
function drawPE(){
  const host = document.getElementById("pe-chart");
  const bars = PRICE.bars || [];
  const peNow = PRICE.quote && PRICE.quote.pe;
  const hist = (EXTRA.data.peHistory || []).filter(p => p && p.d && p.pe > 0);
  const ind = EXTRA.data.industryPe;

  // Prefer FMP's quarterly key-metrics series. Fall back to today's FMP TTM
  // P/E scaled along the price path when history has not been stored yet —
  // never rebuild from sparse filing EPS, which inflates FPIs that only tag
  // some quarters.
  let pts = [];
  let idle = "From Financial Modeling Prep.";
  if (hist.length >= 2) {
    const byDate = [...hist].sort((a, b) => a.d < b.d ? -1 : 1);
    // Align to daily bars: carry each quarter's P/E forward until the next.
    let i = 0;
    pts = bars.map(b => {
      while (i + 1 < byDate.length && byDate[i + 1].d <= b.d) i++;
      const pe = byDate[i].d <= b.d ? byDate[i].pe : null;
      return { v: pe, label: shortDate(b.d), full: longDate(b.d) };
    });
    idle = "Quarterly P/E from Financial Modeling Prep.";
  } else if (peNow && peNow > 0 && bars.length >= 2) {
    const spot = lastPrice();
    if (spot) {
      const ttmEps = spot / peNow;
      pts = bars.map(b => ({
        v: ttmEps > 0 ? b.c / ttmEps : null,
        label: shortDate(b.d), full: longDate(b.d),
      }));
      idle = "FMP trailing P/E; history follows the share price until quarterly series arrives.";
    }
  }

  if (!pts.some(p => p.v !== null)) {
    host.innerHTML = peNow != null && peNow <= 0
      ? `<div class="note">No P/E — the company is loss-making on a trailing basis.</div>`
      : `<div class="note">P/E from market data is not available yet.</div>`;
    return;
  }
  linePlot(host, [{ name: `${S.company.ticker} P/E`, colour: "var(--c-blue)", pts }], {
    id: "pe", zero: false,
    fmtY: v => v.toFixed(0), fmtV: v => v.toFixed(1),
    refs: ind ? [{ v: ind, colour: "var(--warn, #eda100)",
                   name: `${EXTRA.data.industry || "Industry"} today ${ind.toFixed(1)}` }] : [],
    alt: "Price to earnings against the industry",
    idle,
  });
}

/* ---- 3. monthly seasonality ---------------------------------------------- */
// One hue each way, shaded continuously by size: pale for a quiet month, deep
// for a violent one. Running it the other way round buried the ordinary months
// under the darkest fills and made the grid read heavier than the data is.
//
// A ramp that reaches from near-white to near-black cannot carry a single text
// colour, so every cell picks the one it can actually be read in.
// Every ramp stops in the light half of the range. Running on into the dark
// half would cross the band where neither black nor white reaches 4.5:1 on
// the fill -- the deep ends measured 4.1:1, and no choice of ink fixes a
// background sitting at that luminance.
const SEASON_RAMP = {
  up:   [[0xdd, 0xf3, 0xe4], [0x3f, 0xa7, 0x6e]],
  down: [[0xfb, 0xe2, 0xdf], [0xe2, 0x63, 0x59]],
  // How often a month closes positive is a different quantity from a return,
  // so it gets its own hue rather than a third shade of green.
  // Lemon, from white to fully saturated. Yellow occupies a narrow band of
  // lightness, so a ramp between two yellows has little to separate its ends;
  // starting at white and driving blue to zero roughly doubles the range the
  // row can use while keeping the hue where it should be.
  pos:  [[0xff, 0xff, 0xff], [0xd9, 0xb7, 0x00]],
};

const mixRamp = (ramp, t) => {
  const [from, to] = ramp;
  const at = i => Math.round(from[i] + (to[i] - from[i]) * Math.min(1, Math.max(0, t)));
  return [at(0), at(1), at(2)];
};

const INK_DARK = "#14181d", INK_LIGHT = "#f8fafc";

function luminance(rgb){
  const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
  return 0.2126 * lin(rgb[0]) + 0.7152 * lin(rgb[1]) + 0.0722 * lin(rgb[2]);
}

/** Whichever ink actually contrasts better against this fill.
    Choosing on a fixed luminance threshold instead put white on mid-tone
    greens where black was three times more legible -- 2:1 where the standard
    asks for 4.5:1. Comparing the two ratios cannot make that mistake. */
function inkOn(rgb){
  const L = luminance(rgb);
  const withLight = (1.05) / (L + 0.05);
  const withDark = (L + 0.05) / (luminance([20, 24, 29]) + 0.05);
  return withDark >= withLight ? INK_DARK : INK_LIGHT;
}

const swatch = (ramp, t) => {
  const rgb = mixRamp(ramp, t);
  return `background:rgb(${rgb.join(",")});color:${inkOn(rgb)}`;
};

// Saturating at 12% keeps one extraordinary month from flattening the rest.
const seasonStyle = v => swatch(SEASON_RAMP[v >= 0 ? "up" : "down"], Math.abs(v) / 12);
// A hit rate never approaches 0% or 100% in practice -- these sit between
// roughly a quarter and three quarters -- so mapping the raw percentage onto
// the ramp would spend it all in the middle and look flat. Stretching the
// realistic band across the whole ramp is what makes the row readable.
const positiveStyle = pct => swatch(SEASON_RAMP.pos, (pct - 20) / 60);


function drawSeasonality(){
  const host = document.getElementById("season-grid");
  const m = EXTRA.data.monthly || [];
  if (m.length < 13) { host.innerHTML = `<div class="note">Needs a year of history.</div>`; return; }

  // Month-on-month total return from consecutive month-end closes.
  const ret = {};
  for (let i = 1; i < m.length; i++) {
    const prev = m[i - 1].c, cur = m[i].c;
    if (!prev) continue;
    const [y, mo] = m[i].d.split("-");
    (ret[y] = ret[y] || {})[+mo] = (cur / prev - 1) * 100;
  }
  const years = Object.keys(ret).sort((a, b) => b - a).slice(0, 11);
  const mobile = matchMedia("(max-width:720px)").matches;
  const MON = mobile
    ? ["J","F","M","A","M","J","J","A","S","O","N","D"]
    : ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const avgLab = mobile ? "Avg" : "Average";
  const hitLab = mobile ? "Hit %" : "Positive return";

  const cell = v => v === undefined || v === null
    ? `<td class="sc empty"></td>`
    : `<td class="sc" style="${seasonStyle(v)}">${v >= 0 ? "+" : ""}${v.toFixed(1)}%</td>`;

  const avg = mo => {
    const vs = years.map(y => ret[y][mo]).filter(v => v !== undefined);
    return vs.length ? vs.reduce((a, v) => a + v, 0) / vs.length : null;
  };
  const green = mo => {
    const vs = years.map(y => ret[y][mo]).filter(v => v !== undefined);
    return vs.length ? vs.filter(v => v >= 0).length / vs.length * 100 : null;
  };

  host.innerHTML = `<table class="season">
    <thead><tr><th>${mobile ? "" : "Year"}</th>${MON.map(x => `<th>${x}</th>`).join("")}</tr></thead>
    <tbody>${years.map(y =>
      `<tr><th>${mobile ? String(y).slice(2) : y}</th>${MON.map((_, i) => cell(ret[y][i + 1])).join("")}</tr>`).join("")}
    </tbody>
    <tfoot>
      <tr><th>${avgLab}</th>${MON.map((_, i) => {
        const v = avg(i + 1);
        return `<td class="sf">${v === null ? "" : (v >= 0 ? "+" : "") + v.toFixed(1) + "%"}</td>`;
      }).join("")}</tr>
      <tr><th>${hitLab}</th>${MON.map((_, i) => {
        const v = green(i + 1);
        return v === null ? `<td class="sf"></td>`
          : `<td class="sf tint" style="${positiveStyle(v)}">${v.toFixed(0)}%</td>`;
      }).join("")}</tr>
    </tfoot></table>`;
}


/* ===========================================================================
   Watchlist

   A visitor can build one before signing in -- asking for an account first is
   how a feature never gets tried. It lives in the browser until they sign in,
   and merges into the account then, so nothing they did is lost.
=========================================================================== */
const WATCH_KEY = "alphaticker-watchlist";

const localWatch = {
  read(){ try { return JSON.parse(localStorage.getItem(WATCH_KEY) || "[]"); } catch { return []; } },
  write(list){ try { localStorage.setItem(WATCH_KEY, JSON.stringify([...new Set(list)])); } catch {} },
  has(sym){ return this.read().includes(sym); },
  toggle(sym){
    const l = this.read();
    const i = l.indexOf(sym);
    if (i >= 0) l.splice(i, 1); else l.push(sym);
    this.write(l);
    return i < 0;                        // true when it was added
  },
  clear(){ try { localStorage.removeItem(WATCH_KEY); } catch {} },
};

const signedIn = () => !!(window.TA && window.TA.signedIn());

/** Add or remove, wherever this visitor's list lives. `source` says which
    part of the page the star was on; see analytics.js for the vocabulary. */
async function toggleWatch(symbol, source){
  const sym = String(symbol || "").toUpperCase();
  if (!sym) return false;
  const report = watching => {
    GA.track(watching ? "add_to_watchlist" : "remove_from_watchlist", { ticker: sym, source });
    if (window.posthog) window.posthog.capture(
      watching ? "watchlist_ticker_added" : "watchlist_ticker_removed",
      { ticker: sym, source });
  };
  // Following a company is a gate: the ask comes before the save, not after
  // it. See the note on the same branch in landing.html.
  if (!signedIn()) {
    GA.track("gate_view", { gate: "watchlist", ticker: sym, source });
    if (window.TA?.showSignupModal) window.TA.showSignupModal({ reason: "watchlist" });
    return false;
  }
  try {
    const d = await rpc("toggle_watchlist", { p_symbol: sym });
    const w = !!(d && d.watching);
    report(w);
    dispatchEvent(new CustomEvent("watchchange", { detail: { symbol: sym, watching: w } }));
    return w;
  } catch { return false; }
}

/** The symbols on this visitor's list, from wherever it lives. */
async function watchSymbols(){
  if (!signedIn()) return localWatch.read();
  try {
    const d = await rpc("get_watchlist");
    return ((d && d.items) || []).map(i => i.symbol);
  } catch { return []; }
}

/** On sign-in, hand the browser's list to the account and forget the copy. */
async function mergeLocalWatchlist(){
  const local = localWatch.read();
  if (!local.length || !signedIn()) return 0;
  try {
    const d = await rpc("merge_watchlist", { p_symbols: local });
    if (d && !d.error) { localWatch.clear(); return d.added || 0; }
  } catch {}
  return 0;
}

/** The star beside the company name: on for a company already watched, with
    how many people watch it, and it works before signing in. */
async function wireStar(){
  const el = document.getElementById("wstar");
  if (!el) return;
  const sym = el.dataset.sym;

  const paint = (watching, n) => {
    el.setAttribute("aria-pressed", String(!!watching));
    el.classList.toggle("on", !!watching);
    el.querySelector(".wstar-i").textContent = watching ? "★" : "☆";
    el.querySelector(".wstar-n").textContent = n ? compact(n) : "";
    el.title = watching ? `Remove ${sym} from your watchlist`
                        : `Add ${sym} to your watchlist`;
  };

  // `others` is everyone except this visitor, so the number shown is simply
  // others plus one when they are watching too. Counting from the total and
  // adjusting by the click is what produced a star reading "-1".
  let watching = false, others = 0;
  try {
    const d = await rpc("is_watched", { p_symbol: sym });
    const total = (d && d.watchers) || 0;
    // Only a signed-in visitor is counted in that total; a list held in the
    // browser has never reached the database, so it cannot be in it.
    watching = signedIn() ? !!(d && d.watching) : localWatch.has(sym);
    others = signedIn() && d && d.watching ? Math.max(0, total - 1) : total;
  } catch {
    watching = signedIn() ? false : localWatch.has(sym);
  }
  paint(watching, others + (watching ? 1 : 0));

  el.onclick = async () => {
    el.disabled = true;
    watching = await toggleWatch(sym, "ticker_page");
    // A signed-out visitor changes nothing anyone else can see, so the public
    // count stays put rather than claiming a watcher the database has not got.
    paint(watching, others + (watching && signedIn() ? 1 : 0));
    el.disabled = false;
  };
}
