/** Queue a price/extras refresh and poll until the About flip face has data. */
async function ensureCompanyExtras(sym){
  EXTRA._askingExtras = true;
  try { await API.requestPrices(sym); } catch {}
  let tries = 0;
  const tick = async () => {
    if (!S.company || S.company.ticker !== sym) { EXTRA._askingExtras = false; return; }
    if (tries++ > 40) { EXTRA._askingExtras = false; return; }  // ~2 minutes
    try {
      const d = await API.extras(sym);
      if (d && d.profile) {
        EXTRA.data = d;
        EXTRA._askingExtras = false;
        if (document.getElementById("price-stats")) drawPriceStats();
        return;
      }
    } catch {}
    setTimeout(tick, 3000);
  };
  setTimeout(tick, 2500);
}

/* ---- shared line-chart plumbing ------------------------------------------ */
function linePlot(host, series, opts){
  const W = opts.W || 620;
  const H = opts.H != null ? opts.H : (MOBILE_MQ.matches ? 360 : 260);
  const ml = opts.ml != null ? opts.ml : 6;
  const mr = opts.mr != null ? opts.mr : 52;
  const mt = opts.mt != null ? opts.mt : 12;
  const mb = opts.mb != null ? opts.mb : 32;
  const insideY = !!opts.insideY;
  const pw = W - ml - mr, ph = H - mt - mb;
  const all = series.flatMap(s => s.pts.map(p => p.v)).filter(v => v !== null);
  if (!all.length) { host.innerHTML = `<div class="note">Not enough data.</div>`; return; }

  const lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * 0.08 || 1;
  let y0 = opts.zero ? Math.min(0, lo - pad) : lo - pad, y1 = hi + pad;

  /* A reference level outside the series' own range used to be drawn off the
     top of the plot and simply never appear: an industry P/E of 25 against a
     company trading at 17 left the chart with no industry line on it at all.

     The axis stretches to take the reference in, so the line still sits at
     its true height above the series -- which is the whole point of drawing
     it. Only when that stretch would squash the series into less than half
     the plot do the references get a second axis of their own -- the same
     range compressed to fit, labelled on the right in the reference's own
     colour so the two scales cannot be read as one. */
  const refVals = (opts.refs || []).map(r => r.v).filter(Number.isFinite);
  let refY = null;                        // null = references share the axis
  if (refVals.some(v => v < y0 || v > y1)) {
    const m0 = Math.min(y0, ...refVals), m1 = Math.max(y1, ...refVals);
    const mPad = (m1 - m0) * 0.06 || 1;
    const r0 = m0 - mPad, r1 = m1 + mPad;
    if ((y1 - y0) / (r1 - r0) >= 0.5) { y0 = r0; y1 = r1; }
    else refY = v => mt + ph - (v - r0) / (r1 - r0) * ph;
  }

  const n = Math.max(...series.map(s => s.pts.length));
  const x = i => ml + (n < 2 ? pw / 2 : (i / (n - 1)) * pw);
  const y = v => mt + ph - (v - y0) / (y1 - y0) * ph;

  const ticks = bandTicks(y0, y1, opts.tickCount || 5);
  const yLabelX = insideY ? (W - mr - 4) : (W - mr + 6);
  const yAnchor = insideY ? "end" : "start";
  const grid = ticks.map(t => `
    <line x1="${ml}" x2="${W - mr}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"
      stroke="var(--rule-2)" stroke-width="1"/>
    <text x="${yLabelX}" y="${(y(t) + 3.5).toFixed(1)}" class="ax"
      text-anchor="${yAnchor}">${opts.fmtY(t)}</text>`).join("");

  const fillUnder = opts.fillUnder ? series.map(s => {
    if (!s.fill || !s.pts.some(p => p.v !== null)) return "";
    const pts = s.pts.map((p, i) => p.v === null ? null : [x(i), y(p.v)]).filter(Boolean);
    if (pts.length < 2) return "";
    const d = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ")
      + ` L${pts[pts.length - 1][0].toFixed(1)},${(mt + ph).toFixed(1)}`
      + ` L${pts[0][0].toFixed(1)},${(mt + ph).toFixed(1)} Z`;
    return `<path d="${d}" fill="${s.fill}" opacity="${s.fillOpacity != null ? s.fillOpacity : .18}"/>`;
  }).join("") : "";

  const paths = series.map(s => {
    const d = s.pts.map((p, i) => p.v === null ? null : `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`)
      .filter(Boolean).join(" ");
    return d ? `<polyline points="${d}" fill="none" stroke="${s.colour}"
      stroke-width="1.6" stroke-linejoin="round"/>` : "";
  }).join("");

  const refs = (opts.refs || []).map(r => {
    const ry = (refY || y)(r.v);
    // On its own scale the line's height no longer reads off the axis beside
    // it, so it carries its own figure there -- nudged clear when it lands on
    // one of that axis's own labels.
    const clash = ticks.some(t => Math.abs(y(t) - ry) < 9);
    const ly = ry + 3.5 + (clash ? (ry > mt + ph / 2 ? 10 : -10) : 0);
    return `
    <line x1="${ml}" x2="${W - mr}" y1="${ry.toFixed(1)}" y2="${ry.toFixed(1)}"
      stroke="${r.colour}" stroke-width="1.4" stroke-dasharray="5 4"/>` +
    (refY ? `
    <text x="${yLabelX}" y="${ly.toFixed(1)}" class="ax"
      text-anchor="${yAnchor}" style="fill:${r.colour}">${opts.fmtY(r.v)}</text>` : "");
  }).join("");

  const labs = series[0].pts;
  const labelN = opts.xLabels || 5;
  const every = Math.max(1, Math.round((labs.length - 1) / Math.max(1, labelN - 1)));
  const dateIdx = new Set([0, labs.length - 1]);
  // An interior label a step-fraction from the last one prints on top of it
  // (49 points, every 12: index 48 lands under index 49), so the tail of the
  // walk stays clear of the endpoint.
  for (let i = every; i <= labs.length - 1 - Math.ceil(every * 0.6); i += every) dateIdx.add(i);
  const dates = [...dateIdx].sort((a, b) => a - b).map(i => {
    const p = labs[i];
    if (!p) return "";
    // Keep edge labels inside the plot so they are not cropped.
    const anchor = i === 0 ? "start" : i === labs.length - 1 ? "end" : "middle";
    return `<text x="${x(i).toFixed(1)}" y="${H - 8}" class="ax" text-anchor="${anchor}">${p.label}</text>`;
  }).join("");

  host.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" class="lchart" role="img" aria-label="${esc(opts.alt || "")}">
      ${grid}${fillUnder}${refs}${paths}${dates}
      <g id="${opts.id}-cross" style="display:none">
        <line class="xh" y1="${mt}" y2="${H - mb}" stroke="var(--ink-3)"
          stroke-width="1" stroke-dasharray="3 3"/>
      </g>
      <rect x="${ml}" y="0" width="${pw}" height="${H}" fill="transparent" class="hit"/>
    </svg>
    <div class="lkey">${series.map(s =>
      `<span><i style="background:${s.colour}"></i>${esc(s.name)}</span>`).join("")}
      ${(opts.refs || []).map(r =>
      `<span><i class="dash" style="background:${r.colour}"></i>${esc(r.name)}</span>`).join("")}
    </div>
    <div class="lread" id="${opts.id}-read">${opts.idle || ""}</div>`;

  // Crosshair reading every series at the hovered point. The reading lands
  // in the caption strip below the plot, or — with floatTip — in a card that
  // follows the cursor, the way the market page's price chart reads out.
  const svg = host.querySelector("svg");
  const cross = host.querySelector(`#${opts.id}-cross`);
  const xh = cross.querySelector(".xh");
  const read = host.querySelector(`#${opts.id}-read`);
  const hit = host.querySelector(".hit");
  let tip = null;
  if (opts.floatTip) {
    host.style.position = "relative";
    tip = document.createElement("div");
    tip.className = "ltip";
    tip.hidden = true;
    host.appendChild(tip);
  }
  hit.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(n - 1, Math.round((px - ml) / pw * (n - 1))));
    cross.style.display = "";
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i));
    if (tip) {
      tip.innerHTML = `<div class="d">${esc(labs[i] ? labs[i].full || labs[i].label : "")}</div>` +
        series.map(s => s.pts[i] && s.pts[i].v !== null
          ? `<div><i style="background:${s.colour}"></i>${esc(s.name)} <b>${opts.fmtV(s.pts[i].v)}</b></div>`
          : "").join("");
      tip.hidden = false;
      const hr = host.getBoundingClientRect();
      let lx = e.clientX - hr.left + 16, ty = e.clientY - hr.top + 14;
      if (lx + tip.offsetWidth > hr.width - 6) lx = e.clientX - hr.left - tip.offsetWidth - 16;
      if (ty + tip.offsetHeight > hr.height - 4) ty = e.clientY - hr.top - tip.offsetHeight - 12;
      tip.style.left = Math.max(2, lx) + "px";
      tip.style.top = Math.max(2, ty) + "px";
    } else {
      read.innerHTML = `<b>${esc(labs[i] ? labs[i].full || labs[i].label : "")}</b>` +
        series.map(s => s.pts[i] && s.pts[i].v !== null
          ? ` <span><i style="background:${s.colour}"></i>${esc(s.name)} ${opts.fmtV(s.pts[i].v)}</span>`
          : "").join("");
    }
  });
  hit.addEventListener("pointerleave", () => {
    cross.style.display = "none";
    if (tip) tip.hidden = true;
    else read.innerHTML = opts.idle || "";
  });
}

/* ---- 1. price against the sector ----------------------------------------- */
function drawBenchmark(){
  const host = document.getElementById("bench-chart");
  const bars = PRICE.bars || [];
  const bm = EXTRA.data.benchmark;
  if (!bars.length || !bm || !(bm.closes || []).length) {
    host.innerHTML = `<div class="note">No sector benchmark for this company.</div>`;
    return;
  }
  // Both rebased to 100 at the first common date, so the lines compare
  // performance rather than price -- a $600 stock and a $170 fund otherwise
  // share no axis worth reading.
  const byDate = Object.fromEntries(bm.closes.map(c => [c.d, c.c]));
  const pts = bars.filter(b => byDate[b.d] !== undefined);
  if (pts.length < 2) {
    host.innerHTML = `<div class="note">No overlapping history with the sector.</div>`;
    return;
  }
  const c0 = pts[0].c, b0 = byDate[pts[0].d];
  const label = d => shortDate(d);
  linePlot(host, [
    { name: S.company.ticker, colour: "var(--c-blue)",
      pts: pts.map(p => ({ v: p.c / c0 * 100, label: label(p.d), full: longDate(p.d) })) },
    { name: `${bm.symbol} · ${EXTRA.data.sector || "sector"}`, colour: "var(--c-grey)",
      pts: pts.map(p => ({ v: byDate[p.d] / b0 * 100, label: label(p.d), full: longDate(p.d) })) },
  ], { id: "bench", fmtY: v => v.toFixed(0), fmtV: v => (v - 100).toFixed(1) + "%",
       alt: "Company against its sector", idle: "Both rebased to 100 at the start." });
}

/* ---- 2. price/earnings against the industry ------------------------------ */
function drawPE(){
  const host = document.getElementById("pe-chart");
  const bars = PRICE.bars || [];
  const peNow = PRICE.quote && PRICE.quote.pe;
  const hist = (EXTRA.data.peHistory || []).filter(p => p && p.d && p.pe > 0);
  const ind = EXTRA.data.industryPe;

  // Prefer FMP's quarterly key-metrics series. Fall back to today's FMP TTM
  // P/E scaled along the price path when history has not been stored yet —
  // never rebuild from sparse filing EPS, which inflates FPIs that only tag
  // some quarters.
  let pts = [];
  let idle = "From Financial Modeling Prep.";
  if (hist.length >= 2) {
    const byDate = [...hist].sort((a, b) => a.d < b.d ? -1 : 1);
    // Align to daily bars: carry each quarter's P/E forward until the next.
    let i = 0;
    pts = bars.map(b => {
      while (i + 1 < byDate.length && byDate[i + 1].d <= b.d) i++;
      const pe = byDate[i].d <= b.d ? byDate[i].pe : null;
      return { v: pe, label: shortDate(b.d), full: longDate(b.d) };
    });
    idle = "Quarterly P/E from Financial Modeling Prep.";
  } else if (peNow && peNow > 0 && bars.length >= 2) {
    const spot = lastPrice();
    if (spot) {
      const ttmEps = spot / peNow;
      pts = bars.map(b => ({
        v: ttmEps > 0 ? b.c / ttmEps : null,
        label: shortDate(b.d), full: longDate(b.d),
      }));
      idle = "FMP trailing P/E; history follows the share price until quarterly series arrives.";
    }
  }

  if (!pts.some(p => p.v !== null)) {
    host.innerHTML = peNow != null && peNow <= 0
      ? `<div class="note">No P/E — the company is loss-making on a trailing basis.</div>`
      : `<div class="note">P/E from market data is not available yet.</div>`;
    return;
  }
  linePlot(host, [{ name: `${S.company.ticker} P/E`, colour: "var(--c-blue)", pts }], {
    id: "pe", zero: false,
    fmtY: v => v.toFixed(0), fmtV: v => v.toFixed(1),
    refs: ind ? [{ v: ind, colour: "var(--warn, #eda100)",
                   name: `${EXTRA.data.industry || "Industry"} today ${ind.toFixed(1)}` }] : [],
    alt: "Price to earnings against the industry",
    idle,
  });
}

/* ---- Industry: the competitor set ----------------------------------------
   The tab's real job: this company against the handful of companies it is
   actually measured against. get_industry_peers proposes the set (curated
   rivals first, then the same industry by size), the reader edits it, and
   the choice is kept per ticker in localStorage. get_peer_compare feeds
   every chart from one call; a peer whose prices are not cached yet is
   warmed through the same request_prices path the page already uses. */
const PEERS = { symbol: null, sugg: [], chosen: null, custom: false,
                data: null, news: null, loading: false, warmAsked: {},
                poll: 0, polling: false, range: "1Y", basis: "pe" };
const PEER_COLOURS = ["var(--c-blue)", "#e2635a", "#3fa76e", "#d9a400",
                      "#8a63d2", "#2aa7b8", "#c05a2e"];
const MAX_PEERS = 6;

const peerLsKey = sym => "ta-peers-" + sym;
function peerStored(sym){
  try {
    const v = JSON.parse(localStorage.getItem(peerLsKey(sym)));
    return Array.isArray(v) ? v.filter(s => typeof s === "string").slice(0, MAX_PEERS) : null;
  } catch { return null; }
}
function peerStore(sym, arr){
  try {
    if (arr) localStorage.setItem(peerLsKey(sym), JSON.stringify(arr));
    else localStorage.removeItem(peerLsKey(sym));
  } catch {}
}

async function loadPeers(){
  const sym = S.company && S.company.ticker;
  if (!sym || !HOSTED || !document.getElementById("peer-chips")) return;
  if (PEERS.symbol === sym && (PEERS.data || PEERS.loading)) {
    renderPeers();
    ensurePeerData();          // a peer still cold when the tab was left
    return;
  }
  PEERS.symbol = sym; PEERS.loading = true;
  PEERS.sugg = []; PEERS.chosen = null; PEERS.data = null; PEERS.news = null;
  PEERS.warmAsked = {}; clearTimeout(PEERS.poll); PEERS.polling = false;
  wirePeerPicker();
  try {
    const d = await API.peers(sym);
    if (PEERS.symbol !== sym) return;
    PEERS.sugg = (d && d.peers) || [];
    const scope = document.getElementById("peer-scope");
    if (scope && d && (d.industry || d.sector)) {
      scope.textContent = `Suggested from well-known rivals and the `
        + `${d.industry || d.sector} ${d.industry ? "industry" : "sector"} — `
        + `drop any, add any listed company.`;
    }
  } catch { PEERS.sugg = []; }
  const stored = peerStored(sym);
  PEERS.custom = !!stored;
  PEERS.chosen = stored || PEERS.sugg.slice(0, 4).map(p => p.symbol);
  await refreshPeerData();
}

async function refreshPeerData(){
  const sym = PEERS.symbol;
  PEERS.loading = true;
  renderPeerChips();                       // the set responds immediately
  try {
    const rows = await API.peerCompare([sym, ...PEERS.chosen]);
    if (PEERS.symbol !== sym) return;
    PEERS.data = rows || [];
  } catch { if (PEERS.symbol !== sym) return; PEERS.data = []; }
  PEERS.loading = false;
  renderPeers();
  ensurePeerData();
  loadPeerNews();
}

/** The newest close anything in the set has, which is as close to "today" as
    the cache can testify. Comparing against it rather than the wall clock
    means a weekend or a market holiday does not read as stale data. */
function peerNewestDay(rows){
  let best = null;
  (rows || []).forEach(r => {
    const c = r.closes || [];
    const d = c.length ? c[c.length - 1].d : null;
    if (d && (!best || d > best)) best = d;
  });
  return best;
}

const PEER_STALE_DAYS = 4;

/** A peer whose cached bars stop well before the rest of the set was fetched
    once and never refreshed -- its line would simply stop mid-chart. */
function peerPriceStale(r, newest){
  const c = r.closes || [];
  if (!c.length) return true;
  if (!newest) return false;
  const days = (Date.parse(newest) - Date.parse(c[c.length - 1].d)) / 864e5;
  return days > PEER_STALE_DAYS;
}

/** What a peer is still missing, if anything. `filedQuarters` arrives with
    migration 0077; while the database is behind it, the field is absent and
    nothing is requested -- an older backend degrades to the old behaviour
    rather than queueing a backfill for every peer on every render. */
function peerGaps(r, newest){
  return {
    prices: !r.warm || peerPriceStale(r, newest),
    filings: r.filedQuarters === 0,
  };
}

/** Fill in whatever the set is missing. Prices come from the price queue --
    for a peer never opened, and for one whose cache has gone stale -- and
    filings from the same SEC backfill queue a first visit to a company uses.
    Both are drained by the worker on a 20-second loop behind everything else,
    so this polls: eager at first, relaxing to twelve seconds, holding on for
    about four minutes. Re-entering the tab starts it again. */
function ensurePeerData(){
  const rows = PEERS.data || [];
  const newest = peerNewestDay(rows);
  let outstanding = false;
  rows.forEach(r => {
    const gaps = peerGaps(r, newest);
    if (!gaps.prices && !gaps.filings) return;
    outstanding = true;
    const asked = PEERS.warmAsked[r.symbol] || (PEERS.warmAsked[r.symbol] = {});
    if (gaps.prices && !asked.prices) {
      asked.prices = 1;
      API.requestPrices(r.symbol).catch(() => {});
    }
    if (gaps.filings && !asked.filings) {
      asked.filings = 1;
      API.requestBackfill(r.symbol).catch(() => {});
    }
  });
  if (!outstanding || PEERS.polling) return;
  PEERS.polling = true;
  let tries = 0;
  const sym = PEERS.symbol;
  const tick = async () => {
    if (PEERS.symbol !== sym || !document.getElementById("peer-chips")) {
      PEERS.polling = false; return;
    }
    if (tries++ >= 24) { PEERS.polling = false; return; }
    let rows2 = null;
    try { rows2 = await API.peerCompare([sym, ...PEERS.chosen]); } catch {}
    if (PEERS.symbol !== sym) { PEERS.polling = false; return; }
    if (rows2) { PEERS.data = rows2; renderPeers(); }
    if (rows2) {
      const day = peerNewestDay(rows2);
      const g = rows2.some(r => { const x = peerGaps(r, day); return x.prices || x.filings; });
      if (!g) { PEERS.polling = false; return; }
    }
    PEERS.poll = setTimeout(tick, tries < 6 ? 5000 : 12000);
  };
  PEERS.poll = setTimeout(tick, 4000);
}

async function loadPeerNews(){
  const sym = PEERS.symbol;
  if (!document.getElementById("peer-news")) return;
  try {
    const rows = await API.peerNews([sym, ...PEERS.chosen]);
    if (PEERS.symbol !== sym) return;
    PEERS.news = rows || [];
  } catch { if (PEERS.symbol !== sym) return; PEERS.news = []; }
  renderPeerNews();
}

function peerAdd(raw){
  const p = String(raw || "").trim().toUpperCase();
  if (!p || !/^[A-Z][A-Z.\-]{0,9}$/.test(p)) return;
  if (p === PEERS.symbol || PEERS.chosen.includes(p)) return;
  const scope = document.getElementById("peer-scope");
  if (PEERS.chosen.length >= MAX_PEERS) {
    if (scope) scope.textContent =
      `Six competitors is the most the charts can hold — remove one first.`;
    return;
  }
  PEERS.chosen = [...PEERS.chosen, p];
  PEERS.custom = true;
  peerStore(PEERS.symbol, PEERS.chosen);
  refreshPeerData();
}

function peerDrop(p){
  PEERS.chosen = PEERS.chosen.filter(x => x !== p);
  PEERS.custom = true;
  peerStore(PEERS.symbol, PEERS.chosen);
  refreshPeerData();
}

function peerResetChoice(){
  peerStore(PEERS.symbol, null);
  PEERS.custom = false;
  PEERS.chosen = PEERS.sugg.slice(0, 4).map(p => p.symbol);
  refreshPeerData();
}

function wirePeerPicker(){
  const input = document.getElementById("peer-q");
  if (input && input.dataset.wired !== "1") {
    input.dataset.wired = "1";
    wireCorrSuggest(input, t => { peerAdd(t); input.value = ""; }, "peer-ac");
    input.addEventListener("keydown", ev => {
      const ac = document.getElementById("peer-ac");
      if (ev.key === "Enter" && !(ac && ac.classList.contains("open"))) {
        ev.preventDefault(); peerAdd(input.value); input.value = "";
      }
    });
  }
  const reset = document.getElementById("peer-reset");
  if (reset) reset.onclick = peerResetChoice;
  const basis = document.getElementById("peer-val-basis");
  if (basis && basis.dataset.wired !== "1") {
    basis.dataset.wired = "1";
    basis.querySelectorAll("[data-b]").forEach(b => b.onclick = () => {
      if (PEERS.basis === b.dataset.b) return;
      PEERS.basis = b.dataset.b;
      basis.querySelectorAll("[data-b]").forEach(x =>
        x.setAttribute("aria-pressed", String(x.dataset.b === PEERS.basis)));
      renderPeerScatter();
    });
  }
  const rng = document.getElementById("peer-perf-range");
  if (rng && rng.dataset.wired !== "1") {
    rng.dataset.wired = "1";
    rng.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
      if (PEERS.range === b.dataset.r) return;
      PEERS.range = b.dataset.r;
      rng.querySelectorAll("[data-r]").forEach(x =>
        x.setAttribute("aria-pressed", String(x.dataset.r === PEERS.range)));
      renderPeerPerf();
    });
  }
  const chips = document.getElementById("peer-chips");
  if (chips) chips.onclick = ev => {
    const x = ev.target.closest("[data-p]");
    if (x) return peerDrop(x.dataset.p);
    const add = ev.target.closest("[data-add]");
    if (add) peerAdd(add.dataset.add);
  };
}

/** What a symbol is called, from whichever payload knows. */
function peerName(sym){
  const inData = (PEERS.data || []).find(r => r.symbol === sym);
  if (inData && inData.name) return inData.name;
  const inSugg = (PEERS.sugg || []).find(p => p.symbol === sym);
  return (inSugg && inSugg.name) || "";
}

function renderPeerChips(){
  const host = document.getElementById("peer-chips");
  if (!host || !PEERS.chosen) return;
  const chip = (sym, me) => {
    const name = peerName(sym);
    return `<span class="pchip${me ? " me" : ""}"><b>${esc(sym)}</b>` +
      (name ? `<span class="pnm" title="${esc(name)}">${esc(name)}</span>` : "") +
      (me ? "" : `<button type="button" class="x" data-p="${esc(sym)}"
                    aria-label="Remove ${esc(sym)}">×</button>`) +
      `</span>`;
  };
  const spare = (PEERS.sugg || [])
    .filter(p => p.symbol !== PEERS.symbol && !PEERS.chosen.includes(p.symbol))
    .slice(0, Math.max(0, MAX_PEERS - PEERS.chosen.length));
  host.innerHTML = chip(PEERS.symbol, true)
    + PEERS.chosen.map(s => chip(s, false)).join("")
    + spare.map(p => `<button type="button" class="pchip addp" data-add="${esc(p.symbol)}"
        title="${esc(p.name || "")}">+ ${esc(p.symbol)}</button>`).join("")
    + (!PEERS.chosen.length && !spare.length
        ? `<div class="note">No peer suggestions available — add one by name.</div>` : "");
  const reset = document.getElementById("peer-reset");
  if (reset) reset.hidden = !PEERS.custom;
}

function renderPeers(){
  wirePeerPicker();          // idempotent; the panel DOM is rebuilt per render
  renderPeerChips();
  renderPeerPerf();
  renderPeerTable();
  renderPeerScatter();
  renderPeerRev();
  wireHelp();
  hydratePageLogos();
}

/** The first date the chosen range admits; null means the whole year. */
function peerPerfCut(){
  const d = new Date();
  if (PEERS.range === "3M") { d.setMonth(d.getMonth() - 3); return d.toISOString().slice(0, 10); }
  if (PEERS.range === "6M") { d.setMonth(d.getMonth() - 6); return d.toISOString().slice(0, 10); }
  if (PEERS.range === "YTD") return d.getFullYear() + "-01-01";
  return null;
}

function renderPeerPerf(){
  const host = document.getElementById("peer-perf");
  if (!host) return;
  const cut = peerPerfCut();
  const clip = r => (r.closes || []).filter(c => !cut || c.d >= cut);
  const rows = (PEERS.data || []).filter(r => clip(r).length >= 2);
  if (rows.length < 2) {
    host.innerHTML = `<div class="note">${
      PEERS.loading ? `<span class="load"></span> &nbsp;Loading peer prices…`
      : (PEERS.data || []).some(r => !r.warm)
        ? `Fetching prices for the peer set — a moment…`
        : `Not enough price history across the set yet.`}</div>`;
    return;
  }
  const base = rows.find(r => r.symbol === PEERS.symbol) || rows[0];
  const dates = clip(base).map(c => c.d);
  // Each ticker's weekly samples are struck from its own cached bars, so two
  // series rarely share exact dates -- one lands on Tuesdays, another on
  // Fridays. Matching by nearest date (within a trading week) keeps every
  // peer on the chart instead of silently dropping the misaligned ones.
  const asDay = d => Math.round(new Date(d + "T00:00:00Z").getTime() / 864e5);
  const series = rows.map((r, i) => {
    const cl = clip(r);
    let j = 0, c0 = null;
    const pts = dates.map(d => {
      const day = asDay(d);
      while (j + 1 < cl.length && asDay(cl[j + 1].d) <= day) j++;
      let v = null, gap = 6;
      for (const c of [cl[j], cl[j + 1]]) {
        if (!c) continue;
        const g = Math.abs(asDay(c.d) - day);
        if (g < gap) { gap = g; v = c.c; }
      }
      if (v != null && c0 === null) c0 = v;
      return { v: v != null && c0 ? v / c0 * 100 : null,
               label: shortDate(d), full: longDate(d) };
    });
    return { name: r.symbol, colour: PEER_COLOURS[i % PEER_COLOURS.length], pts };
  });
  const waiting = (PEERS.data || []).filter(r => !r.warm).map(r => r.symbol);
  linePlot(host, series, {
    id: "peerperf", H: 320, floatTip: true,
    fmtY: v => v.toFixed(0),
    fmtV: v => sign(v - 100) + (v - 100).toFixed(1) + "%",
    alt: "Performance of the peer set, rebased to 100",
    idle: "Weekly closes, rebased to 100 at the start of the range."
      + (waiting.length ? ` Fetching prices for ${waiting.join(", ")}…` : ""),
  });
}

/** Four filed quarters against the four before them. */
function peerRevGrowth(r){
  const q = (r.revenue || []).filter(x => x && x.r > 0);
  const sum = a => a.reduce((t, x) => t + x.r, 0);
  if (q.length >= 8) {
    const last4 = sum(q.slice(-4)), prev4 = sum(q.slice(-8, -4));
    return prev4 > 0 ? (last4 / prev4 - 1) * 100 : null;
  }
  // A company public for barely a year has no prior trailing year to measure
  // against. Its newest quarter against the same quarter twelve months back
  // asks the same question of the history that exists, so a recent listing
  // takes its place on the chart instead of waiting a year for one.
  if (q.length >= 5) {
    const last = q[q.length - 1], back = q[q.length - 5];
    return back.r > 0 ? (last.r / back.r - 1) * 100 : null;
  }
  return null;
}

/** Trailing twelve months of filed revenue -- the denominator for P/S. */
function peerTtmRevenue(r){
  const q = (r.revenue || []).filter(x => x && x.r > 0);
  return q.length >= 4 ? q.slice(-4).reduce((t, x) => t + x.r, 0) : null;
}

/** Price to earnings, in order of authority: the market feed's own figure,
    then one formed from the company's filed diluted EPS, and failing both
    the reason there is none. A company earning nothing has no P/E to find —
    that is a fact about the company, not a hole in the data, so it comes
    back marked rather than empty. */
function peerPE(r){
  const q = r.quote || {};
  if (q.pe > 0) return { v: q.pe };
  if (q.pe < 0) return { loss: true };
  if (r.epsTtm != null && q.price > 0)
    return r.epsTtm > 0 ? { v: q.price / r.epsTtm, filed: true } : { loss: true };
  return {};
}

/** Market cap over trailing revenue: the valuation a loss-making company can
    still be measured on, which is most of the point of offering it. */
function peerPS(r){
  const rev = peerTtmRevenue(r), cap = r.quote && r.quote.cap;
  return rev && cap > 0 ? { v: cap / rev } : {};
}

const peerValuation = r => PEERS.basis === "ps" ? peerPS(r) : peerPE(r);

function renderPeerTable(){
  const host = document.getElementById("peer-table");
  const verdict = document.getElementById("peer-verdict");
  if (!host) return;
  const rows = PEERS.data || [];
  if (!rows.length) {
    host.innerHTML = `<div class="note">${PEERS.loading
      ? `<span class="load"></span> &nbsp;Loading…` : `No peer data yet.`}</div>`;
    if (verdict) verdict.hidden = true;
    return;
  }
  const cell = (v, fmt, tone) => v === null || v === undefined || Number.isNaN(v)
    ? `<td class="num">—</td>`
    : `<td class="num ${tone ? (v >= 0 ? "up" : "down") : ""}">${fmt(v)}</td>`;
  const yr = r => {
    const c = r.closes || [];
    return c.length >= 2 && c[0].c > 0 ? (c[c.length - 1].c / c[0].c - 1) * 100 : null;
  };
  const offHigh = r => r.quote && r.quote.yearHigh > 0 && r.quote.price != null
    ? (r.quote.price / r.quote.yearHigh - 1) * 100 : null;
  const upside = r => r.quote && r.quote.price > 0 && r.target && +r.target.median > 0
    ? (+r.target.median / r.quote.price - 1) * 100 : null;
  host.innerHTML = `<table class="otab">
    <thead><tr><th>Company</th>
      <th class="num">Mkt cap</th><th class="num">P/E</th>
      <th class="num">Div yield</th><th class="num">Rev growth</th>
      <th class="num">1Y</th><th class="num">Off 52-w high</th>
      <th class="num">Street upside</th><th class="num">Next earnings</th></tr></thead>
    <tbody>${rows.map(r => {
      const q = r.quote || {};
      const logo = window.TickerLogos ? window.TickerLogos.chip(r.symbol, "") : "";
      return `<tr${r.symbol === PEERS.symbol ? ` class="me"` : ""}>
        <td class="co">${logo}<b>${esc(r.symbol)}</b>${
          r.name ? ` <span style="color:var(--ink-3)">${esc(r.name)}</span>` : ""}${
          r.warm ? "" : ` <span style="color:var(--ink-3)">· fetching…</span>`}</td>
        ${cell(q.cap, v => money(v, 1))}
        ${(() => {
          const pe = peerPE(r);
          if (pe.v != null) return `<td class="num"${pe.filed
            ? ` title="Computed from filed diluted EPS over the last four quarters"` : ""
            }>${pe.v.toFixed(1)}</td>`;
          if (pe.loss) return `<td class="num" title="Loss-making over the last four filed quarters — there are no earnings to price"><span style="color:var(--ink-3)">n/m</span></td>`;
          return `<td class="num">—</td>`;
        })()}
        ${q.divYield > 0 ? `<td class="num">${(q.divYield * 100).toFixed(2)}%</td>`
          : q.divYield === 0 ? `<td class="num" title="Pays no dividend">0%</td>`
          : `<td class="num">—</td>`}
        ${cell(peerRevGrowth(r), v => sign(v) + v.toFixed(1) + "%", true)}
        ${cell(yr(r), v => sign(v) + v.toFixed(1) + "%", true)}
        ${cell(offHigh(r), v => v.toFixed(1) + "%", true)}
        ${cell(upside(r), v => sign(v) + v.toFixed(1) + "%", true)}
        <td class="num">${r.nextEarnings ? esc(shortDate(r.nextEarnings)) : "—"}</td>
      </tr>`;
    }).join("")}</tbody></table>`;

  // One sentence the table adds up to: the P/E against the peer median, and
  // where the growth ranks. Skipped whenever either side lacks the figures.
  if (verdict) {
    verdict.hidden = true;
    const mine = rows.find(r => r.symbol === PEERS.symbol);
    const peers = rows.filter(r => r !== mine);
    const pes = peers.map(r => peerPE(r).v).filter(v => v != null).sort((a, b) => a - b);
    const myPe = mine ? peerPE(mine).v : null;
    if (myPe && pes.length >= 2) {
      const med = pes.length % 2 ? pes[(pes.length - 1) / 2]
        : (pes[pes.length / 2 - 1] + pes[pes.length / 2]) / 2;
      const prem = (myPe / med - 1) * 100;
      let s = `<b>${esc(PEERS.symbol)}</b> trades at ${myPe.toFixed(1)}× earnings — `
        + `${Math.abs(prem) < 2 ? "in line with" : prem > 0
            ? `a ${prem.toFixed(0)}% premium to` : `a ${(-prem).toFixed(0)}% discount to`} `
        + `the peer median of ${med.toFixed(1)}×`
        // A median struck over half the set should say so rather than imply
        // the whole industry sits at that multiple.
        + (pes.length < peers.length
            ? ` (the ${pes.length} of ${peers.length} that earn a profit)` : "");
      const myG = mine ? peerRevGrowth(mine) : null;
      const gs = peers.map(peerRevGrowth).filter(v => v !== null);
      if (myG !== null && gs.length >= 2) {
        const faster = gs.filter(g => myG > g).length;
        s += `, growing revenue faster than ${faster} of ${gs.length} peers`;
      }
      verdict.innerHTML = s + `.`;
      verdict.hidden = false;
    }
  }
}

function renderPeerScatter(){
  const host = document.getElementById("peer-scatter");
  if (!host) return;
  const ps = PEERS.basis === "ps";
  const measure = ps ? "P/S" : "P/E";
  const sub = document.getElementById("peer-scatter-sub");
  if (sub) sub.textContent = ps
    ? "Price to sales against revenue growth; bubble is market cap"
    : "P/E against revenue growth; bubble is market cap";
  const rows = (PEERS.data || []).map((r, i) => ({
    sym: r.symbol,
    val: peerValuation(r).v ?? null,
    g: peerRevGrowth(r),
    cap: r.quote ? r.quote.cap : null,
    colour: PEER_COLOURS[i % PEER_COLOURS.length],
    me: r.symbol === PEERS.symbol,
  })).filter(r => r.val !== null && r.g !== null);
  if (rows.length < 2) {
    host.innerHTML = `<div class="note">Needs a ${measure} and a year-earlier
      quarter to measure growth against, for at least two of the set.${
      ps ? "" : ` Loss-making companies have no P/E — try P/S.`}</div>`;
    return;
  }
  const W = 620, H = MOBILE_MQ.matches ? 340 : 280,
        ml = 10, mr = 46, mt = 14, mb = 30;
  const pw = W - ml - mr, ph = H - mt - mb;
  const xs = rows.map(r => r.val), ys = rows.map(r => r.g);
  const xPad = (Math.max(...xs) - Math.min(...xs)) * 0.15 || 2;
  const yPad = (Math.max(...ys) - Math.min(...ys)) * 0.15 || 2;
  const x0 = Math.max(0, Math.min(...xs) - xPad), x1 = Math.max(...xs) + xPad;
  const y0 = Math.min(...ys) - yPad, y1 = Math.max(...ys) + yPad;
  const x = v => ml + (v - x0) / (x1 - x0) * pw;
  const y = v => mt + ph - (v - y0) / (y1 - y0) * ph;
  const caps = rows.map(r => r.cap || 0);
  const capMax = Math.max(...caps, 1);
  const rad = c => 7 + 13 * Math.sqrt((c || 0) / capMax);
  const xt = bandTicks(x0, x1, 5), yt = bandTicks(y0, y1, 5);
  // A P/S of 3.4x needs its decimal where a P/E of 25x does not.
  const fx = v => (x1 < 15 ? v.toFixed(1) : v.toFixed(0)) + "\u00d7";
  host.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" class="lchart" role="img"
         aria-label="${esc(measure)} against revenue growth, bubble sized by market cap">
      ${yt.map(t => `<line x1="${ml}" x2="${W - mr}" y1="${y(t).toFixed(1)}"
          y2="${y(t).toFixed(1)}" stroke="var(--rule-2)" stroke-width="1"/>
        <text x="${W - mr + 6}" y="${(y(t) + 3.5).toFixed(1)}" class="ax">${t.toFixed(0)}%</text>`).join("")}
      ${xt.map(t => `<text x="${x(t).toFixed(1)}" y="${H - 8}" class="ax"
          text-anchor="middle">${fx(t)}</text>`).join("")}
      ${rows.map(r => {
        const cx = x(r.val).toFixed(1), cy = y(r.g).toFixed(1), rr = rad(r.cap).toFixed(1);
        return `<g><title>${esc(r.sym)}: ${measure} ${r.val.toFixed(1)}×, revenue ${
            sign(r.g)}${r.g.toFixed(1)}%, cap ${money(r.cap, 1)}</title>
          <circle cx="${cx}" cy="${cy}" r="${rr}" fill="${r.colour}"
            opacity="${r.me ? .85 : .55}" stroke="${r.colour}" stroke-width="1.4"/>
          <text x="${cx}" y="${Math.max(10, +cy - rad(r.cap) - 4).toFixed(1)}" class="ax"
            text-anchor="middle" style="fill:var(--ink);font-weight:${r.me ? 700 : 400};
            stroke:var(--card);stroke-width:3;paint-order:stroke">${esc(r.sym)}</text></g>`;
      }).join("")}
    </svg>
    <div class="lread">Cheap and growing sits top-left; expensive and slowing
      sits bottom-right. Hover a bubble for the figures.${(() => {
        // Say who is missing and why, so an absent bubble reads as a fact
        // about the company rather than a broken chart.
        const out = (PEERS.data || [])
          .filter(r => !rows.some(x => x.sym === r.symbol))
          .map(r => {
            const v = peerValuation(r);
            const why = v.loss ? "loss-making, so no P/E — switch to P/S"
              : v.v == null
                ? (!r.warm ? "prices still fetching"
                   : r.filedQuarters === 0 ? "filings not read yet"
                   : ps ? "no filed revenue to price against" : "no P/E on file")
              : r.filedQuarters === 0 ? "filings not read yet"
              : "not enough filed quarters to measure growth";
            return `${esc(r.symbol)} (${why})`;
          });
        return out.length ? ` Not drawn: ${out.join(", ")}.` : "";
      })()}</div>`;
}
