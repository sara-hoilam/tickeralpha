/* ---- KPIs ---------------------------------------------------------------- */
function renderKPIs(){
  const q = S.quarter;
  // Banks and insurers have no cost of revenue, so gross profit and operating
  // income do not exist for them — showing those tiles empty would imply the
  // data is missing rather than inapplicable. Their equivalents take the slot.
  const reports = k => S.company.quarters.some(x => x.lines[k] !== null && x.lines[k] !== undefined);
  const card = (label, k, unit, hint) => [
    label,
    k === "epsDiluted"
      ? (at(q,k) !== null
          ? (at(q,k) < 0 ? "−$" : "$") + Math.abs(at(q,k)).toFixed(2) : "—")
      : money(at(q,k)),
    yoy(k), unit ? marginOf(k) : null, unit || "", hint || "",
  ];

  // A margin near or above 100% is almost always non-operating income rather
  // than an error, so say so on the tile instead of leaving it to be
  // rediscovered further down the page.
  const nonOp = at(q,"otherIncome"), pretax = at(q,"pretaxIncome");
  const netHint = (nonOp !== null && pretax && Math.abs(nonOp) > Math.abs(pretax) * 0.25)
    ? `includes <b>${money(nonOp,1)}</b> of ${nonOp < 0 ? "non-operating expense" : "non-operating income"},
       outside the business's operations`
    : "";

  const cards = [card("Revenue","revenue","")];
  if (reports("grossProfit"))     cards.push(card("Gross profit","grossProfit","margin"));
  else if (reports("provisions")) cards.push(card("Credit provisions","provisions","of revenue"));
  if (reports("operatingIncome")) cards.push(card("Operating income","operatingIncome","margin"));
  else                            cards.push(card("Pre-tax income","pretaxIncome","margin"));
  cards.push(card("Net income","netIncome","margin", netHint));
  cards.push(card("Diluted EPS","epsDiluted",""));
  cards.push(card(reports("noninterestExpense") ? "Non-interest expense" : "Operating expenses",
                  "opex","of revenue"));
  document.getElementById("kpis").innerHTML = cards.map(([k,v,ch,mg,unit,hint]) => `
    <div class="kpi">
      <div class="k">${esc(k)}</div>
      <div class="v">${esc(v)}</div>
      <div class="d">
        ${ch===null ? `<span>no prior-year quarter</span>`
          : `<b class="${ch>=0?"up":"down"}">${sign(ch)}${ch.toFixed(1)}%</b><span>YoY</span>`}
        ${mg!==null && mg!==undefined ? `<span>· ${pct(mg)} ${esc(unit)}</span>` : ""}
      </div>
      ${hint ? `<div class="h">${hint}</div>` : ""}
    </div>`).join("");
}

/* ---- Sankey -------------------------------------------------------------- */
/*  Nodes are laid out in fixed columns and stacked in a fixed order, so the
    ribbons stay untangled without a general-purpose crossing solver.        */
function renderSankey(){
  const host = document.getElementById("sankey");
  if (!host) return;
  const q = S.quarter, L = q.lines;
  const rev = L.revenue;
  if (!rev) { host.innerHTML = `<div class="note">No revenue reported for this quarter.</div>`; return; }

  const gp = L.grossProfit, cogs = L.cogs, opex = L.opex;
  const opInc = L.operatingIncome, net = L.netIncome, tax = L.tax;
  // The non-operating figure has to be the gap between operating profit and
  // pre-tax income, or the diagram will not balance. Companies tag only part
  // of that gap — Walmart tags "other gains and losses" but reports interest
  // separately — so the tagged value cannot be used here.
  const pretaxRaw = L.pretaxIncome !== null && L.pretaxIncome !== undefined
    ? L.pretaxIncome
    : (L.netIncome !== null && L.tax !== null ? L.netIncome + L.tax : null);
  const other = (pretaxRaw !== null && opInc !== null && opInc !== undefined)
    ? pretaxRaw - opInc : L.otherIncome;
  // The minority's share of a partly-owned subsidiary's profit, taken out
  // between pre-tax income and the group's net income.
  const nci = (pretaxRaw !== null && tax !== null && net !== null)
    ? pretaxRaw - tax - net : 0;

  /* ---- last year's same quarter, for the Y/Y figures --------------------
     The statement lines are already in memory (every quarter arrives with
     the company); segments were fetched alongside this quarter's. A node
     whose prior value is unknown simply shows no delta. */
  const prevQ = prevYearQuarter();
  const P = prevQ ? prevQ.lines : null;
  const priorOf = {
    rev: P && P.revenue, gp: P && P.grossProfit, cogs: P && P.cogs,
    opex: P && P.opex, opinc: P && P.operatingIncome, net: P && P.netIncome,
    tax: P && P.tax, pretax: P && P.pretaxIncome,
    xrd: P && P.rd, xsm: P && P.sm, xga: P && P.ga, xsga: P && P.sga,
    xopexOther: P && P.opexOther, prov: P && P.provisions,
  };
  const yoy = (cur, prior) => (prior !== null && prior !== undefined && prior > 0
    && cur !== null && cur !== undefined)
    ? `${cur >= prior ? "+" : "−"}${Math.abs((cur - prior) / prior * 100).toFixed(0)}% Y/Y`
    : null;
  // Margin nodes speak in points of margin, the way the note itself does:
  // profit can fall while its margin holds, and the pair tells you which.
  const ppYoy = (cur, prior) => (prior !== null && prior !== undefined && prior > 0
    && priorOf.rev > 0 && rev > 0 && cur !== null)
    ? (() => { const d = cur/rev*100 - prior/priorOf.rev*100;
               return `${d >= 0 ? "+" : "−"}${Math.abs(d).toFixed(0)}pp Y/Y`; })()
    : null;

  const N = [], K = [], made = new Set();
  const node = (id,col,val,label,kind,note) => {
    if (val === null || val === undefined || val <= 0) return null;
    N.push({id,col,val,label,kind,note}); made.add(id); return id;
  };
  // Only join nodes that actually exist — many companies leave parts of the
  // income statement untagged, and a missing node must drop its flow, not
  // break the diagram.
  const link = (a,b,v) => { if (made.has(a) && made.has(b) && v > 0) K.push({a,b,v}); };

  // Column 0 — revenue sources, when the filing discloses them.
  // Some groups report segment revenue gross and then subtract intersegment
  // eliminations. Only the positive rows can be drawn as inflows, so the
  // eliminations are carried as their own outflow and the widths still add up.
  //
  // Where the filing nests its members, the revenue side gets two columns:
  // the lines the company reports, then the groupings it puts them in.
  const cut = S.breakdowns && S.breakdowns.length ? S.breakdowns[S.cut] : null;
  // Last year's rows for the same breakdown, matched by label -- segment ids
  // are positional and a company can add or drop a segment between years, so
  // the name is the only join that survives.
  // Matched on the cut's name -- "label" was the wrong field (always null),
  // and null-matches-null paired this quarter's segment cut with last year's
  // geography cut. Wrong deltas are worse than none, so an unnamed cut on
  // either side simply pairs with nothing.
  const prevCut = cut && cut.name && S.breakdownsPrior
    ? S.breakdownsPrior.find(b => b.name === cut.name) || null
    : null;
  const priorSeg = {}, priorGrp = {};
  if (prevCut) prevCut.rows.forEach(r => {
    if (r.value > 0) {
      priorSeg[r.label] = (priorSeg[r.label] || 0) + r.value;
      if (r.parent) priorGrp[r.parent] = (priorGrp[r.parent] || 0) + r.value;
    }
  });
  const segColour = {};
  let segGross = 0, segElim = 0;
  const feeds = [];               // what flows into Revenue: [id, value]

  if (cut) {
    const pos = cut.rows.filter(r => r.value > 0);
    cut.rows.forEach(r => { if (r.value <= 0) segElim += -r.value; });
    pos.forEach(r => { segGross += r.value; });

    // A grouping is only worth its own column if it actually groups more
    // than one reported line.
    const kids = {};
    pos.forEach(r => { if (r.parent) (kids[r.parent] = kids[r.parent] || []).push(r); });
    const groups = Object.keys(kids).filter(p => kids[p].length > 1);
    const twoLevel = groups.length > 0;

    pos.forEach((r,i) => { segColour[r.label] = SERIES[i % SERIES.length]; });

    if (twoLevel) {
      let gi = 0;
      groups.forEach(p => {
        const sum = kids[p].reduce((a,r) => a + r.value, 0);
        const gid = "grp" + (gi++);
        node(gid, 0, sum, p, "group", pct(sum/rev*100,1));
        kids[p].forEach((r,j) => {
          const id = "leaf" + p.replace(/\W/g,"") + j;
          node(id, -1, r.value, r.label, "seg", pct(r.value/rev*100,1));
          link(id, gid, r.value);
        });
        feeds.push([gid, sum]);
      });
      pos.filter(r => !r.parent || kids[r.parent].length <= 1).forEach((r,i) => {
        node("seg"+i, 0, r.value, r.label, "seg", pct(r.value/rev*100,1));
        feeds.push(["seg"+i, r.value]);
      });
    } else {
      pos.forEach((r,i) => {
        node("seg"+i, 0, r.value, r.label, "seg", pct(r.value/rev*100,1));
        feeds.push(["seg"+i, r.value]);
      });
    }
  }

  node("rev", 1, rev, "Revenue", "revenue", null);
  if (segElim > 0)
    node("elim", 1, segElim, "Intersegment eliminations", "cost",
         pct(segElim/segGross*100,0) + " of gross");
  // Each source funds consolidated revenue first; what is left over is the
  // amount eliminated between segments.
  let remaining = rev;
  feeds.forEach(([id, v]) => {
    const toRev = Math.max(0, Math.min(v, remaining));
    link(id, "rev", toRev);
    link(id, "elim", v - toRev);
    remaining -= toRev;
  });

  const cats = [["rd","R&D"],["sm","Sales & marketing"],["ga","General & admin"],
                ["sga","Selling, general & admin"],["opexOther","Other operating"]];
  const pretax = pretaxRaw;
  const hasGross = gp !== null && cogs !== null && cogs > 0;

  const opexLabel = L.noninterestExpense !== null && L.noninterestExpense !== undefined
    ? "Non-interest expense" : "Operating expenses";
  const prov = L.provisions;
  const isLoss = net !== null && net < 0;
  S.sankeyLoss = isLoss ? {net, tax} : null;

  if (isLoss) {
    // A loss quarter cannot be drawn as revenue dividing into profit: the
    // costs are larger than the revenue. What balances is a sources-and-uses
    // reading — revenue, plus the loss itself and any tax benefit, are what
    // covered the quarter's costs. Every width is still a real filed figure.
    const taxRelief = tax !== null && tax < 0 ? -tax : 0;
    node("loss", 1, -net, "Net loss", "cost", pct(-net/rev*100,0) + " of revenue");
    node("relief", 1, taxRelief, "Tax benefit", "cost", null);

    const uses = [];
    if (hasGross) uses.push(["ucogs", cogs, "Cost of revenue", cogs]);
    if (opex > 0) uses.push(["uopex", opex, opexLabel, opex]);
    if (prov > 0) uses.push(["uprov", prov, "Credit provisions", prov]);
    if (tax > 0)  uses.push(["utax", tax, "Tax", tax]);
    const funds = rev + (-net) + taxRelief;
    const rest = funds - uses.reduce((a,u) => a + u[1], 0);
    if (rest > funds * 0.01) uses.push(["urest", rest, "Other costs & expenses", rest]);

    uses.forEach(([id, v, label]) =>
      node(id, 2, v, label, "cost", pct(v/rev*100,0) + " of revenue"));

    // Draw on revenue first, then on the loss, then on the tax benefit.
    const sources = [["rev", rev], ["loss", -net], ["relief", taxRelief]];
    let si = 0, left = sources[0][1];
    uses.forEach(([id, v]) => {
      let need = v;
      while (need > 1e-6 && si < sources.length) {
        const take = Math.min(need, left);
        if (take > 0) link(sources[si][0], id, take);
        need -= take; left -= take;
        if (left <= 1e-6) { si++; left = si < sources.length ? sources[si][1] : 0; }
      }
    });

    cats.forEach(([k,label]) => {
      if (L[k] > 0) { node("x"+k, 3, L[k], label, "cost", pct(L[k]/rev*100,0) + " of rev");
                      link("uopex","x"+k,L[k]); }
    });

  } else if (hasGross) {
    // The familiar shape: revenue splits into cost of revenue and gross
    // profit, gross profit into operating expenses and operating profit.
    node("gp",   2, gp,   "Gross profit",    "profit", pct(gp/rev*100,0) + " margin");
    node("cogs", 2, cogs, "Cost of revenue", "cost",   pct(cogs/rev*100,0) + " of rev");
    link("rev","gp",gp); link("rev","cogs",cogs);

    node("opinc", 3, opInc, "Operating profit", "profit",
         opInc ? pct(opInc/rev*100,0) + " margin" : null);
    node("opex",  3, opex,  "Operating expenses", "cost",
         opex ? pct(opex/rev*100,0) + " of rev" : null);
    link("gp","opinc",opInc); link("gp","opex",opex);

    cats.forEach(([k,label]) => {
      if (L[k] > 0) { node("x"+k, 4, L[k], label, "cost", pct(L[k]/rev*100,0) + " of rev");
                      link("opex","x"+k,L[k]); }
    });

    const otherIn  = other > 0 ?  other : 0;
    const otherOut = other < 0 ? -other : 0;
    // A negative tax charge is a credit: it adds to net profit rather than
    // taking from it, so it enters as a source alongside operating profit.
    const taxCredit = tax !== null && tax < 0 ? -tax : 0;
    node("oth",  3, otherIn,  "Other income", "profit", "non-operating");
    node("relief", 3, taxCredit, "Tax benefit", "profit", null);
    node("net",  4, net,      "Net profit",   "profit", pct(net/rev*100,0) + " margin");
    node("tax",  4, tax,      "Tax", "cost", null);
    node("othx", 4, otherOut, "Other expense", "cost", "non-operating");
    link("relief","net", taxCredit);

    // Pre-tax income does not always equal net income plus tax: where a group
    // consolidates a business it only partly owns, the minority's share of
    // profit is deducted too. Without it the diagram is short by that amount.
    node("nci", 4, nci, "Non-controlling interests", "cost", null);

    // Operating profit and any non-operating income together fund net profit,
    // tax and non-operating expense.
    link("opinc","net", Math.max(0, net - otherIn - taxCredit));
    link("oth",  "net", otherIn);
    link("opinc","tax", tax);
    link("opinc","othx",otherOut);
    link("opinc","nci", nci);

  } else {
    // Banks and insurers report no cost of revenue, so revenue divides
    // straight into what it costs to run the business and what is left
    // before tax. Total costs are whatever revenue did not keep, so anything
    // the filing does not tag is shown as its own line rather than dropped.
    node("pretax", 2, pretax, "Pre-tax income", "profit",
         pretax ? pct(pretax/rev*100,0) + " of rev" : null);
    node("opex",   2, opex, opexLabel, "cost",
         opex ? pct(opex/rev*100,0) + " of rev" : null);
    node("prov", 2, prov, "Credit provisions", "cost",
         prov ? pct(prov/rev*100,0) + " of rev" : null);
    const totalCosts = rev - (pretax || 0);
    const rest = totalCosts - (opex || 0) - (prov > 0 ? prov : 0);
    if (rest > rev * 0.01)
      node("rest", 2, rest, "Other costs & expenses", "cost", pct(rest/rev*100,0) + " of rev");

    link("rev","pretax",pretax); link("rev","opex",opex);
    link("rev","prov",prov); link("rev","rest",rest);

    const credit = tax !== null && tax < 0 ? -tax : 0;
    node("relief", 2, credit, "Tax benefit", "profit", null);
    node("net", 3, net, "Net profit", "profit", net>0 ? pct(net/rev*100,0)+" margin" : null);
    node("tax", 3, tax, "Tax", "cost", null);
    node("nci", 3, nci, "Non-controlling interests", "cost", null);
    link("pretax","net", Math.max(0, net - credit));
    link("relief","net", credit);
    link("pretax","tax",tax); link("pretax","nci",nci);

    cats.forEach(([k,label]) => {
      if (L[k] > 0) { node("x"+k, 3, L[k], label, "cost", pct(L[k]/rev*100,0) + " of rev");
                      link("opex","x"+k,L[k]); }
    });
  }

  // Attach each node's year-ago value and the delta its label will carry.
  // Profit nodes speak in points of margin (their note already names the
  // margin); everything else in percent growth of the value itself.
  N.forEach(n => {
    const prior = n.kind === "seg" ? priorSeg[n.label]
      : n.kind === "group" ? priorGrp[n.label]
      : priorOf[n.id];
    n.prior = (prior !== null && prior !== undefined && prior > 0) ? prior : null;
    n.delta = (n.id === "gp" || n.id === "opinc" || n.id === "net" || n.id === "pretax")
      ? ppYoy(n.val, prior) : yoy(n.val, prior);
  });

  if (N.length < 2) { host.innerHTML = `<div class="note">Not enough detail filed to draw the flow.</div>`; return; }

  // ---- layout ----
  const cols = [...new Set(N.map(n => n.col))].sort((a,b) => a - b);
  const hasSeg = cols.includes(0);
  const twoLevelSrc = cols.includes(-1);
  const W = twoLevelSrc ? 1560 : hasSeg ? 1300 : 1000;
  // A band above the plot for the chart's own heading, so a screenshot or the
  // full-screen view says what it is without the panel around it.
  const titleH = 46;
  const H = (twoLevelSrc ? 420 : 380) + titleH;
  const padT = 34 + titleH, padB = 18;
  const leftPad  = twoLevelSrc ? 230 : hasSeg ? 250 : 84;
  const rightPad = 210;
  const nodeW = 13;
  const usableW = W - leftPad - rightPad;
  const colX = {};
  cols.forEach((c,i) => { colX[c] = leftPad + (usableW * i) / (cols.length - 1 || 1); });

  const order = {seg:0, group:0, revenue:0, profit:0, cost:1};
  // Every node carries a two-line label, so the gap has to clear it. The
  // segment column stacks the most nodes and needs the most room.
  const gapFor = c => 26;
  const maxTotal = Math.max(...cols.map(c =>
    N.filter(n => n.col === c).reduce((s,n) => s + n.val, 0)));
  const maxGaps = Math.max(...cols.map(c =>
    gapFor(c) * Math.max(0, N.filter(n => n.col === c).length - 1)));
  const scale = (H - padT - padB - maxGaps) / maxTotal;

  cols.forEach(c => {
    const gap = gapFor(c);
    const inCol = N.filter(n => n.col === c)
      .sort((a,b) => (order[a.kind] ?? 1) - (order[b.kind] ?? 1));
    const total = inCol.reduce((s,n) => s + n.val * scale, 0) + gap * (inCol.length - 1);
    let y = padT + (H - padT - padB - total) / 2;
    inCol.forEach(n => { n.y0 = y; n.h = Math.max(2, n.val * scale); n.y1 = y + n.h; y = n.y1 + gap; });
  });

  const byId = Object.fromEntries(N.map(n => [n.id, n]));
  N.forEach(n => { n.outAt = n.y0; n.inAt = n.y0; });
  K.forEach(k => {
    const a = byId[k.a], b = byId[k.b];
    k.sy0 = a.outAt; k.sy1 = a.outAt + k.v * scale; a.outAt = k.sy1;
    k.ty0 = b.inAt;  k.ty1 = b.inAt  + k.v * scale; b.inAt  = k.ty1;
  });

  const paint = n => n.kind === "seg" ? `var(${segColour[n.label] || "--s1"})`
    : n.kind === "group" ? "var(--ink-3)"
    : n.kind === "cost" ? "var(--cost)" : n.kind === "profit" ? "var(--profit)" : "var(--revenue)";

  const parts = [];

  /* The heading: company logo where the cache has one, then name, quarter and
     year. Values in the diagram are as filed, in dollars, so no currency line. */
  const logoUrl = window.TickerLogos && window.TickerLogos.dataUrl
    ? window.TickerLogos.dataUrl(S.ticker) : null;
  const titleX = logoUrl ? 52 : 16;
  if (logoUrl) parts.push(
    `<image href="${esc(logoUrl)}" x="16" y="7" width="28" height="28"
       preserveAspectRatio="xMidYMid meet" clip-path="inset(0 round 6px)"/>`);
  parts.push(
    `<text x="${titleX}" y="22" font-size="17" font-weight="700"
       fill="var(--ink)">${esc(clip(S.company.name || S.ticker, 60))}</text>
     <text x="${titleX}" y="39" font-size="12" class="tnum"
       fill="var(--ink-2)">Q${q.fq} FY${q.fy} · quarter ended ${esc(longDate(q.end) || "")}${
         prevQ ? "" : " · no year-ago quarter filed, so no Y/Y figures"}</text>`);

  K.forEach(k => {
    const a = byId[k.a], b = byId[k.b];
    const x1 = colX[a.col] + nodeW, x2 = colX[b.col];
    const mx = (x1 + x2) / 2;
    const d = `M${x1},${k.sy0} C${mx},${k.sy0} ${mx},${k.ty0} ${x2},${k.ty0}`
            + ` L${x2},${k.ty1} C${mx},${k.ty1} ${mx},${k.sy1} ${x1},${k.sy1} Z`;
    parts.push(`<path d="${d}" fill="${paint(b.kind === "seg" ? b : (a.kind==="revenue"?b:b))}"
       opacity=".26" data-k="${esc(a.label)}→${esc(b.label)}" data-v="${k.v}"></path>`);
  });

  N.forEach(n => {
    const x = colX[n.col];
    parts.push(`<rect x="${x}" y="${n.y0}" width="${nodeW}" height="${n.h}" rx="2.5"
        fill="${paint(n)}" data-n="${esc(n.label)}" data-v="${n.val}"${
        n.prior ? ` data-p="${n.prior}"` : ""}></rect>`);

    // Labels sit outside the plot on the two edge columns, otherwise above
    // the node, so nothing overlaps a ribbon. The second line reads
    // value · note · Y/Y, each part present only when it exists.
    const sub = [money(n.val,1), n.note, n.delta].filter(Boolean).join(" · ");
    const isFirst = n.col === cols[0], isLast = n.col === cols[cols.length-1];
    const fill = n.kind === "cost" ? "var(--cost)" : n.kind === "profit" ? "var(--profit)"
               : n.kind === "seg" || n.kind === "group" ? "var(--ink)" : "var(--revenue)";
    if (isFirst || isLast) {
      const tx = isFirst ? x - 12 : x + nodeW + 12;
      const anchor = isFirst ? "end" : "start";
      const cy = (n.y0 + n.y1) / 2;
      parts.push(`
        <text x="${tx}" y="${cy - 7}" text-anchor="${anchor}" font-size="12" font-weight="600"
              fill="${fill}">${esc(clip(n.label, 26))}</text>
        <text x="${tx}" y="${cy + 11}" text-anchor="${anchor}" font-size="11.5"
              class="tnum" fill="var(--ink-2)">${esc(sub)}</text>`);
    } else {
      parts.push(`
        <text x="${x}" y="${n.y0 - 21}" font-size="12" font-weight="600" fill="${fill}">${esc(clip(n.label, 26))}</text>
        <text x="${x}" y="${n.y0 - 5}" font-size="11.5" class="tnum" fill="var(--ink-2)">${esc(sub)}</text>`);
    }
  });

  // Drop fixed width/height so mobile can full-bleed the viewBox; desktop
  // still sizes from CSS max-width and the intrinsic aspect ratio.
  const lossNote = S.sankeyLoss
    ? `<div class="note" style="text-align:left;padding:4px 0 10px">Costs exceeded revenue this quarter, so revenue alone cannot cover them. `
      + `The ${esc(money(-S.sankeyLoss.net,1))} net loss`
      + (S.sankeyLoss.tax < 0 ? ` and the ${esc(money(-S.sankeyLoss.tax,1))} tax benefit` : "")
      + ` appear on the left as the rest of what funded the quarter's costs.</div>`
    : "";
  host.innerHTML = `${lossNote}<svg viewBox="0 0 ${W} ${H}" role="img" class="schart"
      aria-label="Flow of revenue into costs and profit for Q${q.fq} FY${q.fy}">${parts.join("")}</svg>`;

  host.querySelectorAll("[data-n]").forEach(el => hoverable(el, el.dataset.n,
    [["Amount", money(+el.dataset.v)],
     ["Share of revenue", pct(+el.dataset.v/rev*100)],
     ...(el.dataset.p ? [["Year ago", money(+el.dataset.p)]] : [])]));
  host.querySelectorAll("[data-k]").forEach(el => hoverable(el, el.dataset.k.replace("→"," → "),
    [["Amount", money(+el.dataset.v)], ["Share of revenue", pct(+el.dataset.v/rev*100)]]));
  wireSankeyFullscreen();
}

/* ---- Revenue mix --------------------------------------------------------- */
function renderMix(){
  const host = document.getElementById("mix");
  const cuts = document.getElementById("mix-cuts");

  /* The breakdown selector belongs to the Sankey panel, not to the donut this
     function draws -- so it has to be built even though the donut is gone.
     Returning early on a missing #mix, as this used to, left the Sankey with
     no way to switch cut. */
  const note = html => { if (host) host.innerHTML = html; };

  if (S.breakdowns === null){
    if (cuts) cuts.innerHTML = "";
    note(`<div class="note"><span class="load"></span> &nbsp;Reading the segment note from the filing…</div>`);
    return;
  }
  if (!S.breakdowns.length){
    if (cuts) cuts.innerHTML = "";
    note(`<div class="note">This filing's revenue note could not be reconciled to
      total revenue, so no breakdown is shown rather than an approximate one.</div>`);
    return;
  }

  const cut = S.breakdowns[S.cut];
  const rev = S.quarter.lines.revenue;
  if (cuts) {
    cuts.innerHTML = S.breakdowns.map((b,i) =>
      `<button aria-pressed="${i===S.cut}" data-i="${i}">${esc(b.name)}</button>`).join("");
    cuts.querySelectorAll("button").forEach(b => b.onclick = () => {
      S.cut = +b.dataset.i; renderMix(); renderSankey();
    });
  }
  if (!host) return;                 // selector kept current; no donut to draw

  // A donut carries the part-to-whole reading; the ranked rows beside it
  // carry the comparison, and every slice is labelled so colour is never the
  // only thing distinguishing two segments.
  const W = 640, H = 300, cx = 148, cy = 150, rOut = 116, rIn = 68;
  const total = cut.rows.reduce((s,r) => s + Math.max(0,r.value), 0) || 1;
  let ang = -Math.PI/2;
  const arcs = [], rows = [];

  cut.rows.forEach((r,i) => {
    const frac = Math.max(0,r.value) / total;
    const a0 = ang, a1 = ang + frac * Math.PI * 2;
    ang = a1;
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    const p = (rad,a) => [cx + rad*Math.cos(a), cy + rad*Math.sin(a)];
    const [x0,y0] = p(rOut,a0), [x1,y1] = p(rOut,a1);
    const [x2,y2] = p(rIn ,a1), [x3,y3] = p(rIn ,a0);
    arcs.push(`<path d="M${x0},${y0} A${rOut},${rOut} 0 ${large} 1 ${x1},${y1}
        L${x2},${y2} A${rIn},${rIn} 0 ${large} 0 ${x3},${y3} Z"
        fill="var(${SERIES[i%SERIES.length]})" stroke="var(--card)" stroke-width="2"
        data-n="${esc(r.label)}" data-v="${r.value}"></path>`);

    const y = cy - (cut.rows.length * 24) / 2 + 16 + i * 24;
    rows.push(`
      <rect x="312" y="${y-10}" width="10" height="10" rx="3" fill="var(${SERIES[i%SERIES.length]})"></rect>
      <text x="330" y="${y-1}" font-size="12.5" fill="var(--ink)">${esc(clip(r.label, 20))}</text>
      <text x="${W-10}" y="${y-1}" text-anchor="end" font-size="12.5" class="tnum" fill="var(--ink-2)">
        ${esc(money(r.value,1))} · ${esc(pct(r.value/total*100))}</text>`);
  });

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
      aria-label="Revenue split ${esc(cut.name)}">
      ${arcs.join("")}
      <text x="${cx}" y="${cy-10}" text-anchor="middle" font-size="11" fill="var(--ink-3)"
        letter-spacing=".08em">REVENUE</text>
      <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="18" font-weight="600"
        class="tnum" fill="var(--ink)">${esc(money(rev,1))}</text>
      ${rows.join("")}
    </svg>`;

  host.querySelectorAll("[data-n]").forEach(el => hoverable(el, el.dataset.n,
    [["Revenue", money(+el.dataset.v)], ["Share", pct(+el.dataset.v/total*100)]]));
}

/* ---- shared axis helper -------------------------------------------------- */
function niceTicks(max, count=4){
  if (!(max > 0)) return [0, 1];
  const raw = max / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m => m*mag).find(s => s >= raw) || mag*10;
  // Round the axis up past the largest value, so no bar can exceed the plot.
  const top = Math.ceil(max / step) * step;
  const out = [];
  for (let v = 0; v <= top + step * 1e-6; v += step) out.push(v);
  return out;
}

/* ---------------------------------------------------------------------------
   A general quarter-by-quarter chart, shared by the cash-flow panel and the
   chart builder. Handles several series, negative values, and the three
   ways of expressing a value: as filed, as a share of revenue, or as growth.
--------------------------------------------------------------------------- */
function valueOf(q, key, mode){
  const raw = q.lines[key];
  if (raw === null || raw === undefined) return null;
  if (mode === "pctRevenue") return q.lines.revenue ? raw / q.lines.revenue * 100 : null;
  if (mode === "qoq") return growth(q, key).qoq;
  if (mode === "yoy") return growth(q, key).yoy;
  return raw;
}

function renderQuarterChart(host, legendHost, opts){
  const {series, type = "bar", mode = "absolute", quarters, width = 560, height = 300} = opts;
  if (!host) return;
  const qs = quarters;
  const pct_ = mode !== "absolute";

  const pts = series.map(s => qs.map(q => valueOf(q, s.k, mode)));
  const flat = pts.flat().filter(v => v !== null);
  if (!qs.length || !flat.length){
    host.innerHTML = `<div class="note">No data for this selection.</div>`;
    if (legendHost) legendHost.innerHTML = "";
    return;
  }

  const W = width, H = height, ml = 62, mr = pct_ ? 16 : 16, mt = 18, mb = 48;
  const pw = W - ml - mr, ph = H - mt - mb;

  // The axis has to reach past the extremes in both directions, and include
  // zero whenever any value is negative. A stack is bounded by its totals,
  // not by any single segment.
  let hiV = Math.max(...flat, 0), loV = Math.min(...flat, 0);
  if (type === "stack"){
    const tot = qs.map((q, i) => {
      let up = 0, dn = 0;
      series.forEach((s, si) => {
        const v = pts[si][i];
        if (v === null) return;
        if (v >= 0) up += v; else dn += v;
      });
      return [up, dn];
    });
    hiV = Math.max(...tot.map(t => t[0]), 0);
    loV = Math.min(...tot.map(t => t[1]), 0);
  }
  const ticksPos = niceTicks(hiV || 1);
  const step = ticksPos.length > 1 ? ticksPos[1] - ticksPos[0] : (hiV || 1);
  const top = Math.max(step, Math.ceil(hiV / step) * step);
  const bot = loV < 0 ? Math.floor(loV / step) * step : 0;
  const y = v => mt + ph - ((v - bot) / (top - bot)) * ph;

  const ticks = [];
  for (let v = bot; v <= top + step * 1e-6; v += step) ticks.push(v);

  const parts = [];
  ticks.forEach(t => parts.push(`
    <line x1="${ml}" y1="${y(t)}" x2="${W-mr}" y2="${y(t)}"
      stroke="${Math.abs(t) < step*1e-6 ? "var(--rule)" : "var(--rule-2)"}"></line>
    <text x="${ml-9}" y="${y(t)+4}" text-anchor="end" font-size="10.5" class="tnum"
      fill="var(--ink-3)">${esc(pct_ ? t.toFixed(0)+"%" : money(t,0))}</text>`));

  const slot = pw / qs.length;
  const label = (q, s) => `${s.label} · Q${q.fq} FY${q.fy}`;
  const rowsFor = (q, s, v, i) => {
    const rows = [
      [pct_ ? (mode==="pctRevenue" ? "Share of revenue" : "Change") : "Amount",
       pct_ ? pct(v) : fmtBy(FIELD[s.k].unit, q.lines[s.k])],
    ];
    if (type === "stack" && series.length > 1 && !pct_ && opts.totalLabel){
      const net = series.reduce((a, _s, si) => a + (pts[si][i] ?? 0), 0);
      if (net) rows.push([opts.totalLabel, pct(v / net * 100)]);
    }
    rows.push(...growthRows(q, s.k));
    rows.push(["Source", q.basis === "derived" ? "derived from annual report" : "as filed"]);
    return rows;
  };

  if (type === "stack"){
    // One bar per quarter. Positive parts stack up from zero and negative
    // parts hang below it, so a quarter that spent more than it earned still
    // reads correctly. A tick marks the net total.
    const bw = Math.min(slot - 12, 46);
    qs.forEach((q, i) => {
      const x = ml + slot*i + (slot - bw)/2;
      let up = 0, dn = 0, net = 0, any = false;
      series.forEach((s, si) => {
        const v = pts[si][i];
        if (v === null) return;
        any = true; net += v;
        const from = v >= 0 ? up : dn;
        const to = from + v;
        if (v >= 0) up = to; else dn = to;
        const y0 = y(Math.max(from, to)), y1 = y(Math.min(from, to));
        parts.push(`<rect x="${x}" y="${y0}" width="${bw}"
          height="${Math.max(1.5, y1 - y0 - 2)}" rx="3"
          fill="var(${s.col})" opacity="${q === S.quarter ? 1 : .74}"
          data-t="${esc(label(q,s))}" data-i="${i}" data-s="${si}"></rect>`);
      });
      if (any && series.length > 1)
        parts.push(`<line x1="${x-3}" y1="${y(net)}" x2="${x+bw+3}" y2="${y(net)}"
          stroke="var(--ink)" stroke-width="1.5" opacity=".55"></line>`);
    });
  } else if (type === "bar"){
    const gw = Math.min(slot - 8, 44);
    const bw = Math.max(3, (gw - (series.length - 1) * 3) / series.length);
    qs.forEach((q, i) => {
      series.forEach((s, si) => {
        const v = pts[si][i];
        if (v === null) return;
        const x = ml + slot*i + (slot - gw)/2 + si*(bw+3);
        const y0 = y(Math.max(v, 0)), y1 = y(Math.min(v, 0));
        parts.push(`<rect x="${x}" y="${y0}" width="${bw}" height="${Math.max(1.5, y1-y0)}" rx="3"
          fill="var(${s.col})" opacity="${q === S.quarter ? 1 : .72}"
          data-t="${esc(label(q,s))}" data-i="${i}" data-s="${si}"></rect>`);
      });
    });
  } else {
    series.forEach((s, si) => {
      const line = qs.map((q,i) => ({i, v: pts[si][i]})).filter(p => p.v !== null);
      if (!line.length) return;
      const px = i => ml + slot*(i+0.5);
      const d = line.map((p,j) => `${j?"L":"M"}${px(p.i)},${y(p.v)}`).join(" ");
      if (type === "area")
        parts.push(`<path d="${d} L${px(line[line.length-1].i)},${y(bot)} L${px(line[0].i)},${y(bot)} Z"
          fill="var(${s.col})" opacity=".16"></path>`);
      parts.push(`<path d="${d}" fill="none" stroke="var(${s.col})" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"></path>`);
      line.forEach(p => parts.push(`<circle cx="${px(p.i)}" cy="${y(p.v)}"
        r="${qs[p.i] === S.quarter ? 4.5 : 3}" fill="var(${s.col})"
        stroke="var(--card)" stroke-width="2"
        data-t="${esc(label(qs[p.i], s))}" data-i="${p.i}" data-s="${si}"></circle>`));
    });
  }

  qs.forEach((q,i) => {
    const cx = ml + slot*(i+0.5);
    const sel = q === S.quarter;
    parts.push(`<text x="${cx}" y="${H-mb+16}" text-anchor="middle" font-size="10.5"
      fill="${sel?"var(--ink)":"var(--ink-3)"}" font-weight="${sel?600:400}">Q${q.fq}</text>
      <text x="${cx}" y="${H-mb+33}" text-anchor="middle" font-size="9.5" class="tnum"
      fill="var(--ink-3)">'${String(q.fy).slice(2)}</text>`);
  });

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
    aria-label="${esc(series.map(s=>s.label).join(", "))} by quarter">${parts.join("")}</svg>`;

  host.querySelectorAll("[data-t]").forEach(el => {
    const i = +el.dataset.i, si = +el.dataset.s;
    hoverable(el, el.dataset.t, rowsFor(qs[i], series[si], pts[si][i], i));
  });
  if (legendHost)
    legendHost.innerHTML = series.length > 1
      ? series.map(s => `<div><i style="background:var(${s.col})"></i>${esc(s.label)}</div>`).join("")
      : "";
}

/* ---- Revenue trend ------------------------------------------------------- */
function renderRevTrend(){
  const host = document.getElementById("revtrend");
  if (!host) return;
  const qs = recentQuarters(12).filter(q => q.lines.revenue !== null);
  if (!qs.length) { host.innerHTML = `<div class="note">No history available.</div>`; return; }

  const W = 560, H = 300, ml = 56, mr = 12, mt = 16, mb = 46;
  const pw = W - ml - mr, ph = H - mt - mb;
  const max = Math.max(...qs.map(q => q.lines.revenue));
  const ticks = niceTicks(max);
  const top = ticks[ticks.length-1];
  const y = v => mt + ph - (v / top) * ph;
  const bw = Math.min(38, pw / qs.length - 8);

  const parts = ticks.map(t => `
    <line x1="${ml}" y1="${y(t)}" x2="${W-mr}" y2="${y(t)}" stroke="var(--rule-2)"></line>
    <text x="${ml-9}" y="${y(t)+4}" text-anchor="end" font-size="10.5" class="tnum"
      fill="var(--ink-3)">${esc(money(t,0))}</text>`);

  qs.forEach((q,i) => {
    const cx = ml + pw*(i+0.5)/qs.length;
    const v = q.lines.revenue;
    const h = Math.max(1, ph - (y(v) - mt));
    const sel = q === S.quarter;
    const derived = q.basis === "derived";
    parts.push(`<rect x="${cx-bw/2}" y="${y(v)}" width="${bw}" height="${h}" rx="4"
      fill="${derived ? "transparent" : (sel ? "var(--revenue)" : "color-mix(in srgb, var(--revenue) 42%, transparent)")}"
      stroke="var(--revenue)" stroke-width="${derived ? 1.5 : 0}"
      stroke-dasharray="${derived ? "3 2" : ""}"
      data-n="Q${q.fq} FY${q.fy}" data-v="${v}" data-b="${q.basis}" data-q="${i}"></rect>`);
    if (sel) parts.push(`<text x="${Math.min(Math.max(cx, ml+26), W-mr-26)}" y="${y(v)-7}" text-anchor="middle" font-size="11"
        font-weight="600" class="tnum" fill="var(--revenue)">${esc(money(v,1))}</text>`);
    parts.push(`<text x="${cx}" y="${H-mb+16}" text-anchor="middle" font-size="10.5"
      fill="${sel ? "var(--ink)" : "var(--ink-3)"}" font-weight="${sel?600:400}">Q${q.fq}</text>
      <text x="${cx}" y="${H-mb+33}" text-anchor="middle" font-size="9.5" class="tnum"
      fill="var(--ink-3)">'${String(q.fy).slice(2)}</text>`);
  });

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
    aria-label="Revenue by quarter">${parts.join("")}</svg>`;
  host.querySelectorAll("[data-n]").forEach(el => hoverable(el, el.dataset.n,
    [["Revenue", money(+el.dataset.v)],
     ...growthRows(qs[+el.dataset.q], "revenue"),
     ["Source", el.dataset.b === "derived" ? "derived from annual report" : "as filed"]]));
}

/* ---- Margins ------------------------------------------------------------- */
function renderMargins(){
  const host = document.getElementById("margins");
  const qs = recentQuarters(12);
  const defs = [
    ["Gross margin",     "grossProfit",     "--profit"],
    ["Operating margin", "operatingIncome", "--revenue"],
    ["Net margin",       "netIncome",       "--s7"],
  ].filter(([,k]) => qs.some(q => q.lines[k] !== null && q.lines.revenue));

  if (!defs.length || qs.length < 2){
    host.innerHTML = `<div class="note">Not enough history to plot margins.</div>`;
    document.getElementById("margins-legend").innerHTML = "";
    return;
  }

  const series = defs.map(([label,key,col]) => ({
    label, col, key,
    pts: qs.map((q,i) => {
      const r = q.lines.revenue, v = q.lines[key];
      return (r && v !== null) ? {i, v: v/r*100, q} : null;
    }).filter(Boolean)
  }));

  const all = series.flatMap(s => s.pts.map(p => p.v));
  const lo = Math.min(0, Math.floor(Math.min(...all)/10)*10);
  const hi = Math.ceil(Math.max(...all)/10)*10 || 10;

  const W = 560, H = 300, ml = 46, mr = 92, mt = 16, mb = 46;
  const pw = W - ml - mr, ph = H - mt - mb;
  const x = i => ml + pw*(i+0.5)/qs.length;
  const y = v => mt + ph - ((v - lo)/(hi - lo))*ph;

  const parts = [];
  for (let t = lo; t <= hi; t += Math.max(5,(hi-lo)/5)) {
    parts.push(`<line x1="${ml}" y1="${y(t)}" x2="${W-mr}" y2="${y(t)}" stroke="var(--rule-2)"></line>
      <text x="${ml-8}" y="${y(t)+4}" text-anchor="end" font-size="10.5" class="tnum"
        fill="var(--ink-3)">${t.toFixed(0)}%</text>`);
  }
  qs.forEach((q,i) => parts.push(`<text x="${x(i)}" y="${H-mb+16}" text-anchor="middle" font-size="10.5"
      fill="${q===S.quarter?"var(--ink)":"var(--ink-3)"}" font-weight="${q===S.quarter?600:400}">Q${q.fq}</text>
      <text x="${x(i)}" y="${H-mb+33}" text-anchor="middle" font-size="9.5" class="tnum"
      fill="var(--ink-3)">'${String(q.fy).slice(2)}</text>`));

  series.forEach(s => {
    const d = s.pts.map((p,j) => `${j?"L":"M"}${x(p.i)},${y(p.v)}`).join(" ");
    parts.push(`<path d="${d}" fill="none" stroke="var(${s.col})" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"></path>`);
    s.pts.forEach(p => parts.push(`<circle cx="${x(p.i)}" cy="${y(p.v)}" r="${p.q===S.quarter?4.5:3}"
      fill="var(${s.col})" stroke="var(--card)" stroke-width="2"
      data-n="${esc(s.label)} · Q${p.q.fq} FY${p.q.fy}" data-v="${p.v}"
      data-q="${p.i}" data-k="${s.key}"></circle>`));
  });

  // Direct labels at the line ends, so the legend is a backup and not a
  // crutch. Lines that finish close together get nudged apart rather than
  // printed on top of each other.
  const ends = series.map(s => {
    const last = s.pts[s.pts.length-1];
    return {col: s.col, v: last.v, ty: y(last.v), i: last.i};
  }).sort((a,b) => a.ty - b.ty);
  for (let j = 1; j < ends.length; j++)
    if (ends[j].ty - ends[j-1].ty < 15) ends[j].ty = ends[j-1].ty + 15;
  ends.forEach(e => parts.push(`<text x="${x(e.i)+9}" y="${e.ty+4}" font-size="11"
    font-weight="600" fill="var(${e.col})">${esc(pct(e.v,0))}</text>`));

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
    aria-label="Margin trend">${parts.join("")}</svg>`;
  document.getElementById("margins-legend").innerHTML = series.map(s =>
    `<div><i style="background:var(${s.col})"></i>${esc(s.label)}</div>`).join("");
  host.querySelectorAll("[data-n]").forEach(el => hoverable(el, el.dataset.n,
    [["Margin", pct(+el.dataset.v)], ...growthRows(qs[+el.dataset.q], el.dataset.k)]));
}

/* ---- Cost & expense structure -------------------------------------------- */
function renderCostStack(){
  const host = document.getElementById("coststack");
  const qs = recentQuarters(12).filter(q => q.lines.revenue);
  const defs = [
    ["Cost of revenue","cogs","--s2"], ["R&D","rd","--s1"],
    ["Sales & marketing","sm","--s3"], ["General & admin","ga","--s4"],
    ["Selling, general & admin","sga","--s5"], ["Other operating","opexOther","--s7"],
    ["Credit provisions","provisions","--s8"],
  ].filter(([,k]) => qs.some(q => q.lines[k] !== null && q.lines[k] > 0));

  if (!defs.length || !qs.length){
    host.innerHTML = `<div class="note">This company does not disclose a cost breakdown.</div>`;
    document.getElementById("coststack-legend").innerHTML = "";
    return;
  }

  // The card is full width on a desktop now that the filings have a tab of
  // their own, so the plot is drawn at the width it is shown at: stretching
  // the old half-column geometry to 1400px put 750px-tall bars on screen.
  // A phone is still one narrow column, and gets the narrow geometry -- the
  // wide one scales down to a third and takes its axis labels with it.
  const wide = !MOBILE_MQ.matches;
  const W = wide ? 1180 : 560, H = wide ? 340 : 300, ml = 46, mr = 12, mt = 16, mb = 46;
  const pw = W - ml - mr, ph = H - mt - mb;
  const y = v => mt + ph - (v/100)*ph;
  const bw = Math.min(wide ? 54 : 34, pw/qs.length - (wide ? 10 : 7));
  const parts = [];

  for (let t = 0; t <= 100; t += 25)
    parts.push(`<line x1="${ml}" y1="${y(t)}" x2="${W-mr}" y2="${y(t)}" stroke="var(--rule-2)"></line>
      <text x="${ml-8}" y="${y(t)+4}" text-anchor="end" font-size="10.5" class="tnum"
        fill="var(--ink-3)">${t}%</text>`);

  qs.forEach((q,i) => {
    const cx = ml + pw*(i+0.5)/qs.length;
    let acc = 0;
    defs.forEach(([label,key,col]) => {
      const v = q.lines[key];
      if (v === null || v === undefined || v <= 0) return;
      const share = v / q.lines.revenue * 100;
      const y0 = y(acc + share), y1 = y(acc);
      // A 2px gap between segments keeps adjacent fills readable without
      // relying on the colour difference alone.
      parts.push(`<rect x="${cx-bw/2}" y="${y0}" width="${bw}" height="${Math.max(1,y1-y0-2)}" rx="2"
        fill="var(${col})" opacity="${q===S.quarter?1:.72}"
        data-n="${esc(label)} · Q${q.fq} FY${q.fy}" data-v="${v}" data-s="${share}"
        data-q="${i}" data-k="${key}"></rect>`);
      acc += share;
    });
    parts.push(`<text x="${cx}" y="${H-mb+16}" text-anchor="middle" font-size="10.5"
      fill="${q===S.quarter?"var(--ink)":"var(--ink-3)"}" font-weight="${q===S.quarter?600:400}">Q${q.fq}</text>
      <text x="${cx}" y="${H-mb+33}" text-anchor="middle" font-size="9.5" class="tnum"
      fill="var(--ink-3)">'${String(q.fy).slice(2)}</text>`);
  });

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
    aria-label="Cost and expense structure">${parts.join("")}</svg>`;
  document.getElementById("coststack-legend").innerHTML = defs.map(([label,,col]) =>
    `<div><i style="background:var(${col})"></i>${esc(label)}</div>`).join("");
  host.querySelectorAll("[data-n]").forEach(el => hoverable(el, el.dataset.n,
    [["Amount", money(+el.dataset.v)], ["Share of revenue", pct(+el.dataset.s)],
     ...growthRows(qs[+el.dataset.q], el.dataset.k)]));
}

/* ---------------------------------------------------------------------------
   Chart builder

   Only fields this company actually reports can be selected, so a chart can
   never show data that is not in the filings.
--------------------------------------------------------------------------- */
const BUILD = {series:["revenue"], type:"bar", mode:"absolute", n:12};

function renderBuilder(){
  const wrap = document.getElementById("builder");
  if (!wrap) return;
  const avail = availableFields();
  BUILD.series = BUILD.series.filter(k => avail.some(f => f.k === k));
  if (!BUILD.series.length) BUILD.series = [avail[0] ? avail[0].k : "revenue"];

  const cols = ["--s1","--s3","--s2","--s7"];
  const series = BUILD.series.map((k,i) => ({k, label: FIELD[k].label, col: cols[i % cols.length]}));

  document.getElementById("b-fields").innerHTML = avail.map(f =>
    `<button role="checkbox" aria-checked="${BUILD.series.includes(f.k)}"
       data-k="${f.k}">${esc(f.label)}</button>`).join("");
  document.getElementById("b-type").value = BUILD.type;
  document.getElementById("b-mode").value = BUILD.mode;
  document.getElementById("b-n").value = String(BUILD.n);

  const yLabel = BUILD.mode === "pctRevenue" ? "% of revenue"
    : BUILD.mode === "yoy" ? "Year-over-year change"
    : BUILD.mode === "qoq" ? "Quarter-over-quarter change"
    : series.map(s => s.label).join(" · ");
  document.getElementById("b-axes").innerHTML =
    `<span><b>y</b> ${esc(yLabel)}</span><span><b>x</b> Fiscal quarter</span>`;
  renderQuarterChart(document.getElementById("b-chart"),
    document.getElementById("b-legend"),
    {series, type: BUILD.type, mode: BUILD.mode,
     quarters: recentQuarters(BUILD.n), width: 1180, height: 340});

  // Clicking a field toggles it into or out of the y axis.
  document.getElementById("b-fields").querySelectorAll("button").forEach(b => {
    b.onclick = () => {
      const k = b.dataset.k;
      if (BUILD.series.includes(k)) {
        if (BUILD.series.length > 1) BUILD.series = BUILD.series.filter(x => x !== k);
      } else if (BUILD.series.length < 4) {
        BUILD.series = [...BUILD.series, k];
      }
      renderBuilder();
    };
  });
}

function wireBuilder(){
  ["b-type","b-mode","b-n"].forEach(id =>
    document.getElementById(id).addEventListener("change", e => {
      BUILD[id === "b-n" ? "n" : id === "b-type" ? "type" : "mode"] =
        id === "b-n" ? +e.target.value : e.target.value;
      renderBuilder();
    }));
  renderBuilder();
}

/* ---- Income statement ---------------------------------------------------- */
function renderStatement(){
  const q = S.quarter;
  const prevQ = priorQuarter(q);
  const yearAgo = sameQuarterLastYear(q);

  const ROWS = [
    ["Revenue","revenue","rule"],
    ["Cost of revenue","cogs","sub"],
    ["Gross profit","grossProfit","rule"],
    ["Research & development","rd","sub"],
    ["Sales & marketing","sm","sub"],
    ["General & administrative","ga","sub"],
    ["Selling, general & administrative","sga","sub"],
    ["Other operating expenses","opexOther","sub"],
    ["Total operating expenses","opex","rule"],
    ["Operating income","operatingIncome","rule"],
    ["Other income (expense), net","otherIncome","sub"],
    ["Pre-tax income","pretaxIncome",""],
    ["Income tax","tax","sub"],
    ["Net income","netIncome","rule"],
    ["Diluted EPS","epsDiluted","eps"],
  ];

  const fmt = (k,v) => v===null||v===undefined ? "—"
    : (k==="epsDiluted" ? (v<0 ? "−$" : "$") + Math.abs(v).toFixed(2) : money(v));
  const delta = (a,b) => {
    if (a===null||b===null||a===undefined||b===undefined||!b) return "—";
    const d = (a-b)/Math.abs(b)*100;
    return `<span class="${d>=0?"up":"down"}">${sign(d)}${d.toFixed(1)}%</span>`;
  };

  const body = ROWS.filter(([,k]) => q.lines[k] !== null && q.lines[k] !== undefined)
    .map(([label,k,cls]) => {
      const v = q.lines[k];
      const src = q.provenance && q.provenance[k];
      return `<tr class="${cls==="eps"?"":cls}">
        <td>${esc(label)}${src === "computed" ? `<span class="tag" title="Not tagged in the filing; derived from the lines around it">derived</span>` : ""}</td>
        <td>${fmt(k,v)}</td>
        <td>${k==="epsDiluted"||!q.lines.revenue ? "—" : pct(v/q.lines.revenue*100)}</td>
        <td class="col-yago">${yearAgo ? fmt(k,yearAgo.lines[k]) : "—"}</td>
        <td>${yearAgo ? delta(v, yearAgo.lines[k]) : "—"}</td>
        <td class="col-qoq">${prevQ ? delta(v, prevQ.lines[k]) : "—"}</td>
      </tr>`;
    }).join("");

  document.getElementById("istmt").innerHTML = `
    <table>
      <thead><tr>
        <th>Line item</th>
        <th>Q${q.fq} FY${q.fy}</th>
        <th>% of revenue</th>
        <th class="col-yago">${yearAgo ? `Q${yearAgo.fq} FY${yearAgo.fy}` : "Year ago"}</th>
        <th>YoY</th>
        <th class="col-qoq">${prevQ ? `vs Q${prevQ.fq} FY${prevQ.fy}` : "QoQ"}</th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table>`;
}

/* ===========================================================================
   Price

   Daily candles with a volume band beneath, and the last session's numbers
   beside them. Prices are the market's view of the company; everything else on
   this page is the company's own account of itself. They are kept visibly
   apart for that reason.
=========================================================================== */
const PRICE = { symbol: null, bars: [], quote: null, range: 126, view: null, poll: null,
  flipped: false, descOpen: false, asOf: null, stale: false };
const RANGES = [["1M", 21], ["3M", 63], ["6M", 126], ["1Y", 252], ["5Y", 1260], ["Max", 0]];
/* Reading five years of daily candles is 1,260 hairlines; each long range
   opens at the interval a reader can actually see, and the interval buttons
   still override it. */
const RANGE_INTERVAL = { 21: "daily", 63: "daily", 126: "daily", 252: "daily",
                         1260: "weekly", 0: "monthly" };

/** The three sections of a ticker page, in the order they are read: what the
    market is doing (Overview), what the filings say (Financials), and who
    holds or covers the stock (Ownership). A view that cannot fill one --
    an index has no income statement -- simply does not list it. */
const TAB_LABEL = {
  overview:   "Overview",
  financials: "Financials",
  earnings:   "Earnings",
  industry:   "Industry",
  ownership:  "Ownership",
};

const TABS = { active: "overview" };

/** The tab strip. Every render builds its own, so the set of tabs is a
    property of the view rather than something the markup repeats. */
function tabBar(ids){
  TABS.active = ids[0];
  return `<nav class="mtabs" id="mtabs" role="tablist" aria-label="Sections">
    ${ids.map((id, i) => `<button type="button" role="tab" data-mtab="${id}"
      id="mtab-btn-${id}" aria-controls="mtab-${id}"
      aria-selected="${i === 0}">${TAB_LABEL[id] || id}</button>`).join("")}
  </nav>`;
}

/** Show one tab. A chart drawn into a display:none panel measures zero, so
    every panel redraws what it owns on the way in rather than at load. */
function selectTab(id, opts){
  const bar = document.getElementById("mtabs");
  if (!bar) return;
  const btn = bar.querySelector(`[data-mtab="${id}"]`);
  if (!btn) return;                       // this view has no such tab
  TABS.active = id;
  bar.querySelectorAll("[data-mtab]").forEach(b => {
    b.setAttribute("aria-selected", b.dataset.mtab === id ? "true" : "false");
  });
  document.querySelectorAll(".mtab-panel").forEach(p => {
    p.classList.toggle("on", p.dataset.mtab === id);
  });
  document.body.dataset.tab = id;
  // The strip scrolls on a phone, so the tab just chosen may be off the edge
  // of it -- particularly when the choice was made for the reader, by the
  // analyst count on the Overview tab.
  keepTabInView(bar, btn);

  if (id === "overview") {
    if (PRICE.bars.length) drawCandles();
    marketPanels();
  }
  if (id === "financials") {
    renderSankey(); renderMix(); renderRevTrend();
    renderMargins(); renderCostStack();
    try { renderBuilder(); } catch {}
  }
  if (id === "earnings") loadEarnings();
  if (id === "industry") { marketPanels(); loadPeers(); }
  if (id === "ownership") {
    loadAnalyst();
    loadOwnershipTrades();
    // The holdings scrollport is sized from measured row heights, which are
    // zero while the panel is hidden.
    if (document.getElementById("idx-holdings")) requestAnimationFrame(fitHoldingsRows);
  }
  if (!opts || opts.scroll !== false) scrollTo({ top: 0, behavior: "auto" });
}

/** Scroll the strip, and only the strip, until the chosen tab is on it. */
function keepTabInView(bar, btn){
  if (!bar || !btn || bar.scrollWidth <= bar.clientWidth) return;
  const strip = bar.getBoundingClientRect(), tab = btn.getBoundingClientRect();
  if (tab.left < strip.left) bar.scrollLeft -= (strip.left - tab.left) + 12;
  else if (tab.right > strip.right) bar.scrollLeft += (tab.right - strip.right) + 12;
}

/** Section tabs, at every width. */
function wireTabs(){
  const bar = document.getElementById("mtabs");
  if (!bar) return;
  bar.querySelectorAll("[data-mtab]").forEach(b => {
    b.onclick = () => selectTab(b.dataset.mtab);
  });
  // Marks the strip as having more to the right of it -- see .mtabs.more.
  const fade = () => bar.classList.toggle(
    "more", bar.scrollWidth - bar.clientWidth - bar.scrollLeft > 4);
  fade();
  bar.addEventListener("scroll", fade, { passive: true });
  if (!wireTabs._fade) {
    wireTabs._fade = true;
    addEventListener("resize", () => {
      const el = document.getElementById("mtabs");
      if (el) el.classList.toggle(
        "more", el.scrollWidth - el.clientWidth - el.scrollLeft > 4);
    }, { passive: true });
  }
  document.body.dataset.tab = TABS.active;
}

/** Pinch only — one finger always scrolls the page. */
function attachTransformZoom(host){
  if (!host || host.dataset.zoomWired === "1") return;
  host.dataset.zoomWired = "1";
  let layer = host.querySelector(":scope > .zoom-layer");
  if (!layer) {
    layer = document.createElement("div");
    layer.className = "zoom-layer";
    while (host.firstChild) layer.appendChild(host.firstChild);
    host.appendChild(layer);
  }

  const st = { scale: 1, x: 0, y: 0, pts: null, lastTap: 0 };
  const apply = () => {
    layer.style.transform = `translate(${st.x}px,${st.y}px) scale(${st.scale})`;
  };
  const clamp = () => {
    st.scale = Math.max(1, Math.min(4.5, st.scale));
    if (st.scale === 1) { st.x = 0; st.y = 0; return; }
    const w = host.clientWidth, h = host.clientHeight;
    const maxX = 0, minX = w - w * st.scale;
    const maxY = 0, minY = h - h * st.scale;
    st.x = Math.min(maxX, Math.max(minX, st.x));
    st.y = Math.min(maxY, Math.max(minY, st.y));
  };
  const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  const mid = (a, b) => ({ x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 });

  host.addEventListener("touchstart", e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const m = mid(e.touches[0], e.touches[1]);
      const r = host.getBoundingClientRect();
      st.pts = {
        d: dist(e.touches[0], e.touches[1]),
        scale: st.scale, x: st.x, y: st.y,
        mx: m.x - r.left, my: m.y - r.top,
      };
    } else if (e.touches.length === 1 && st.scale > 1) {
      // Pan only while zoomed; otherwise the finger scrolls the page.
      st.pts = {
        pan: true, x: st.x, y: st.y,
        tx: e.touches[0].clientX, ty: e.touches[0].clientY,
      };
    }
  }, { passive: false });

  host.addEventListener("touchmove", e => {
    if (!st.pts) return;
    if (e.touches.length === 2 && st.pts.d) {
      e.preventDefault();
      const m = mid(e.touches[0], e.touches[1]);
      const r = host.getBoundingClientRect();
      const mx = m.x - r.left, my = m.y - r.top;
      const next = st.pts.scale * (dist(e.touches[0], e.touches[1]) / st.pts.d);
      const ratio = next / st.pts.scale;
      st.scale = next;
      st.x = mx - (st.pts.mx - st.pts.x) * ratio;
      st.y = my - (st.pts.my - st.pts.y) * ratio;
      clamp(); apply();
    } else if (e.touches.length === 1 && st.pts.pan) {
      e.preventDefault();
      st.x = st.pts.x + (e.touches[0].clientX - st.pts.tx);
      st.y = st.pts.y + (e.touches[0].clientY - st.pts.ty);
      clamp(); apply();
    }
  }, { passive: false });

  host.addEventListener("touchend", e => {
    if (e.touches.length < 2) st.pts = null;
    if (e.touches.length === 0) {
      const now = Date.now();
      if (now - st.lastTap < 280) {
        st.scale = 1; st.x = 0; st.y = 0; apply();
      }
      st.lastTap = now;
    }
  });
}

function wireChartZoomHosts(){
  // Kept for callers; most filing charts no longer use transform-zoom hosts
  // so a one-finger scroll is never trapped by the diagram.

/** Ticks between two values. niceTicks() starts at zero, which is right for a
    bar chart and wrong for a price axis: a stock between 160 and 240 would
    spend most of the panel on empty space below it. */
function bandTicks(lo, hi, count = 5){
  const raw = (hi - lo) / count;
  if (!(raw > 0)) return [lo];
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) out.push(v);
  return out;
}

/** 1.2K, 4.9M, 2.1B — for volumes and share counts, which are never read to
    the unit. */
function compact(v){
  if (v === null || v === undefined) return "—";
  const a = Math.abs(v);
  if (a >= 1e12) return (v / 1e12).toFixed(2) + "T";
  if (a >= 1e9)  return (v / 1e9).toFixed(2) + "B";
  if (a >= 1e6)  return (v / 1e6).toFixed(2) + "M";
  if (a >= 1e3)  return (v / 1e3).toFixed(1) + "K";
  return String(Math.round(v));
}

async function loadPrices(){
  const sym = S.company && S.company.ticker;
  if (!sym) return;
  // The local server has no price feed — keep the Chart tab honest instead of blank.
  if (!HOSTED) {
    return priceState("Market prices load from the hosted data feed (not available on the local server).");
  }

  // Re-rendering the report for another quarter must not refetch.
  if (PRICE.symbol === sym && PRICE.bars.length) return paintPrices();

  let d = null;
  try { d = await API.prices(sym); } catch { return priceState("Prices are unavailable."); }
  if (!d) return;

  PRICE.symbol = sym;
  PRICE.bars = d.bars || [];
  PRICE.quote = d.quote || null;
  PRICE.asOf = d.asOf || null;
  PRICE.stale = !!d.stale;
  // Fresh symbol, fresh history: the stitched decade belongs to the previous
  // one, and a stale approxBefore would caption the new chart wrongly.
  PRICE.longFor = null;
  PRICE.approxBefore = null;
  applyQuoteName();
  PRICE.view = null;

  if (!PRICE.bars.length || d.stale) {
    // Nobody has opened this company before, or the bars are behind.
    try { await API.requestPrices(sym); } catch {}
    if (!PRICE.bars.length) return pollPrices(sym);
    // Bars exist but are behind. The request above used to be fired and its
    // answer never collected, so a chart that opened stale stayed stale for
    // the whole visit however fast the worker refilled it -- which is how a
    // company last refreshed on the 7th still read "7 Aug" on the 12th.
    refreshStale(sym, PRICE.asOf);
  }
  paintPrices();
  extendWithLongCloses(sym);
}

/** Stretch the chart's history: price_daily keeps ~300 days, price_close_long
 *  a decade of closes. The old closes are stitched under the daily bars as
 *  degenerate candles (open = high = low = close, no volume) -- every range,
 *  resample and zoom then works on the full span unchanged, and the weekly or
 *  monthly views the long ranges open in rebuild honest-looking candles from
 *  the daily closes inside each bucket. A symbol with no long history stored
 *  yet is requested once, so the worker backfills it for the next visit. */
async function extendWithLongCloses(sym){
  if (PRICE.longFor === sym) return;
  PRICE.longFor = sym;
  let got = null;
  try { got = await rpc("get_long_closes", { p_symbols: [sym] }); } catch {}
  const closes = ((got && got[sym]) || {}).closes || [];
  if (!closes.length) {
    rpc("request_long_closes", { p_symbols: [sym] }).catch(() => {});
    return;
  }
  // The user may have moved on while the closes were in flight.
  if (PRICE.symbol !== sym || !PRICE.bars.length) return;
  const dailyStart = PRICE.bars[0].d;
  const old = closes
    .map(b => ({ d: String(b.d).slice(0, 10), c: Number(b.c) }))
    .filter(b => b.d && b.d < dailyStart && Number.isFinite(b.c) && b.c > 0)
    .sort((a, b) => a.d < b.d ? -1 : 1)
    // a: this bar is a close, not a session. drawCandles draws these as a
    // line rather than a candle with no body.
    .map(b => ({ d: b.d, o: b.c, h: b.c, l: b.c, c: b.c, v: 0, a: 1 }));
  if (!old.length) return;
  // The two series must meet: the last stored close against the first daily
  // bar. A stored history that lands a multiple away is a different
  // instrument under the same name -- SPX's long closes were a penny-priced
  // stray fetched without the index alias -- and stitching it in scales the
  // whole chart to nonsense. Refuse it; the fixed worker replaces the row on
  // its next backfill pass.
  const joinOld = old[old.length - 1].c;
  const joinNew = Number(PRICE.bars[0].c);
  if (!(joinOld > 0) || !(joinNew > 0)
      || joinOld / joinNew > 3 || joinNew / joinOld > 3) {
    console.warn(`[chart] discarding stored long closes for ${sym}: `
      + `${joinOld} vs ${joinNew} at the join reads as a different instrument`);
    return;
  }
  PRICE.bars = [...old, ...PRICE.bars];
  PRICE.approxBefore = dailyStart;
  // Repaint only what the longer base changes: the drawn window (via its
  // buttons' pressed state) is unchanged, but Max now means the full span.
  drawCandles();
}

/** Watch for the refresh requested above and swap it in when it lands.
    Quiet on purpose: the chart keeps showing what it has rather than being
    replaced by a spinner, because stale prices still beat no prices. Gives up
    after about a minute rather than polling the rest of the visit. */
function refreshStale(sym, wasAsOf){
  clearTimeout(PRICE.poll);
  let tries = 0;
  const tick = async () => {
    if (!S.company || S.company.ticker !== sym) return;
    // Two minutes, the same budget pollPrices allows. A refresh measured in
    // tens of seconds was the optimistic case; NTRA's took minutes, and a
    // window that gives up first is the same bug in a shorter coat.
    if (tries++ > 40) return;
    let d = null;
    try { d = await API.prices(sym); } catch {}
    if (d && (d.bars || []).length && (d.asOf || "") > (wasAsOf || "")) {
      PRICE.bars = d.bars;
      PRICE.quote = d.quote || PRICE.quote;
      PRICE.asOf = d.asOf;
      PRICE.stale = !!d.stale;
      applyQuoteName();
      PRICE.view = null;          // so the new bar is inside the window
      paintPrices();                        // redraws the stats panel too
      // The fresh daily bars replaced the stitched array; stitch again.
      PRICE.longFor = null;
      extendWithLongCloses(sym);
      return;
    }
    PRICE.poll = setTimeout(tick, 3500);
  };
  PRICE.poll = setTimeout(tick, 2500);
}

/** A company nobody has opened has no prices yet. Say that it is being
    fetched, rather than leaving the space blank and hoping -- a silent gap
    is indistinguishable from a broken page. */
function priceState(msg, busy){
  const row = document.getElementById("pricerow");
  if (!row) return;
  row.hidden = false;
  row.classList.add("waiting");
  row.innerHTML =
    `<section class="card pricechart"><div class="note">
       ${busy ? `<span class="load"></span> &nbsp;` : ""}${esc(msg)}
     </div></section>`;
}

/** The worker fills a request in a few seconds when it is keeping up, and in
    a minute or two when it is behind on filings. Wait the longer of those,
    then say so plainly instead of leaving a space that never fills. */
function pollPrices(sym){
  clearTimeout(PRICE.poll);
  priceState(`Fetching prices for ${sym}…`, true);
  let tries = 0;
  const tick = async () => {
    if (!S.company || S.company.ticker !== sym) return;
    if (tries++ > 40) {                      // ~2 minutes
      return priceState(
        `Prices for ${sym} are still being fetched. Reload in a minute.`);
    }
    let d = null;
    try { d = await API.prices(sym); } catch {}
    if (d && (d.bars || []).length) {
      PRICE.bars = d.bars; PRICE.quote = d.quote;
      applyQuoteName();
      restorePriceRow();
      paintPrices();
      PRICE.longFor = null;
      extendWithLongCloses(sym);
      return;
    }
    PRICE.poll = setTimeout(tick, 3000);
  };
  PRICE.poll = setTimeout(tick, 2000);
}

            stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
